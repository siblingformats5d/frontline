}
function doWeekOption(k, sp){
  const s = ME();
  if(k === "box"){
    (s.board || []).slice(0, 3).forEach(d => { d.warmth = clamp(d.warmth + rnd(3, 7), 0, 100) });
    return "Three prospects spent the game in the box.";
  }
  if(k === "coach"){
    const c = s.coaches[sp];
    if(c) c.morale = clamp(c.morale + rnd(9, 16), 0, 100);
    return c ? c.name + " feels heard, for now." : "";
  }
  if(k === "council"){
    s.clout = clamp((s.clout || 0) + 0.5, -4, 6);
    return "You were on the call with the numbers in front of you.";
  }
  if(k === "committee"){
    const p = progOf(s, sp);
    if(p) p._seedPush = (p._seedPush || 0) + rnd(1.4, 3.2);
    return SPORT_SHORT[sp] + "'s case is in front of the committee.";
  }
  s.fan = clamp(s.fan + 1.3, 0, 100);
  s.donors = clamp(s.donors + 0.8, 0, 100);
  return "Two radio hits and a room full of season ticket holders.";
}

/* ===========================================================================
   REALIGNMENT
   You do not run a conference, so you cannot invite anyone. What you can do is
   make yourself impossible to leave out: raise the things a league actually
   shops for, spend money making sure the right people know your name, and then
   answer the phone when it rings.
   =========================================================================== */
function joinFit(s, conf){
  const cp = confPillars(conf), sp = pillarsOf(s), v = s.values || VALUE_SETS.balanced;
  const parts = {};
  ["aca","ath","med","fac"].forEach(k => {
    parts[k] = v[k] * clamp((cp[k] - sp[k]) / 20, -2.4, 2.4);
  });
  return { total: sum(Object.values(parts)), parts };
}
/* WOULD THEY TAKE YOU. A conference is not shopping for the best school, it is
   shopping for what it is short of. If it already owns your market you are
   worth much less to it than a worse school in a market it does not have. */
function wantScore(conf, s){
  const cp = confPillars(conf), p = pillarsOf(s);
  const ms = conf.members.map(id => S(id)).filter(Boolean);
  /* Marginal reach: what the union goes up by if you walk in the door. */
  const before = confReachRaw(ms);
  const after = confReachRaw(ms.concat([s]));
  const marg = (after - before) / Math.max(1, G._confReachScale) * 92;
  return p.ath*0.20 + p.pre*0.22 + p.fac*0.13 + p.aca*0.10 + marg*1.55
       + (hasFB(s) ? 9 : -4)
       + (s.awareness || 0) * 0.55
       - cp.ath*0.10 - cp.pre*0.09;
}
function inviteThreshold(conf){
  return conf.stratum === 0 ? 62 : conf.stratum === 1 ? 46 : 30;
}
/* The season-end call. At most one, because two competing offers in the same
   window would make the choice trivial instead of tense. */
function generateInvites(){
  const s = ME();
  const from = s.conf != null ? C(s.conf) : null;
  const out = [];
  G.conferences.forEach(c => {
    if(from && c.id === from.id) return;
    if(c.members.length >= CONF_MAX) return;
    /* The membership floor is a rule for the AI, not a cage for the player. A
       league at eight was quietly making every invitation impossible, which
       meant a director could win a Director's Cup and still never get a call.
       You can always leave; leaving a room that cannot afford to lose you just
       costs more, and the league it leaves behind backfills the same offseason. */
    const want = wantScore(c, s);
    const need = inviteThreshold(c) + (c.members.length >= 14 ? 9 : 0) - G.lobby * 2.4;
    if(want < need) return;
    /* A league does not raid a peer for nothing. Moving down is never offered. */
    if(from && c.stratum > from.stratum) return;
    out.push({ conf:c.id, want:Math.round(want), need:Math.round(need),
               fee: from ? exitFee(s) : 0, share: projectedShare(c, s) });
  });
  out.sort((a,b) => C(a.conf).stratum - C(b.conf).stratum || b.want - a.want);
  return out.slice(0, 1);
}
/* Quote the number the school would genuinely be paid, by running the real
   distribution as if it had already joined. A flat guess here disagreed with
   the actual share the moment the player arrived. */
function projectedShare(c, s){
  const oldConf = s.conf, oldJoined = s.joined;
  c.members.push(s.id);
  s.conf = c.id; s.joined = G.season;
  let v = 0;
  try{ v = memberShareModel(s) }catch(e){ v = 0 }
  c.members.pop();
  s.conf = oldConf; s.joined = oldJoined;
  return Math.round(v);
}
function exitFee(s){ return exitCost(s).total }
function acceptInvite(inv){
  const s = ME(), c = C(inv.conf);
  const ex = exitCost(s);
  const fee = ex.total;
  if(s.budget < fee) return { ok:false, why:"Getting out costs " + money(fee) + " and you do not have it." };
  s.budget -= fee;
  const old = s.conf != null ? C(s.conf) : null;
  /* Only the fee portion is a purse the old members split. */
  G._exitPaid = ex.fee;
  joinConf(s, c.id);
  s.grant = 5;
  G.news.unshift(s.name + " is joining the " + c.name + ".");
  G.trophies.push({ season:G.season, kind:"move", what:"Joined the " + c.name });
  return { ok:true, fee, from: old ? old.name : "independence" };
}
/* LOBBYING. Consultants, a bowl trip nobody needed, a very expensive dinner.
   Buys you a place in the conversation, and it wears off, so it is a recurring
   drain rather than a purchase. */
function lobbyCost(){ return Math.round(IN(4.2e6) * Math.pow(1.42, G.lobby)) }
function doLobby(){
  const s = ME();
  const cost = lobbyCost();
  if(s.budget < cost) return { ok:false, why:"That costs " + money(cost) + "." };
  s.budget -= cost;
  G.lobby = Math.min(6, G.lobby + 1);
  s.awareness = clamp(s.awareness + 1.1, 0, 30);
  return { ok:true, cost };
}
/* A national profile campaign is the only lever on media reach, and it is
   deliberately weak, because you cannot move a campus. */
function awarenessCost(s){ return Math.round(IN(6.5e6) * Math.pow(1.28, Math.floor(s.awareness/2))) }
function buyAwareness(){
  const s = ME();
  if(s.awareness >= 20) return { ok:false, why:"You are as visible as this campus is going to get." };
  const cost = awarenessCost(s);
  if(s.budget < cost) return { ok:false, why:"That costs " + money(cost) + "." };
  s.budget -= cost;
  s.awareness = clamp(s.awareness + 2, 0, 20);
  touchPillars();
  return { ok:true, cost };
}

/* ---- the rest of the country moves --------------------------------------- */
function aiRealign(){
  const moves = [];
  const meId = G.schoolId;
  /* Anyone under the floor recruits first, whatever their stratum, so a league
     the player just walked out of is repaired rather than left to rot. */
  G.conferences.slice().sort((a,b) =>
    (a.members.length < CONF_MIN ? -1 : 0) - (b.members.length < CONF_MIN ? -1 : 0)
    || a.stratum - b.stratum).forEach(c => {
    const short = c.members.length < CONF_MIN;
    /* A room that voted to expand goes and gets the members it voted for. */
    const cap = c.wantSize != null ? c.wantSize
      : (c.stratum === 0 ? 15 : c.stratum === 1 ? 13 : 12);
    if(c.members.length >= cap) return;
    if(!short && Math.random() > 0.5) return;
    const pool = G.schools.filter(s => s.id !== meId)
      .filter(s => {
        if(s.conf === c.id) return false;
        const from = s.conf != null ? C(s.conf) : null;
        if(from && from.members.length <= CONF_MIN) return false;
        if(from && c.stratum > from.stratum) return false;
        return true;
      })
      .map(s => ({ s, v: wantScore(c, s) }))
      .filter(x => x.v >= inviteThreshold(c) - (short ? 22 : 0))
      .sort((a,b) => b.v - a.v);
    if(!pool.length) return;
    const t = pool[0].s;
    const fit = joinFit(t, c);
    const from = t.conf != null ? C(t.conf) : null;
    const climb = from ? (from.stratum - c.stratum) * 0.6 : 0.9;
    if(fit.total * 1.1 + climb + rnd(-0.3,0.3) < 0.15) return;
    if((t.grant || 0) > 2 && Math.random() < 0.7) return;
    joinConf(t, c.id);
    t.grant = 5;
    moves.push(t.name + " to the " + c.name);
  });
  /* Nobody is left stranded forever: an independent worth having gets picked up. */
  G.independents.slice().forEach(id => {
    const s = S(id); if(!s || s.id === meId) return;
    const c = G.conferences.filter(x => x.members.length < CONF_MAX)
      .map(x => ({ x, v: wantScore(x, s) })).sort((a,b) => b.v - a.v)[0];
    if(c && c.v >= inviteThreshold(c.x) && Math.random() < 0.5){
      joinConf(s, c.x.id); s.grant = 4;
      moves.push(s.name + " to the " + c.x.name);
    }
  });
  if(moves.length) G.news.unshift("Realignment: " + moves.slice(0,3).join(", ") + ".");
  return moves;
}
function driftTick(){
  /* Strata are not fixed. A league that has been outrunning its band for years
     moves up, and one that has been coasting moves down, so the ladder you are
     climbing is itself moving. */
  const ranked = G.conferences.map(c => ({ c, v: confScore(c) })).sort((a,b) => b.v - a.v);
  ranked.forEach((x, i) => {
    const want = i < 4 ? 0 : i < 8 ? 1 : 2;
    if(want === x.c.stratum) return;
    x.c._drift = (x.c._drift || 0) + (want < x.c.stratum ? 1 : -1);
    if(Math.abs(x.c._drift) >= 3){
      x.c.stratum = want;
      x.c._drift = 0;
      G.news.unshift("The " + x.c.name + " is now considered a " + STRATUM_NAME[want].toLowerCase() + " conference.");
    }
  });
}
function rightsTick(){
  G.conferences.forEach(c => {
    if(!c.rightsDeal){ c.rightsDeal = openingDeal(c); return }
    if(dealYearsLeft(c.rightsDeal) > 0) return;
    const t = tierFor(c);
    /* Time at the top is a cost. A partner who has already paid for this
       audience wants the next deal cheaper. */
    const fatigue = clamp((c._atTop || 0) - 5, 0, 12) * 0.012;
    const v = Math.round(dealValue(c, t) * (1 - fatigue));
    c.rightsDeal = { tier:t, name:RIGHTS_TIERS[t].name, aav:v, term:RIGHTS_TIERS[t].term, signed:G.season };
    if(c.id === (ME()||{}).conf)
      G.news.unshift("The " + c.name + " signed a new " + RIGHTS_TIERS[t].name.toLowerCase() + " deal worth " + money(IN(v)) + " a year.");
  });
  G.conferences.forEach(c => { c._atTop = c.stratum === 0 ? (c._atTop||0) + 1 : Math.max(0, (c._atTop||0) - 2) });
}
function apparelTick(){
  G.schools.forEach(s => {
    if(s.id === G.schoolId) return;
    if(s.apparel && dealYearsLeftApp(s) > 0) return;
    const o = openApparelOffer(s);
    if(o) s.apparel = { brand:o.brand, tier:o.tier, signed:G.season, term:APP_TERM };
    else s.apparel = null;
  });
}

/* ---- season turnover ------------------------------------------------------ */
function rollSeason(){
  const me = ME();
  /* prestige absorbs the season. The only writer of pre outside title bumps. */
  G.schools.forEach(s => { s.pre = clamp(s.pre * 0.885 + pAth(s) * 0.115, 0, 100) });
  /* everyone else's books, buildings and staff */
  G.schools.forEach(s => { if(s.id !== me.id) aiFinance(s) });
  G.schools.forEach(s => { if(s.id !== me.id) autoRecruit(s) });
  decayTick(ME());
  developTick();
  touchPillars();
  coachAge();
  aiCarousel();
  rightsTick();
  apparelTick();
  driftTick();
  G.aiMoves = aiRealign();
  touchPillars();

  /* your history line, then the clock */
  const b = G.seasonBook || seasonBook();
  G.history.push({ season:G.season, cup:G.cupMine ? G.cupMine.rank : null,
    conf: me.conf != null ? (C(me.conf)||{}).name : "Independent",
    W:b.wins, L:b.losses, ranked:b.ranked, nat:b.nat.length, pre:Math.round(me.pre),
    net: b.R - b.X });
  if(G.history.length > 60) G.history.shift();

  G.season++; G.week = 0; G.phase = "regular";
  G.infl *= (1 + INFL_RATE);
  G.lobby = Math.max(0, G.lobby - 1);
  G.refused = {};
  G.reveal = null; G.spotlight = null; G.offers = []; G.invites = [];
  G.osStep = 0; G.osData = null; G.seasonBook = null;
  G.search = null; G.whipped = 0;
  G.agenda = newAgenda();
  G.audit = { start: me.budget, weekly:0, settle:0 };
  donorTick();
  G.schools.forEach(s => {
    s.programs.forEach(p => { p.last = { W:p.rec.W, L:p.rec.L }; p.rec = { W:0, L:0 };
      p.cf = { W:0, L:0 }; p.hurt = 0; delete p._seedPush });
    s.grant = Math.max(0, (s.grant||0) - 1);
  });
  G.conferences.forEach(c => c._pillarStamp = null);
  G._dirty = true;
  reindex();
  rescale();
  touchPillars();
  ncInit();
  G._dirty = true;
  buildSchedule();
  stampPolls();
  /* The comment on repair has always claimed it runs after every turnover. It
     did not. A league raided below its floor limped through an entire season
     undersized with the backfill sitting there unused. */
  repair();
  const bad = integrityCheck();
  if(bad.length){
    G.log.unshift("Season " + G.season + ": " + bad.slice(0,3).join(" | "));
    if(G.log.length > 40) G.log.length = 40;
  }
  /* the fail check runs last, on the world the player will actually see */
  const s = ME();
  if(s.presidentPatience <= 0) G.over = "fired";
  else if(s.budget < -IN(60e6)) G.over = "broke";
}

/* ===========================================================================
   SAVE
   Compact serialisation and LZW above a threshold, because a thirty season
   career with a hundred and thirty-two schools in it does not fit in local
   storage any other way.
   =========================================================================== */
/* UTF-8 in, one character per byte out, so everything downstream is Latin-1
   safe. Reversed exactly on the way back in. */
function toBytes(str){ return unescape(encodeURIComponent(str)) }
function fromBytes(b){ return decodeURIComponent(escape(b)) }
/* The dictionary is RESET when it fills rather than abandoned. The previous
   version returned null on overflow, which meant compression quietly switched
   itself off on exactly the long careers that needed it most: a save crossed
   half a megabyte and went to storage uncompressed. Encoder and decoder count
   entries identically, so they reset at the same symbol and no clear code has
   to be transmitted. */
const LZW_LIMIT = 60000;
function lzw(str){
  let d = {}, out = [], w = "", code = 256;
  for(let i = 0; i < str.length; i++){
    const c = str[i], wc = w + c;
    if(d[wc] != null || (wc.length === 1 && wc.charCodeAt(0) < 256)){ w = wc; continue }
    out.push(w.length > 1 ? d[w] : w.charCodeAt(0));
    d[wc] = code++;
    if(code > LZW_LIMIT){ d = {}; code = 256 }
    w = c;
  }
  if(w) out.push(w.length > 1 ? d[w] : w.charCodeAt(0));
  return out.map(x => String.fromCharCode(x)).join("");
}
function unlzw(s){
  let d = {}, code = 256;
  let w = s[0], out = w;
  for(let i = 1; i < s.length; i++){
    const k = s.charCodeAt(i);
    let entry;
    if(k < 256) entry = s[i];
    else if(d[k] != null) entry = d[k];
    else entry = w + w[0];
    out += entry;
    d[code++] = w + entry[0];
    if(code > LZW_LIMIT){ d = {}; code = 256 }
    w = entry;
  }
  return out;
}
function stripRuntime(g){
  const o = {};
  for(const k in g){ if(k[0] !== "_") o[k] = g[k] }
  o.schools = g.schools.map(s => {
    const c = {};
    for(const k in s){ if(k[0] !== "_") c[k] = s[k] }
    return c;
  });
  o.conferences = g.conferences.map(c => {
    const o2 = {};
    for(const k in c){ if(k[0] !== "_") o2[k] = c[k] }
    return o2;
  });
  delete o.sched;
  return o;
}
function saveGame(){
  if(!G) return;
  try{
    const raw = JSON.stringify(stripRuntime(G));
    let body = raw, z = 0;
    /* LZW cannot round trip a string containing codepoints above 255, because
       the decoder cannot tell a literal wide character from a dictionary code.
       Themed school names are full of them, so the payload is converted to a
       byte string first. Without this the accented names silently turned
       compression off and the save went out at eight times the size. */
    if(raw.length > 60000){
      const c = lzw(toBytes(raw));
      if(c && c.length < raw.length){ body = c; z = 1 }
    }
    localStorage.setItem(SAVE_KEY, (z ? "Z" : "J") + body);
    G.saveError = false;
  }catch(e){
    G.saveError = true;
  }
}
let _saveT = null;
function saveSoon(){ clearTimeout(_saveT); _saveT = setTimeout(saveGame, 400) }
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const body = raw[0] === "Z" ? fromBytes(unlzw(raw.slice(1))) : raw.slice(1);
    const g = JSON.parse(body);
    if(!g || !g.schools || !g.schools.length || g.schoolId == null) return false;
    G = g;
    hydrate();
    return true;
  }catch(e){ return false }
}
/* Everything a save deliberately does not carry, rebuilt on the way in. Also
   the self-healing pass: a save from a slightly older shape gets the fields it
   is missing rather than throwing. */
function hydrate(){
  G.ver = VER;
  G.infl = G.infl || 1;
  G.news = G.news || []; G.log = G.log || []; G.trophies = G.trophies || [];
  G.history = G.history || []; G.coachPool = G.coachPool || [];
  G.offers = G.offers || []; G.invites = G.invites || []; G.cup = G.cup || [];
  G.post = G.post || {}; G.lobby = G.lobby || 0; G.refused = G.refused || {};
  G.whipped = G.whipped || 0;
  COACH_SEQ = 0; DONOR_SEQ = 0;
  G.schools.forEach(s => {
    s.bld = s.bld || {}; BKEYS.forEach(k => { if(s.bld[k] == null) s.bld[k] = 0 });
    s.staff = s.staff || {}; STAFF.forEach(x => { if(s.staff[x.key] == null) s.staff[x.key] = 0 });
    s.programs = s.programs || [];
    s.programs.forEach(p => { p.rec = p.rec || {W:0,L:0}; p.cf = p.cf || {W:0,L:0};
      p.last = p.last || {W:0,L:0}; p.hurt = p.hurt || 0 });
    s.coaches = s.coaches || {};
    for(const k in s.coaches){ const c = s.coaches[k]; if(c && c.id > COACH_SEQ) COACH_SEQ = c.id }
    s.reach = s.reach != null ? s.reach : rawReach(s.x, s.y);
    s.rs = s.rs || {}; s.restricted = s.restricted || {}; s.named = s.named || {};
    s.maint = s.maint || {}; BKEYS.forEach(k => { if(s.maint[k] == null) s.maint[k] = 1 });
    s.prem = s.prem || { stad:0, arena:0 };
    s.clout = s.clout || 0;
    for(const k in s.coaches){ const c = s.coaches[k]; if(c && c.gtee == null) c.gtee = 0.6 }
    s.archetype = s.archetype && VALUE_SETS[s.archetype] ? s.archetype : "balanced";
    s.values = VALUE_SETS[s.archetype];
    s.history = s.history || [];
  });
  G.coachPool.forEach(c => { if(c.id > COACH_SEQ) COACH_SEQ = c.id });
  const meS = G.schools.find(x => x.id === G.schoolId);
  if(meS){
    if(!meS.board || !meS.board.length) seedDonors(meS);
    meS.board.forEach(d => { if(d.id > DONOR_SEQ) DONOR_SEQ = d.id });
  }
  reindex();
  rescale();
  G._dirty = true;
  touchPillars();
  if(!G.nonconf) ncInit();
  buildSchedule();
  stampPolls();
  repair();
}
/* Self-healing guard. Runs after load and after every turnover: anything that
   should never be true gets quietly made false rather than left to compound. */
function repair(){
  const seen = new Set();
  G.conferences.forEach(c => {
    c.members = c.members.filter(id => {
      const s = S(id);
      if(!s || seen.has(id)) return false;
      seen.add(id); s.conf = c.id; return true;
    });
    c.titles = c.titles || {}; c.titleSeasons = c.titleSeasons || [];
    /* A league that has fallen under the floor recruits out of the independent
       pool immediately rather than limping through a season nobody can schedule. */
    while(c.members.length < CONF_MIN && G.independents.length){
      const pick2 = G.independents
        .map(id => S(id)).filter(Boolean)
        .sort((a,b) => wantScore(c, b) - wantScore(c, a))[0];
      if(!pick2) break;
      joinConf(pick2, c.id);
    }
    if(c.titleSeasons.length > 200) c.titleSeasons.splice(0, c.titleSeasons.length - 200);
  });
  G.independents = G.schools.filter(s => s.conf == null || !C(s.conf)).map(s => { s.conf = null; return s.id });
  G.schools.forEach(s => {
    if(s.id !== G.schoolId)
      s.programs.forEach(p => { if(!s.coaches[p.sport]) s.coaches[p.sport] = hireFresh(p.sport, clamp(p.ovr-8, 10, 70), s) });
    Object.keys(s.coaches).forEach(sp => { if(!progOf(s, sp)) delete s.coaches[sp] });
    s.budget = Math.round(s.budget || 0);
  });
  if(!ME()){ G.over = "gone" }
}
function integrityCheck(){
  const out = [];
  const seen = new Set();
  G.conferences.forEach(c => c.members.forEach(id => {
    if(seen.has(id)) out.push("school in two conferences: " + id);
    seen.add(id);
    if(!S(id)) out.push("ghost member " + id);
  }));
  G.schools.forEach(s => {
    if(s.conf != null && !(C(s.conf) || {members:[]}).members.includes(s.id)) out.push("orphan " + s.name);
    if(s.id !== G.schoolId)
      s.programs.forEach(p => { if(!s.coaches[p.sport]) out.push("coachless " + s.name + " " + p.sport) });
  });
  return out;
}

let TAB = "office", SPORT_TAB = "FB", SHEET = null, START_NAME = "", START_PICK = null;
const app = (typeof document !== "undefined") ? document.getElementById("app") : null;
const $ = h => { const d = document.createElement("div"); d.innerHTML = h.trim();
  return d.childElementCount === 1 ? d.firstElementChild : d };
/* Table rows need their own parser. Setting innerHTML on a div to "<tr>..." is
   silently discarded by the HTML parser, because tr is only valid inside table
   markup: what comes back is the cell text with the structure thrown away, and
   every standings table in the game rendered as one run-on line because of it.
   Parsing inside a real table is the only thing that works everywhere. */
const $tr = h => {
  const t = document.createElement("table");
  t.innerHTML = "<tbody>" + h.trim() + "</tbody>";
  const b = t.querySelector("tbody");
  return b && b.firstElementChild ? b.firstElementChild : document.createElement("tr");
};
function on(el, sel, fn){ const n = el && el.querySelector(sel); if(n) n.onclick = fn; return n }
let TOASTBOX = null;
function toast(msg){
  if(!msg) return;
  if(!TOASTBOX){ TOASTBOX = $('<div class="toastbox"></div>'); document.body.appendChild(TOASTBOX) }
  /* School and coach names arrive here. Everything else in the file escapes;
     this did not. */
  const t = $('<div class="toast">' + esc(msg) + "</div>");
  TOASTBOX.appendChild(t);
  const n = TOASTBOX.children.length;
  setTimeout(() => t.remove(), 2600 + Math.min(4, n-1) * 800);
}

/* ---- words instead of numbers --------------------------------------------
   The player never sees a raw rating. Everything on screen is either a rank,
   a phrase, or money, because "sixty-eight" tells nobody anything and "third
   in the country" tells them everything. -------------------------------------- */
function progWord(v){
  return v>=88?"National contender":v>=76?"Very good":v>=64?"Solid":v>=52?"Middling"
       : v>=40?"Struggling":v>=28?"Bad":"A long way off";
}
function facWord(l){ return LVL_WORD[l] || "None" }
function moraleWord(v){ return v>=78?"Loving it":v>=60?"Content":v>=42?"Restless":v>=24?"Unhappy":"Wants out" }
function donorWord(v){ return v>=82?"Extraordinary":v>=64?"Deep pockets":v>=46?"Reliable":v>=28?"Thin":"Almost nothing" }
function nilWord(v){ return v>=80?"Among the biggest":v>=62?"Competitive":v>=42?"Keeping up":v>=22?"Behind":"Barely exists" }
function starStr(n){ return '<span class="stars">' + "\u2605".repeat(n) + "\u2606".repeat(5-n) + "</span>" }
function crest(){
  return '<svg class="crest" viewBox="0 0 48 48" fill="none" role="img" aria-label="AD Empire">' +
    '<path d="M6 5 H42 V22 C42 35.5 32 41.6 24 44.8 C16 41.6 6 35.5 6 22 Z" fill="#b41d4a" stroke="#e0af52" stroke-width="1.8" stroke-linejoin="round"/>' +
    '<path d="M9.6 8.2 H38.4 V22.4 C38.4 33.4 30.2 38.3 24 41 C17.8 38.3 9.6 33.4 9.6 22.4 Z" fill="none" stroke="#e0af52" stroke-width="0.6"/>' +
    '<text x="24" y="22" text-anchor="middle" dominant-baseline="central" textLength="21" lengthAdjust="spacingAndGlyphs"' +
    ' font-family="Open Sans,system-ui,sans-serif" font-weight="800" font-size="13" fill="#ffd88f">AD</text></svg>';
}

    else if(g.rank && !g.rankWas)
      move = '<span class="pill grn">ranked #' + g.rank + "</span>";
    else if(!g.rank && g.rankWas)
      move = '<span class="pill red">out of the poll</span>';
    row.appendChild($('<span class="op">' + (g.home ? "vs " : "at ") +
      (g.oppRank ? '<span class="rk">#' + g.oppRank + "</span>" : "") + esc(opp.name) +
      (g.spot ? '<span class="pill">TV</span>' : "") + move +
      (g.n > 1 ? '<span class="muted small"> \u00B7 ' + g.W + "-" + g.L + " series</span>" : "") +
      "</span>"));
    row.appendChild($('<span class="sc ' + cls + '">' + sc + "</span>"));
    card.appendChild(row);
  });
  w.appendChild(card);

  /* The lede. Yours when you have earned it, the country's when you have not. */
  if(r.story){
    w.appendChild($('<div class="card' + (r.story.mine ? "" : " flat") + '"' +
      (r.story.mine && !r.story.bad ? ' style="border-color:rgba(84,214,141,.45)"' : "") + ">" +
      '<div class="lbl">' + esc(r.story.sport) + "</div>" +
      '<div style="margin-top:5px' + (r.story.mine ? ";font-weight:700" : ";font-size:12px") + '">' +
      esc(r.story.line) + "</div></div>"));
  }

  /* Money as a punchline. */
  const net = r.cash.net;
  const mc = $('<div class="card flat"></div>');
  mc.appendChild($('<div class="row"><span class="lbl">On the week</span>' +
    '<span class="big ' + (net>=0?"res-w":"res-l") + '">' + (net>=0?"+":"") + money(net) + "</span></div>"));
  const bits = [];
  bits.push("gate and giving " + money(r.cash.gate + r.cash.give));
  if(r.cash.bonus) bits.push("television window " + money(r.cash.bonus));
  bits.push("costs " + money(r.cash.pay));
  mc.appendChild($('<div class="small muted" style="margin-top:6px">' + bits.join(" \u00B7 ") + "</div>"));
  if(r.cash.gteeNote) mc.appendChild($('<div class="small ' +
    (r.cash.gtee > 0 ? "res-w" : "res-l") + '" style="margin-top:6px">' + esc(r.cash.gteeNote) + "</div>"));
  if(r.cash.why) mc.appendChild($('<div class="small ' + (r.cash.bonus ? "res-w" : "res-l") +
    '" style="margin-top:4px">' + esc(r.cash.why) + "</div>"));
  w.appendChild(mc);

  if(r.event) eventCard(w, r.event);
}

function eventCard(w, ev){
  const card = $('<div class="card" style="border-color:rgba(224,175,82,.4)"></div>');
  card.appendChild($('<div class="small" style="margin-bottom:10px">' + esc(ev.text) + "</div>"));
  const choices = { gift:["Take the money","Redirect it"], transfer:["Sign them","Pass"],
    press:["Do the interview","Decline"], compliance:["Handle it quietly","Let it run"] };
  const ch = choices[ev.k];
  if(ch){
    const row = $('<div class="row" style="gap:6px"></div>');
    const a = $('<button class="btn sm" style="flex:1">' + ch[0] + "</button>");
    const b = $('<button class="btn sm sec" style="flex:1">' + ch[1] + "</button>");
    a.onclick = () => { const m = resolveEvent(ev, "take"); G.reveal.event = null; saveSoon(); if(m) toast(m); render() };
    b.onclick = () => { const m = resolveEvent(ev, "pass"); G.reveal.event = null; saveSoon(); if(m) toast(m); render() };
    row.appendChild(a); row.appendChild(b);
    card.appendChild(row);
  }
  w.appendChild(card);
}

/* ===========================================================================

  const body = tb.querySelector("tbody");
  G.cup.slice(0, 10).forEach(x => body.appendChild($tr('<tr class="' + (x.id===me.id?"me":"") + '"><td class="l">' +
    x.rank + '</td><td class="l">' + esc(x.name) + "</td><td>" + x.pts + "</td></tr>")));
  if(cm.rank > 10) body.appendChild($tr('<tr class="me"><td class="l">' + cm.rank + '</td><td class="l">' +
    esc(me.name) + "</td><td>" + cm.pts + "</td></tr>"));

  const b = $('<button class="btn">Close the season and settle the books</button>');

    moraleTick();
    saveGame(); render();
  };
  w.appendChild(b);
}

/* ---- the offseason, one step at a time ------------------------------------ */
const OS_STEPS = ["The year in review","The carousel","Paying the players","Recruiting",
  "Buildings","Programs","Staff","Fundraising","Business","Scheduling","The conference room"];
const OS_VIEWS = [osReview, osCarousel, osRevShare, osRecruit, osBuild, osPrograms, osStaff,
  osDonors, osBusiness, osSchedule, osConfRoom];
/* A screen that has nothing on it is a tap you made the player spend for
   nothing. Eleven of them in a row is where people put the game down. Each step
   declares whether it has a decision in it this year; a quiet offseason with no
   vacancy, no invitation and no money collapses to a handful of screens, and a
   loud one still shows you everything. */
const OS_HAS = [
  () => true,                                       // the year in review
  () => true,                                       // the carousel: always the drama
  me => rsOptedIn(me) || revenueSeason(me) > rsCap() * 2.2,
  () => true,                                       // recruiting
  me => {
    const cheapest = Math.min.apply(null, BUILDINGS.filter(b => (me.bld[b.key]||0) < 5)
      .map(b => IN(b.cost[(me.bld[b.key]||0) + 1])).concat([Infinity]));
    const held = sum(BKEYS.map(k => restrictedFor(me, k)));
    return cheapest !== Infinity && (me.budget + held) > cheapest * 0.7;
  },
  me => addableSports(me).some(sp => (me.bld[SPORT_HOME[sp]]||0) >= 1 && me.budget > addSportCost(sp) * 0.8)
     || (me.programs.length > 3 && revenueSeason(me) < costSeason(me)),
  me => me.programs.some(p => !me.coaches[p.sport])
     || me.programs.some(p => me.coaches[p.sport] && me.coaches[p.sport].years <= 1)
     || STAFF.some(x => (me.staff[x.key]||0) < 4 && me.budget > IN(STAFF_WAGE[(me.staff[x.key]||0)+1]) * 3),
  me => (me.board || []).length > 0,
  /* An expired apparel deal with nobody offering is not a decision, it is a
     sentence. Only stop here if there is something to sign or buy. */
  me => !!openApparelOffer(me) || (me.awareness < 20 && me.budget > awarenessCost(me)),
  me => NC_SPORTS.some(sp => progOf(me, sp)),
  me => (G.agenda || []).some(m => !m.resolved) || (G.invites || []).length > 0
     || ME().budget > lobbyCost()
];
function osActive(me){
  const out = [];
  OS_STEPS.forEach((n, i) => { let ok = true; try{ ok = OS_HAS[i](me) }catch(e){ ok = true }
    if(ok) out.push(i) });
  return out;
}
function offseasonView(w, me){
  /* An open coaching search takes over the screen. Nothing else on the desk
     matters until the chair is filled. */
  if(G.search){ searchView(w, me); return }
  const active = osActive(me);
  let step = G.osStep || 0;
  if(active.indexOf(step) < 0){
    const nxt = active.filter(i => i > step)[0];
    if(nxt == null){ rollSeason(); TAB = "office"; saveGame(); render(); return }
    G.osStep = step = nxt;
  }
  const pos = active.indexOf(step) + 1;
  w.appendChild($('<div class="row" style="margin-bottom:10px"><div class="lbl">Offseason \u00B7 ' +
    pos + " of " + active.length + '</div><div class="tag">' + OS_STEPS[step] + "</div></div>"));
  (OS_VIEWS[step] || osReview)(w, me);
}
function osNext(w, label){
  const me = ME();
  const active = osActive(me);
  const nxt = active.filter(i => i > (G.osStep || 0))[0];
  const b = $('<button class="btn">' +
    (label || (nxt != null ? "On to " + OS_STEPS[nxt].toLowerCase() : "Start season " + (G.season + 1))) +
    "</button>");
  b.onclick = () => {
    const after = osActive(ME()).filter(i => i > (G.osStep || 0))[0];
    if(after == null){
      rollSeason();
      TAB = "office";
      toast("Season " + G.season + " begins.");
      saveGame();
    } else { G.osStep = after; saveSoon() }
    render();
  };
  w.appendChild(b);
}

function osCarousel(w, me){
  if(!G.osData.carousel){
    G.osData.carousel = true;
    G.offers = poachOffers();
  }
  /* Retention first. Somebody is always calling about your best people, and the
     cheapest coach you will ever hire is the one already in the building. */
  if(G.offers.length){
    const c = $('<div class="card" style="border-color:rgba(214,72,120,.45)"></div>');
    c.appendChild($('<div class="grp-h">Somebody is calling your coach</div>'));
    /* Iterating a list while splicing indices out of it means the second poach
       button can act on the wrong offer. Match on the sport instead. */
    G.offers.slice().forEach(o => {
      const co = me.coaches[o.sp];
      if(!co) return;
      const from = S(o.from);
      const row = $('<div style="padding:10px 0;border-bottom:1px solid var(--hair)"></div>');
      row.appendChild($('<div class="row"><b>' + esc(co.name) + '</b><span class="tag">' + SPORT_SHORT[o.sp] + "</span></div>"));
      row.appendChild($('<div class="small muted" style="margin:5px 0 9px">' + esc(from.name) +
        " has offered " + money(IN(o.offer)) + " a year against " + money(IN(co.pay)) +
        ", with " + Math.round((co.gtee != null ? co.gtee : 0.6) * 100) + "% guaranteed.</div>"));
      const rr = $('<div class="row" style="gap:6px"></div>');
      const a = $('<button class="btn sm" style="flex:1">Match it</button>');
      const bt = $('<button class="btn sm sec" style="flex:1">Let him go</button>');
      a.onclick = () => { const r = keepCoach(o); if(!r.ok) return toast(r.why);
        toast(co.name + " is staying, at " + money(IN(r.pay)) + ".");
        G.offers = G.offers.filter(x => x.sp !== o.sp); saveGame(); render() };
      bt.onclick = () => { letCoachGo(o); toast(co.name + " is gone.");
        G.offers = G.offers.filter(x => x.sp !== o.sp); saveGame(); render() };
      rr.appendChild(a); rr.appendChild(bt);
      row.appendChild(rr);
      c.appendChild(row);
    });
    w.appendChild(c);
  }

  const sc = $('<div class="card"></div>');
  sc.appendChild($('<div class="grp-h">Your head coaches</div>'));
  me.programs.forEach(p => {
    const co = me.coaches[p.sport];
    const row = $('<div style="padding:11px 0;border-bottom:1px solid var(--hair)"></div>');
    if(!co){
      row.appendChild($('<div class="row"><b class="res-l">' + SPORT_SHORT[p.sport] + ' \u00B7 vacant</b></div>'));
      row.appendChild($('<div class="small muted" style="margin:5px 0 9px">You can run this yourself, or retain a firm. The firm does not find you better coaches. It tells you what the coaches actually are.</div>'));
      const rr = $('<div class="row" style="gap:6px"></div>');
      const a = $('<button class="btn sm" style="flex:1">Run it yourself</button>');
      const b = $('<button class="btn sm" style="flex:1">Retain a firm \u00B7 ' + money(IN(FIRM_FEE)) + "</button>");
      a.onclick = () => { const r = startSearch(p.sport, false); if(!r.ok) return toast(r.why); saveSoon(); render() };
      b.onclick = () => { const r = startSearch(p.sport, true); if(!r.ok) return toast(r.why); saveSoon(); render() };
      rr.appendChild(a); rr.appendChild(b);
      row.appendChild(rr);
      sc.appendChild(row);
      return;
    }
    const ext = extensionTerms(p.sport);
    const buy = buyoutFor(co);
    const g = p.last.W + p.last.L;
    row.appendChild($('<div class="row"><span><b class="link">' + esc(co.name) + "</b>" +
      (co.years <= 1 ? '<span class="pill red">Expiring</span>' : "") +
      (ext.underpaid ? '<span class="pill">Underpaid</span>' : "") + "</span>" +
      '<span class="tag">' + SPORT_SHORT[p.sport] + "</span></div>"));
    row.appendChild($('<div class="small muted" style="margin-top:5px">' +
      (g ? p.last.W + "-" + p.last.L + " last year \u00B7 " : "") + coachWord(coachOvr(co)) +
      " \u00B7 " + coachTrait(co) + " \u00B7 " + moraleWord(co.morale) + "</div>"));
    row.appendChild($('<div class="small muted" style="margin-top:3px">' + money(IN(co.pay)) + "/yr, " +
      (co.years > 0 ? co.years + " years left" : "out of contract") + " \u00B7 buyout " + money(buy) + "</div>"));
    const rr = $('<div class="row" style="gap:6px;margin-top:9px;flex-wrap:wrap"></div>');
    const e = $('<button class="btn tiny sec">Extend \u00B7 ' + money(ext.cost) + "</button>");
    const f = $('<button class="btn tiny sec">Fire \u00B7 ' + money(buy) + "</button>");
    const v = $('<button class="btn tiny sec">Look</button>');
    e.onclick = () => { const r = signExtension(p.sport, ext);
      toast(r.ok ? co.name + " signed through " + (G.season + ext.years) + "." : r.why); saveSoon(); render() };
    f.onclick = () => { const r = fireCoach(p.sport);
      toast(r.ok ? "Bought out for " + money(r.buyout) + ". The chair is open." : r.why); saveSoon(); render() };
    v.onclick = () => openCoach(co);
    rr.appendChild(e); rr.appendChild(f); rr.appendChild(v);
    row.appendChild(rr);
    sc.appendChild(row);
  });
  w.appendChild(sc);
  osNext(w);
}

function osBuild(w, me){
  const keep = upkeepSeason(me);
  w.appendChild($('<div class="card"><div class="row"><div><div class="lbl">Upkeep this year</div>' +
    '<div class="big">' + money(keep) + '</div></div><div style="text-align:right"><div class="lbl">In the bank</div>' +
    '<div class="big" style="' + (me.budget<0?"color:var(--loss)":"") + '">' + money(me.budget) + "</div></div></div>" +
    '<div class="small muted" style="margin-top:8px">Upkeep is charged every season whether you use the building or not, and anything you underfund slides back down.</div></div>'));
  const c = $('<div class="card"></div>');
  BUILDINGS.forEach(b => {
    const l = me.bld[b.key] || 0;
    const row = $('<div style="padding:11px 0;border-bottom:1px solid var(--hair)"></div>');
    row.appendChild($('<div class="row"><b>' + b.name + '</b><span class="lvl">' +
      [0,1,2,3,4].map(i => '<i class="' + (i < l ? "on" : "") + '"></i>').join("") + "</span></div>"));
    row.appendChild($('<div class="small muted" style="margin:4px 0 8px">' + facWord(l) + " \u00B7 " + b.note + "</div>"));
    if(l < 5){
      const cost = IN(b.cost[l+1]);
      const nk = IN(b.keep[l+1]);
      const bt = $('<button class="btn sm ' + (me.budget >= cost ? "" : "sec") + '">Build to ' +
        facWord(l+1).toLowerCase() + " \u00B7 " + money(cost) + "</button>");
      bt.onclick = () => {
        /* Restricted gifts pay first. That is the only thing they can pay for. */
        const held = restrictedFor(me, b.key);
        if(held + me.budget < cost) return toast("You are " + money(cost - held - me.budget) + " short.");
        const used = spendRestricted(me, b.key, cost);
        me.budget -= (cost - used);
        me.bld[b.key] = l + 1; touchPillars(); saveSoon();
        toast(used > 0 ? money(used) + " of restricted money covered it."
                       : b.name + " is now " + facWord(l+1).toLowerCase() + ".");
        render();
      };
      row.appendChild(bt);
      row.appendChild($('<div class="small muted" style="margin-top:5px">Upkeep would go to ' + money(nk) + " a year.</div>"));
    } else {
      row.appendChild($('<div class="small gold">There is nothing better than this anywhere.</div>'));
    }
    c.appendChild(row);
  });
  w.appendChild(c);

  osNext(w);
}

/* ---------------------------------------------------------------------------
   PROGRAMS
   Starting and cutting sports is one of the few levers that changes the shape
   of the department rather than its quality. The numbers are all on screen
   because this is a budget decision, not a taste one.
   -------------------------------------------------------------------------- */
function osPrograms(w, me){
  const rev = revenueSeason(me), cost = costSeason(me);
  w.appendChild($('<div class="card"><div class="row"><div><div class="lbl">Programs sponsored</div>' +
    '<div class="big">' + me.programs.length + ' <span class="muted" style="font-size:14px">of 8</span></div></div>' +
    '<div style="text-align:right"><div class="lbl">Running surplus</div><div class="big ' +
    (rev-cost >= 0 ? "res-w" : "res-l") + '">' + money(rev - cost) + "</div></div></div>" +
    '<div class="small muted" style="margin-top:8px">Every program you sponsor is scholarships, a coach, travel and operations every year for as long as you keep it. Every program you sponsor also scores in the Director\u2019s Cup.</div></div>'));

  const add = $('<div class="card"></div>');
  add.appendChild($('<div class="grp-h">Start a program</div>'));
  const addable = addableSports(me);
  if(!addable.length) add.appendChild($('<div class="small muted">You already sponsor all eight.</div>'));
  addable.forEach(sp => {
    const e2 = sportEcon(me, sp);
    const home = SPORT_HOME[sp];
    const ok = (me.bld[home] || 0) >= 1;
    const row = $('<div style="padding:11px 0;border-bottom:1px solid var(--hair)"></div>');
    row.appendChild($('<div class="row"><b>' + SPORT_NAME[sp] + "</b>" +
      (REVENUE.includes(sp) ? '<span class="pill">revenue sport</span>' : "") + "</div>"));
    row.appendChild($('<div class="logline"><span class="muted">Startup</span><span>' + money(e2.start) + "</span></div>"));
    row.appendChild($('<div class="logline"><span class="muted">Every year after</span><span class="res-l">' +
      money(e2.keep) + " plus a coach at about " + money(e2.coach) + "</span></div>"));
    row.appendChild($('<div class="logline"><span class="muted">Gate it would bring</span><span class="' +
      (e2.gate ? "res-w" : "muted") + '">' + (e2.gate ? money(e2.gate) + "/yr" : "none") + "</span></div>"));
    row.appendChild($('<div class="logline"><span class="muted">Television</span><span>' + e2.tv + "</span></div>"));
    row.appendChild($('<div class="logline"><span class="muted">Director\u2019s Cup</span><span>' + e2.cup + "</span></div>"));
    if(ok){
      const b = $('<button class="btn sm" style="margin-top:9px">Start ' + SPORT_NAME[sp].toLowerCase() + "</button>");
      b.onclick = () => { const r = addSport(sp); if(!r.ok) return toast(r.why);
        toast(SPORT_NAME[sp] + " is varsity. " + money(addSportKeep(sp)) + " a year from now on.");
        saveSoon(); render() };
      row.appendChild(b);
    } else {
      row.appendChild($('<div class="small res-l" style="margin-top:8px">You need a ' +
        BLD[home].name.toLowerCase() + " before you can field it.</div>"));
    }
    add.appendChild(row);
  });
  w.appendChild(add);

  const cut = $('<div class="card"></div>');
  cut.appendChild($('<div class="grp-h">What you already run</div>'));
  me.programs.forEach(p => {
    const e2 = sportEcon(me, p.sport);
    const co = me.coaches[p.sport];
    const net = e2.gate - e2.keep - (co ? IN(co.pay) : 0);
    const row = $('<div style="padding:10px 0;border-bottom:1px solid var(--hair)"></div>');
    row.appendChild($('<div class="row"><b>' + SPORT_NAME[p.sport] + "</b><span class=\"" +
      (net >= 0 ? "res-w" : "res-l") + '">' + (net >= 0 ? "+" : "") + money(net) + "/yr</span></div>"));
    row.appendChild($('<div class="small muted" style="margin-top:4px">' +
      (e2.gate ? money(e2.gate) + " in, " : "no gate, ") + money(e2.keep + (co ? IN(co.pay) : 0)) +
      " out \u00B7 " + e2.tv.toLowerCase() + "</div>"));
    if(me.programs.length > 3){
      const b = $('<button class="btn tiny sec" style="margin-top:8px">Cut ' + SPORT_SHORT[p.sport] + "</button>");
      b.onclick = () => { const r = dropSport(p.sport); if(!r.ok) return toast(r.why);
        toast(SPORT_NAME[p.sport] + " has been cut. That is " + money(e2.keep) + " a year back.");
        saveSoon(); render() };
      row.appendChild(b);
    }
    cut.appendChild(row);
  });
  cut.appendChild($('<div class="small muted" style="margin-top:10px">Cutting costs you standing with the president and with the country. Departments that do it are usually out of options.</div>'));
  w.appendChild(cut);
  osNext(w);
}

/* ---- recruiting: the one dial that decides the next five years ------------ */
function osRecruit(w, me){
  const pool = recruitPool(me);
  if(!G.osData.alloc){
    const a = {};
    me.programs.forEach(p => a[p.sport] = REVENUE.includes(p.sport) ? 3 : 1);
    G.osData.alloc = a;
    G.osData.nilAdd = 0;
  }
  const a = G.osData.alloc;
  const tot = sum(me.programs.map(p => a[p.sport] || 0)) || 1;

  const head = $('<div class="card"></div>');
  head.appendChild($('<div class="row"><div><div class="lbl">Recruiting budget</div><div class="big">' +
    money(pool) + '</div></div><div style="text-align:right"><div class="lbl">The collective</div>' +
    '<div class="big">' + nilWord(me.nil) + "</div></div></div>"));
  head.appendChild($('<div class="small muted" style="margin-top:8px">Split it across the eight. Everything you give football is something the other seven do not get, and the Director\u2019s Cup counts all of them.</div>'));
  w.appendChild(head);

  const c = $('<div class="card"></div>');
  me.programs.forEach(p => {
    const share = (a[p.sport] || 0) / tot;
    const est = classFor(me, p.sport, pool * share, pool);
    const row = $('<div style="padding:10px 0;border-bottom:1px solid var(--hair)"></div>');
    row.appendChild($('<div class="row"><span><b>' + SPORT_SHORT[p.sport] + "</b> " + starStr(classStars(est)) + "</span>" +
      '<span class="muted small">' + money(Math.round(pool * share)) + "</span></div>"));
    const rr = $('<div class="row" style="gap:6px;margin-top:7px"></div>');
    const minus = $('<button class="btn tiny sec">\u2212</button>');
    const bar = $('<span class="bar" style="margin:0 4px"><div style="width:' + Math.round(share*100) + '%"></div></span>');
    const plus = $('<button class="btn tiny sec">+</button>');
    minus.onclick = () => { a[p.sport] = Math.max(0, (a[p.sport]||0) - 1); render() };
    plus.onclick = () => { a[p.sport] = Math.min(9, (a[p.sport]||0) + 1); render() };
    rr.appendChild(minus); rr.appendChild(bar); rr.appendChild(plus);
    row.appendChild(rr);
    c.appendChild(row);
  });
  w.appendChild(c);

  /* the collective: a recurring drain that decays, so it is never bought once */
  const nc = $('<div class="card"></div>');
  nc.appendChild($('<div class="grp-h">The collective</div>'));
  nc.appendChild($('<div class="small muted" style="margin-bottom:10px">' + nilWord(me.nil) +
    ". It shrinks every year on its own, so it has to be topped up or it stops mattering.</div>"));
  [[8e6, 4],[20e6, 10],[44e6, 20]].forEach(([amt, gain]) => {
    const cost = IN(amt);
    const b = $('<button class="btn sm sec" style="width:100%;margin-bottom:6px">Put in ' + money(cost) + "</button>");
    b.onclick = () => {
      if(me.budget < cost) return toast("You are " + money(cost - me.budget) + " short.");
      me.budget -= cost; me.nil = clamp(me.nil + gain, 0, 100); saveSoon();
      toast("The collective is now " + nilWord(me.nil).toLowerCase() + ".");
      render();
    };
    nc.appendChild(b);
  });
  w.appendChild(nc);

  const b = $('<button class="btn">Sign the classes</button>');
  b.onclick = () => {
    const t = sum(me.programs.map(p => a[p.sport] || 0)) || 1;
    me.programs.forEach(p => { p.cls = classFor(me, p.sport, pool * (a[p.sport]||0)/t, pool) });
    const best = me.programs.slice().sort((x,y) => y.cls - x.cls)[0];
    if(best) toast(SPORT_SHORT[best.sport] + " signed a " + classStars(best.cls) + "-star class.");
    const after = osActive(ME()).filter(i => i > (G.osStep || 0))[0];
    if(after == null){ rollSeason(); TAB = "office"; saveGame() } else { G.osStep = after; saveSoon() }
    render();
  };
  w.appendChild(b);
}

/* ---- business: the levers that are not people or buildings ---------------- */

  const t = $('<div class="card"></div>');

  t.appendChild($('<div class="row"><span class="muted small">Price</span><b>$' + me.ticket + "</b></div>"));

    ac.appendChild($('<div class="small muted" style="margin-top:5px">' + money(apparelPay(me)) + " a year, " +

      b.onclick = () => { me.apparel = { brand:o.brand, tier:o.tier, signed:G.season, term:APP_TERM };
        toast("Signed with " + o.brand + "."); saveSoon(); render() };
      ac.appendChild(b);
    } else {
      ac.appendChild($('<div class="small muted">Nobody is offering. Win something and they will call.</div>'));
    }
  }

  const pc = $('<div class="card"></div>');
  pc.appendChild($('<div class="grp-h">National profile</div>'));

    ". You cannot move the campus, but you can make sure people know it is there.</div>"));

    pc.appendChild($('<div class="small gold">You are as visible as this campus is going to get.</div>'));

/* ---- fail screen ---------------------------------------------------------- */
function renderOver(){
  app.innerHTML = "";
  const s = ME();
  const w = $('<div class="start"></div>');
  w.appendChild($('<div class="center">' + crest() + "</div>"));
  const why = G.over === "fired" ? "The board has relieved you of your duties."
    : G.over === "broke" ? "The department is insolvent. The university has taken it back."
    : "Your school is no longer in the game.";
  w.appendChild($('<h1 class="center" style="font-size:24px;margin:14px 0 6px">' + why + "</h1>"));
  const best = G.history.length ? Math.min(...G.history.map(h => h.cup || 999)) : null;
  w.appendChild($('<div class="center small muted" style="margin-bottom:18px">' + (G.season - 1) +
    " seasons" + (best && best < 999 ? ", best Director\u2019s Cup finish " + ordinal(best) : "") +
    (s ? ", " + s.titles + " national titles" : "") + ".</div>"));
  if(G.history.length){
    const c = $('<div class="card"></div>');
    c.appendChild($('<div class="grp-h">The record</div>'));
    G.history.slice(-12).reverse().forEach(h => c.appendChild($('<div class="logline"><span class="muted">Season ' +
      h.season + "</span><span>" + h.W + "-" + h.L + (h.cup ? " \u00B7 Cup " + ordinal(h.cup) : "") + "</span></div>")));

  }
  const b = $('<button class="btn">Start over</button>');
  b.onclick = () => { localStorage.removeItem(SAVE_KEY); G = null; renderStart() };
  w.appendChild(b);
  app.appendChild(w);
}

    '<div class="lbl">In the bank</div><div class="big">' + money(me.budget) + "</div></div></div>" +

  }

  const open = S2.cands.filter(x => x.status === "open");

    if(x.status !== "open"){
      card.appendChild($('<div class="small ' + (x.status==="hired"?"res-w":"muted") + '" style="margin-top:8px">' +
        (x.status === "hired" ? "Hired." : x.status === "no" ? "Turned you down." : "Took another job.") + "</div>"));
      w.appendChild(card);
      return;
    }

    card.appendChild($('<div class="divider"></div>'));
    [["Recruiting","rec"],["Player development","dev"],["Gameday","gd"]].forEach(([n,k]) =>
      card.appendChild($('<div class="logline"><span class="muted">' + n + '</span><span>' +
        attrBand(c, k) + "</span></div>")));
    card.appendChild($('<div class="logline"><span class="muted">The agent wants</span><span>' +
      money(IN(x.asking)) + "/yr</span></div>"));
    if(x.release) card.appendChild($('<div class="logline"><span class="muted">Release from ' +
      esc(at.name) + '</span><span class="res-l">' + money(x.release) + "</span></div>"));

    const rr = $('<div class="row" style="gap:6px;margin-top:10px"></div>');
    if(scoutLevel(c) < 2){
      const dg = $('<button class="btn tiny sec">Work up a full file \u00B7 ' + money(IN(140e3)) + "</button>");
      dg.onclick = () => { const r = digIn(x); toast(r.ok ? "The file is complete." : r.why); saveSoon(); render() };
      rr.appendChild(dg);
    }
    const mk = $('<button class="btn tiny">Make an offer</button>');
    mk.onclick = () => openOffer(x, c);

      Math.round(x.counter.gtee*100) + "% guaranteed.</div>"));
    w.appendChild(card);
  });

  const b = $('<button class="btn sec">Walk away from this search</button>');
  b.onclick = () => { endSearch(); saveSoon(); render() };
  w.appendChild(b);
}
/* The three terms. Money and years are what the coach hears; the guarantee is
   what you will be reading out at a press conference in three years. */
function openOffer(cand, c){
  const me = ME();
  const start = cand.counter || { salary: Math.round(cand.asking * 1.02), years:5, gtee:0.65 };
  const st = { salary:start.salary, years:start.years, gtee:start.gtee };
  const d = $("<div></div>");
  d.appendChild($('<h2 style="font-size:19px">Offer to ' + esc(c.name) + "</h2>"));
  const body = $("<div></div>");
  d.appendChild(body);
  const draw = () => {
    body.innerHTML = "";
    const exposure = Math.round(IN(st.salary) * st.years * st.gtee);
    body.appendChild($('<div class="small muted" style="margin:6px 0 12px">The agent is at ' +
      money(IN(cand.asking)) + " a year.</div>"));

    const row = (lab, val, dec, inc) => {
      const r = $('<div style="margin-bottom:12px"></div>');
      r.appendChild($('<div class="row"><span class="lbl">' + lab + '</span><b>' + val + "</b></div>"));
      const rr = $('<div class="row" style="gap:6px;margin-top:6px"></div>');
      const m = $('<button class="btn tiny sec" style="flex:1">\u2212</button>');
      const p = $('<button class="btn tiny sec" style="flex:1">+</button>');
      m.onclick = () => { dec(); draw() };
      p.onclick = () => { inc(); draw() };
      rr.appendChild(m); rr.appendChild(p);
      r.appendChild(rr);
      return r;
    };
    body.appendChild(row("Salary", money(IN(st.salary)) + "/yr",
      () => st.salary = Math.max(Math.round(cand.asking*0.5), Math.round(st.salary*0.92)),
      () => st.salary = Math.round(st.salary*1.08)));
    body.appendChild(row("Term", st.years + " years",
      () => st.years = Math.max(2, st.years-1), () => st.years = Math.min(8, st.years+1)));
    body.appendChild(row("Guaranteed", Math.round(st.gtee*100) + "%",
      () => st.gtee = Math.max(0.2, Math.round((st.gtee-0.05)*100)/100),
      () => st.gtee = Math.min(1, Math.round((st.gtee+0.05)*100)/100)));

    const read = offerRead(cand, st);
    const upfront = (cand.at != null ? cand.release : 0) + Math.round(IN(st.salary) * 0.15);
    body.appendChild($('<div class="divider"></div>'));
    body.appendChild($('<div class="logline"><span class="muted">What the agent says</span>' +
      '<span class="' + (read.tone === "win" ? "res-w" : read.tone === "loss" ? "res-l" : "") + '">' +
      read.word + "</span></div>"));
    body.appendChild($('<div class="logline"><span class="muted">Due now</span><span>' + money(upfront) + "</span></div>"));
    body.appendChild($('<div class="logline"><span class="muted">If you fire them after one season</span>' +
      '<span class="res-l">' + money(exposure) + "</span></div>"));

    const go = $('<button class="btn" style="margin-top:12px">Send it</button>');
    go.onclick = () => {
      const r = makeOffer(cand, st);
      closeSheet();
      if(r.ok) toast(c.name + " said yes.");
      else if(r.counter) toast(c.name + "'s agent countered.");
      else toast(r.why);
      searchDrift();
      saveSoon(); render();
    };
    body.appendChild(go);
  };
  draw();
  sheet(d);
}

/* ===========================================================================
   PAYING THE PLAYERS
   =========================================================================== */
function osRevShare(w, me){
  const cap = rsCap();
  if(!me.rs) me.rs = {};
  const head = $('<div class="card"></div>');
  head.appendChild($('<div class="row"><div><div class="lbl">The cap this year</div><div class="big">' +
    money(cap) + '</div></div><div style="text-align:right"><div class="lbl">You have committed</div>' +
    '<div class="big" style="' + (rsSpend(me) > cap ? "color:var(--loss)" : "") + '">' +
    money(rsSpend(me)) + "</div></div></div>"));
  head.appendChild($('<div class="small muted" style="margin-top:8px">You may pay your athletes directly, up to the cap. Nothing tells you how to split it. It comes out of the same budget as everything else.</div>'));
  w.appendChild(head);

  if(!rsOptedIn(me)){
    const c = $('<div class="card"></div>');
    c.appendChild($('<div class="grp-h">You are not in</div>'));
    c.appendChild($('<div class="small muted" style="margin-bottom:10px">Opting in is a choice. A department that cannot carry the line is better off not pretending it can, and there are schools that have decided exactly that.</div>'));
    const b = $('<button class="btn sm">Opt in</button>');
    b.onclick = () => { me.rsIn = true; me.rs = rsAutoSplit(me); saveSoon();
      toast("You are in. That is " + money(cap) + " a year on the books."); render() };
    c.appendChild(b);
    w.appendChild(c);
    osNext(w);
    return;
  }

  const c = $('<div class="card"></div>');
  me.programs.forEach(p => {
    const v = rsShare(me, p.sport);
    const step = Math.round(cap * 0.04);
    const row = $('<div style="padding:9px 0;border-bottom:1px solid var(--hair)"></div>');
    row.appendChild($('<div class="row"><b>' + SPORT_SHORT[p.sport] + '</b><span>' + money(v) +
      '<span class="muted small"> \u00B7 ' + Math.round(v / Math.max(1,cap) * 100) + "%</span></span></div>"));
    const rr = $('<div class="row" style="gap:6px;margin-top:6px"></div>');
    const m = $('<button class="btn tiny sec">\u2212</button>');
    const bar = $('<span class="bar" style="margin:0 4px"><div style="width:' +
      Math.round(clamp(v / Math.max(1,cap) * 100, 0, 100)) + '%"></div></span>');
    const pl = $('<button class="btn tiny sec">+</button>');
    m.onclick = () => { me.rs[p.sport] = Math.max(0, (me.rs[p.sport]||0) - step); render() };
    pl.onclick = () => {
      if(rsSpend(me) + step > cap) return toast("That is over the cap.");
      me.rs[p.sport] = (me.rs[p.sport]||0) + step; render();
    };
    rr.appendChild(m); rr.appendChild(bar); rr.appendChild(pl);
    row.appendChild(rr);
    c.appendChild(row);
  });
  const risk = titleIXRisk(me);
  c.appendChild($('<div class="row" style="margin-top:12px"><span class="lbl">Women\u2019s programs</span>' +
    '<span class="' + (risk > 0.4 ? "res-l" : risk > 0.2 ? "" : "res-w") + '">' +
    Math.round(womensShare(me)*100) + "%</span></div>"));
  c.appendChild($('<div class="small ' + (risk > 0.4 ? "res-l" : "muted") + '" style="margin-top:5px">' +
    titleIXWord(me) + ".</div>"));
  w.appendChild(c);

  const rr = $('<div class="row" style="gap:6px"></div>');
  const auto = $('<button class="btn sec sm" style="flex:1">Split it the way everyone else does</button>');
  auto.onclick = () => { me.rs = rsAutoSplit(me); saveSoon(); render() };
  const out = $('<button class="btn sec sm" style="flex:1">Opt back out</button>');
  out.onclick = () => { me.rsIn = false; me.rs = {}; saveSoon(); toast("You are out."); render() };
  rr.appendChild(auto); rr.appendChild(out);
  w.appendChild(rr);
  osNext(w);
}

/* ===========================================================================
   FUNDRAISING
   =========================================================================== */
function osDonors(w, me){
  me.board = me.board || [];
  if(!me.board.length) seedDonors(me);
  const held = Object.keys(me.restricted || {}).filter(k => me.restricted[k] > 0);

  const head = $('<div class="card"></div>');
  head.appendChild($('<div class="row"><div><div class="lbl">Given to date</div><div class="big">' +
    money(sum(me.board.map(d => d.given))) + '</div></div><div style="text-align:right">' +
    '<div class="lbl">Restricted and unspent</div><div class="big">' +
    money(sum(held.map(k => me.restricted[k]))) + "</div></div></div>"));
  if(held.length) head.appendChild($('<div class="small muted" style="margin-top:8px">' +
    held.map(k => money(me.restricted[k]) + " for " + BLD[k].name.toLowerCase()).join(", ") +
    ". It will pay for that and nothing else.</div>"));
  w.appendChild(head);

  /* The two warmest, anyone who has already given, and one new name. Showing
     the whole board every single year turned the best screen in the game into
     a chore. */
  const shown = me.board.slice().sort((a,b) => (b.given - a.given) || (b.warmth - a.warmth)).slice(0, 3);
  const fresh = me.board.filter(d => shown.indexOf(d) < 0 && !d.given && d.warmth < 30)[0];
  if(fresh) shown.push(fresh);
  if(me.board.length > shown.length)
    w.appendChild($('<div class="small muted" style="margin:2px 0 10px">' +
      (me.board.length - shown.length) + " other names on the board are not worth your week yet.</div>"));
  shown.forEach(d => {
    const card = $('<div class="card"></div>');
    card.appendChild($('<div class="row"><b>' + esc(d.name) + '</b><span class="tag">' +
      capWord(d.cap) + "</span></div>"));
    card.appendChild($('<div class="small muted" style="margin-top:4px">' + esc(d.how) +
      ". Would fund " + causeLabel(d.cause) + ".</div>"));

    /* Warmth is the whole mechanic, so it gets a bar rather than a word buried
       on the right hand side of a row. */
    card.appendChild($('<div class="row" style="margin-top:10px"><span class="lbl">Where you stand</span>' +
      '<span class="small">' + warmthWord(d.warmth) + "</span></div>"));
    card.appendChild($('<div class="warm"><div style="width:' + Math.round(clamp(d.warmth,0,100)) + '%"></div></div>'));
    if(d.given) card.appendChild($('<div class="small gold" style="margin-top:6px">Has given ' +
      money(d.given) + " so far.</div>"));

    const cost = cultivateCost(d);
    const cu = $('<button class="btn sec sm" style="width:100%;margin-top:10px">Dinner and a tour \u00B7 ' +
      money(cost) + "</button>");
    cu.onclick = () => { const r = cultivate(d); if(!r.ok) return toast(r.why);
      toast(d.name.split(" ")[0] + " is " + warmthWord(d.warmth).toLowerCase() + " now.");
      saveSoon(); render() };
    card.appendChild(cu);

    const tiers = askTiers(d);
    if(tiers.length){
      const grid = $('<div class="askgrid"></div>');
      tiers.forEach((t2, idx) => {
        /* Only the middle ask is the obvious one, so only it reads as primary. */
        const b = $('<button class="btn ask ' + (idx === 1 ? "" : "sec") + '"><b>' +
          money(t2.amt) + "</b><span>" + esc(t2.label.replace(/^A /, "")) + "</span></button>");
        b.onclick = () => {
          const r = solicit(d, t2.amt);
          if(!r.ok){ toast(r.why); saveSoon(); render(); return }
          toast(d.name + " gave " + money(r.amt) +
            (r.cause === "open" ? ", unrestricted." : ", for " + causeLabel(r.cause) + "."));
          saveSoon(); render();
        };
        grid.appendChild(b);
      });
      card.appendChild(grid);
      card.appendChild($('<div class="small muted" style="margin-top:7px">Ask for more than the relationship carries and they say no, and the relationship cools.</div>'));
    } else {
      card.appendChild($('<div class="small muted" style="margin-top:8px">Not warm enough to ask for anything yet.</div>'));
    }
    w.appendChild(card);
  });
  osNext(w);
}

/* ===========================================================================
   SCHEDULING
   =========================================================================== */
function osSchedule(w, me){
  if(!G.nonconf) ncInit();
  const sum2 = ncSummary();
  const head = $('<div class="card"></div>');
  head.appendChild($('<div class="row"><div><div class="lbl">Guarantees you collect</div>' +
    '<div class="big res-w">' + money(sum2.earned) + '</div></div><div style="text-align:right">' +
    '<div class="lbl">Guarantees you pay</div><div class="big res-l">' + money(sum2.paid) + "</div></div></div>"));
  head.appendChild($('<div class="small muted" style="margin-top:8px">Non-conference dates are yours to fill. A trip to a big stadium is a loss and a check. A home game against a small school is a win you paid for.</div>'));
  w.appendChild(head);

  NC_SPORTS.forEach(sp => {
    if(!progOf(me, sp)) return;
    const c = $('<div class="card"></div>');
    c.appendChild($('<div class="grp-h">' + SPORT_NAME[sp] + "</div>"));
    (G.nonconf[sp] || []).forEach((booked, slot) => {
      const row = $('<div style="padding:10px 0;border-bottom:1px solid var(--hair)"></div>');
      row.appendChild($('<div class="lbl">Date ' + (slot+1) + "</div>"));
      if(booked && booked.kind !== "open"){
        const opp = S(booked.opp);
        row.appendChild($('<div style="margin:4px 0 6px">' + (booked.home ? "vs " : "at ") +
          "<b>" + esc(opp.name) + "</b></div>"));
        row.appendChild($('<div class="small ' + (booked.fee > 0 ? "res-w" : booked.fee < 0 ? "res-l" : "muted") + '">' +
          (booked.fee > 0 ? "They pay you " + money(booked.fee)
           : booked.fee < 0 ? "You pay them " + money(-booked.fee) : "No money either way") + "</div>"));
      } else {
        row.appendChild($('<div class="small muted" style="margin:4px 0 6px">Nothing booked.</div>'));
      }
      const opts = (G.ncOffers[sp] || [])[slot] || [];
      const rr = $('<div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap"></div>');
      opts.forEach(o => {
        const opp = o.opp != null ? S(o.opp) : null;
        const lab = o.kind === "buy" ? "Buy a home game" : o.kind === "guarantee" ? "Take the road check"
                  : o.kind === "series" ? "Home and home" : "Leave it open";
        const b = $('<button class="btn tiny ' + (booked && booked.kind === o.kind ? "" : "sec") + '">' +
          lab + (o.fee ? " \u00B7 " + money(Math.abs(o.fee)) : "") + "</button>");
        b.onclick = () => { const r = ncBook(sp, slot, o); if(!r.ok) return toast(r.why);
          toast(opp ? (o.home ? "Home against " : "At ") + opp.name : "Date left open."); saveSoon(); render() };
        rr.appendChild(b);
      });
      row.appendChild(rr);
      const detail = opts.map(o => o.opp != null ?
        (o.kind === "buy" ? "Buy: " : o.kind === "guarantee" ? "Road: " : "Series: ") + S(o.opp).name : null)
        .filter(Boolean).join(" \u00B7 ");
      if(detail) row.appendChild($('<div class="small muted" style="margin-top:6px">' + esc(detail) + "</div>"));
      c.appendChild(row);
    });
    w.appendChild(c);
  });
  osNext(w);
}

/* ===========================================================================
   THE CONFERENCE ROOM
   =========================================================================== */
function osConfRoom(w, me){
  if(!G.osData.invited){ G.osData.invited = true; G.invites = generateInvites() }
  const c = me.conf != null ? C(me.conf) : null;

  if(c){
    const st = standing(me);
    const ex = exitCost(me);
    const head = $('<div class="card"></div>');
    head.appendChild($('<div class="row"><h2 style="font-size:18px">' + esc(c.name) + '</h2>' +
      '<span class="tag">' + STRATUM_NAME[c.stratum] + "</span></div>"));
    head.appendChild($('<div class="small muted" style="margin-top:5px">Spring meetings. ' +
      c.members.length + " athletic directors, " + c.members.length +
      " presidents, and one commissioner in the same hotel for a week.</div>"));
    head.appendChild($('<div class="divider"></div>'));
    head.appendChild($('<div class="logline"><span class="muted">Your share last year</span><span>' +
      money(memberShare(me)) + "</span></div>"));
    head.appendChild($('<div class="logline"><span class="muted">Distribution</span><span>' +
      DIST_MODELS[c.model || "equal"].name + "</span></div>"));
    if(vestFactor(c, me) < 1) head.appendChild($('<div class="logline"><span class="muted">You are still vesting</span>' +
      '<span class="res-l">' + Math.round(vestFactor(c, me)*100) + "% of a full share</span></div>"));
    head.appendChild($('<div class="logline"><span class="muted">Tournament units held</span><span>' +
      unitCount(c) + " \u00B7 " + money(unitIncome(c)) + "/yr</span></div>"));
    head.appendChild($('<div class="logline"><span class="muted">Grant of rights</span><span>' +
      (ex.gorYears ? "signed through season " + c.gor : "expired") + "</span></div>"));
    head.appendChild($('<div class="logline"><span class="muted">Cost to leave</span><span class="res-l">' +
      money(ex.total) + "</span></div>"));
    if(ex.gorYears) head.appendChild($('<div class="small muted" style="margin-top:7px">' +
      money(ex.fee) + " exit fee at " + ex.mult.toFixed(1) + " times your annual payout, plus " +
      money(ex.gor) + " of media rights you would still be handing over for " + ex.gorYears +
      " more years. That second number is the one that keeps schools where they are.</div>"));
    head.appendChild($('<div class="row" style="margin-top:10px"><span class="lbl">Your voice in the room</span>' +
      '<span>' + standingWord(st) + "</span></div>"));
    w.appendChild(head);
  }

  /* the agenda */
  const agenda = G.agenda || [];
  agenda.forEach((m, i) => {
    const card = $('<div class="card"' + (m.resolved ? "" : ' style="border-color:rgba(224,175,82,.45)"') + "></div>");
    card.appendChild($('<div class="grp-h' + (m.resolved ? "" : " gold") + '">Item ' + (i+1) + "</div>"));
    card.appendChild($('<div><b>' + esc(m.title) + "</b></div>"));
    card.appendChild($('<div class="small muted" style="margin:8px 0"><b>For:</b> ' + esc(m.yes) +
      "<br><b>Against:</b> " + esc(m.no) + "</div>"));
    if(m.resolved){
      card.appendChild($('<div class="small ' + (m.withYou ? "res-w" : "res-l") + '">' +
        (m.vetoed ? "The directors recommended it. The presidents' board did not sign it off."
                  : m.passed ? "Passed." : "Failed.") +
        (m.withYou ? " You were with the outcome." : " You were not.") + "</div>"));
    } else {
      const wc = whipCount(m);
      card.appendChild($('<div class="row"><span class="lbl">Where the room is</span><span>' +
        '<span class="res-w">' + wc.yes + " for</span> \u00B7 <span class=\"res-l\">" +
        wc.no + " against</span></span></div>"));
      const cost = whipCost();
      const wb = $('<button class="btn sec sm" style="width:100%;margin:10px 0 8px">Go and see the ones who might move \u00B7 ' +
        money(cost) + "</button>");
      wb.onclick = () => { const r = whipVotes(); toast(r.ok ? "Two more directors are with you." : r.why);
        saveSoon(); render() };
      card.appendChild(wb);
      const rr = $('<div class="row" style="gap:6px"></div>');
      const y = $('<button class="btn sm" style="flex:1">Vote for</button>');
      const n = $('<button class="btn sm sec" style="flex:1">Vote against</button>');
      const cast = v => { const r = resolveMeasure(m, v);
        toast(r.vetoed ? "The presidents' board blocked it."
              : r.passed ? "It passed." : "It failed.");
        saveSoon(); render() };
      y.onclick = () => cast("yes"); n.onclick = () => cast("no");
      rr.appendChild(y); rr.appendChild(n);
      card.appendChild(rr);
    }
    w.appendChild(card);
  });

  /* the invitation */
  if(G.invites.length){
    const inv = G.invites[0];
    const conf = C(inv.conf);
    const ex = exitCost(me);
    const card = $('<div class="card" style="border-color:rgba(224,175,82,.5)"></div>');
    card.appendChild($('<div class="grp-h gold">The phone rang</div>'));
    card.appendChild($('<div style="margin-bottom:8px">The <b>' + esc(conf.name) + "</b> wants you.</div>"));
    card.appendChild($('<div class="logline"><span class="muted">Their distribution</span><span>' +
      DIST_MODELS[conf.model || "equal"].name + "</span></div>"));
    card.appendChild($('<div class="logline"><span class="muted">You would start on</span><span>' +
      Math.round(VEST_SCHEDULE[conf.model || "equal"][0] * 100) + "% of a share, about " + money(inv.share) + "</span></div>"));
    card.appendChild($('<div class="logline"><span class="muted">Full share after</span><span>' +
      VEST_SCHEDULE[conf.model || "equal"].length + " years</span></div>"));
    if(ex.total) card.appendChild($('<div class="logline"><span class="muted">Getting out of here</span>' +
      '<span class="res-l">' + money(ex.total) + "</span></div>"));
    const rr = $('<div class="row" style="gap:6px;margin-top:10px"></div>');
    const a = $('<button class="btn sm" style="flex:1">Accept</button>');
    const b = $('<button class="btn sm sec" style="flex:1">Stay</button>');
    a.onclick = () => { const r = acceptInvite(inv); if(!r.ok) return toast(r.why);
      toast("You are in the " + conf.name + "."); G.invites = []; saveGame(); render() };
    b.onclick = () => { G.invites = []; toast("You told them no."); saveSoon(); render() };
    rr.appendChild(a); rr.appendChild(b);
    card.appendChild(rr);
    w.appendChild(card);
  }

  const lc = $('<div class="card"></div>');
  lc.appendChild($('<div class="grp-h">Getting on the list</div>'));
  lc.appendChild($('<div class="small muted" style="margin-bottom:10px">Nobody moves conferences by asking. You make sure the people who run other leagues know your television number, your market and your buildings, and you do it every year because it wears off.' +
    (G.lobby ? " You have been at it " + G.lobby + " years running." : "") + "</div>"));
  const cost = lobbyCost();
  const b = $('<button class="btn sec sm" style="width:100%">Work the other leagues \u00B7 ' + money(cost) + "</button>");
  b.onclick = () => { const r = doLobby(); if(!r.ok) return toast(r.why);
    G.invites = generateInvites();
    toast(G.invites.length ? "Somebody just called." : "You made the rounds. Nothing came of it.");
    saveSoon(); render() };
  lc.appendChild(b);
  w.appendChild(lc);

  osNext(w);
}

/* ===========================================================================
   TEAMS
   =========================================================================== */
function viewTeams(w, me){

      " \u00B7 " + moraleWord(co.morale) + " \u00B7 " + money(IN(co.pay)) + "/yr</div>"));
    const b = $('<button class="btn sec sm" style="margin-top:9px">Full file</button>');
    b.onclick = () => openCoach(co);
    cc.appendChild(b);
    w.appendChild(cc);
  }

  const conf = me.conf != null ? C(me.conf) : null;
  if(conf){
    const tc = $('<div class="card"></div>');

    const body = tbl.querySelector("tbody");
    confStandings(conf, SPORT_TAB).forEach((r, i) => {

        '</td><td class="l">' + (rk ? '<span class="rk">#' + rk + "</span>" : "") + esc(r.s.name) +
        "</td><td>" + r.W + "</td><td>" + r.L + "</td></tr>"));

  /* national top ten in this sport */

    if(ext){

      rr.appendChild(e2);

    const f = $('<button class="btn tiny warn">' + (inSeason ? "Fire now" : "Fire") + " \u00B7 " + money(buy) + "</button>");

      const r = fireCoach(p.sport);

function buildOne(me, b){
  /* Building is the same transaction wherever it is initiated from, so the
     offseason step and the Build tab cannot drift apart. */
  const l = me.bld[b.key] || 0;
  if(l >= 5) return { ok:false, why:"There is nothing better than this anywhere." };
  const cost = IN(b.cost[l+1]);
  const held = restrictedFor(me, b.key);
  if(held + me.budget < cost)
    return { ok:false, why:"You are " + money(cost - held - me.budget) + " short." };
  const used = spendRestricted(me, b.key, cost);
  me.budget -= (cost - used);
  me.bld[b.key] = l + 1;
  touchPillars();
  return { ok:true, cost, used, level:l+1 };
}
function viewBuild(w, me){
  const c = $('<div class="card"></div>');

    held.map(k => money(me.restricted[k]) + " for the " + BLD[k].name.toLowerCase()).join(", ") +

  BUILDINGS.forEach(b => {

    const card = $('<div class="card"></div>');

      const cost = IN(b.cost[l+1]);

      const r = restrictedFor(me, b.key);

        facWord(l+1).toLowerCase() + " \u00B7 " + money(cost) + "</button>");
      bt.onclick = () => { const res = buildOne(me, b); if(!res.ok) return toast(res.why);
        saveSoon();
        toast(res.used ? money(res.used) + " of restricted money covered it."
                       : b.name + " is now " + facWord(res.level).toLowerCase() + ".");
        render() };
      card.appendChild(bt);
      card.appendChild($('<div class="small muted" style="margin-top:5px">Upkeep would go to ' + money(nk) +
        " a year" + (r ? ", and " + money(r) + " of that cost is already funded" : "") + ".</div>"));
    } else {
      card.appendChild($('<div class="small gold" style="margin-top:8px">Nothing better exists anywhere.</div>'));
    }

    /* the recurring lever: how hard you fund keeping it standing */
    if(l > 0){
      card.appendChild($('<div class="divider"></div>'));
      card.appendChild($('<div class="row"><span class="lbl">Maintenance</span><span>' +

      const rr = $('<div class="row" style="gap:5px;margin-top:8px"></div>');
      MAINT.forEach((m, i) => {
        const bb = $('<button class="btn tiny ' + (i === tier ? "" : "sec") + '" style="flex:1">' + m.name + "</button>");
        bb.onclick = () => { me.maint[b.key] = i; touchPillars(); saveSoon();
          toast(m.name + " maintenance on the " + b.name.toLowerCase() + ". " +
            money(Math.round(IN(b.keep[l]) * m.mult)) + " a year."); render() };
        rr.appendChild(bb);

      card.appendChild($('<div class="small ' + (tier === 0 ? "res-l" : "muted") + '" style="margin-top:6px">' +
        MAINT[tier].note + "</div>"));
    }

    /* the two buildings that sell tickets can sell better ones */
    if(PREMIUM[b.key] && l > 0){
      const pv = (me.prem || {})[b.key] || 0;

      card.appendChild($('<div class="divider"></div>'));

          me.budget -= cost; me.prem[b.key] = pv + 1; saveSoon();

  const cap = $('<div class="card"></div>');

  cap.appendChild($('<div class="logline"><span class="muted">Turning up</span><span>' +

    money(gateSeason(me)) + " a year</span></div>"));
  w.appendChild(cap);
}

  const c = $('<div class="card"></div>');
  c.appendChild($('<div class="row statrow"><div class="stat"><div class="lbl">In the bank</div><div class="big" style="' +

    '<div class="stat"><div class="lbl">Going out</div><div class="big res-l">' + money(X) + "</div></div></div>"));
  c.appendChild($('<div class="small ' + (R-X>=0?"res-w":"res-l") + '" style="margin-top:8px">' +
    (R-X>=0 ? "You are running a surplus of " + money(R-X) + " a year." :
              "You are losing " + money(X-R) + " a year.") + "</div>"));

  const lc = $('<div class="card"></div>');
  lc.appendChild($('<div class="grp-h">Where it comes from</div>'));

    '</span><span class="res-w">' + money(v) + "</span></div>")));

  w.appendChild(dc);

  /* Inflation. Every contract, building cost and television deal in the game is
     stored in season-one dollars and converted at the point it is paid, so a

    "prices up " + Math.round((G.infl - 1) * 100) + "%</span></div>"));

    G.infl.toFixed(2) + "</span></div>"));

  w.appendChild(ic);

  const bc = $('<div class="card"></div>');
  bc.appendChild($('<div class="grp-h">This career</div>'));
