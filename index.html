<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AD Empire</title>
<meta name="theme-color" content="#0a0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AD Empire">

<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="app" style="color:#e9ecf2;font-family:Open Sans,system-ui,sans-serif;padding:24px">Loading AD Empire…</div>
<script>
(async function(){
  const SRC = "https://cdn.jsdelivr.net/gh/siblingformats5d/frontline@633784ef373c4bcd15eee5e778e2101e76773bee/index.html";
  const FALLBACK = "https://raw.githubusercontent.com/siblingformats5d/frontline/633784ef373c4bcd15eee5e778e2101e76773bee/index.html";
  const REPS = [["    w.appendChild($('<div class=\"card\" style=\"border-color:var(--loss)\"><div class=\"small\">' +\n      '<b style=\"color:var(--loss)\">This tab failed to draw.</b> The rest of the game still works.</div></div>'));", "    w.appendChild($('<div class=\"card\" style=\"border-color:var(--loss)\"><div class=\"small\">' +\n      '<b style=\"color:var(--loss)\">This tab failed to draw.</b> The rest of the game still works.' +\n      (err && err.message ? '<div class=\"muted\" style=\"margin-top:6px\">' + esc(err.message) + \"</div>\" : \"\") +\n      \"</div></div>\"));"], ["    const m = MAINT[(s.maint || {})[k] == null ? 1 : s.maint[k]];\n    w += (lv * 20 + (lv > 0 ? m.boost : 0)) * BLD_W[k];", "    const m = MAINT[(s.maint || {})[k] == null ? 1 : s.maint[k]] || MAINT[1];\n    w += (lv * 20 + (lv > 0 ? m.boost : 0)) * BLD_W[k];"], ["function osCarousel(w, me){\n  if(!G.osData.carousel){\n    G.osData.carousel = true;\n    G.offers = poachOffers();\n  }", "function osCarousel(w, me){\n  G.osData = G.osData || {};\n  if(!G.osData.carousel){\n    G.osData.carousel = true;\n    try{ G.offers = poachOffers() }catch(e){ G.offers = [] }\n  }\n  if(!Array.isArray(G.offers)) G.offers = [];"], ["    G.offers.slice().forEach(o => {\n      const co = me.coaches[o.sp];\n      if(!co) return;\n      const from = S(o.from);", "    G.offers.slice().forEach(o => {\n      const co = me.coaches[o.sp];\n      const from = S(o.from);\n      if(!co || !from) return;"], ["    const ext = extensionTerms(p.sport);\n    const buy = buyoutFor(co);\n    const g = p.last.W + p.last.L;", "    const ext = extensionTerms(p.sport) || { underpaid:false, cost:0, years:4 };\n    const buy = buyoutFor(co);\n    const last = p.last || {W:0,L:0};\n    const g = last.W + last.L;"], ["(g ? p.last.W + \"-\" + p.last.L + \" last year \\u00B7 \" : \"\") + coachWord(coachOvr(co)) +", "(g ? last.W + \"-\" + last.L + \" last year \\u00B7 \" : \"\") + coachWord(coachOvr(co)) +"], ["function startSearch(sp, useFirm){", "function beginSearchDesk(){\n  G.osData = G.osData || {};\n  if(G.phase === \"regular\" || G.phase === \"conf\" || G.phase === \"national\" || G.phase === \"cup\"){\n    G.phase = \"offseason\";\n    G.osStep = 1;\n  } else if(G.osStep == null){\n    G.osStep = 1;\n  }\n  TAB = \"office\";\n}\nfunction startSearch(sp, useFirm){"], ["        a.onclick = () => { const r = startSearch(p.sport, false); if(!r.ok) return toast(r.why);\n          G.phase = \"offseason\"; G.osStep = 1; TAB = \"office\"; saveSoon(); render() };\n        b.onclick = () => { const r = startSearch(p.sport, true); if(!r.ok) return toast(r.why);\n          G.phase = \"offseason\"; G.osStep = 1; TAB = \"office\"; saveSoon(); render() };", "        a.onclick = () => { const r = startSearch(p.sport, false); if(!r.ok) return toast(r.why);\n          beginSearchDesk(); saveSoon(); render() };\n        b.onclick = () => { const r = startSearch(p.sport, true); if(!r.ok) return toast(r.why);\n          beginSearchDesk(); saveSoon(); render() };"]];
  function patch(src){
    let out = src, missed = [];
    REPS.forEach((pair, i) => {
      const a = pair[0], b = pair[1];
      if(out.indexOf(a) < 0) missed.push(i);
      else out = out.split(a).join(b);
    });
    if(missed.length) console.warn("patch misses", missed);
    return out;
  }
  async function load(url){
    const r = await fetch(url, { cache: "no-store" });
    if(!r.ok) throw new Error("fetch " + r.status);
    return r.text();
  }
  let html;
  try { html = await load(SRC) }
  catch(e){ html = await load(FALLBACK) }
  const style = (html.match(/<style>([\s\S]*?)<\/style>/) || [])[1] || "";
  const script = (html.match(/<script>([\s\S]*?)<\/script>/) || [])[1];
  if(!script) throw new Error("game script missing from source");
  const st = document.createElement("style");
  st.textContent = style;
  document.head.appendChild(st);
  const s = document.createElement("script");
  s.textContent = patch(script);
  document.body.appendChild(s);
})().catch(err => {
  const el = document.getElementById("app");
  if(el) el.textContent = "Could not load AD Empire. " + (err && err.message ? err.message : err);
});
</script>
</body>
</html>
