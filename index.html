    if(a.target!=null&&!PV(a.target))errs.push(`army ${a.id} targeting missing province`);
    if(a.moving!=null&&!PV(a.moving))errs.push(`army ${a.id} moving to missing province`);
    if(!G.generals.some(g=>g.id===a.gen))errs.push(`army ${a.id} has no general`);
  });
  G.provinces.forEach(p=>{
    if(p.sea)return;
    if(p.owner==null)return;
    const c=CO(p.owner);
    if(!c)errs.push(`province ${p.id} owned by missing country`);
    else if(!c.alive)errs.push(`province ${p.id} owned by dead country ${c.name}`);
  });
  // EXACTLY one, not at least one, and the country's own pointer has to agree with it.
  // The old assert only checked "at least one, and not for the player", which is why a
  // leaked capital star was invisible to a 63,000 day soak.
  alive().forEach(c=>{
    const stars=G.provinces.filter(p=>!p.sea&&p.capital&&p.owner===c.id);
    if(!provsOf(c.id).length)return;
    if(stars.length!==1)errs.push(`${c.name} has ${stars.length} capitals`);
    else if(c.capital!==stars[0].id)errs.push(`${c.name} points at the wrong capital`);
  });
  const orphanStars=G.provinces.filter(p=>!p.sea&&p.capital&&(!CO(p.owner)||!CO(p.owner).alive));
  if(orphanStars.length)errs.push(`${orphanStars.length} capital stars on nobody's land`);
  for(const k in G.rel){
    const [a,b]=k.split(":").map(Number);
    if(!CO(a)||!CO(b))errs.push(`relation ${k} references a missing country`);
    else if(!CO(a).alive||!CO(b).alive)errs.push(`relation ${k} references a dead country`);
    const r=G.rel[k];
    if(r.war&&r.pact)errs.push(`relation ${k} is at war and allied at once`);
  }
  if(errs.length)throw new Error(`[${where}] ${errs.length} faults: ${errs.slice(0,4).join(" | ")}`);
  return true;
}
function repairWorld(){
  let fixed=0;
  G.armies.slice().forEach(a=>{
    const c=CO(a.owner);
    if(!c||!c.alive||!PV(a.prov)||PV(a.prov).sea){destroyArmy(a);fixed++;return;}
    if(a.target!=null&&!PV(a.target)){a.target=null;a.stance="defend";fixed++;}
    if(a.moving!=null&&!PV(a.moving)){a.moving=null;a.eta=0;fixed++;}
    if(!G.generals.some(g=>g.id===a.gen)){const g=newGeneral();a.gen=g.id;fixed++;}
    if(a.troops<0){a.troops=0;fixed++;}
  });
  G.provinces.forEach(p=>{
    if(p.sea){p.owner=null;p.city=false;p.capital=false;return;}
    const c=CO(p.owner);
    if(!c||!c.alive){
      const nb=landNeighbors(p.id).map(n=>CO(n.owner)).filter(c2=>c2&&c2.alive);
      p.owner=nb.length?nb[0].id:(alive()[0]||{id:null}).id;
      p.capital=false;fixed++;
    }
  });
  for(const k in G.rel){
    const [a,b]=k.split(":").map(Number);
    const A=CO(a),B=CO(b);
    if(!A||!B||!A.alive||!B.alive){delete G.rel[k];fixed++;continue;}
    if(G.rel[k].war&&G.rel[k].pact){G.rel[k].pact=null;fixed++;}
  }
  G.provinces.forEach(p=>{
    if(p.capital&&(p.sea||!CO(p.owner)||!CO(p.owner).alive)){p.capital=false;fixed++;}
  });
  alive().forEach(c=>{
    const mine=provsOf(c.id);
    if(!mine.length)return;
    const stars=mine.filter(p=>p.capital);
    if(stars.length===1&&c.capital===stars[0].id)return;
    const seat=stars.find(p=>p.id===c.capital)||stars[0]||mine.find(p=>p.city)||mine[0];
    setCapital(c.id,seat.id);fixed++;
  });
  return fixed;
}
function integrityGuard(where){
  try{assertWorldIntegrity(where);}
  catch(e){const n=repairWorld();if(n)logAdd(`World repaired (${n} faults).`);}
}

/* ================================================================
   SAVE
   ================================================================ */
function scrub(o,d){
  d=d||0;if(d>10||o==null)return o;
  if(typeof o==="string")return o.replace(/[<>"'&]/g,"").slice(0,80);
  if(Array.isArray(o)){for(let i=0;i<o.length;i++)o[i]=scrub(o[i],d+1);return o;}
  if(typeof o==="object"){for(const k in o)o[k]=scrub(o[k],d+1);return o;}
  return o;
}
function serializeSave(){
  // provinces carry static geometry that never changes, so it is dropped and
  // recomputed on load. That is most of the file.
  const g={
    ver:SAVE_VER,day:G.day,you:G.you,speed:G.speed,
    nextArmy:G.nextArmy,nextGen:G.nextGen,stats:G.stats,
    defeat:!!G.defeat,victory:!!G.victory,
    p:G.provinces.map(p=>[p.id,p.sea?1:0,p.owner==null?-1:p.owner,p.name,p.terrain,
      (p.city?1:0)+(p.capital?2:0),p.fort,p.pop,Math.round(p.siege||0)]),
    c:G.countries.map(c=>[c.id,c.name,c.color,c.alive?1:0,c.capital,
      Math.round(c.treasury),Math.round(c.workers),c.factories,Math.round(c.pp),
      TECH.map(t=>c.tech[t.k]).join(","),c.personality,
      c.research?[c.research.k,c.research.left,c.research.total]:0,
      c.build.map(b=>[b.kind==="army"?1:0,b.prov==null?-1:b.prov,Math.round(b.left),b.size||0]),
      c.nextThink,c.homeProvs||0,c.nat==null?-1:c.nat]),
    a:G.armies.map(a=>[a.id,a.owner,a.prov,a.troops,a.max,a.gen,
      a.stance==="attack"?1:0,a.broken?1:0,a.moving==null?-1:a.moving,a.eta,
      a.target==null?-1:a.target,+(a.pool||0).toFixed(2)]),
    g:G.generals.map(x=>[x.id,x.name,x.skill]),
    r:Object.entries(G.rel).map(([k,v])=>[k,Math.round(v.stance),
      v.pact?v.pact.type:"",v.pact?v.pact.since:0,v.war?1:0,
      v.justify?[v.justify.by,v.justify.until]:0,v.lastAsk,v.truce,v.warStart||0,
      v.offer?[v.offer.from,v.offer.until]:0,v.ready?[v.ready.by,v.ready.until]:0]),
    l:G.log.slice(0,80).map(x=>[x.d,x.t,x.k])
  };
  return JSON.stringify(g);
}
function expandSave(s){
  const g={ver:s.ver,day:s.day,you:s.you,speed:s.speed||2,
    nextArmy:s.nextArmy,nextGen:s.nextGen,stats:s.stats||{battles:0,taken:0},
    defeat:!!s.defeat,victory:!!s.victory,rel:{},log:[]};
  g.provinces=s.p.map(a=>{
    const id=a[0],col=id%COLS,row=Math.floor(id/COLS),xy=hexXY(col,row);
    return {id,col,row,x:+xy.x.toFixed(1),y:+xy.y.toFixed(1),sea:!!a[1],
      owner:a[2]<0?null:a[2],name:a[3],terrain:a[4],
      city:!!(a[5]&1),capital:!!(a[5]&2),fort:a[6],pop:a[7],siege:a[8]||0,nb:neighborCells(col,row)};
  });
  g.countries=s.c.map(a=>{
    // comma separated, because join("") silently corrupted any level above nine
    const parts=String(a[9]).indexOf(",")>=0?String(a[9]).split(","):String(a[9]).split("");
    const tech={};TECH.forEach((t,i)=>tech[t.k]=+(parts[i]||0));
    return {id:a[0],name:a[1],color:a[2],alive:!!a[3],capital:a[4],ai:a[0]!==s.you,
      treasury:a[5],workers:a[6],factories:a[7],pp:a[8],tech,personality:a[10],
      research:a[11]?{k:a[11][0],left:a[11][1],total:a[11][2]}:null,homeProvs:a[14]||0,
      nat:(a[15]==null||a[15]<0)?null:a[15],
      blurb:(NATIONS[a[15]]||{}).blurb||"",bonus:(NATIONS[a[15]]||{}).bonus||{},
      build:(a[12]||[]).map(b=>({kind:b[0]?"army":"factory",prov:b[1]<0?null:b[1],left:b[2],size:b[3]})),
      nextThink:a[13]||0};
  });
  g.armies=s.a.map(a=>({id:a[0],owner:a[1],prov:a[2],troops:a[3],max:a[4],gen:a[5],
    stance:a[6]?"attack":"defend",broken:!!a[7],moving:a[8]<0?null:a[8],eta:a[9],
    target:a[10]<0?null:a[10],pool:a[11]||0}));
  g.generals=s.g.map(a=>({id:a[0],name:a[1],skill:a[2]}));
  (s.r||[]).forEach(a=>{
    g.rel[a[0]]={stance:a[1],pact:a[2]?{type:a[2],since:a[3]}:null,war:!!a[4],
      justify:a[5]?{by:a[5][0],until:a[5][1]}:null,lastAsk:a[6],truce:a[7],warStart:a[8],
      offer:a[9]?{from:a[9][0],until:a[9][1]}:null,
      ready:a[10]?{by:a[10][0],until:a[10][1]}:null};
  });
  g.log=(s.l||[]).map(a=>({d:a[0],t:a[1],k:a[2]}));
  return g;
}
function validateSaveShape(g){
  if(!g||typeof g!=="object")throw new Error("not an object");
  if(g.ver!==SAVE_VER)throw new Error("version");
  if(!Array.isArray(g.p)||g.p.length!==COLS*ROWS)throw new Error("province count");
  if(!Array.isArray(g.c)||!g.c.length)throw new Error("countries");
  if(!Array.isArray(g.a)||!Array.isArray(g.g))throw new Error("armies");
  if(typeof g.you!=="number"||!g.c.some(c=>c[0]===g.you))throw new Error("no player country");
  if(typeof g.day!=="number"||g.day<0)throw new Error("day");
  return true;
}
function saveGame(quiet){
  try{
    localStorage.setItem(SAVE_KEY,serializeSave());
    G.saveError=false;return true;
  }catch(e){
    G.saveError=true;
    if(!quiet)toast("Could not save. Storage is full or blocked.","war");
    return false;
  }
}
function loadGame(){
  const backup=G;
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const s=scrub(JSON.parse(raw));
    validateSaveShape(s);
    G=expandSave(s);
    rebuildIndex();
    repairWorld();
    if(!you())throw new Error("player country missing");
    return true;
  }catch(e){
    G=backup;if(G)rebuildIndex();
    return false;
  }
}
function wipeSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}

/* ================================================================
   UI STATE
   All of it in one object, so resetting after a new game or a load clears
   everything instead of most things.
   ================================================================ */
const UI={tab:"nation",sel:null,army:null,sheet:null,lastTab:null,pending:""};
function resetUI(){UI.tab="nation";UI.sel=null;UI.army=null;UI.sheet=null;UI.lastTab=null;UI.pending="";}
const app=document.getElementById("app");
let TOASTS=null;
function toast(msg,kind){
  if(!TOASTS){TOASTS=$(`<div class="toasts"></div>`);document.body.appendChild(TOASTS);}

/* ================================================================
   THE MAP
   Redrawn every tick, so it stays cheap: one path per hex, one counter per army,
   one line per live battle. Everything else on screen is left alone.
   ================================================================ */
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(Math.round(r*(1+amt)),0,255);g=clamp(Math.round(g*(1+amt)),0,255);b=clamp(Math.round(b*(1+amt)),0,255);
  return "#"+((r<<16)|(g<<8)|b).toString(16).padStart(6,"0");
}
function mapSVG(){
  let hexes="",marks="",counters="",arrows="";
  for(const p of G.provinces){
    const path=hexPath(p.x,p.y);
    if(p.sea){hexes+=`<path class="hex sea" d="${path}"/>`;continue;}
    const c=CO(p.owner);
    const base=c?c.color:"#2a3640";
    const fill=shade(base,TERRAIN_TINT[p.terrain]||0);
    const sel=UI.sel===p.id?" sel":"";
    hexes+=`<path class="hex${sel}" d="${path}" fill="${fill}" data-p="${p.id}"/>`;
    if(p.capital)
      marks+=`<path class="cap" d="M${p.x} ${p.y-9} l2.6 5.4 5.9.8 -4.3 4.2 1 5.9 -5.2-2.8 -5.2 2.8 1-5.9 -4.3-4.2 5.9-.8Z"/>`;
    else if(p.city)
      marks+=`<rect class="city" x="${p.x-3.5}" y="${p.y-3.5}" width="7" height="7" rx="1"/>`;
    if(p.fort>0)
      marks+=`<text class="hexlbl" x="${p.x}" y="${p.y+HEX-9}">${"|".repeat(p.fort)}</text>`;
    if(p.siege>0){
      const need=siegeNeed(p),frac=clamp(p.siege/Math.max(1,need),0,1);
      marks+=`<path d="${hexPath(p.x,p.y)}" fill="none" stroke="#e05252" stroke-width="2.4"
        stroke-dasharray="${(frac*HEX*6).toFixed(1)} 999" opacity=".95" pointer-events="none"/>`;
    }
  }
  // army counters: stacked slightly when more than one sits on a hex
  const byProv={};
  G.armies.forEach(a=>{(byProv[a.prov]=byProv[a.prov]||[]).push(a);});
  for(const pid in byProv){
    const p=PV(+pid);if(!p)continue;
    const stack=byProv[pid];
    stack.slice(0,3).forEach((a,i)=>{
      const c=CO(a.owner);
      const ox=p.x-13+i*3, oy=p.y+4+i*3;
      const w=Math.max(20,a.troops>=100?28:24);
      const hp=clamp(a.troops/Math.max(1,a.max),0,1);
      counters+=`<g class="cnt"><rect x="${ox}" y="${oy}" width="${w}" height="13" rx="2"
        fill="${c?c.color:"#666"}" opacity="${a.broken?.55:1}"/>
        <rect x="${ox}" y="${oy+11}" width="${(w*hp).toFixed(1)}" height="2" fill="${hp>.5?"#6cc27a":hp>.25?"#e0a33e":"#e05252"}"/>
        <text x="${ox+w/2}" y="${oy+6}">${a.broken?"\u2620":a.troops}</text></g>`;
      if(a.owner===G.you)
        counters+=`<rect x="${ox-1.5}" y="${oy-1.5}" width="${w+3}" height="16" rx="3" fill="none" stroke="#f0b429" stroke-width="1.3" pointer-events="none"/>`;
    });
  }
  // battle arrows: green when the attacker is winning the exchange, red when losing
  engagements().forEach(({att,def})=>{
    const a=PV(att.prov),b=PV(def.prov);
    if(!a||!b)return;
    const winning=att._win;
    const col=winning?"#6cc27a":"#e05252";
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
    // pushed off the centre line so it does not sit under the two unit counters
    const nx=-dy/len, ny=dx/len;
    const off=11;
    const x1=a.x+dx/len*11+nx*off, y1=a.y+dy/len*11+ny*off;
    const x2=b.x-dx/len*21+nx*off, y2=b.y-dy/len*21+ny*off;
    const ax=x2-dx/len*9, ay=y2-dy/len*9, px=nx*6, py=ny*6;
    arrows+=`<line class="arrow" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#080d11" stroke-width="6"/>
      <line class="arrow" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}"/>
      <path class="arrow" d="M${x2.toFixed(1)} ${y2.toFixed(1)}L${(ax+px).toFixed(1)} ${(ay+py).toFixed(1)}L${(ax-px).toFixed(1)} ${(ay-py).toFixed(1)}Z" fill="${col}" stroke="#080d11" stroke-width="1.4"/>`;
  });
  return `<svg class="map" viewBox="0 0 ${MAPW} ${MAPH}" role="img" aria-label="Situation map">
    ${hexes}${marks}${counters}${arrows}</svg>`;
}
function paintMap(){
  const host=document.getElementById("mapwrap");
  if(!host)return;
  const old=host.querySelector("svg");
  const next=$(mapSVG());
  if(old)host.replaceChild(next,old);else host.insertBefore(next,host.firstChild);
  next.querySelectorAll("[data-p]").forEach(el=>{
    el.onclick=()=>{const id=+el.dataset.p;UI.sel=id;openProvince(id);};
  });
}
function paintBar(){
  const host=document.getElementById("bar");

}
function barHTML(){
  const c=you();if(!c)return "";

  // Everything is shown per DAY. The clock ticks in days and nobody converts weeks in

/* ================================================================
   THE CLOCK
   The world runs whether or not the player is looking at it. This is the
   structural difference from a turn-based game: render can no longer be the
   only thing that redraws, because state changes without a tap.
   ================================================================ */
let CLOCK=null;
function restartClock(){
  if(CLOCK){clearInterval(CLOCK);CLOCK=null;}
  const ms=TICK_MS[G?G.speed:0];
  if(!ms)return;
  CLOCK=setInterval(()=>{
    tick();
    paintMap();paintBar();
    // Army is the tap-heaviest tab and it was being rebuilt every 170ms at speed 3, so
    // Select then Attack ate clicks. While a selection or a sheet is live, the panel
    // holds still; the map and the readout keep moving.
    const frozen=(UI.tab==="army"&&(UI.army!=null||UI.sheet))||UI.sheet;
    if(!frozen&&(UI.tab==="army"||UI.tab==="nation"||UI.tab==="build"))paintPanel();
    // A decision waiting on the player has to reach them even if they are looking at
    // another tab. Repainting Diplomacy every tick would move buttons under a thumb
    // mid-tap, so it only rebuilds when the set of pending decisions actually changes.
    const sig=pendingSignature();
    if(sig!==UI.pending){UI.pending=sig;render();}
    if(G.defeat||G.victory){G.speed=0;restartClock();render();}
  },ms);
}

/* ================================================================
   PANELS
   ================================================================ */
function pendingSignature(){
  let out="";
  for(const k in G.rel){
    const r=G.rel[k];
    if(r.offer)out+="o"+k;
    if(r.ready)out+="r"+k;
    if(r.demand)out+="d"+k;
  }
  return out;
}
function render(){
  if(!G||G.you==null){renderStart();return;}
  UI.pending=pendingSignature();
  const keep=UI.lastTab===UI.tab?(window.scrollY||0):0;
  UI.lastTab=UI.tab;
  app.innerHTML="";
  app.appendChild($(`<div class="bar" id="bar">${barHTML()}</div>`));
  app.appendChild($(`<div class="mapwrap" id="mapwrap"></div>`));
  app.appendChild($(`<div class="wrap" id="panel"></div>`));
  app.appendChild(nav());
  paintMap();
  paintPanel();
  window.scrollTo(0,keep);
}
function nav(){
  const items=[["nation","\u25C8","Nation"],["army","\u2694","Army"],["build","\u2699","Build"],
    ["research","\u2691","Tech"],["diplo","\u25CE","Talks"],["world","\u25D4","World"],
    ["log","\u2261","Log"]];
  const n=$(`<nav></nav>`);
  const offers=Object.values(G.rel).filter(r=>r.offer||r.ready||r.demand).length;
  items.forEach(([k,ic,lab])=>{
    const alert=(k==="diplo"&&offers>0);
    const b=$(`<button class="${UI.tab===k?"on":""}${alert?" alert":""}" ${UI.tab===k?'aria-current="page"':""}>
      <span class="ic">${ic}</span>${lab}</button>`);
    b.onclick=()=>{UI.tab=k;render();};
    n.appendChild(b);
  });
  return n;
}
function paintPanel(){
  const w=document.getElementById("panel");
  if(!w)return;
  const y=window.scrollY;
  w.innerHTML="";
  if(G.defeat){w.appendChild($(`<div class="card"><div class="eyebrow">Game over</div>
    <h3>Your nation is gone.</h3><div class="small muted">Survived to ${esc(dateStr(G.day))}.</div></div>`));}
  if(G.victory){w.appendChild($(`<div class="card"><div class="eyebrow">Victory</div>
    <h3>The map is yours.</h3><div class="small muted">Completed ${esc(dateStr(G.day))}.</div></div>`));}
  ({nation:panelNation,army:panelArmy,build:panelBuild,research:panelResearch,
    diplo:panelDiplo,world:panelWorld,log:panelLog}[UI.tab]||panelNation)(w);
  if(Math.abs(window.scrollY-y)>2)window.scrollTo(0,y);
}

/* ---- Nation ---- */
function panelNation(w){
  const c=you();
  const wars=alive().filter(o=>o.id!==c.id&&atWar(c.id,o.id));
  const pacts=alliesOf(c.id).map(CO).filter(Boolean);
  const threats=[];
  for(const k in G.rel){
    const r=G.rel[k];
    if(!r.justify)continue;
    const [a,b]=k.split(":").map(Number);
    if((a===c.id||b===c.id)&&r.justify.by!==c.id)threats.push({who:CO(r.justify.by),until:r.justify.until});
  }
  // The game used to tell you how you were doing only once, at the end. A live rank
  // turns the clock into a scoreboard instead of a screensaver.
  const byLand=alive().slice().sort((x,y)=>provsOf(y.id).length-provsOf(x.id).length);
  const byArmy=alive().slice().sort((x,y)=>
    armiesOf(y.id).reduce((s,a)=>s+a.troops,0)-armiesOf(x.id).reduce((s,a)=>s+a.troops,0));
  const rankLand=byLand.findIndex(x=>x.id===c.id)+1;
  const rankArmy=byArmy.findIndex(x=>x.id===c.id)+1;

  if(G.day<OPENING_PEACE){
    const b=$(`<div class="card" style="border-color:var(--pact)"></div>`);
    b.appendChild($(`<div class="eyebrow" style="color:var(--pact)">Peacetime</div>`));
    b.appendChild($(`<div class="small">Nobody can start a war until <b>${esc(dateStr(OPENING_PEACE))}</b>.
      Build armies, factories and forts now. ${OPENING_PEACE-G.day} days left.</div>`));
    w.appendChild(b);
  }

  const card=$(`<div class="card"></div>`);
  card.appendChild($(`<div class="eyebrow">Situation</div>`));
  card.appendChild($(`<div class="between"><h3 style="margin:0">${esc(c.name)}</h3>
    <span class="pill">${esc((PERSONALITIES.find(p=>p.k===c.personality)||{}).label||"")}</span></div>`));
  if(c.blurb)card.appendChild($(`<div class="small muted">${esc(c.blurb)}</div>`));
  card.appendChild($(`<div class="row small" style="margin-top:5px">
    <span class="pill">Land ${rankLand} of ${alive().length}</span>
    <span class="pill">Army ${rankArmy} of ${alive().length}</span></div>`));
  const st=[
    ["Provinces",provsOf(c.id).length+" of "+(c.homeProvs||provsOf(c.id).length)+" at the start"],
    ["Cities",provsOf(c.id).filter(p=>p.city).length],
    ["Armies",armiesOf(c.id).length+" / "+ARMY_MAX],
    ["Troops",armiesOf(c.id).reduce((a,x)=>a+x.troops,0)],
    ["Upkeep",money(upkeepOf(c.id)/7)+"/day"],
    ["Provinces taken",G.stats.mine||0]];
  card.appendChild($(`<div class="divider"></div><table>${
    st.map(([k,v])=>`<tr><td class="l muted">${k}</td><td class="mono">${esc(String(v))}</td></tr>`).join("")}</table>`));
  w.appendChild(card);

  if(threats.length){
    const t=$(`<div class="card" style="border-color:var(--war)"></div>`);
    t.appendChild($(`<div class="eyebrow" style="color:var(--war)">Incoming</div>`));
    threats.forEach(x=>t.appendChild($(`<div class="small">${esc(x.who?x.who.name:"Someone")} is justifying a war on you.
      <span class="mono muted">${Math.max(0,x.until-G.day)} days left.</span></div>`)));
    w.appendChild(t);
  }
  if(wars.length){
    const t=$(`<div class="card"></div>`);
    t.appendChild($(`<div class="eyebrow">At war with</div>`));
    const l=$(`<div class="lst"></div>`);
    wars.forEach(o=>{
      const row=$(`<div class="between"><div class="row">
        <span class="flag" style="background:${esc(o.color)}"></span>
        <span>${esc(o.name)}</span><span class="pill war">war</span></div></div>`);
      const b=$(`<button class="btn sm">Demand terms</button>`);
      b.onclick=()=>openTerms(o.id);
      row.appendChild(b);l.appendChild(row);
    });
    t.appendChild(l);w.appendChild(t);
  }
  if(pacts.length){
    const t=$(`<div class="card"></div>`);
    t.appendChild($(`<div class="eyebrow">Defence pacts</div>`));
    pacts.forEach(o=>t.appendChild($(`<div class="row small" style="padding:3px 0">
      <span class="flag" style="background:${esc(o.color)}"></span>${esc(o.name)}
      <span class="pill pact">defence</span></div>`)));
    w.appendChild(t);
  }
  // The headline rule he asked for, stated on the screen instead of hidden in a toast.
  {
    const aim=$(`<div class="card"></div>`);
    aim.appendChild($(`<div class="eyebrow">How a country ends</div>`));
    aim.appendChild($(`<div class="small muted">Taking a capital only ends a country that has
      already lost more than half its land. Above that, its government flees to another
      city and the war goes on. Take the land first, then the capital.</div>`));
    const list=alive().filter(o=>o.id!==c.id&&atWar(c.id,o.id));
    list.forEach(o=>{
      const left=provsOf(o.id).length, home=o.homeProvs||left;
      const need=Math.ceil(home*CAPITULATE_AT);
      const done=clamp(1-(left-need)/Math.max(1,home-need),0,1);
      aim.appendChild($(`<div style="margin-top:7px">
        <div class="between small"><span>${esc(o.name)}</span>
        <span class="mono muted">${left} of ${home} left \u00B7 needs ${Math.max(0,left-need+1)} more</span></div>
        <div class="bar2" style="margin-top:3px"><i style="width:${(done*100).toFixed(0)}%;background:var(--war)"></i></div></div>`));
    });
    if(list.length)w.appendChild(aim);
  }

  const sv=$(`<div class="card"></div>`);
  sv.appendChild($(`<div class="eyebrow">Save</div>`));
  const row=$(`<div class="row"></div>`);
  const b1=$(`<button class="btn sm">Save now</button>`);
  b1.onclick=()=>{if(saveGame())toast("Saved.","good");};
  const b2=$(`<button class="btn sm d">New game</button>`);
  b2.onclick=()=>confirmSheet("Start a new game?","This wipes the current campaign.",()=>{
    wipeSave();G=null;resetUI();if(CLOCK)clearInterval(CLOCK);CLOCK=null;renderStart();
  });
  row.appendChild(b1);row.appendChild(b2);sv.appendChild(row);
  if(G.saveError)sv.appendChild($(`<div class="small" style="color:var(--war);margin-top:6px">Saving is failing. Storage may be full.</div>`));
  w.appendChild(sv);
}

/* ---- Army ---- */
function panelArmy(w){
  const c=you();
  const arms=armiesOf(c.id);
  const head=$(`<div class="card"></div>`);
  head.appendChild($(`<div class="eyebrow">Order of battle</div>`));
  head.appendChild($(`<div class="small muted">Tap an army, then tap a province on the map to move or attack.
    Armies next to an enemy you are at war with fight on their own. Attack presses the
    assault, Hold digs in.</div>`));
  w.appendChild(head);
  if(!arms.length){
    w.appendChild($(`<div class="card small muted">No armies in the field. Raise one from the Build tab.</div>`));
    return;
  }
  const list=$(`<div class="card lst"></div>`);
  arms.sort((a,b)=>b.troops-a.troops).forEach(a=>{
    const g=generalOf(a),p=PV(a.prov);
    const hp=clamp(a.troops/Math.max(1,a.max),0,1);
    const state=a.broken?`<span class="pill war">broken</span>`
      :a.moving!=null?`<span class="pill">moving \u00B7 ${a.eta}d</span>`
      :a.stance==="attack"?`<span class="pill war">attacking</span>`
      :`<span class="pill">holding</span>`;
    const fight=a._fighting?`<span class="pill ${a._win?"pact":"war"}">${a._win?"winning":"losing"}</span>`:"";
    const where=a.moving!=null?`${esc(p?p.name:"?")} \u2192 ${esc(PV(a.moving)?PV(a.moving).name:"?")}`
      :a.target!=null?`${esc(p?p.name:"?")} vs ${esc(PV(a.target)?PV(a.target).name:"?")}`
      :esc(p?p.name:"?");
    const row=$(`<div>
      <div class="between"><div style="min-width:0">
        <div style="font-weight:600">${esc(g.name)} ${state} ${fight}</div>
        <div class="small muted">${where} \u00B7 skill ${g.skill}</div>
      </div><div class="mono" style="text-align:right">
        <div style="font-weight:700">${a.troops}</div><div class="small muted">/${a.max}</div></div></div>
      <div class="bar2" style="margin-top:4px"><i style="width:${(hp*100).toFixed(0)}%;background:${hp>.5?"var(--ok)":hp>.25?"var(--you)":"var(--war)"}"></i></div>
    </div>`);
    const acts=$(`<div class="row" style="margin-top:6px;flex-wrap:wrap"></div>`);
    const sel=$(`<button class="btn sm ${UI.army===a.id?"p":""}">${UI.army===a.id?"Selected":"Select"}</button>`);
    sel.onclick=()=>{UI.army=UI.army===a.id?null:a.id;paintPanel();paintMap();};
    acts.appendChild(sel);
    // He said troops every time, not armies. This is how you feed a unit already at the
    // front instead of waiting a fortnight for a whole new stack.
    if(PV(a.prov)&&PV(a.prov).owner===c.id&&a.troops<a.max+REINFORCE_OVER){
      const rc=reinforceCost(a);
      const rb=$(`<button class="btn sm">Reinforce \u00B7 ${money(rc.money)}</button>`);
      rb.disabled=c.treasury<rc.money||c.workers<rc.workers;
      rb.onclick=()=>{const res=orderReinforce(c.id,a.id);
        toast(res.ok?`+${res.gain} troops.`:res.msg,res.ok?"good":"war");paintPanel();paintBar();paintMap();};
      acts.appendChild(rb);
    }
    const gb=$(`<button class="btn sm">New general \u00B7 ${GENERAL_PP}pp</button>`);
    gb.disabled=c.pp<GENERAL_PP;
    gb.onclick=()=>{const res=replaceGeneral(c.id,a.id);
      toast(res.ok?`${res.name} takes command. Skill ${res.skill}.`:res.msg||"Cannot.",res.ok?"good":"war");
      paintPanel();paintBar();};
    acts.appendChild(gb);
    if(a.stance==="attack"||a.moving!=null){
      const h=$(`<button class="btn sm">Hold</button>`);
      h.onclick=()=>{orderHold(a);paintPanel();paintMap();};
      acts.appendChild(h);
    }
    if(UI.army===a.id){
      landNeighbors(a.prov).forEach(q=>{
        const enemy=q.owner!=null&&q.owner!==c.id;
        const war=enemy&&atWar(c.id,q.owner);
        if(enemy&&!war)return;
        const held=war&&zocBlocked(q,c.id);
        const b=$(`<button class="btn sm ${war?"d":""}">${war?"Attack ":"Move "}${esc(q.name)}</button>`);
        b.disabled=a.broken&&war;
        b.onclick=()=>{
          if(war)orderAttack(a,q.id);else orderMove(a,q.id);
          UI.army=null;paintPanel();paintMap();
        };
        acts.appendChild(b);
        if(held)acts.appendChild($(`<span class="small muted" style="width:100%">
          An enemy army beside ${esc(q.name)} is holding that ground. Beat it first.</span>`));
      });
      seaReach(a.prov,c.id).forEach(pid=>{
        const q=PV(pid);
        if(!q||(q.owner!=null&&q.owner!==c.id&&!atWar(c.id,q.owner)))return;
        const b=$(`<button class="btn sm">\u2248 Sail to ${esc(q.name)} \u00B7 ${crossingDays(c.id)}d</button>`);
        b.onclick=()=>{if(orderMove(a,pid))toast(`Crossing to ${q.name}.`);
          UI.army=null;paintPanel();paintMap();};
        acts.appendChild(b);
      });
    }
    row.appendChild(acts);
    list.appendChild(row);
  });
  w.appendChild(list);
}

/* ---- Build ---- */
function panelBuild(w){
  const c=you();
  const cost=recruitCost(c.id);
  const q=$(`<div class="card"></div>`);
  q.appendChild($(`<div class="eyebrow">Production queue</div>`));
  if(!c.build.length)q.appendChild($(`<div class="small muted">Nothing in production.</div>`));
  else{
    const l=$(`<div class="lst"></div>`);
    c.build.forEach((b,i)=>{
      const total=b.kind==="army"?RECRUIT_DAYS*8:RECRUIT_DAYS*10;
      const pct=clamp(1-b.left/total,0,1);
      const days=Math.ceil(b.left/Math.max(.1,buildRate(c.id)));
      l.appendChild($(`<div>
        <div class="between"><span>${b.kind==="army"?"Army at "+esc(PV(b.prov)?PV(b.prov).name:"?"):"Factory"}</span>
        <span class="mono small muted">${i===0?days+"d":"queued"}</span></div>
        <div class="bar2" style="margin-top:4px"><i style="width:${(pct*100).toFixed(0)}%;background:var(--you)"></i></div></div>`));
    });
    q.appendChild(l);
  }
  w.appendChild(q);

  const r=$(`<div class="card"></div>`);
  r.appendChild($(`<div class="eyebrow">Raise an army</div>`));
  r.appendChild($(`<div class="small muted">${money(cost.money)} and ${cost.workers} workers. Costs more with every army you already field.</div>`));
  const cities=provsOf(c.id).filter(p=>p.city);
  const grid=$(`<div class="row" style="flex-wrap:wrap;margin-top:7px"></div>`);
  if(!cities.length)grid.appendChild($(`<div class="small muted">No cities held.</div>`));
  cities.forEach(p=>{
    const b=$(`<button class="btn sm">${esc(p.name)}</button>`);
    b.disabled=c.treasury<cost.money||c.workers<cost.workers;
    b.onclick=()=>{const res=orderRecruit(c.id,p.id);if(!res.ok)toast(res.msg,"war");else toast("Recruitment ordered.");paintPanel();paintBar();};
    grid.appendChild(b);
  });
  r.appendChild(grid);
  w.appendChild(r);

  const f=$(`<div class="card"></div>`);
  f.appendChild($(`<div class="eyebrow">Factories</div>`));
  f.appendChild($(`<div class="between"><div class="small muted" style="flex:1">
    National industry: ${c.factories} factories, finishing ${buildRate(c.id).toFixed(1)} points of work a day.
    They are not on the map, so capturing a city does not capture its factories.</div></div>`));
  const fb=$(`<button class="btn sm" style="margin-top:7px">Build factory \u00B7 ${money(factoryCost(c))}</button>`);
  fb.disabled=c.treasury<factoryCost(c);
  fb.onclick=()=>{const res=orderFactory(c.id);if(!res.ok)toast(res.msg||"Cannot build.","war");else toast("Factory ordered.");paintPanel();paintBar();};
  f.appendChild(fb);
  w.appendChild(f);

  const fo=$(`<div class="card"></div>`);
  fo.appendChild($(`<div class="eyebrow">Fortify</div>`));
  fo.appendChild($(`<div class="small muted">Forts make a province harder to take. Front line provinces first.</div>`));
  const front=provsOf(c.id).filter(p=>p.nb.some(n=>{const z=PV(n);return z&&!z.sea&&z.owner!=null&&z.owner!==c.id;}));
  const fg=$(`<div class="row" style="flex-wrap:wrap;margin-top:7px"></div>`);
  (front.length?front:provsOf(c.id)).slice(0,14).forEach(p=>{
    const b=$(`<button class="btn sm">${esc(p.name)} ${"|".repeat(p.fort)||"\u00B7"} ${money(fortCost(p))}</button>`);
    b.disabled=c.treasury<fortCost(p)||p.fort>=4;
    b.onclick=()=>{const res=orderFortify(c.id,p.id);if(!res.ok)toast(res.msg,"war");else toast(`${p.name} fortified.`,"good");paintPanel();paintBar();paintMap();};
    fg.appendChild(b);
  });
  fo.appendChild(fg);
  w.appendChild(fo);
}

/* ---- Research ---- */
function panelResearch(w){
  const c=you();
  if(c.research){
    const t=TECH_BY[c.research.k];
    const pct=clamp(1-c.research.left/c.research.total,0,1);
    const card=$(`<div class="card"></div>`);
    card.appendChild($(`<div class="eyebrow">In progress</div>`));
    card.appendChild($(`<div class="between"><b>${esc(t.label)} \u00B7 level ${c.tech[t.k]+1}</b>
      <span class="mono small muted">${c.research.left}d</span></div>
      <div class="bar2" style="margin-top:5px"><i style="width:${(pct*100).toFixed(0)}%;background:var(--you)"></i></div>`));
    w.appendChild(card);
  }
  ["Land","Defence","Industry"].forEach(col=>{
    const card=$(`<div class="card"></div>`);
    card.appendChild($(`<div class="eyebrow">${col}</div>`));
    const l=$(`<div class="lst"></div>`);
    TECH.filter(t=>t.col===col).forEach(t=>{
      const lvl=c.tech[t.k],maxed=lvl>=t.max,cost=techCost(c,t);
      const lock=techLocked(c,t);
      const row=$(`<div class="between">
        <div style="min-width:0">
          <div><b>${esc(t.label)}</b> <span class="mono small muted">${lvl}/${t.max}</span></div>
          <div class="small muted">${esc(t.desc)}</div>
          ${lock?`<div class="small" style="color:var(--you)">Locked. Needs ${esc(lock)}.</div>`:""}
        </div></div>`);
      const b=$(`<button class="btn sm">${maxed?"Complete":lock?"Locked":money(cost)}</button>`);
      b.disabled=maxed||!!lock||!!c.research||c.treasury<cost;
      b.onclick=()=>{const res=startResearch(c.id,t.k);if(!res.ok)toast(res.msg||"Cannot start.","war");else toast(`${t.label} research begun.`);paintPanel();paintBar();};
      row.appendChild(b);l.appendChild(row);
    });
    card.appendChild(l);
    w.appendChild(card);
  });
}

/* ---- Diplomacy ---- */
function panelDiplo(w){
  const c=you();
  // pending offers first: these are decisions waiting on the player
  const pending=[];
  for(const k in G.rel){
    const r=G.rel[k];
    if(r.offer&&CO(r.offer.from)&&CO(r.offer.from).alive)pending.push({r,from:r.offer.from});
    if(r.demand&&CO(r.demand.from)&&CO(r.demand.from).alive)pending.push({r,demand:r.demand});
    if(r.ready&&r.ready.by===c.id){
      const [a,b]=k.split(":").map(Number);
      pending.push({r,ready:(a===c.id?b:a)});
    }
  }
  if(pending.length){
    const card=$(`<div class="card" style="border-color:var(--you)"></div>`);
    card.appendChild($(`<div class="eyebrow" style="color:var(--you)">Waiting on you</div>`));
    const l=$(`<div class="lst"></div>`);
    pending.forEach(x=>{
      if(x.demand){
        const o=CO(x.demand.from),pr=PV(x.demand.prov);
        if(!o||!pr){x.r.demand=null;return;}
        const row=$(`<div><div class="row" style="margin-bottom:5px">
          <span class="flag" style="background:${esc(o.color)}"></span>
          <span style="flex:1">${esc(o.name)} will end the war if you hand over
          <b>${esc(pr.name)}</b>. <span class="mono muted">${Math.max(0,x.demand.until-G.day)}d</span></span></div></div>`);
        const acts=$(`<div class="row"></div>`);
        const y=$(`<button class="btn sm d">Give ${esc(pr.name)}</button>`);
        y.onclick=()=>{
          setProvinceOwner(pr.id,o.id);
          makePeace(G.you,o.id);
          x.r.demand=null;
          logAdd(`You cede ${pr.name} to ${o.name} for peace.`);
          toast("The war is over.","good");render();
        };
        const n=$(`<button class="btn sm">Fight on</button>`);
        n.onclick=()=>{x.r.demand=null;nudgeStance(G.you,o.id,-6);toast("You refuse.","war");render();};
        acts.appendChild(y);acts.appendChild(n);row.appendChild(acts);l.appendChild(row);
        return;
      }
      if(x.from!=null){
        const o=CO(x.from);
        const row=$(`<div><div class="row" style="margin-bottom:5px">
          <span class="flag" style="background:${esc(o.color)}"></span>
          <span style="flex:1">${esc(o.name)} proposes a defence pact.
          <span class="mono muted">${Math.max(0,x.r.offer.until-G.day)}d</span></span></div></div>`);
        const acts=$(`<div class="row"></div>`);
        const y=$(`<button class="btn sm p">Accept</button>`);
        y.onclick=()=>{formPact(c.id,o.id,"defense");x.r.offer=null;
          logAdd(`You sign a defence pact with ${o.name}.`);toast("Pact signed.","good");paintPanel();render();};
        const n=$(`<button class="btn sm">Decline</button>`);
        n.onclick=()=>{x.r.offer=null;nudgeStance(c.id,o.id,-8);toast("Declined.");paintPanel();render();};
        acts.appendChild(y);acts.appendChild(n);row.appendChild(acts);l.appendChild(row);
      }else{
        const o=CO(x.ready);
        if(!o||!o.alive){x.r.ready=null;return;}
        const row=$(`<div><div class="row" style="margin-bottom:5px">
          <span class="flag" style="background:${esc(o.color)}"></span>
          <span style="flex:1">War on ${esc(o.name)} is justified.
          <span class="mono small muted">${Math.max(0,x.r.ready.until-G.day)}d</span></span></div></div>`);
        const b=$(`<button class="btn sm d">Declare war</button>`);
        b.onclick=()=>confirmSheet(`Declare war on ${o.name}?`,
          "Their allies will be pulled in with them.",()=>{
            x.r.ready=null;declareWar(c.id,o.id);render();});
        row.appendChild(b);l.appendChild(row);
      }
    });
    card.appendChild(l);w.appendChild(card);
  }

  const others=alive().filter(o=>o.id!==c.id)
    .sort((a,b)=>stanceOf(c.id,b.id)-stanceOf(c.id,a.id));
  const borders=bordersWith(c.id);
  const card=$(`<div class="card"></div>`);
  card.appendChild($(`<div class="eyebrow">Nations</div>`));
  card.appendChild($(`<div class="small muted">Opinion runs from -100 to 100. It decides whether a pact is accepted and whether you are a target.</div>`));
  const l=$(`<div class="lst"></div>`);
  others.forEach(o=>{
    const r=rel(c.id,o.id);
    const s=r.stance;
    const tags=[];
    if(r.war)tags.push(`<span class="pill war">war</span>`);
    if(r.pact)tags.push(`<span class="pill pact">defence pact</span>`);
    if(r.justify)tags.push(`<span class="pill just">${r.justify.by===c.id?"justifying":"justified against you"}</span>`);
    if(r.truce>G.day)tags.push(`<span class="pill">truce</span>`);
    if(borders.includes(o.id))tags.push(`<span class="pill">border</span>`);
    const w2=clamp((s+100)/2,0,100);
    const row=$(`<div>
      <div class="between"><div class="row" style="min-width:0">
        <span class="flag" style="background:${esc(o.color)}"></span>
        <span style="font-weight:600">${esc(o.name)}</span></div>
        <span class="mono small ${s>=0?"up":"down"}">${s>0?"+":""}${Math.round(s)}</span></div>
      <div class="small muted">${provsOf(o.id).length} provinces \u00B7 ${armiesOf(o.id).reduce((a,x)=>a+x.troops,0)} troops
        \u00B7 ${esc((PERSONALITIES.find(p=>p.k===o.personality)||{}).label||"")}</div>
      <div class="bar2" style="margin-top:4px"><i style="width:${w2}%;background:${s>=0?"var(--pact)":"var(--war)"}"></i></div>
      <div class="row" style="flex-wrap:wrap;margin-top:5px">${tags.join(" ")}</div>
    </div>`);
    const acts=$(`<div class="row" style="flex-wrap:wrap;margin-top:6px"></div>`);
    if(!r.war&&!r.pact){
      const b=$(`<button class="btn sm">Propose pact</button>`);
      b.disabled=G.day-r.lastAsk<45;
      b.onclick=()=>{
        const ok=proposeAlliance(c.id,o.id);
        toast(ok?`${o.name} accepts.`:`${o.name} refuses.`,ok?"good":"war");
        logAdd(ok?`You sign a defence pact with ${o.name}.`:`${o.name} refuses a pact.`);
        paintPanel();render();
      };
      acts.appendChild(b);
    }
    if(r.pact){
      const b=$(`<button class="btn sm d">Break pact</button>`);
      b.onclick=()=>confirmSheet(`Break the pact with ${o.name}?`,
        "Every nation will think less of you.",()=>{
          breakPact(c.id,o.id);alive().forEach(x=>{if(x.id!==c.id)nudgeStance(x.id,c.id,-8);});
          toast("Pact broken.","war");render();});
      acts.appendChild(b);
    }
    if(!r.war&&!r.justify&&!r.ready&&borders.includes(o.id)&&r.truce<G.day){
      const cost=Math.round(JUSTIFY_PP*(1+o.tech.nuke*.7));
      const b=$(`<button class="btn sm d">Justify war \u00B7 ${cost}pp</button>`);
      b.disabled=c.pp<cost;
      b.onclick=()=>{
        const res=startJustify(c.id,o.id);
        if(!res.ok)toast(res.msg,"war");
        else toast(`Justification started. ${JUSTIFY_DAYS} days.`);
        paintPanel();paintBar();render();
      };
      acts.appendChild(b);
    }
    if(r.war){
      const b=$(`<button class="btn sm">Demand terms</button>`);
      b.onclick=()=>openTerms(o.id);
      acts.appendChild(b);
    }
    if(r.justify&&r.justify.by===c.id)
      acts.appendChild($(`<span class="small muted mono">${Math.max(0,r.justify.until-G.day)} days to justify</span>`));
    row.appendChild(acts);
    l.appendChild(row);
  });
  card.appendChild(l);
  w.appendChild(card);
}

/* ---- World: who is biggest, who is fighting whom. Log is a designer's tab; this is
   the one a twelve-year-old opens, because it answers "am I winning". ---- */
function panelWorld(w){
  const me=you();
  const rows=alive().slice().sort((a,b)=>provsOf(b.id).length-provsOf(a.id).length);
  const total=G.provinces.filter(p=>!p.sea).length;
  const card=$(`<div class="card"></div>`);
  card.appendChild($(`<div class="eyebrow">Standings</div>`));
  card.appendChild($(`<div class="small muted">${alive().length} nations left of ${G.countries.length}.</div>`));
  const l=$(`<div class="lst"></div>`);
  rows.forEach((o,i)=>{
    const land=provsOf(o.id).length;
    const troops=armiesOf(o.id).reduce((a,x)=>a+x.troops,0);
    const isMe=o.id===me.id;
    const tags=[];
    if(!isMe&&atWar(me.id,o.id))tags.push(`<span class="pill war">at war with you</span>`);
    if(!isMe&&hasPact(me.id,o.id))tags.push(`<span class="pill pact">pact</span>`);
    const fighting=alive().filter(x=>x.id!==o.id&&atWar(o.id,x.id));
    if(fighting.length&&!(!isMe&&atWar(me.id,o.id)))
      tags.push(`<span class="pill war">fighting ${esc(fighting.map(x=>x.name).join(", "))}</span>`);
    l.appendChild($(`<div style="${isMe?"border-left:3px solid var(--you);padding-left:7px":""}">
      <div class="between">
        <div class="row" style="min-width:0">
          <span class="mono muted" style="font-size:11px;width:16px">${i+1}</span>
          <span class="flag" style="background:${esc(o.color)}"></span>
          <span style="font-weight:${isMe?700:600}">${esc(o.name)}${isMe?" (you)":""}</span>
        </div>
        <span class="mono small">${land} \u00B7 ${troops}</span>
      </div>
      <div class="small muted">${esc(o.blurb||"")}</div>
      <div class="bar2" style="margin-top:4px"><i style="width:${(land/Math.max(1,total)*100*3).toFixed(0)}%;background:${esc(o.color)}"></i></div>
      <div class="row" style="flex-wrap:wrap;margin-top:4px">${tags.join(" ")}</div>
    </div>`));
  });
  card.appendChild(l);
  card.appendChild($(`<div class="small muted" style="margin-top:6px">Columns are provinces and troops.</div>`));
  w.appendChild(card);
}

/* ---- Log ---- */
function panelLog(w){
  const card=$(`<div class="card"></div>`);
  card.appendChild($(`<div class="eyebrow">Dispatches</div>`));
  const l=$(`<div class="lst"></div>`);
  if(!G.log.length)l.appendChild($(`<div class="small muted">Nothing has happened yet.</div>`));
  G.log.slice(0,90).forEach(e=>{
    l.appendChild($(`<div class="small">
      <span class="mono muted" style="font-size:10px">${esc(dateStr(e.d))}</span><br>
      <span style="${e.k==="war"?"color:var(--war)":""}">${esc(e.t)}</span></div>`));
  });
  card.appendChild(l);
  w.appendChild(card);
}

/* ================================================================
   SHEETS
   One in-game sheet for confirmations and province detail. No confirm(),
   because a system alert on an installed phone app ignores the palette and
   lands under the home indicator.
   ================================================================ */
function closeSheet(){
  if(UI.sheet){UI.sheet.remove();UI.sheet=null;}
  document.removeEventListener("keydown",escClose);
}
function escClose(e){if(e.key==="Escape")closeSheet();}
function openSheet(build){
  closeSheet();
  const ov=$(`<div class="overlay"></div>`);
  const sh=$(`<div class="sheet" role="dialog" aria-modal="true"></div>`);
  ov.onclick=e=>{if(e.target===ov)closeSheet();};
  build(sh);
  const close=$(`<button class="btn" style="width:100%;margin-top:9px">Close</button>`);
  close.onclick=closeSheet;
  sh.appendChild(close);
  ov.appendChild(sh);document.body.appendChild(ov);
  UI.sheet=ov;
  document.addEventListener("keydown",escClose);
  const first=sh.querySelector("button");if(first)first.focus();
}
function confirmSheet(title,body,onYes){
  openSheet(sh=>{
    sh.appendChild($(`<div class="eyebrow">Confirm</div>`));
    sh.appendChild($(`<h3>${esc(title)}</h3>`));
    sh.appendChild($(`<div class="small muted">${esc(body)}</div>`));
    const row=$(`<div class="row" style="margin-top:11px"></div>`);
    const y=$(`<button class="btn d" style="flex:1">Yes</button>`);
    y.onclick=()=>{closeSheet();onYes();};
    const n=$(`<button class="btn" style="flex:1">Cancel</button>`);
    n.onclick=closeSheet;
    row.appendChild(y);row.appendChild(n);sh.appendChild(row);
  });
}
/* Demand terms: the third verb. A war that can only end in annexation or a coin flip
   has a map payoff and no diplomatic one, which is half a grand strategy game. */
function openTerms(themId){
  const me=G.you, them=CO(themId);
  if(!them)return;
  openSheet(sh=>{
    const score=warScore(me,themId);
    const r=rel(me,themId);
    const len=G.day-(r.warStart||G.day);
    const verdict=score>4?"You are clearly winning.":score>1?"You have the upper hand."
      :score>-1?"Neither side is winning.":score>-4?"You are losing.":"You are being beaten.";
    sh.appendChild($(`<div class="eyebrow">Terms with ${esc(them.name)}</div>`));
    sh.appendChild($(`<h3>${esc(verdict)}</h3>`));
    sh.appendChild($(`<div class="small muted">War score <b class="mono">${score>0?"+":""}${score.toFixed(1)}</b>
      after ${len} days. It rises with provinces you take from them and with the size of
      your army against theirs.</div>`));

    sh.appendChild($(`<div class="divider"></div><div class="eyebrow">White peace</div>`));
    sh.appendChild($(`<div class="small muted">Both stop. Everyone keeps what they hold today.</div>`));
    const wp=$(`<button class="btn sm" style="margin-top:5px">Offer white peace</button>`);
    wp.onclick=()=>{
      const res=termsOffer(me,themId,"white");
      toast(res.ok?res.msg:res.msg,res.ok?"good":"war");
      if(res.ok)closeSheet();
      render();
    };
    sh.appendChild(wp);

    const want=demandableFrom(me,themId);
    sh.appendChild($(`<div class="divider"></div><div class="eyebrow">Demand a province</div>`));
    if(!want.length)
      sh.appendChild($(`<div class="small muted">You do not border anything of theirs you could ask for.</div>`));
    else{
      sh.appendChild($(`<div class="small muted">They hand it over and the war ends. They only agree if
        they are beaten badly enough, and a walled city costs more.</div>`));
      const g=$(`<div class="row" style="flex-wrap:wrap;margin-top:6px"></div>`);
      want.sort((a,b)=>(b.city?1:0)-(a.city?1:0)||b.pop-a.pop).slice(0,8).forEach(q=>{
        const bar=(3.2+(q.city?1.6:0)+q.fort*.5).toFixed(1);
        const b=$(`<button class="btn sm ${score>=+bar?"p":""}">${esc(q.name)}${q.city?" \u00B7 city":""}
          <span class="mono">${bar}</span></button>`);
        b.onclick=()=>{
          const res=termsOffer(me,themId,"demand",q.id);
          toast(res.msg,res.ok?"good":"war");
          if(res.ok)closeSheet();
          render();
        };
        g.appendChild(b);
      });
      sh.appendChild(g);
    }

    const mine=G.provinces.filter(q=>!q.sea&&q.owner===me&&!q.capital);
    if(score<-1&&mine.length){
      sh.appendChild($(`<div class="divider"></div><div class="eyebrow">Buy your way out</div>`));
      sh.appendChild($(`<div class="small muted">Give them a province and the war ends today.</div>`));
      const g=$(`<div class="row" style="flex-wrap:wrap;margin-top:6px"></div>`);
      mine.sort((a,b)=>a.pop-b.pop).slice(0,6).forEach(q=>{
        const b=$(`<button class="btn sm d">Give ${esc(q.name)}</button>`);
        b.onclick=()=>{
          const res=termsOffer(me,themId,"cede",q.id);
          toast(res.msg,res.ok?"good":"war");
          if(res.ok)closeSheet();
          render();
        };
        g.appendChild(b);
      });
      sh.appendChild(g);
    }
  });
}
function openProvince(pid){
  const p=PV(pid);
  if(!p||p.sea){paintMap();return;}
  const c=you();
  // an army is selected and this hex is next to it: treat the tap as an order
  if(UI.army!=null&&AR(UI.army)){
    const a=AR(UI.army);
    if(PV(a.prov).nb.includes(pid)){
      if(p.owner!=null&&p.owner!==c.id&&atWar(c.id,p.owner)){
        if(orderAttack(a,pid)){UI.army=null;toast(`Attacking ${p.name}.`,"war");paintMap();paintPanel();return;}
      }else if(canMove(a,pid)){
        orderMove(a,pid);UI.army=null;toast(`Marching on ${p.name}.`);paintMap();paintPanel();return;
      }
    }
  }
  openSheet(sh=>{
    const o=CO(p.owner);
    sh.appendChild($(`<div class="eyebrow">${esc(TERRAIN[p.terrain].label)}${p.capital?" \u00B7 capital":p.city?" \u00B7 city":""}</div>`));
    sh.appendChild($(`<div class="between"><h3 style="margin:0">${esc(p.name)}</h3>
      ${o?`<span class="row"><span class="flag" style="background:${esc(o.color)}"></span>
      <span class="small">${esc(o.name)}</span></span>`:""}</div>`));
    sh.appendChild($(`<table style="margin-top:7px">
      <tr><td class="l muted">Population</td><td class="mono">${p.pop}</td></tr>
      <tr><td class="l muted">Defence terrain</td><td class="mono">x${TERRAIN[p.terrain].def.toFixed(2)}</td></tr>
      <tr><td class="l muted">Fortification</td><td class="mono">${p.fort}/4</td></tr>
      <tr><td class="l muted">Holds against</td><td class="mono">${siegeNeed(p)?siegeNeed(p)+" siege":"nothing"}</td></tr>
      ${p.siege>0?`<tr><td class="l muted">Under siege</td><td class="mono" style="color:var(--war)">${Math.round(p.siege)}/${siegeNeed(p)}</td></tr>`:""}
      <tr><td class="l muted">Tax value</td><td class="mono">${money(p.pop*.5*TERRAIN[p.terrain].income*(p.city?1.5:1)/7)}/day</td></tr>
      </table>`));
    if(p.owner!=null&&p.owner!==c.id&&atWar(c.id,p.owner)&&zocBlocked(p,c.id)){
      const blockers=neighbors(pid).filter(q=>
        armiesAt(q.id).some(x=>x.owner!==c.id&&!x.broken&&atWar(c.id,x.owner)));
      sh.appendChild($(`<div class="card" style="border-color:var(--war);margin-top:8px">
        <div class="small">An enemy army in <b>${esc(blockers.map(q=>q.name).join(", "))}</b>
        is holding this ground. You can wear the walls down, but you cannot walk in until
        that army is beaten or moves.</div></div>`));
    }
    const here=armiesAt(pid);
    if(here.length){
      sh.appendChild($(`<div class="divider"></div><div class="eyebrow">Forces here</div>`));
      here.forEach(a=>{
        const ac=CO(a.owner),g=generalOf(a);
        sh.appendChild($(`<div class="between small" style="padding:3px 0">
          <span class="row"><span class="flag" style="background:${esc(ac?ac.color:"#666")}"></span>
          ${esc(g.name)} ${a.broken?'<span class="pill war">broken</span>':""}</span>
          <span class="mono">${a.troops}/${a.max}</span></div>`));
      });
    }
    if(p.owner===c.id){
      const acts=$(`<div class="row" style="flex-wrap:wrap;margin-top:9px"></div>`);
      if(p.fort<4){
        const b=$(`<button class="btn sm">Fortify \u00B7 ${money(fortCost(p))}</button>`);
        b.disabled=c.treasury<fortCost(p);
        b.onclick=()=>{const r2=orderFortify(c.id,pid);if(!r2.ok)toast(r2.msg,"war");else{toast("Fortified.","good");closeSheet();}paintMap();paintBar();paintPanel();};
        acts.appendChild(b);
      }
      if(p.city){
        const cost=recruitCost(c.id);
        const b=$(`<button class="btn sm">Raise army \u00B7 ${money(cost.money)}</button>`);
        b.disabled=c.treasury<cost.money||c.workers<cost.workers;
        b.onclick=()=>{const r2=orderRecruit(c.id,pid);if(!r2.ok)toast(r2.msg,"war");else{toast("Recruitment ordered.");closeSheet();}paintBar();paintPanel();};
        acts.appendChild(b);
      }
      sh.appendChild(acts);
    }
  });
}

/* ================================================================
   START
   ================================================================ */
let START_NAME="";
function renderStart(){
  if(CLOCK){clearInterval(CLOCK);CLOCK=null;}
  app.innerHTML="";
  const s=$(`<div class="start"></div>`);
  s.appendChild($(`<h1>Front Line</h1>`));
  s.appendChild($(`<div class="small muted" style="margin-bottom:14px">A war of nations, one day at a time.</div>`));

  if(localStorage.getItem(SAVE_KEY)){
    const b=$(`<button class="btn p" style="width:100%;margin-bottom:8px">Continue campaign</button>`);
    b.onclick=()=>{
      if(loadGame()&&G.you!=null){resetUI();integrityGuard("load");render();restartClock();}
      else toast("No usable save found.","war");
    };
    s.appendChild(b);
    s.appendChild($(`<div class="divider"></div>`));
  }
  if(!G)genWorld();
  s.appendChild($(`<div class="eyebrow" style="text-align:left">Rename your nation (optional)</div>`));
  const inp=$(`<input type="text" maxlength="22" placeholder="Leave blank to keep the generated name"
    style="width:100%;padding:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:5px;color:var(--ink);font:inherit;margin-bottom:12px">`);
  inp.value=START_NAME;
  inp.oninput=()=>{START_NAME=inp.value;};
  s.appendChild(inp);
  s.appendChild($(`<div class="eyebrow" style="text-align:left">Pick a nation</div>`));
 s.appendChild($(`<div class="small muted" style="text-align:left;margin-bottom:7px">
   The ten largest countries in Europe by area. The map is not Europe, so each name goes
   to whichever land on this map suits it. The blurb is true of the territory it holds.</div>`));

  G.countries.forEach(c=>{
    const land=provsOf(c.id).length;
    const b=$(`<button class="pick">
      <span class="flag" style="width:18px;height:18px;background:${esc(c.color)}"></span>
      <span style="flex:1;min-width:0">
        <b>${esc(c.name)}</b>
        <span class="small muted" style="display:block">${esc(c.blurb||"")}</span>
        <span class="small muted mono" style="display:block">${land} provinces \u00B7 ${c.factories} factories \u00B7
        ${esc((PERSONALITIES.find(p=>p.k===c.personality)||{}).label)}</span></span>
      <span class="pill">Take</span></button>`);
    b.onclick=()=>{
      G.you=c.id;c.ai=false;
      const nm=START_NAME.trim().replace(/[<>&"']/g,"").slice(0,22);
      if(nm)c.name=nm;
      G.speed=2;
      logAdd(`${c.name} enters the world stage.`);
      resetUI();integrityGuard("start");saveGame(true);render();restartClock();
    };
    s.appendChild(b);
  });
  const rg=$(`<button class="btn" style="width:100%;margin-top:10px">Generate a new world</button>`);
  rg.onclick=()=>{G=null;renderStart();};
  s.appendChild(rg);
  app.appendChild(s);
}

/* ================================================================
   BOOT
   ================================================================ */
if(loadGame()&&G.you!=null){integrityGuard("boot");render();restartClock();}
else{G=null;renderStart();}
addEventListener("pagehide",()=>{if(G&&G.you!=null)saveGame(true);});
document.addEventListener("visibilitychange",()=>{
  // the clock is a real clock, so stop burning battery in a background tab
  if(document.hidden){if(CLOCK){clearInterval(CLOCK);CLOCK=null;}if(G&&G.you!=null)saveGame(true);}
  else if(G&&G.you!=null)restartClock();
});
</script>
