        if(seen.has(nid))continue;seen.add(nid);
        const n=PV(nid);if(!n||n.sea)continue;
        if(n.owner!=null&&enemies.includes(n.owner))return nid;
        next.push(nid);
      }
    }
    q=next;
  }
  return null;
}
function stepToward(from,goal,cid,enemies){
  const prev=new Map([[from,null]]);let q=[from];
  for(let depth=0;depth<16&&q.length;depth++){
    const next=[];
    for(const pid of q){
      for(const nid of PV(pid).nb){
        if(prev.has(nid))continue;
        const n=PV(nid);if(!n||n.sea)continue;
        if(n.owner!=null&&n.owner!==cid&&!enemies.includes(n.owner))continue;  // no trespassing
        prev.set(nid,pid);
        if(nid===goal){
          let cur=nid;while(prev.get(cur)!==from&&prev.get(cur)!=null)cur=prev.get(cur);
          return cur;
        }
        next.push(nid);
      }
    }
    q=next;
  }
  return null;
}

/* ================================================================
   INTEGRITY
   Throws in a harness, repairs quietly in play. Same stack as the football game:
   assert what must be true, fix what can be fixed, never take the game down.
   ================================================================ */
function assertWorldIntegrity(where){
  const errs=[];
  const seenA=new Set();
  G.armies.forEach(a=>{
    if(seenA.has(a.id))errs.push(`duplicate army id ${a.id}`);
    seenA.add(a.id);
    const p=PV(a.prov);
    if(!p)errs.push(`army ${a.id} on missing province ${a.prov}`);
    else if(p.sea)errs.push(`army ${a.id} at sea`);
    const c=CO(a.owner);
    if(!c)errs.push(`army ${a.id} owned by missing country ${a.owner}`);
    else if(!c.alive)errs.push(`army ${a.id} owned by dead country ${c.name}`);
    if(a.troops<0)errs.push(`army ${a.id} negative troops`);
    if(a.target!=null&&!PV(a.target))errs.push(`army ${a.id} targeting missing province`);
    if(a.moving!=null&&!PV(a.moving))errs.push(`army ${a.id} moving to missing province`);
    if(!G.generals.some(g=>g.id===a.gen))errs.push(`army ${a.id} has no general`);
  });
  G.provinces.forEach(p=>{
    if(p.sea)return;
    if(p.owner==null)return;
    const c=CO(p.owner);
    if(!c)errs.push(`province ${p.id} owned by missing country`);
    else if(!c.alive)errs.push(`province ${p.id} owned by dead country ${c.name}`);
  });
  // EXACTLY one, not at least one, and the country's own pointer has to agree with it.
  // The old assert only checked "at least one, and not for the player", which is why a
  // leaked capital star was invisible to a 63,000 day soak.
  alive().forEach(c=>{
    const stars=G.provinces.filter(p=>!p.sea&&p.capital&&p.owner===c.id);
    if(!provsOf(c.id).length)return;
    if(stars.length!==1)errs.push(`${c.name} has ${stars.length} capitals`);
    else if(c.capital!==stars[0].id)errs.push(`${c.name} points at the wrong capital`);
  });
  const orphanStars=G.provinces.filter(p=>!p.sea&&p.capital&&(!CO(p.owner)||!CO(p.owner).alive));
  if(orphanStars.length)errs.push(`${orphanStars.length} capital stars on nobody's land`);
  for(const k in G.rel){
    const [a,b]=k.split(":").map(Number);
    if(!CO(a)||!CO(b))errs.push(`relation ${k} references a missing country`);
    else if(!CO(a).alive||!CO(b).alive)errs.push(`relation ${k} references a dead country`);
    const r=G.rel[k];
    if(r.war&&r.pact)errs.push(`relation ${k} is at war and allied at once`);
  }
  if(errs.length)throw new Error(`[${where}] ${errs.length} faults: ${errs.slice(0,4).join(" | ")}`);
  return true;
}
function repairWorld(){
  let fixed=0;
  G.armies.slice().forEach(a=>{
    const c=CO(a.owner);
    if(!c||!c.alive||!PV(a.prov)||PV(a.prov).sea){destroyArmy(a);fixed++;return;}
    if(a.target!=null&&!PV(a.target)){a.target=null;a.stance="defend";fixed++;}
    if(a.moving!=null&&!PV(a.moving)){a.moving=null;a.eta=0;fixed++;}
    if(!G.generals.some(g=>g.id===a.gen)){const g=newGeneral();a.gen=g.id;fixed++;}
    if(a.troops<0){a.troops=0;fixed++;}
  });
  G.provinces.forEach(p=>{
    if(p.sea){p.owner=null;p.city=false;p.capital=false;return;}
    const c=CO(p.owner);
    if(!c||!c.alive){
      const nb=landNeighbors(p.id).map(n=>CO(n.owner)).filter(c2=>c2&&c2.alive);
      p.owner=nb.length?nb[0].id:(alive()[0]||{id:null}).id;
      p.capital=false;fixed++;
    }
  });
  for(const k in G.rel){
    const [a,b]=k.split(":").map(Number);
    const A=CO(a),B=CO(b);
    if(!A||!B||!A.alive||!B.alive){delete G.rel[k];fixed++;continue;}
    if(G.rel[k].war&&G.rel[k].pact){G.rel[k].pact=null;fixed++;}
  }
  G.provinces.forEach(p=>{
    if(p.capital&&(p.sea||!CO(p.owner)||!CO(p.owner).alive)){p.capital=false;fixed++;}
  });
  alive().forEach(c=>{
    const mine=provsOf(c.id);
    if(!mine.length)return;
    const stars=mine.filter(p=>p.capital);
    if(stars.length===1&&c.capital===stars[0].id)return;
    const seat=stars.find(p=>p.id===c.capital)||stars[0]||mine.find(p=>p.city)||mine[0];
    setCapital(c.id,seat.id);fixed++;
  });
  return fixed;
}
function integrityGuard(where){
  try{assertWorldIntegrity(where);}
  catch(e){const n=repairWorld();if(n)logAdd(`World repaired (${n} faults).`);}
}

function scrub(o,d){
  d=d||0;if(d>10||o==null)return o;
  if(typeof o==="string")return o.replace(/[<>"'&]/g,"").slice(0,80);
  if(Array.isArray(o)){for(let i=0;i<o.length;i++)o[i]=scrub(o[i],d+1);return o;}
  if(typeof o==="object"){for(const k in o)o[k]=scrub(o[k],d+1);return o;}
  return o;
}
function serializeSave(){
  // provinces carry static geometry that never changes, so it is dropped and
  // recomputed on load. That is most of the file.
  const g={
    ver:SAVE_VER,day:G.day,you:G.you,speed:G.speed,
    nextArmy:G.nextArmy,nextGen:G.nextGen,stats:G.stats,
    defeat:!!G.defeat,victory:!!G.victory,
    p:G.provinces.map(p=>[p.id,p.sea?1:0,p.owner==null?-1:p.owner,p.name,p.terrain,
      (p.city?1:0)+(p.capital?2:0),p.fort,p.pop,Math.round(p.siege||0)]),
    c:G.countries.map(c=>[c.id,c.name,c.color,c.alive?1:0,c.capital,
      Math.round(c.treasury),Math.round(c.workers),c.factories,Math.round(c.pp),
      TECH.map(t=>c.tech[t.k]).join(","),c.personality,
      c.research?[c.research.k,c.research.left,c.research.total]:0,
      c.build.map(b=>[b.kind==="army"?1:0,b.prov==null?-1:b.prov,Math.round(b.left),b.size||0]),
      c.nextThink,c.homeProvs||0,c.nat==null?-1:c.nat]),
    a:G.armies.map(a=>[a.id,a.owner,a.prov,a.troops,a.max,a.gen,
      a.stance==="attack"?1:0,a.broken?1:0,a.moving==null?-1:a.moving,a.eta,
      a.target==null?-1:a.target,+(a.pool||0).toFixed(2)]),
    g:G.generals.map(x=>[x.id,x.name,x.skill]),
    r:Object.entries(G.rel).map(([k,v])=>[k,Math.round(v.stance),
      v.pact?v.pact.type:"",v.pact?v.pact.since:0,v.war?1:0,
      v.justify?[v.justify.by,v.justify.until]:0,v.lastAsk,v.truce,v.warStart||0,
      v.offer?[v.offer.from,v.offer.until]:0,v.ready?[v.ready.by,v.ready.until]:0]),
    l:G.log.slice(0,80).map(x=>[x.d,x.t,x.k])
  };
  return JSON.stringify(g);
}
function expandSave(s){
  const g={ver:s.ver,day:s.day,you:s.you,speed:s.speed||2,
    nextArmy:s.nextArmy,nextGen:s.nextGen,stats:s.stats||{battles:0,taken:0},
    defeat:!!s.defeat,victory:!!s.victory,rel:{},log:[]};
  g.provinces=s.p.map(a=>{
    const id=a[0],col=id%COLS,row=Math.floor(id/COLS),xy=hexXY(col,row);
    return {id,col,row,x:+xy.x.toFixed(1),y:+xy.y.toFixed(1),sea:!!a[1],
      owner:a[2]<0?null:a[2],name:a[3],terrain:a[4],
      city:!!(a[5]&1),capital:!!(a[5]&2),fort:a[6],pop:a[7],siege:a[8]||0,nb:neighborCells(col,row)};
  });
  g.countries=s.c.map(a=>{
    // comma separated, because join("") silently corrupted any level above nine
    const parts=String(a[9]).indexOf(",")>=0?String(a[9]).split(","):String(a[9]).split("");
    const tech={};TECH.forEach((t,i)=>tech[t.k]=+(parts[i]||0));
    return {id:a[0],name:a[1],color:a[2],alive:!!a[3],capital:a[4],ai:a[0]!==s.you,
      treasury:a[5],workers:a[6],factories:a[7],pp:a[8],tech,personality:a[10],
      research:a[11]?{k:a[11][0],left:a[11][1],total:a[11][2]}:null,homeProvs:a[14]||0,
      nat:(a[15]==null||a[15]<0)?null:a[15],
      blurb:(NATIONS[a[15]]||{}).blurb||"",bonus:(NATIONS[a[15]]||{}).bonus||{},
      build:(a[12]||[]).map(b=>({kind:b[0]?"army":"factory",prov:b[1]<0?null:b[1],left:b[2],size:b[3]})),
      nextThink:a[13]||0};
  });
  g.armies=s.a.map(a=>({id:a[0],owner:a[1],prov:a[2],troops:a[3],max:a[4],gen:a[5],
    stance:a[6]?"attack":"defend",broken:!!a[7],moving:a[8]<0?null:a[8],eta:a[9],
    target:a[10]<0?null:a[10],pool:a[11]||0}));
  g.generals=s.g.map(a=>({id:a[0],name:a[1],skill:a[2]}));
  (s.r||[]).forEach(a=>{
    g.rel[a[0]]={stance:a[1],pact:a[2]?{type:a[2],since:a[3]}:null,war:!!a[4],
      justify:a[5]?{by:a[5][0],until:a[5][1]}:null,lastAsk:a[6],truce:a[7],warStart:a[8],
      offer:a[9]?{from:a[9][0],until:a[9][1]}:null,
      ready:a[10]?{by:a[10][0],until:a[10][1]}:null};
  });
  g.log=(s.l||[]).map(a=>({d:a[0],t:a[1],k:a[2]}));
  return g;
}
function validateSaveShape(g){
  if(!g||typeof g!=="object")throw new Error("not an object");
  if(g.ver!==SAVE_VER)throw new Error("version");
  if(!Array.isArray(g.p)||g.p.length!==COLS*ROWS)throw new Error("province count");
  if(!Array.isArray(g.c)||!g.c.length)throw new Error("countries");
  if(!Array.isArray(g.a)||!Array.isArray(g.g))throw new Error("armies");
  if(typeof g.you!=="number"||!g.c.some(c=>c[0]===g.you))throw new Error("no player country");
  if(typeof g.day!=="number"||g.day<0)throw new Error("day");
  return true;
}
function saveGame(quiet){
  try{
    localStorage.setItem(SAVE_KEY,serializeSave());
    G.saveError=false;return true;
  }catch(e){
    G.saveError=true;
    if(!quiet)toast("Could not save. Storage is full or blocked.","war");
    return false;
  }
}
function loadGame(){
  const backup=G;
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const s=scrub(JSON.parse(raw));
    validateSaveShape(s);
    G=expandSave(s);
    rebuildIndex();
    repairWorld();
    if(!you())throw new Error("player country missing");
    return true;
  }catch(e){
    G=backup;if(G)rebuildIndex();
    return false;
  }
}
function wipeSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}

/* ================================================================
   UI STATE
   All of it in one object, so resetting after a new game or a load clears
   everything instead of most things.

const UI={tab:"nation",sel:null,army:null,sheet:null,lastTab:null,pending:""};
function resetUI(){UI.tab="nation";UI.sel=null;UI.army=null;UI.sheet=null;UI.lastTab=null;UI.pending="";}
const app=document.getElementById("app");
let TOASTS=null;
function toast(msg,kind){
  if(!TOASTS){TOASTS=$(`<div class="toasts"></div>`);document.body.appendChild(TOASTS);}
  const t=$(`<div class="toast ${kind==="war"?"war":kind==="good"?"good":""}">${esc(msg)}</div>`);

/* ================================================================
   THE MAP
   Redrawn every tick, so it stays cheap: one path per hex, one counter per army,
   one line per live battle. Everything else on screen is left alone.
   ================================================================ */
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(Math.round(r*(1+amt)),0,255);g=clamp(Math.round(g*(1+amt)),0,255);b=clamp(Math.round(b*(1+amt)),0,255);
  return "#"+((r<<16)|(g<<8)|b).toString(16).padStart(6,"0");
}
/* Every enemy country is muted toward the background and only YOUR land keeps its
   colour, with a heavy outline drawn around the whole nation. Ten equally saturated
   blobs meant a player could not answer "where am I" in under ten seconds, which is the
   first question, and the game never answered it. */
function mute(hex){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const gr=(r*.32+g*.52+b*.16);
  // 28% of the original hue over a cold grey. Enough that you can still tell two
  // neighbours apart, nowhere near enough to compete with your own colour.
  r=Math.round(r*.28+gr*.16+22);
  g=Math.round(g*.28+gr*.16+30);
  b=Math.round(b*.28+gr*.16+38);
  return "#"+((clamp(r,0,255)<<16)|(clamp(g,0,255)<<8)|clamp(b,0,255)).toString(16).padStart(6,"0");
}
/* The outline of your whole country, drawn as the edges of your hexes that do not touch
   another of your hexes. One shape, one border, unmistakable. */
function nationOutline(cid){
  let d="";
  const w=Math.sqrt(3)*HEX;
  G.provinces.forEach(p=>{
    if(p.sea||p.owner!==cid)return;
    const list=(p.row&1)?NB_ODD:NB_EVEN;
    // hex corners, pointy top, starting at the top vertex
    const pt=i=>{const a=Math.PI/180*(60*i-90);
      return [p.x+HEX*Math.cos(a),p.y+HEX*Math.sin(a)];};
    // edge i of a pointy-top hex sits between corner i and corner i+1; map each
    // neighbour direction onto the edge that faces it
    const dirEdge=(dc,dr)=>{
      if(dr===0&&dc===1)return 1;
      if(dr===0&&dc===-1)return 4;
      if(dr===-1)return (p.row&1)?(dc===0?5:0):(dc===-1?5:0);
      return (p.row&1)?(dc===0?3:2):(dc===-1?3:2);
    };
    list.forEach(([dc,dr])=>{
      const c2=p.col+dc,r2=p.row+dr;
      const inside=c2>=0&&c2<COLS&&r2>=0&&r2<ROWS;
      const q=inside?PV(r2*COLS+c2):null;
      if(q&&!q.sea&&q.owner===cid)return;
      const e=dirEdge(dc,dr);
      const [x1,y1]=pt(e),[x2,y2]=pt((e+1)%6);
      d+=`M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}`;
    });
  });
  return d;
}
function mapSVG(){
  let hexes="",marks="",counters="",arrows="",threat="";
  const me=G.you;
  for(const p of G.provinces){
    const path=hexPath(p.x,p.y);
    if(p.sea){
      hexes+=`<path class="hex sea" d="${path}"/>`;
      // a couple of wave strokes, so open water never reads as somebody's faded territory
      marks+=`<path d="M${p.x-9} ${p.y} q4.5 -3.5 9 0 q4.5 3.5 9 0" fill="none"
        stroke="rgba(120,180,220,.22)" stroke-width="1.4" pointer-events="none"/>`;
      continue;
    }
    const c=CO(p.owner);
    const mine=p.owner===me;
    let base=c?c.color:"#2a3640";
    let fill=shade(base,TERRAIN_TINT[p.terrain]||0);
    if(!mine)fill=mute(fill);
    const sel=UI.sel===p.id?" sel":"";
    hexes+=`<path class="hex${sel}${mine?" mine":""}" d="${path}" fill="${fill}" data-p="${p.id}"/>`;
    if(p.capital)
      marks+=`<path class="cap" d="M${p.x} ${p.y-10} l3 6.2 6.8.9 -4.9 4.8 1.15 6.8 -6-3.2 -6 3.2 1.15-6.8 -4.9-4.8 6.8-.9Z"
        opacity="${mine?1:.65}"/>`;
    else if(p.city)
      marks+=`<rect class="city" x="${p.x-4}" y="${p.y-4}" width="8" height="8" rx="1.5" opacity="${mine?.9:.5}"/>`;
    if(p.fort>0)
      marks+=`<text class="hexlbl" x="${p.x}" y="${p.y+HEX-8}" opacity="${mine?.85:.45}">${"\u25AE".repeat(p.fort)}</text>`;
    // a province of yours with an enemy army next door gets a red ring, because being
    // attacked and not noticing was the single worst thing about the last build
    if(mine&&p.owner!=null&&zocBlocked(p,me))
      threat+=`<path class="alarm" d="${path}" fill="none" stroke="#e05252" stroke-width="3"/>`;
    if(p.siege>0){
      const need=siegeNeed(p),frac=clamp(p.siege/Math.max(1,need),0,1);
      marks+=`<path d="${path}" fill="none" stroke="${p.owner===me?"#e05252":"#f0b429"}" stroke-width="3.4"
        stroke-dasharray="${(frac*HEX*6).toFixed(1)} 999" opacity=".95" pointer-events="none"/>`;
    }
  }

  const byProv={};
  G.armies.forEach(a=>{(byProv[a.prov]=byProv[a.prov]||[]).push(a);});
  for(const pid in byProv){
    const p=PV(+pid);if(!p)continue;
    const stack=byProv[pid].slice().sort((x,y)=>(y.owner===me?1:0)-(x.owner===me?1:0));
    stack.slice(0,2).forEach((a,i)=>{
      const c=CO(a.owner);
      const yours=a.owner===me;
      const w=28, h=15;
      const ox=p.x-w/2+i*4, oy=p.y+3+i*4;
      const hp=clamp(a.troops/Math.max(1,a.max),0,1);
      const fill=yours?(c?c.color:"#666"):mute(c?c.color:"#666");
      counters+=`<g class="cnt"><rect x="${ox}" y="${oy}" width="${w}" height="${h}" rx="3"
        fill="${fill}" opacity="${a.broken?.6:1}" stroke="${yours?"#fff":"rgba(0,0,0,.55)"}"
        stroke-width="${yours?1.8:1}"/>
        <rect x="${ox+1}" y="${oy+h-3}" width="${((w-2)*hp).toFixed(1)}" height="2" rx="1"
        fill="${hp>.5?"#6cc27a":hp>.25?"#e0a33e":"#e05252"}"/>
        <text x="${ox+w/2}" y="${oy+6.5}" ${yours?'':'fill="#cfd8de"'}>${a.broken?"\u2620":a.troops}</text></g>`;
      if(a._fighting)
        counters+=`<circle cx="${ox+w-1}" cy="${oy}" r="3.4" fill="${a._win?"#6cc27a":"#e05252"}" stroke="#080d11" stroke-width="1"/>`;
      if(UI.army===a.id)
        counters+=`<rect x="${ox-3}" y="${oy-3}" width="${w+6}" height="${h+6}" rx="5" fill="none"
          stroke="#f0b429" stroke-width="2.4" pointer-events="none"/>`;
    });
  }
  engagements().forEach(({att,def})=>{
    const a=PV(att.prov),b=PV(def.prov);
    if(!a||!b)return;
    const col=att._win?"#6cc27a":"#e05252";
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
    const nx=-dy/len, ny=dx/len, off=12;
    const x1=a.x+dx/len*13+nx*off, y1=a.y+dy/len*13+ny*off;
    const x2=b.x-dx/len*22+nx*off, y2=b.y-dy/len*22+ny*off;
    const ax=x2-dx/len*10, ay=y2-dy/len*10, px=nx*6.5, py=ny*6.5;
    arrows+=`<line class="arrow" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#080d11" stroke-width="7"/>
      <line class="arrow" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}"/>
      <path class="arrow" d="M${x2.toFixed(1)} ${y2.toFixed(1)}L${(ax+px).toFixed(1)} ${(ay+py).toFixed(1)}L${(ax-px).toFixed(1)} ${(ay-py).toFixed(1)}Z" fill="${col}" stroke="#080d11" stroke-width="1.4"/>`;
  });
  // when an army is selected, every square it can legally reach is lit up. Nobody
  // should have to guess which hexes are a valid order.
  let hints="";
  if(UI.army!=null&&AR(UI.army)){
    const a=AR(UI.army);
    moveTargets(a).forEach(t=>{
      hints+=`<path d="${hexPath(t.p.x,t.p.y)}" fill="none" stroke="${t.kind==="attack"?"#e05252":"#f0b429"}"
        stroke-width="3" stroke-dasharray="7 5" opacity=".95" pointer-events="none"/>`;
    });
  }
  /* Your border, drawn last so nothing sits on top of it. A dark halo, the national
     colour, then a white line: readable against any of the eight palettes and against
     the sea. Getting this wrong is what made a player unable to answer "which one am I". */
  let border="";
  if(me!=null&&CO(me)){
    const d=nationOutline(me);
    border=`<path d="${d}" fill="none" stroke="#05090c" stroke-width="8.5" stroke-linecap="round" pointer-events="none"/>
      <path d="${d}" fill="none" stroke="${CO(me).color}" stroke-width="6" stroke-linecap="round" pointer-events="none"/>
      <path d="${d}" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" pointer-events="none"/>`;
  }
  return `<svg class="map" viewBox="0 0 ${MAPW} ${MAPH}" role="img" aria-label="Situation map">
    ${hexes}${threat}${marks}${hints}${border}${counters}${arrows}</svg>`;
}
/* Every order an army can legally be given, as a list, so the map, the sheet and the
   Army tab all agree about what is possible. */
function moveTargets(a){
  if(!a||a.moving!=null)return [];
  const out=[];
  landNeighbors(a.prov).forEach(q=>{
    const enemy=q.owner!=null&&q.owner!==a.owner;
    const war=enemy&&atWar(a.owner,q.owner);
    if(enemy&&!war)return;
    if(war){if(!a.broken)out.push({p:q,kind:"attack"});}
    else if(canMove(a,q.id))out.push({p:q,kind:"move"});
  });
  seaReach(a.prov,a.owner).forEach(pid=>{
    const q=PV(pid);
    if(!q)return;
    if(q.owner!=null&&q.owner!==a.owner&&!atWar(a.owner,q.owner))return;
    if(canMove(a,pid))out.push({p:q,kind:"sail"});
  });
  return out;
}
function paintMap(){
  const host=document.getElementById("mapwrap");
  if(!host)return;
  const old=host.querySelector("svg");
  const next=$(mapSVG());
  if(old)host.replaceChild(next,old);else host.insertBefore(next,host.firstChild);
  next.querySelectorAll("[data-p]").forEach(el=>{
    el.onclick=()=>{const id=+el.dataset.p;UI.sel=id;openProvince(id);};
  });
}
/* What needs the player right now, in plain sentences, at the top of the screen.
   The Log told you that two other countries went to war. It never told you that YOU
   were being invaded, which is the only thing that mattered. */
function alerts(){
  const me=G.you, c=you();
  if(!c)return [];
  const out=[];
  // 1. losing ground
  G.provinces.forEach(p=>{
    if(p.sea||p.owner!==me||!p.siege)return;
    const need=siegeNeed(p),pct=Math.round(clamp(p.siege/need,0,1)*100);
    out.push({tone:"red",tag:"Under siege",
      text:`${p.name} is ${pct}% fallen. Send an army or lose it.`,go:()=>focusProv(p.id)});
  });
  G.provinces.forEach(p=>{
    if(p.sea||p.owner!==me)return;
    const foes=neighbors(p.id).filter(q=>armiesAt(q.id)
      .some(x=>x.owner!==me&&!x.broken&&atWar(me,x.owner)));
    if(!foes.length)return;
    if(p.siege)return;
    const who=[...new Set(foes.flatMap(q=>armiesAt(q.id).filter(x=>x.owner!==me)
      .map(x=>CO(x.owner)&&CO(x.owner).name)))].filter(Boolean);
    const defenders=armiesAt(p.id).filter(x=>x.owner===me).length;
    out.push({tone:defenders?"amber":"red",tag:"Enemy at the border",
      text:`${who.join(" and ")} ${who.length>1?"have armies":"has an army"} next to ${p.name}. `+
        (defenders?`${defenders} of yours ${defenders>1?"are":"is"} there.`:"Nobody is defending it."),
      key:"border",prov:p.id,go:()=>focusProv(p.id)});
  });
  // 2. an army that is losing, and one that is idle
  armiesOf(me).forEach(a=>{
    if(a.broken)out.push({tone:"red",tag:"Army broken",
      text:`${generalOf(a).name} is beaten at ${PV(a.prov)?PV(a.prov).name:"?"}. Pull it back or it dies.`,
      go:()=>selectArmy(a.id)});
    else if(a._fighting&&!a._win)out.push({tone:"amber",tag:"Losing a battle",
      text:`${generalOf(a).name} is losing at ${PV(a.prov)?PV(a.prov).name:"?"}.`,
      go:()=>selectArmy(a.id)});
  });
  // 3. someone is winding up to attack you
  threatenedBy(me).forEach(id=>{
    const o=CO(id);if(!o)return;
    const r=rel(me,id);
    const j=r.justify||r.ready;
    const days=j&&j.until?Math.max(0,j.until-G.day):0;
    out.push({tone:"amber",tag:"War coming",
      text:`${o.name} is preparing a war on you${r.justify?`. About ${days} days.`:". It can declare at any moment."}`,
      go:()=>{UI.tab="world";render();}});
  });
  // 4. decisions sitting on Talks
  for(const k in G.rel){
    const r=G.rel[k];
    if(r.offer&&CO(r.offer.from))out.push({tone:"green",tag:"Offer",
      text:`${CO(r.offer.from).name} wants a defence pact with you.`,go:()=>{UI.tab="world";render();}});
    if(r.demand&&CO(r.demand.from)&&PV(r.demand.prov))out.push({tone:"amber",tag:"Demand",
      text:`${CO(r.demand.from).name} will stop the war if you hand over ${PV(r.demand.prov).name}.`,
      go:()=>{UI.tab="world";render();}});
    if(r.ready&&r.ready.by===me){
      const [a,b]=k.split(":").map(Number);
      const o=CO(a===me?b:a);
      if(o)out.push({tone:"amber",tag:"Ready",
        text:`You can declare war on ${o.name} now.`,go:()=>{UI.tab="world";render();}});
    }
  }
  // 5. money going the wrong way
  if(c.treasury<0)out.push({tone:"red",tag:"Broke",
    text:"Your treasury is empty and soldiers are deserting. Disband or take peace.",
    go:()=>{UI.tab="build";render();}});
  else if(netOf(c.id)<0)out.push({tone:"amber",tag:"Losing money",
    text:`You spend ${money(-netOf(c.id)/7)} a day more than you earn.`,go:()=>{UI.tab="build";render();}});
  /* Four "enemy at the border" lines for one invasion is noise, and noise is what
     people learn to ignore. Undefended provinces are collapsed into one line. */
  const border=out.filter(x=>x.key==="border");
  if(border.length>1){
    const first=out.findIndex(x=>x.key==="border");
    const names=border.map(x=>PV(x.prov).name);
    const bare=border.filter(x=>x.tone==="red").length;
    const merged={tone:bare?"red":"amber",tag:"Enemy at the border",
      text:`Enemy armies are next to ${names.slice(0,3).join(", ")}${
        names.length>3?` and ${names.length-3} more`:""}. `+
        (bare?`${bare} of them ${bare>1?"have":"has"} nobody defending.`:"All of them are defended."),
      go:()=>focusProv(border[0].prov)};
    const rest=out.filter(x=>x.key!=="border");
    rest.splice(Math.min(first,rest.length),0,merged);
    return rest.slice(0,4);
  }
  return out.slice(0,4);
}
function focusProv(pid){UI.sel=pid;paintMap();openProvince(pid);}
function selectArmy(id){

function paintBar(){

    G.speed=+b.dataset.speed;restartClock();paintBar();
  });

function barHTML(){
  const c=you();if(!c)return "";
  const net=netOf(c.id), cost=recruitCost(c.id);
  // Everything is shown per DAY. The clock ticks in days and nobody converts weeks in
  // their head while a war is on.
  const cells=[
    ["Money",money(c.treasury),(net>=0?"+":"\u2212")+num(Math.abs(net/7))+"/day",net>=0?"up":"down"],
    ["Workers",num(c.workers),"+"+(workerGain(c.id)/7).toFixed(1)+"/day","up"],
    ["Factories",String(c.factories),"build speed",""],
    ["Influence",Math.floor(c.pp)+"","for deals",""],
    ["Land",provsOf(c.id).length+"","of "+G.provinces.filter(p=>!p.sea).length,""]];
  return `<div class="who">
      <span class="flag" style="background:${esc(c.color)}"></span>
      <h1>${esc(c.name)}</h1>
      <span class="clock">${G.speed===0?"PAUSED \u00B7 ":""}${dateStr(G.day)}</span>
      ${speedsHTML()}
    </div>
    <div class="res">${cells.map(([k,v,d,cl])=>
      `<div><div class="k">${k}</div><div class="v">${v}</div><div class="d ${cl}">${d}</div></div>`).join("")}</div>`;
}
function speedsHTML(){
  const names={0:"\u23F8",1:"Slow",2:"Med",3:"Fast"};
  return `<div class="speeds">${[0,1,2,3].map(s=>
    `<button data-speed="${s}" class="${G.speed===s?"on":""}" aria-label="${
      s===0?"Pause":names[s]}">${names[s]}</button>`).join("")}</div>`;
}

/* ================================================================
   THE CLOCK
   The world runs whether or not the player is looking at it. This is the
   structural difference from a turn-based game: render can no longer be the
   only thing that redraws, because state changes without a tap.
   ================================================================ */
let CLOCK=null;
function restartClock(){
  if(CLOCK){clearInterval(CLOCK);CLOCK=null;}
  const ms=TICK_MS[G?G.speed:0];
  if(!ms)return;
  CLOCK=setInterval(()=>{
    tick();
    paintMap();paintBar();paintAlerts();
    // Army is the tap-heaviest tab and it was being rebuilt every 170ms at speed 3, so
    // Select then Attack ate clicks. While a selection or a sheet is live, the panel
    // holds still; the map and the readout keep moving.
    const frozen=(UI.tab==="army"&&(UI.army!=null||UI.sheet))||UI.sheet;
    if(!frozen&&(UI.tab==="army"||UI.tab==="nation"||UI.tab==="build"))paintPanel();
    // A decision waiting on the player has to reach them even if they are looking at
    // another tab. Repainting Diplomacy every tick would move buttons under a thumb
    // mid-tap, so it only rebuilds when the set of pending decisions actually changes.
    const sig=pendingSignature();
    if(sig!==UI.pending){UI.pending=sig;render();}
    if(G.defeat||G.victory){G.speed=0;restartClock();render();}
  },ms);
}

/* ================================================================
   PANELS
   ================================================================ */
function pendingSignature(){
  let out="";
  for(const k in G.rel){
    const r=G.rel[k];
    if(r.offer)out+="o"+k;
    if(r.ready)out+="r"+k;
    if(r.demand)out+="d"+k;
  }
  return out;
}
function render(){
  if(!G||G.you==null){renderStart();return;}
  UI.pending=pendingSignature();
  const keep=UI.lastTab===UI.tab?(window.scrollY||0):0;
  UI.lastTab=UI.tab;
  app.innerHTML="";
  app.appendChild($(`<div class="bar" id="bar">${barHTML()}</div>`));
  app.appendChild($(`<div class="alerts" id="alerts"></div>`));
  app.appendChild($(`<div class="mapwrap" id="mapwrap"></div>`));
  const key=$(`<button class="mapkey">What do these symbols mean?</button>`);
  key.onclick=openLegend;
  document.getElementById("mapwrap").appendChild(key);
  app.appendChild($(`<div class="wrap" id="panel"></div>`));
  app.appendChild(nav());
  paintMap();
  paintAlerts();
  paintPanel();
  window.scrollTo(0,keep);
}
function nav(){
  const items=[["nation","\u2302","Home"],["army","\u2694","Armies"],["build","\u2692","Build"],
    ["research","\u2699","Tech"],["world","\u25CE","World"]];
  const n=$(`<nav></nav>`);
  const offers=Object.values(G.rel).filter(r=>r.offer||r.ready||r.demand).length;
  items.forEach(([k,ic,lab])=>{
    const alert=(k==="world"&&offers>0);
    const b=$(`<button class="${UI.tab===k?"on":""}${alert?" alert":""}" ${UI.tab===k?'aria-current="page"':""}>
      <span class="ic">${ic}</span>${lab}</button>`);
    b.onclick=()=>{UI.tab=k;render();};
    n.appendChild(b);
  });
  return n;
}
function paintPanel(){
  const w=document.getElementById("panel");
  if(!w)return;
  const y=window.scrollY;
  w.innerHTML="";
  if(G.defeat){w.appendChild($(`<div class="card"><div class="eyebrow">Game over</div>
    <h3>Your nation is gone.</h3><div class="small muted">Survived to ${esc(dateStr(G.day))}.</div></div>`));}
  if(G.victory){w.appendChild($(`<div class="card"><div class="eyebrow">Victory</div>
    <h3>The map is yours.</h3><div class="small muted">Completed ${esc(dateStr(G.day))}.</div></div>`));}
  ({nation:panelNation,army:panelArmy,build:panelBuild,research:panelResearch,
    world:panelWorld}[UI.tab]||panelNation)(w);
  if(Math.abs(window.scrollY-y)>2)window.scrollTo(0,y);
}

/* ---- Nation ---- */
/* A coach, not a dashboard. The single most useful thing the game can do for someone
   who has never played one of these is tell them what to do next, in one sentence,
   that changes as the situation changes. Everything else on Home is reference. */
function nextStep(){
  const c=you();
  const wars=alive().filter(o=>o.id!==c.id&&atWar(c.id,o.id));
  const threats=threatenedBy(c.id);
  const pending=pendingDecisions();
  const armies=armiesOf(c.id);
  const broke=c.treasury<0;
  const cities=provsOf(c.id).filter(p=>p.city);
  const rc=recruitCost(c.id);

  if(G.speed===0&&G.day===0)
    return {t:"Press play when you are ready",
      b:"The buttons next to the date at the top control time. Start on Slow.",go:null};
  if(broke)
    return {t:"You are out of money",
      b:"Your soldiers are deserting. End a war, or you will lose armies for nothing.",
      go:wars.length?()=>openTerms(wars[0].id):()=>{UI.tab="build";render();}};
  const sieged=G.provinces.find(p=>!p.sea&&p.owner===c.id&&p.siege>0);
  if(sieged)
    return {t:`Save ${sieged.name}`,
      b:"An enemy is battering it down. Send an army there, or it changes hands.",
      go:()=>focusProv(sieged.id)};
  const brokenArmy=armies.find(a=>a.broken);
  if(brokenArmy)
    return {t:`Pull ${generalOf(brokenArmy).name} back`,
      b:"That army is beaten. If it stays next to an enemy it will be wiped out. March it home and it will slowly recover.",
      go:()=>openArmySheet(brokenArmy.id)};
  const undefended=G.provinces.find(p=>!p.sea&&p.owner===c.id&&zocBlocked(p,c.id)&&
    !armiesAt(p.id).some(x=>x.owner===c.id&&!x.broken));
  if(undefended)
    return {t:`Defend ${undefended.name}`,
      b:"There is an enemy army next door and nobody of yours in it. Move an army in before they walk in.",
      go:()=>focusProv(undefended.id)};
  if(pending.length)
    return {t:"Someone is waiting on your answer",
      b:"There is a decision sitting in the World tab.",go:()=>{UI.tab="world";render();}};
  if(threats.length)
    return {t:`${CO(threats[0]).name} is preparing to attack you`,
      b:"You have a few weeks. Build walls on that border, raise an army, and look for an ally.",
      go:()=>{UI.tab="build";render();}};
  if(wars.length){
    const w0=wars[0];
    const score=warScore(c.id,w0.id);
    if(score>3.2)return {t:`Make ${w0.name} pay`,
      b:"You are winning. Demand one of their provinces and end it while you are ahead.",
      go:()=>openTerms(w0.id)};
    if(score<-2)return {t:`Get out of the war with ${w0.name}`,
      b:"You are losing. Offer peace before it costs you more.",go:()=>openTerms(w0.id)};
    return {t:`Push the front with ${w0.name}`,
      b:"Tap one of your armies on the map and send it at a province of theirs. Armies next to each other fight on their own.",
      go:()=>{UI.tab="army";render();}};
  }
  if(armies.length<3&&cities.length&&c.treasury>rc.money*1.5)
    return {t:"Raise another army",
      b:`Two armies cannot hold a border and attack at the same time. A new one costs ${money(rc.money)} and takes about two weeks.`,
      go:()=>{UI.tab="build";render();}};
  if(!c.research)
    return {t:"Start researching something",
      b:"Research is slow, so start early. Fortification makes your land hard to take. Infantry makes every soldier hit harder.",
      go:()=>{UI.tab="research";render();}};
  const soft=provsOf(c.id).filter(p=>p.fort<2&&
    p.nb.some(n=>PV(n)&&!PV(n).sea&&PV(n).owner!==c.id));
  if(soft.length&&c.treasury>fortCost(soft[0])*2)
    return {t:`Build walls at ${soft[0].name}`,
      b:"It is on your border with nothing defending it. Walls slow an invasion down even when no army is there.",
      go:()=>focusProv(soft[0].id)};
  if(c.treasury>factoryCost(c)*2.5)
    return {t:"Build a factory",
      b:"Factories make everything else you build finish faster. They are the boring pick and usually the right one.",
      go:()=>{UI.tab="build";render();}};
  return {t:"You are in good shape",
    b:"Let the clock run. Watch the World tab for who is getting big, and the alerts at the top for trouble.",go:null};
}
function panelNation(w){
  const c=you();
  const wars=alive().filter(o=>o.id!==c.id&&atWar(c.id,o.id));
  const pacts=alliesOf(c.id).map(CO).filter(Boolean);
  const byLand=alive().slice().sort((x,y)=>provsOf(y.id).length-provsOf(x.id).length);
  const rankLand=byLand.findIndex(x=>x.id===c.id)+1;

  // 1. WHAT DO I DO NOW
  {
    const st=nextStep();
    const card=$(`<div class="card" style="border-color:var(--you)"></div>`);
    card.appendChild($(`<div class="eyebrow" style="color:var(--you)">What to do next</div>`));
    card.appendChild($(`<h3 style="margin-bottom:3px">${esc(st.t)}</h3>`));
    card.appendChild($(`<div class="small">${esc(st.b)}</div>`));
    if(st.go){
      const b=$(`<button class="btn p sm" style="margin-top:9px">Take me there</button>`);
      b.onclick=st.go;
      card.appendChild(b);
    }
    w.appendChild(card);
  }

  // 2. WHAT AM I TRYING TO DO
  {
    const card=$(`<div class="card"></div>`);
    card.appendChild($(`<div class="eyebrow">The goal</div>`));
    card.appendChild($(`<div class="small">Be the last nation standing. You are <b>${rankLand}${
      rankLand===1?"st":rankLand===2?"nd":rankLand===3?"rd":"th"}</b> of ${alive().length} by land.</div>`));
    const total=G.provinces.filter(p=>!p.sea).length;
    card.appendChild($(`<div class="bar2" style="margin-top:6px"><i style="width:${
      (provsOf(c.id).length/total*100).toFixed(0)}%;background:${esc(c.color)}"></i></div>`));
    card.appendChild($(`<div class="small muted" style="margin-top:4px">You hold ${provsOf(c.id).length}
      of the map\u2019s ${total} provinces. You lose if an enemy takes more than half your land and then
      your capital.</div>`));
    w.appendChild(card);
  }

  if(G.day<PLAYER_GRACE&&!wars.length){
    const bn=$(`<div class="card" style="border-color:var(--pact)"></div>`);
    bn.appendChild($(`<div class="eyebrow" style="color:var(--pact)">Peacetime</div>`));
    bn.appendChild($(`<div class="small">No war can start anywhere until
      <b>${esc(dateStr(OPENING_PEACE))}</b>. Nobody will come for <b>you</b> until
      <b>${esc(dateStr(PLAYER_GRACE))}</b>. Spend it building armies, factories and walls.</div>`));
    w.appendChild(bn);
  }

  // 3. WHO AM I
  {
    const card=$(`<div class="card"></div>`);
    card.appendChild($(`<div class="eyebrow">Your nation</div>`));
    card.appendChild($(`<div class="between"><h3 style="margin:0">${esc(c.name)}</h3>
      <span class="flag" style="width:16px;height:16px;background:${esc(c.color)}"></span></div>`));
    if(c.blurb)card.appendChild($(`<div class="small muted">${esc(c.blurb)}</div>`));
    const st=[
      ["Provinces",provsOf(c.id).length+" of "+(c.homeProvs||provsOf(c.id).length)+" you started with"],
      ["Cities",provsOf(c.id).filter(p=>p.city).length],
      ["Armies",armiesOf(c.id).length+" of "+ARMY_MAX+" allowed"],
      ["Soldiers",armiesOf(c.id).reduce((a,x)=>a+x.troops,0)],
      ["Costing you",money(upkeepOf(c.id)/7)+" a day"]];
    card.appendChild($(`<div class="divider"></div><table>${
      st.map(([k,v])=>`<tr><td class="l muted">${k}</td><td class="mono">${esc(String(v))}</td></tr>`).join("")}</table>`));
    w.appendChild(card);
  }

  if(wars.length){
    const t=$(`<div class="card" style="border-color:var(--war)"></div>`);
    t.appendChild($(`<div class="eyebrow" style="color:var(--war)">Wars you are in</div>`));
    const l=$(`<div class="lst"></div>`);
    wars.forEach(o=>{
      const left=provsOf(o.id).length, home=o.homeProvs||left;
      const need=Math.ceil(home*CAPITULATE_AT);
      const more=Math.max(0,left-need+1);
      const score=warScore(c.id,o.id);
      const row=$(`<div>
        <div class="between"><div class="row">
          <span class="flag" style="background:${esc(o.color)}"></span>
          <b>${esc(o.name)}</b></div>
          <span class="small ${score>1?"up":score<-1?"down":"muted"}">${
            score>3?"you are winning":score>1?"slightly ahead":score<-3?"you are losing":
            score<-1?"slightly behind":"even"}</span></div>
        <div class="small muted" style="margin-top:3px">To conquer them: take
          <b>${more}</b> more of their provinces, then their capital.</div></div>`);
      const b=$(`<button class="btn sm" style="margin-top:6px">Try to end the war</button>`);
      b.onclick=()=>openTerms(o.id);
      row.appendChild(b);
      l.appendChild(row);
    });
    t.appendChild(l);w.appendChild(t);
  }
  if(pacts.length){
    const t=$(`<div class="card"></div>`);
    t.appendChild($(`<div class="eyebrow">Your allies</div>`));
    t.appendChild($(`<div class="small muted">If they are attacked, you join their war. And they join yours.</div>`));
    pacts.forEach(o=>t.appendChild($(`<div class="row small" style="padding:3px 0">
      <span class="flag" style="background:${esc(o.color)}"></span>${esc(o.name)}</div>`)));
    w.appendChild(t);
  }

  // 4. WHAT JUST HAPPENED (the old Log tab, cut to the part anyone reads)
  {
    const t=$(`<div class="card"></div>`);
    t.appendChild($(`<div class="eyebrow">Recent news</div>`));
    if(!G.log.length)t.appendChild($(`<div class="small muted">Nothing has happened yet.</div>`));
    const l=$(`<div class="lst"></div>`);
    G.log.slice(0,8).forEach(e=>l.appendChild($(`<div class="small">
      <span class="mono muted" style="font-size:10px">${esc(dateStr(e.d))}</span>
      <span style="${e.k==="war"?"color:var(--war)":""}"> ${esc(e.t)}</span></div>`)));
    t.appendChild(l);
    if(G.log.length>8){
      const b=$(`<button class="btn sm" style="margin-top:7px">All the news</button>`);
      b.onclick=()=>openSheet(sh=>{
        sh.appendChild($(`<div class="eyebrow">Everything that has happened</div>`));
        G.log.slice(0,90).forEach(e=>sh.appendChild($(`<div class="small" style="padding:3px 0">
          <span class="mono muted" style="font-size:10px">${esc(dateStr(e.d))}</span>
          <span style="${e.k==="war"?"color:var(--war)":""}"> ${esc(e.t)}</span></div>`)));
      });
      t.appendChild(b);
    }
    w.appendChild(t);
  }

  const sv=$(`<div class="card"></div>`);
  sv.appendChild($(`<div class="eyebrow">Game</div>`));
  const row=$(`<div class="row" style="flex-wrap:wrap"></div>`);
  const bh=$(`<button class="btn sm">How to play</button>`);
  bh.onclick=()=>showIntro(0,true);
  const b1=$(`<button class="btn sm">Save now</button>`);
  b1.onclick=()=>{if(saveGame())toast("Saved.","good");};
  const b2=$(`<button class="btn sm d">New game</button>`);
  b2.onclick=()=>confirmSheet("Start a new game?","This wipes the country you are playing now.",()=>{
    wipeSave();G=null;resetUI();if(CLOCK)clearInterval(CLOCK);CLOCK=null;renderStart();
  });
  row.appendChild(bh);row.appendChild(b1);row.appendChild(b2);sv.appendChild(row);
  if(G.saveError)sv.appendChild($(`<div class="small" style="color:var(--war);margin-top:6px">Saving is failing. Storage may be full.</div>`));
  w.appendChild(sv);
}

/* ---- Army ---- */
function panelArmy(w){
  const c=you();
  const arms=armiesOf(c.id);
  const head=$(`<div class="card"></div>`);
  head.appendChild($(`<div class="eyebrow">Your armies</div>`));
  head.appendChild($(`<div class="small muted">Tap one to give it orders. You can also tap it
    straight on the map. Armies standing next to an enemy you are at war with fight without
    being told to.</div>`));
  w.appendChild(head);
  if(!arms.length){
    w.appendChild($(`<div class="card"><div class="small">You have no armies. Raise one from the Build tab,
      in a city you hold.</div></div>`));
    return;
  }
  const list=$(`<div class="card lst"></div>`);
  arms.slice().sort((a,b)=>(b.broken?1:0)-(a.broken?1:0)||(b._fighting?1:0)-(a._fighting?1:0)||b.troops-a.troops)
  .forEach(a=>{
    const g=generalOf(a),p=PV(a.prov);
    const hp=clamp(a.troops/Math.max(1,a.max),0,1);
    const line=a.broken?`Beaten at ${esc(p?p.name:"?")}. Get it out of there.`
      :a.moving!=null?`Marching to ${esc(PV(a.moving)?PV(a.moving).name:"?")}, ${a.eta} days out.`
      :a._fighting?`Fighting at ${esc(p?p.name:"?")} and ${a._win?"winning":"losing"}.`
      :a.stance==="attack"?`Attacking ${esc(PV(a.target)?PV(a.target).name:"?")}.`
      :`Holding ${esc(p?p.name:"?")}.`;
    const tone=a.broken||(a._fighting&&!a._win)?"var(--war)":a._fighting?"var(--ok)":"";
    const row=$(`<div>
      <div class="between"><div style="min-width:0">
        <div style="font-weight:600">${esc(g.name)}</div>
        <div class="small" style="color:${tone||"var(--muted)"}">${line}</div>
      </div><div class="mono" style="text-align:right">
        <div style="font-weight:700">${a.troops}</div><div class="small muted">of ${a.max}</div></div></div>
      <div class="bar2" style="margin-top:4px"><i style="width:${(hp*100).toFixed(0)}%;background:${
        hp>.5?"var(--ok)":hp>.25?"var(--you)":"var(--war)"}"></i></div>
    </div>`);
    const b=$(`<button class="btn sm" style="margin-top:6px">Give orders</button>`);
    b.onclick=()=>openArmySheet(a.id);
    row.appendChild(b);
    list.appendChild(row);
  });
  w.appendChild(list);
}

function panelBuild(w){
  const c=you();
  const cost=recruitCost(c.id);

  if(c.build.length){
    const q=$(`<div class="card"></div>`);
    q.appendChild($(`<div class="eyebrow">Being built</div>`));
    const l=$(`<div class="lst"></div>`);
    c.build.forEach((b,i)=>{
      const total=b.kind==="army"?RECRUIT_DAYS*8:RECRUIT_DAYS*10;
      const pct=clamp(1-b.left/total,0,1);
      const days=Math.ceil(b.left/Math.max(.1,buildRate(c.id)));
      l.appendChild($(`<div>
        <div class="between"><span>${b.kind==="army"?"An army for "+esc(PV(b.prov)?PV(b.prov).name:"?"):"A factory"}</span>
        <span class="mono small muted">${i===0?"ready in "+days+" days":"waiting its turn"}</span></div>
        <div class="bar2" style="margin-top:4px"><i style="width:${(pct*100).toFixed(0)}%;background:var(--you)"></i></div></div>`));
    });
    q.appendChild(l);
    w.appendChild(q);
  }

  // ARMIES
  {
    const r=$(`<div class="card"></div>`);
    r.appendChild($(`<div class="eyebrow">Raise an army</div>`));
    r.appendChild($(`<div class="small muted">A new army of about 25 soldiers. Costs
      <b>${money(cost.money)}</b> and <b>${cost.workers} workers</b>, and takes roughly two weeks.
      Every army you already have makes the next one dearer, and they cost money every single day.
      You can have ${ARMY_MAX}. You have ${armiesOf(c.id).length}.</div>`));
    const cities=provsOf(c.id).filter(p=>p.city);
    if(!cities.length)r.appendChild($(`<div class="hint" style="margin-top:7px">You hold no cities,
      so you cannot raise anyone. Take one back.</div>`));
    const grid=$(`<div class="row" style="flex-wrap:wrap;margin-top:7px"></div>`);
    cities.forEach(p=>{
      const b=$(`<button class="btn sm">Raise at ${esc(p.name)}</button>`);
      b.disabled=c.treasury<cost.money||c.workers<cost.workers;
      b.onclick=()=>{const res=orderRecruit(c.id,p.id);
        if(!res.ok)toast(res.msg,"war");else toast("Recruiting. About two weeks.");
        paintPanel();paintBar();};
      grid.appendChild(b);
    });
    r.appendChild(grid);
    // topping up beats starting from scratch, and nobody finds it on the map by accident
    const hurt=armiesOf(c.id).filter(a=>a.troops<a.max&&PV(a.prov)&&PV(a.prov).owner===c.id);
    if(hurt.length){
      r.appendChild($(`<div class="divider"></div><div class="eyebrow">Or top up one you have</div>`));
      r.appendChild($(`<div class="small muted">Cheaper and instant. Only works in your own land.</div>`));
      const g2=$(`<div class="row" style="flex-wrap:wrap;margin-top:6px"></div>`);
      hurt.sort((a,b)=>(a.troops/a.max)-(b.troops/b.max)).slice(0,5).forEach(a=>{
        const rc=reinforceCost(a);
        const b=$(`<button class="btn sm">${esc(generalOf(a).name)} \u00B7 ${a.troops}/${a.max} \u00B7 ${money(rc.money)}</button>`);
        b.disabled=c.treasury<rc.money||c.workers<rc.workers;
        b.onclick=()=>{const res=orderReinforce(c.id,a.id);
          toast(res.ok?`+${res.gain} men.`:res.msg,res.ok?"good":"war");
          paintPanel();paintBar();paintMap();};
        g2.appendChild(b);
      });
      r.appendChild(g2);
    }
    w.appendChild(r);
  }

  // FACTORIES
  {
    const f=$(`<div class="card"></div>`);
    f.appendChild($(`<div class="eyebrow">Build a factory</div>`));
    f.appendChild($(`<div class="small muted">Factories make everything in the build queue finish faster.
      They are national, not on the map, so losing a city does not lose you a factory.
      You have <b>${c.factories}</b>.</div>`));
    const fb=$(`<button class="btn sm" style="margin-top:7px">Build one \u00B7 ${money(factoryCost(c))}</button>`);
    fb.disabled=c.treasury<factoryCost(c);
    fb.onclick=()=>{const res=orderFactory(c.id);
      if(!res.ok)toast(res.msg||"Cannot build.","war");else toast("Factory ordered.");
      paintPanel();paintBar();};
    f.appendChild(fb);
    w.appendChild(f);
  }

  // WALLS
  {
    const fo=$(`<div class="card"></div>`);
    fo.appendChild($(`<div class="eyebrow">Build walls</div>`));
    fo.appendChild($(`<div class="small muted">Walls make a province slower to take, and they work even
      when no army is standing there. Build them on the border, not in the middle.</div>`));
    const front=provsOf(c.id).filter(p=>p.nb.some(n=>{const z=PV(n);return z&&!z.sea&&z.owner!=null&&z.owner!==c.id;}));
    const list=(front.length?front:provsOf(c.id));
    const fg=$(`<div class="row" style="flex-wrap:wrap;margin-top:7px"></div>`);
    list.slice(0,12).forEach(p=>{
      const b=$(`<button class="btn sm">${esc(p.name)} \u00B7 walls ${p.fort}/4 \u00B7 ${money(fortCost(p))}</button>`);
      b.disabled=c.treasury<fortCost(p)||p.fort>=4;
      b.onclick=()=>{const res=orderFortify(c.id,p.id);
        if(!res.ok)toast(res.msg,"war");else toast(`${p.name} is better defended.`,"good");
        paintPanel();paintBar();paintMap();};
      fg.appendChild(b);
    });
    if(front.length)fo.appendChild($(`<div class="small muted" style="margin-top:5px">These are the ones on your border.</div>`));
    fo.appendChild(fg);
    w.appendChild(fo);
  }
}

/* ---- Research ---- */
function panelResearch(w){
  const c=you();
  if(!c.research)w.appendChild($(`<div class="card"><div class="eyebrow">Research</div>
    <div class="small">You can research one thing at a time. It costs money up front and then takes
    weeks, so start something now rather than saving up. Nothing here is wasted.</div></div>`));
  if(c.research){
    const t=TECH_BY[c.research.k];
    const pct=clamp(1-c.research.left/c.research.total,0,1);
    const card=$(`<div class="card"></div>`);
    card.appendChild($(`<div class="eyebrow">In progress</div>`));
    card.appendChild($(`<div class="between"><b>${esc(t.label)} \u00B7 level ${c.tech[t.k]+1}</b>
      <span class="mono small muted">${c.research.left} days left</span></div>
      <div class="bar2" style="margin-top:5px"><i style="width:${(pct*100).toFixed(0)}%;background:var(--you)"></i></div>`));
    w.appendChild(card);
  }
  const blurbs={Land:"Makes your soldiers better in a fight.",
    Defence:"Makes your land harder to take. Each one unlocks the next.",
    Industry:"Money, building speed and how far your armies can go."};
  ["Land","Defence","Industry"].forEach(col=>{
    const card=$(`<div class="card"></div>`);
    card.appendChild($(`<div class="eyebrow">${col}</div>`));
    card.appendChild($(`<div class="small muted" style="margin-bottom:4px">${blurbs[col]}</div>`));
    const l=$(`<div class="lst"></div>`);
    TECH.filter(t=>t.col===col).forEach(t=>{
      const lvl=c.tech[t.k],maxed=lvl>=t.max,cost=techCost(c,t);
      const lock=techLocked(c,t);
      const row=$(`<div class="between">
        <div style="min-width:0">
          <div><b>${esc(t.label)}</b> <span class="mono small muted">${lvl}/${t.max}</span></div>
          <div class="small muted">${esc(t.desc)}</div>
          ${lock?`<div class="small" style="color:var(--you)">Locked. Needs ${esc(lock)}.</div>`:""}
        </div></div>`);
      const b=$(`<button class="btn sm">${maxed?"Complete":lock?"Locked":money(cost)}</button>`);
      b.disabled=maxed||!!lock||!!c.research||c.treasury<cost;
      b.onclick=()=>{const res=startResearch(c.id,t.k);if(!res.ok)toast(res.msg||"Cannot start.","war");else toast(`${t.label} research begun.`);paintPanel();paintBar();};
      row.appendChild(b);l.appendChild(row);
    });
    card.appendChild(l);
    w.appendChild(card);
  });
}

/* ---- Diplomacy ---- */
/* Decisions that are waiting on the player. Pulled out of the old Talks tab so the
   same list can head the World tab and drive the alerts strip. */
function pendingDecisions(){
  const c=you(),out=[];
  for(const k in G.rel){
    const r=G.rel[k];
    if(r.offer&&CO(r.offer.from)&&CO(r.offer.from).alive)out.push({r,from:r.offer.from});
    if(r.demand&&CO(r.demand.from)&&CO(r.demand.from).alive)out.push({r,demand:r.demand});
    if(r.ready&&r.ready.by===c.id){
      const [a,b]=k.split(":").map(Number);
      out.push({r,ready:(a===c.id?b:a)});
    }
  }
  return out;
}
/* One tab for everything to do with other countries: who is winning, who likes you,
   and every button you can press at them. Standings and diplomacy were two tabs that
   both listed all eight nations, which meant scrolling twice to answer one question. */
function panelWorld(w){
  const c=you();
  const pending=pendingDecisions();
  if(pending.length){
    const card=$(`<div class="card" style="border-color:var(--you)"></div>`);
    card.appendChild($(`<div class="eyebrow" style="color:var(--you)">Waiting on you</div>`));
    const l=$(`<div class="lst"></div>`);
    pending.forEach(x=>{
      if(x.demand){
        const o=CO(x.demand.from),pr=PV(x.demand.prov);
        if(!o||!pr){x.r.demand=null;return;}
        const row=$(`<div><div class="small" style="margin-bottom:5px">
          <b>${esc(o.name)}</b> will stop the war if you give them <b>${esc(pr.name)}</b>.</div></div>`);
        const acts=$(`<div class="row"></div>`);
        const y=$(`<button class="btn sm d">Give it up, end the war</button>`);
        y.onclick=()=>{setProvinceOwner(pr.id,o.id);makePeace(c.id,o.id);x.r.demand=null;
          logAdd(`You gave ${pr.name} to ${o.name} for peace.`);toast("The war is over.","good");render();};
        const n=$(`<button class="btn sm">Keep fighting</button>`);
        n.onclick=()=>{x.r.demand=null;nudgeStance(c.id,o.id,-6);toast("You refused.","war");render();};
        acts.appendChild(y);acts.appendChild(n);row.appendChild(acts);l.appendChild(row);
        return;
      }
      if(x.from!=null){
        const o=CO(x.from);
        const row=$(`<div><div class="small" style="margin-bottom:5px">
          <b>${esc(o.name)}</b> wants a defence pact. If either of you is attacked, the other joins in.</div></div>`);
        const acts=$(`<div class="row"></div>`);
        const y=$(`<button class="btn sm p">Accept</button>`);
        y.onclick=()=>{formPact(c.id,o.id,"defense");x.r.offer=null;
          logAdd(`You signed a defence pact with ${o.name}.`);toast("Pact signed.","good");render();};
        const n=$(`<button class="btn sm">No thanks</button>`);
        n.onclick=()=>{x.r.offer=null;nudgeStance(c.id,o.id,-8);render();};
        acts.appendChild(y);acts.appendChild(n);row.appendChild(acts);l.appendChild(row);
        return;
      }
      const o=CO(x.ready);
      if(!o||!o.alive){x.r.ready=null;return;}
      const row=$(`<div><div class="small" style="margin-bottom:5px">
        You are ready to declare war on <b>${esc(o.name)}</b>.
        <span class="muted">Offer expires in ${Math.max(0,x.r.ready.until-G.day)} days.</span></div></div>`);
      const bb=$(`<button class="btn sm d">Declare war</button>`);
      bb.onclick=()=>confirmSheet(`Declare war on ${o.name}?`,
        "Anyone they have a pact with will join their side.",()=>{
          x.r.ready=null;declareWar(c.id,o.id);render();});
      row.appendChild(bb);l.appendChild(row);
    });
    card.appendChild(l);w.appendChild(card);
  }

  const rows=alive().slice().sort((a,b)=>provsOf(b.id).length-provsOf(a.id).length);
  const total=G.provinces.filter(p=>!p.sea).length;
  const card=$(`<div class="card"></div>`);
  card.appendChild($(`<div class="eyebrow">Every nation</div>`));
  card.appendChild($(`<div class="small muted">${alive().length} left of ${G.countries.length}.
    The green bar under each one is how much they like you.</div>`));
  const l=$(`<div class="lst"></div>`);
  rows.forEach((o,i)=>{
    const isMe=o.id===c.id;
    const land=provsOf(o.id).length;
    const troops=armiesOf(o.id).reduce((a,x)=>a+x.troops,0);
    const r=isMe?null:rel(c.id,o.id);
    const tags=[];
    if(r&&r.war)tags.push(`<span class="pill war">at war with you</span>`);
    if(r&&r.pact)tags.push(`<span class="pill pact">your ally</span>`);
    if(r&&r.justify)tags.push(`<span class="pill just">${r.justify.by===c.id?"you are preparing":"preparing to attack you"}</span>`);
    if(r&&r.truce>G.day)tags.push(`<span class="pill">truce</span>`);
    const fights=alive().filter(x=>x.id!==o.id&&atWar(o.id,x.id)&&(!r||x.id!==c.id));
    if(fights.length)tags.push(`<span class="pill war">fighting ${esc(fights.map(x=>x.name).join(", "))}</span>`);

    const row=$(`<div style="${isMe?"border-left:3px solid var(--you);padding-left:8px":""}">
      <div class="between">
        <div class="row" style="min-width:0">
          <span class="mono muted" style="font-size:11px;width:14px">${i+1}</span>
          <span class="flag" style="background:${esc(o.color)}"></span>
          <span style="font-weight:${isMe?700:600}">${esc(o.name)}${isMe?" (you)":""}</span>
        </div>
        <span class="mono small">${land} land \u00B7 ${troops} men</span>
      </div>
      <div class="small muted">${esc(o.blurb||"")}</div>
      ${r?`<div class="bar2" style="margin-top:4px"><i style="width:${clamp((r.stance+100)/2,0,100)}%;
        background:${r.stance>=0?"var(--pact)":"var(--war)"}"></i></div>`:""}
      <div class="row" style="flex-wrap:wrap;margin-top:4px">${tags.join(" ")}</div>
    </div>`);

    if(!isMe){
      const acts=$(`<div class="row" style="flex-wrap:wrap;margin-top:6px"></div>`);
      if(r.war){
        const b=$(`<button class="btn sm">Try to end the war</button>`);
        b.onclick=()=>openTerms(o.id);
        acts.appendChild(b);
      }else{
        if(!r.pact){
          const b=$(`<button class="btn sm">Ask for a pact</button>`);
          b.disabled=G.day-r.lastAsk<45;
          b.onclick=()=>{
            const ok=proposeAlliance(c.id,o.id);
            toast(ok?`${o.name} agreed.`:`${o.name} said no.`,ok?"good":"war");
            logAdd(ok?`You signed a defence pact with ${o.name}.`:`${o.name} refused a pact.`);
            render();
          };
          acts.appendChild(b);
        }else{
          const b=$(`<button class="btn sm d">Break the pact</button>`);
          b.onclick=()=>confirmSheet(`Break your pact with ${o.name}?`,
            "Every other nation will trust you less.",()=>{
              breakPact(c.id,o.id);alive().forEach(x=>{if(x.id!==c.id)nudgeStance(x.id,c.id,-8);});
              toast("Pact broken.","war");render();});
          acts.appendChild(b);
        }
        if(!r.justify&&!r.ready&&bordersWith(c.id).includes(o.id)&&r.truce<G.day){
          const cost=Math.round(JUSTIFY_PP*(1+o.tech.nuke*.7));
          const b=$(`<button class="btn sm d">Prepare a war \u00B7 ${cost} influence</button>`);
          b.disabled=c.pp<cost||G.day<OPENING_PEACE;
          b.onclick=()=>{
            const res=startJustify(c.id,o.id);
            if(!res.ok)toast(res.msg,"war");
            else toast(`Preparing. You can declare in ${JUSTIFY_DAYS} days, and they will see it coming.`,"war");
            render();
          };
          acts.appendChild(b);
        }
      }
      if(r.justify&&r.justify.by===c.id)
        acts.appendChild($(`<span class="small muted">${Math.max(0,r.justify.until-G.day)} days until you can declare</span>`));
      row.appendChild(acts);
    }
    l.appendChild(row);
  });
  card.appendChild(l);
  w.appendChild(card);
}

/* ================================================================
   SHEETS
   One in-game sheet for confirmations and province detail. No confirm(),
   because a system alert on an installed phone app ignores the palette and
   lands under the home indicator.
   ================================================================ */
function closeSheet(){
  if(UI.sheet){UI.sheet.remove();UI.sheet=null;}
  document.removeEventListener("keydown",escClose);
}
function escClose(e){if(e.key==="Escape")closeSheet();}
function openSheet(build){
  closeSheet();
  const ov=$(`<div class="overlay"></div>`);
  const sh=$(`<div class="sheet" role="dialog" aria-modal="true"></div>`);
  ov.onclick=e=>{if(e.target===ov)closeSheet();};
  build(sh);
  const close=$(`<button class="btn" style="width:100%;margin-top:9px">Close</button>`);
  close.onclick=closeSheet;
  sh.appendChild(close);
  ov.appendChild(sh);document.body.appendChild(ov);
  UI.sheet=ov;
  document.addEventListener("keydown",escClose);
  const first=sh.querySelector("button");if(first)first.focus();
}
function confirmSheet(title,body,onYes){
  openSheet(sh=>{
    sh.appendChild($(`<div class="eyebrow">Confirm</div>`));
    sh.appendChild($(`<h3>${esc(title)}</h3>`));
    sh.appendChild($(`<div class="small muted">${esc(body)}</div>`));
    const row=$(`<div class="row" style="margin-top:11px"></div>`);
    const y=$(`<button class="btn d" style="flex:1">Yes</button>`);
    y.onclick=()=>{closeSheet();onYes();};
    const n=$(`<button class="btn" style="flex:1">Cancel</button>`);
    n.onclick=closeSheet;
    row.appendChild(y);row.appendChild(n);sh.appendChild(row);
  });
}
/* Demand terms: the third verb. A war that can only end in annexation or a coin flip
   has a map payoff and no diplomatic one, which is half a grand strategy game. */
/* Nobody can guess what a small white square means. */
function openLegend(){
  openSheet(sh=>{
    sh.appendChild($(`<div class="eyebrow">Map symbols</div>`));
    const rows=[
      ["\u2605","White star","A capital city. Take a nation's capital, once they have lost half their land, and the whole nation is yours."],
      ["\u25A0","Small white square","A city. Cities are worth more money and are the only places you can raise an army."],
      ["\u25AE\u25AE","Small bars at the bottom","Walls. More bars means harder to take, even if no army is there."],
      ["42","Box with a number","An army, and how many soldiers are in it. White edge means it is yours."],
      ["\u2620","Skull on a box","That army is beaten. It cannot attack and will be destroyed if the enemy walks in."],
      ["\u2192","Green or red arrow","A battle. Green means the side it points from is winning."],
      ["\u25CB","Red ring around a province","An enemy army is right next to it. If the ring is filling up, they are knocking the walls down."],
      ["","Faded colours","Every nation except you is faded, so your own land is easy to find."]];
    const l=$(`<div class="lst"></div>`);
    rows.forEach(([g,n,d])=>l.appendChild($(`<div class="row" style="align-items:flex-start;gap:9px">
      <span class="mono" style="width:22px;text-align:center;color:var(--you);font-size:14px">${esc(g)}</span>
      <span style="flex:1;min-width:0"><b class="small">${esc(n)}</b>
      <span class="small muted" style="display:block">${esc(d)}</span></span></div>`)));
    sh.appendChild(l);
  });
}
function openTerms(themId){
  const me=G.you, them=CO(themId);
  if(!them)return;
  openSheet(sh=>{
    const score=warScore(me,themId);
    const r=rel(me,themId);
    const len=G.day-(r.warStart||G.day);
    const verdict=score>4?"You are clearly winning.":score>1?"You have the upper hand."
      :score>-1?"Neither side is winning.":score>-4?"You are losing.":"You are being beaten.";
    sh.appendChild($(`<div class="eyebrow">Terms with ${esc(them.name)}</div>`));
    sh.appendChild($(`<h3>${esc(verdict)}</h3>`));
    sh.appendChild($(`<div class="small muted">${len} days of fighting. Take more of their land, or have the
      bigger army, and they will agree to more.</div>`));

    sh.appendChild($(`<div class="divider"></div><div class="eyebrow">White peace</div>`));
    sh.appendChild($(`<div class="small muted">Both stop. Everyone keeps what they hold today.</div>`));
    const wp=$(`<button class="btn sm" style="margin-top:5px">Offer white peace</button>`);
    wp.onclick=()=>{
      const res=termsOffer(me,themId,"white");
      toast(res.ok?res.msg:res.msg,res.ok?"good":"war");
      if(res.ok)closeSheet();
      render();
    };
    sh.appendChild(wp);

    const want=demandableFrom(me,themId);
    sh.appendChild($(`<div class="divider"></div><div class="eyebrow">Demand a province</div>`));
    if(!want.length)
      sh.appendChild($(`<div class="small muted">You do not border anything of theirs you could ask for.</div>`));
    else{
      sh.appendChild($(`<div class="small muted">They hand it over and the war ends. They only agree if
        they are beaten badly enough, and a walled city costs more.</div>`));
      const g=$(`<div class="row" style="flex-wrap:wrap;margin-top:6px"></div>`);
      want.sort((a,b)=>(b.city?1:0)-(a.city?1:0)||b.pop-a.pop).slice(0,8).forEach(q=>{
        const bar=3.2+(q.city?1.6:0)+q.fort*.5;
        const b=$(`<button class="btn sm ${score>=bar?"p":""}">${esc(q.name)}${q.city?" \u00B7 city":""}
          ${score>=bar?"":'<span class="muted">they will refuse</span>'}</button>`);
        b.onclick=()=>{
          const res=termsOffer(me,themId,"demand",q.id);
          toast(res.msg,res.ok?"good":"war");
          if(res.ok)closeSheet();
          render();
        };
        g.appendChild(b);
      });
      sh.appendChild(g);
    }

    const mine=G.provinces.filter(q=>!q.sea&&q.owner===me&&!q.capital);
    if(score<-1&&mine.length){
      sh.appendChild($(`<div class="divider"></div><div class="eyebrow">Buy your way out</div>`));
      sh.appendChild($(`<div class="small muted">Give them a province and the war ends today.</div>`));
      const g=$(`<div class="row" style="flex-wrap:wrap;margin-top:6px"></div>`);
      mine.sort((a,b)=>a.pop-b.pop).slice(0,6).forEach(q=>{
        const b=$(`<button class="btn sm d">Give ${esc(q.name)}</button>`);
        b.onclick=()=>{
          const res=termsOffer(me,themId,"cede",q.id);
          toast(res.msg,res.ok?"good":"war");
          if(res.ok)closeSheet();
          render();
        };
        g.appendChild(b);
      });
      sh.appendChild(g);
    }
  });
}
/* Tapping the map is how you play. Tap your own army and the orders come up right
   there, named and in plain words. Previously you had to find the Army tab, find the
   army in a list, press Select, then find the right button, while the clock ran. */
function openArmySheet(id){
  const a=AR(id);
  if(!a)return;
  const c=you();
  UI.army=id;UI.sel=a.prov;
  paintMap();
  openSheet(sh=>{
    const g=generalOf(a), here=PV(a.prov);
    const hp=clamp(a.troops/Math.max(1,a.max),0,1);
    sh.appendChild($(`<div class="eyebrow">Your army at ${esc(here?here.name:"?")}</div>`));
    sh.appendChild($(`<div class="between"><h3 style="margin:0">${esc(g.name)}</h3>
      <span class="mono" style="font-weight:700">${a.troops} men</span></div>`));
    sh.appendChild($(`<div class="bar2" style="margin:5px 0 7px"><i style="width:${(hp*100).toFixed(0)}%;
      background:${hp>.5?"var(--ok)":hp>.25?"var(--you)":"var(--war)"}"></i></div>`));
    const status=a.broken?"Beaten. It will be destroyed if it stays and fights."
      :a.moving!=null?`Marching to ${esc(PV(a.moving)?PV(a.moving).name:"?")}, arrives in ${a.eta} days.`
      :a._fighting?(a._win?"Fighting and winning.":"Fighting and losing.")
      :a.stance==="attack"?"Pressing an attack.":"Holding position.";
    sh.appendChild($(`<div class="small ${a.broken||(a._fighting&&!a._win)?"":"muted"}"
      style="${a.broken?"color:var(--war)":""}">${esc(status)}</div>`));

    if(a.moving!=null){
      const b=$(`<button class="btn" style="width:100%;margin-top:9px">Stop and hold here</button>`);
      b.onclick=()=>{orderHold(a);closeSheet();paintMap();paintPanel();};
      sh.appendChild(b);
      return;
    }

    sh.appendChild($(`<div class="divider"></div><div class="eyebrow">Send it where</div>`));
    const targets=moveTargets(a);
    if(!targets.length)
      sh.appendChild($(`<div class="small muted">Nowhere to go from here.</div>`));
    targets.forEach(t=>{
      const q=t.p;
      const owner=CO(q.owner);
      const enemyArmies=armiesAt(q.id).filter(x=>x.owner!==c.id);
      const held=t.kind==="attack"&&zocBlocked(q,c.id);
      const label=t.kind==="attack"?`Attack ${esc(q.name)}`
        :t.kind==="sail"?`Sail to ${esc(q.name)}`:`March to ${esc(q.name)}`;
      const sub=t.kind==="attack"
        ? `${esc(owner?owner.name:"nobody")}\u2019s land \u00B7 ${enemyArmies.length?`${enemyArmies.reduce((s2,x)=>s2+x.troops,0)} men defending`:"undefended"}`+
          (siegeNeed(q)?` \u00B7 walls hold`:"")
        : t.kind==="sail" ? `across the water \u00B7 ${crossingDays(c.id)} days`
        : `your own land \u00B7 ${Math.max(1,MOVE_DAYS-(c.tech.logistics||0)*.5|0)} days`;
      const b=$(`<button class="btn ${t.kind==="attack"?"d":""}" style="width:100%;margin-top:5px;text-align:left">
        <div>${label}</div><div class="small muted" style="font-weight:400">${sub}</div></button>`);
      b.onclick=()=>{
        if(t.kind==="attack")orderAttack(a,q.id);else orderMove(a,q.id);
        UI.army=null;closeSheet();paintMap();paintPanel();
      };
      sh.appendChild(b);
      if(held)sh.appendChild($(`<div class="hint" style="margin-top:4px">You can batter the walls,
        but an enemy army beside ${esc(q.name)} stops you walking in. Beat that army first.</div>`));
    });

    sh.appendChild($(`<div class="divider"></div>`));
    const row=$(`<div class="row" style="flex-wrap:wrap"></div>`);
    if(a.stance==="attack"||a.target!=null){
      const h=$(`<button class="btn sm">Stop attacking, dig in</button>`);
      h.onclick=()=>{orderHold(a);closeSheet();paintMap();paintPanel();};
      row.appendChild(h);
    }
    if(here&&here.owner===c.id&&a.troops<a.max+REINFORCE_OVER){
      const rc=reinforceCost(a);
      const rb=$(`<button class="btn sm">Send ${money(rc.money)} of reinforcements</button>`);
      rb.disabled=c.treasury<rc.money||c.workers<rc.workers;
      rb.onclick=()=>{const res=orderReinforce(c.id,a.id);
        toast(res.ok?`+${res.gain} men.`:res.msg,res.ok?"good":"war");
        closeSheet();paintMap();paintBar();paintPanel();};
      row.appendChild(rb);
    }
    sh.appendChild(row);
  });
}
function openProvince(pid){
  const p=PV(pid);
  if(!p||p.sea){UI.army=null;paintMap();return;}
  const c=you();

  // an army is already selected and this is a legal target: just give the order
  if(UI.army!=null&&AR(UI.army)){
    const a=AR(UI.army);
    const t=moveTargets(a).find(x=>x.p.id===pid);
    if(t){
      if(t.kind==="attack"){orderAttack(a,pid);toast(`Attacking ${p.name}.`,"war");}
      else {orderMove(a,pid);toast(t.kind==="sail"?`Sailing to ${p.name}.`:`Marching to ${p.name}.`);}
      UI.army=null;paintMap();paintPanel();return;
    }
    if(a.prov!==pid){UI.army=null;paintMap();}
  }
  // your own army standing here: command it
  const mine=armiesAt(pid).filter(x=>x.owner===c.id);
  if(mine.length===1)return openArmySheet(mine[0].id);
  if(mine.length>1){
    return openSheet(sh=>{
      sh.appendChild($(`<div class="eyebrow">${esc(p.name)}</div>`));
      sh.appendChild($(`<h3>${mine.length} of your armies are here</h3>`));
      mine.forEach(a=>{
        const b=$(`<button class="btn" style="width:100%;margin-top:5px;text-align:left">
          <div>${esc(generalOf(a).name)}</div>
          <div class="small muted" style="font-weight:400">${a.troops} men${a.broken?" \u00B7 beaten":""}</div></button>`);
        b.onclick=()=>{closeSheet();openArmySheet(a.id);};
        sh.appendChild(b);
      });
    });
  }
  // otherwise: what is this place, in words
  openSheet(sh=>{
    const o=CO(p.owner);
    const mineLand=p.owner===c.id;
    sh.appendChild($(`<div class="eyebrow">${mineLand?"Yours":o?esc(o.name)+"\u2019s land":"No man\u2019s land"}</div>`));
    sh.appendChild($(`<div class="between"><h3 style="margin:0">${esc(p.name)}</h3>
      ${o?`<span class="row"><span class="flag" style="background:${esc(o.color)}"></span></span>`:""}</div>`));
    const desc=[];
    desc.push(p.capital?(mineLand?"This is your capital. Lose it and you can lose the game.":
      "This is their capital city."):p.city?"A city.":"Open country.");
    desc.push(`${TERRAIN[p.terrain].label}, which makes it ${
      TERRAIN[p.terrain].def>1.3?"very hard":TERRAIN[p.terrain].def>1.1?"harder":"no harder"} to take.`);
    desc.push(p.fort?`Fortified, level ${p.fort} of 4.`:"No walls.");
    if(!mineLand&&o&&atWar(c.id,o.id))
      desc.push(siegeNeed(p)?"Your army must batter it down before walking in.":"An army can simply walk in.");
    sh.appendChild($(`<div class="small muted">${desc.map(esc).join(" ")}</div>`));
    if(p.siege>0){
      const need=siegeNeed(p),pct=Math.round(clamp(p.siege/need,0,1)*100);
      sh.appendChild($(`<div style="margin-top:8px">
        <div class="between small"><span style="color:var(--war)">Under siege</span>
        <span class="mono">${pct}% down</span></div>
        <div class="bar2" style="margin-top:3px"><i style="width:${pct}%;background:var(--war)"></i></div></div>`));
    }
    if(!mineLand&&o&&atWar(c.id,o.id)&&zocBlocked(p,c.id)){
      const blockers=neighbors(pid).filter(q=>
        armiesAt(q.id).some(x=>x.owner!==c.id&&!x.broken&&atWar(c.id,x.owner)));
      sh.appendChild($(`<div class="hint" style="margin-top:8px">An enemy army in
        <b>${esc(blockers.map(q=>q.name).join(", "))}</b> is holding this ground. You cannot walk in
        until it is beaten or moves away.</div>`));
    }
    const here=armiesAt(pid);
    if(here.length){
      sh.appendChild($(`<div class="divider"></div><div class="eyebrow">Armies here</div>`));
      here.forEach(a=>{
        const ac=CO(a.owner);
        sh.appendChild($(`<div class="between small" style="padding:3px 0">
          <span class="row"><span class="flag" style="background:${esc(ac?ac.color:"#666")}"></span>
          ${esc(ac?ac.name:"?")}${a.broken?' <span class="pill war">beaten</span>':""}</span>
          <span class="mono">${a.troops} men</span></div>`));
      });
    }
    if(mineLand){
      const acts=$(`<div class="row" style="flex-wrap:wrap;margin-top:9px"></div>`);
      if(p.fort<4){
        const b=$(`<button class="btn sm">Build walls \u00B7 ${money(fortCost(p))}</button>`);
        b.disabled=c.treasury<fortCost(p);
        b.onclick=()=>{const r2=orderFortify(c.id,pid);
          if(!r2.ok)toast(r2.msg,"war");else{toast("Walls raised.","good");closeSheet();}
          paintMap();paintBar();paintPanel();};
        acts.appendChild(b);
      }
      if(p.city){
        const cost=recruitCost(c.id);
        const b=$(`<button class="btn sm">Raise an army here \u00B7 ${money(cost.money)}</button>`);
        b.disabled=c.treasury<cost.money||c.workers<cost.workers;
        b.onclick=()=>{const r2=orderRecruit(c.id,pid);
          if(!r2.ok)toast(r2.msg,"war");else{toast("Recruiting. It will take about two weeks.");closeSheet();}
          paintBar();paintPanel();};
        acts.appendChild(b);
      }
      sh.appendChild(acts);
    }
  });
}

/* Four cards, once, before the clock starts. The last build dropped a player onto a
   ticking map with seven tabs and no sentence of explanation anywhere, and they lost a
   country without ever finding out which one was theirs. */
const INTRO=[
 {t:"This is your country",
  b:"Your land is the bright colour with the white outline around it. Every other nation is faded out. "+
    "The white star is your capital city."},
 {t:"You control time",
  b:"The buttons next to the date pause the game or speed it up. The world keeps moving while you read menus, "+
    "so pause whenever you want to think. Start on Slow."},
 {t:"Tap an army to move it",
  b:"Your armies are the boxes with a white edge and a number, which is how many soldiers are in them. "+
    "Tap one on the map and you get a list of places to send it. Two armies standing next to each other, "+
    "at war, fight automatically. You do not need to press anything."},
 {t:"Taking land",
  b:"Send an army at an enemy province. If somebody is defending it you have to beat them first. "+
    "If it has walls you have to knock them down, which takes days. The red ring filling up around a "+
    "province shows how close it is to falling."},
 {t:"Winning and losing",
  b:"You win by being the last nation left. You lose if an enemy takes more than half your land and "+
    "then your capital. Red rings on your own provinces mean an enemy army is right next door."},
 {t:"You get a head start",
  b:"Nobody can start any war for the first year, and nobody will attack you for two years. "+
    "Other nations will fight each other before then. Use the time to raise armies, build "+
    "factories and wall your borders."},
 {t:"If you get stuck",
  b:"Home always tells you one thing to do next. The messages at the very top are problems that need "+
    "you now, and tapping one takes you straight there."}];
function showIntro(step,replay){
  step=step||0;
  if(step>=INTRO.length){
    G.introDone=true;saveGame(true);
    if(!replay)toast("Press play at the top when you are ready.");
    return;
  }
  const card=INTRO[step];
  openSheet(sh=>{
    sh.appendChild($(`<div class="eyebrow">Step ${step+1} of ${INTRO.length}</div>`));
    sh.appendChild($(`<h3>${esc(card.t)}</h3>`));
    sh.appendChild($(`<div class="small">${esc(card.b)}</div>`));
    const b=$(`<button class="btn p" style="width:100%;margin-top:11px">
      ${step===INTRO.length-1?"Start playing":"Next"}</button>`);
    b.onclick=()=>{closeSheet();showIntro(step+1,replay);};
    sh.appendChild(b);
  });
}

/* ================================================================
   START
   ================================================================ */
let START_NAME="";
function renderStart(){
  if(CLOCK){clearInterval(CLOCK);CLOCK=null;}
  app.innerHTML="";
  const s=$(`<div class="start"></div>`);
  s.appendChild($(`<h1>Front Line</h1>`));
  s.appendChild($(`<div class="small muted" style="margin-bottom:14px">A war of nations, one day at a time.</div>`));

  if(localStorage.getItem(SAVE_KEY)){
    const b=$(`<button class="btn p" style="width:100%;margin-bottom:8px">Continue campaign</button>`);
    b.onclick=()=>{
      if(loadGame()&&G.you!=null){resetUI();integrityGuard("load");render();restartClock();}
      else toast("No usable save found.","war");
    };
    s.appendChild(b);
    s.appendChild($(`<div class="divider"></div>`));
  }
  if(!G)genWorld();
  s.appendChild($(`<div class="eyebrow" style="text-align:left">Rename your nation (optional)</div>`));
  const inp=$(`<input type="text" maxlength="22" placeholder="Leave blank to keep the generated name"
    style="width:100%;padding:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:5px;color:var(--ink);font:inherit;margin-bottom:12px">`);
  inp.value=START_NAME;
  inp.oninput=()=>{START_NAME=inp.value;};
  s.appendChild(inp);
  s.appendChild($(`<div class="eyebrow" style="text-align:left">Pick a nation</div>`));
 s.appendChild($(`<div class="small muted" style="text-align:left;margin-bottom:7px">
   The ten largest countries in Europe by area. The map is not Europe, so each name goes
   to whichever land on this map suits it. The blurb is true of the territory it holds.</div>`));

  G.countries.forEach(c=>{
    const land=provsOf(c.id).length;
    const b=$(`<button class="pick">
      <span class="flag" style="width:18px;height:18px;background:${esc(c.color)}"></span>
      <span style="flex:1;min-width:0">
        <b>${esc(c.name)}</b>
        <span class="small muted" style="display:block">${esc(c.blurb||"")}</span>
        <span class="small muted mono" style="display:block">${land} provinces \u00B7 ${c.factories} factories \u00B7
        ${esc((PERSONALITIES.find(p=>p.k===c.personality)||{}).label)}</span></span>
      <span class="pill">Take</span></button>`);
    b.onclick=()=>{
      G.you=c.id;c.ai=false;
      const nm=START_NAME.trim().replace(/[<>&"']/g,"").slice(0,22);
      if(nm)c.name=nm;
      G.speed=0;   // paused until they press play, after the intro
      logAdd(`${c.name} enters the world stage.`);
      resetUI();integrityGuard("start");saveGame(true);render();restartClock();
      showIntro(0);
    };
    s.appendChild(b);
  });
  const rg=$(`<button class="btn" style="width:100%;margin-top:10px">Generate a new world</button>`);
  rg.onclick=()=>{G=null;renderStart();};
  s.appendChild(rg);
  app.appendChild(s);
}

/* ================================================================
   BOOT
   ================================================================ */
if(loadGame()&&G.you!=null){integrityGuard("boot");render();restartClock();}
else{G=null;renderStart();}
addEventListener("pagehide",()=>{if(G&&G.you!=null)saveGame(true);});
document.addEventListener("visibilitychange",()=>{
  // the clock is a real clock, so stop burning battery in a background tab
  if(document.hidden){if(CLOCK){clearInterval(CLOCK);CLOCK=null;}if(G&&G.you!=null)saveGame(true);}
  else if(G&&G.you!=null)restartClock();
});
</script>
