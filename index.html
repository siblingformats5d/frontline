/* Ending a career is deliberately two taps and a summary, because deleting
   twenty seasons by accident is not a recoverable mistake. */
function confirmEndCareer(){
  const me = ME();
  const d = $("<div></div>");
  d.appendChild($('<h2 style="font-size:19px">End this career?</h2>'));
  d.appendChild($('<div class="small muted" style="margin:6px 0 12px">' + G.season +
    " seasons at " + esc(me.name) + ". This deletes the save and cannot be undone.</div>"));
  d.appendChild($('<div class="logline"><span class="muted">National titles</span><span>' + me.titles + "</span></div>"));
  if(me.cupBest) d.appendChild($('<div class="logline"><span class="muted">Best Director\u2019s Cup finish</span><span>' +
    ordinal(me.cupBest) + "</span></div>"));
  d.appendChild($('<div class="logline"><span class="muted">Conference</span><span>' +
    (me.conf != null ? esc((C(me.conf) || {}).name) : "Independent") + "</span></div>"));
  const bk = $('<button class="btn sec sm" style="width:100%;margin:12px 0 8px">Export a backup first</button>');
  bk.onclick = exportSave;
  d.appendChild(bk);
  const go = $('<button class="btn warn" style="width:100%">Delete it and start a new career</button>');
  go.onclick = () => {
    closeSheet();
    try{ localStorage.removeItem(SAVE_KEY) }catch(e){}
    G = null; START_POOL = null; START_WORLD = null;
    TAB = "office"; _lastTab = null;
    renderStart();
    toast("Career ended.");
  };
  d.appendChild(go);
  sheet(d);
}
/* ===========================================================================
   LEAGUE
   A browser, not a dashboard. You can open any of the twelve conferences and
   read its actual contract: how it splits money, what its television deal is
   worth, how many tournament units it is sitting on, how long its members are
   signed away for, and what it would cost each of them to leave. That is the
   information an athletic director is working from when he decides whether to
   answer somebody's call.
   =========================================================================== */
let LEAGUE_ID = null;
function viewLeague(w, me){
  const mine = me.conf != null ? C(me.conf) : null;
  if(LEAGUE_ID == null || !C(LEAGUE_ID)) LEAGUE_ID = mine ? mine.id : 0;
  const c = C(LEAGUE_ID);

  /* picker across all twelve, yours marked */
  const strip = $('<div class="tabgrid" style="grid-template-columns:repeat(3,minmax(0,1fr))"></div>');
  G.conferences.slice().sort((a,b) => a.stratum - b.stratum || confScore(b) - confScore(a))
    .forEach(x => {
      const b = $('<button class="btn sm ' + (x.id === LEAGUE_ID ? "" : "sec") + '">' +
        esc(x.name.split(" ")[0]) + (mine && x.id === mine.id ? " \u2605" : "") + "</button>");
      b.onclick = () => { LEAGUE_ID = x.id; render() };
      strip.appendChild(b);
    });
  w.appendChild(strip);

  if(!mine && LEAGUE_ID === (mine ? mine.id : -1)) return;

  const isMine = mine && c.id === mine.id;
  const p = confPillars(c);
  const head = $('<div class="card"></div>');
  head.appendChild($('<div class="row"><h2 style="font-size:18px">' + esc(c.name) + '</h2>' +
    '<span class="tag">' + STRATUM_NAME[c.stratum] + "</span></div>"));
  head.appendChild($('<div class="small muted" style="margin-top:5px">' + c.members.length +
    " members \u00B7 " + ordinal(confRankOn(c, "all")) + " of " + G.conferences.length +
    (isMine ? " \u00B7 this is your league" : "") + "</div>"));
  head.appendChild($('<div class="divider"></div>'));
  head.appendChild($('<div class="logline"><span class="muted">Television</span><span>' +
    (c.rightsDeal ? c.rightsDeal.name + ", " + money(confRevenue(c)) + "/yr" : "no deal") + "</span></div>"));
  if(c.rightsDeal) head.appendChild($('<div class="logline"><span class="muted">Years left on it</span><span>' +
    dealYearsLeft(c.rightsDeal) + "</span></div>"));
  head.appendChild($('<div class="logline"><span class="muted">Tournament units</span><span>' +
    unitCount(c) + " \u00B7 " + money(unitIncome(c)) + "/yr</span></div>"));
  head.appendChild($('<div class="logline"><span class="muted">Distribution</span><span>' +
    DIST_MODELS[c.model || "equal"].name + "</span></div>"));
  head.appendChild($('<div class="logline"><span class="muted">Grant of rights</span><span>' +
    ((c.gor || 0) > G.season ? "through season " + c.gor : "expired") + "</span></div>"));
  head.appendChild($('<div class="logline"><span class="muted">Exit fee</span><span>' +
    exitSchedule(c).toFixed(1) + "\u00D7 annual payout</span></div>"));
  if(c.alliance != null) head.appendChild($('<div class="logline"><span class="muted">Scheduling alliance</span><span>' +
    esc((C(c.alliance) || {}).name || "") + "</span></div>"));
  if(c.nineGame) head.appendChild($('<div class="logline"><span class="muted">Conference games</span><span>nine</span></div>'));
  head.appendChild($('<div class="small muted" style="margin-top:8px">' +
    DIST_MODELS[c.model || "equal"].note + "</div>"));
  w.appendChild(head);

  /* the room, with what each member takes home under this league's model */
  const mc = $('<div class="card"></div>');
  mc.appendChild($('<div class="grp-h">The room</div>'));
  const tbl = $('<table><thead><tr><th class="l">School</th><th class="l">Where</th><th>Takes home</th><th>Rank</th></tr></thead><tbody></tbody></table>');
  const body = tbl.querySelector("tbody");
  c.members.map(id => S(id)).filter(Boolean)
    .sort((a,b) => memberShareModel(b) - memberShareModel(a))
    .forEach(s => {
      const vest = vestFactor(c, s);
      const tr = $tr('<tr class="' + (s.id === me.id ? "me" : "") + '" style="cursor:pointer"><td class="l">' +
        esc(s.name) + (vest < 1 ? '<span class="pill">vesting</span>' : "") +
        '</td><td class="l muted">' + regionName(s.region) + "</td><td>" +
        money(memberShareModel(s)) + "</td><td>" + ordinal(schoolRankOn(s, "all")) + "</td></tr>");
      tr.onclick = () => openSchool(s.id);
      body.appendChild(tr);
    });
  mc.appendChild($('<div class="tscroll"></div>')).appendChild(tbl);
  w.appendChild(mc);

  const sc = $('<div class="card"></div>');
  sc.appendChild($('<div class="grp-h">Scorecard</div>'));
  PILLARS.forEach(x => sc.appendChild($('<div class="arow"><span class="al">' + x.name + '</span>' +
    '<span class="bar"><div style="width:' + p[x.key] + '%"></div></span>' +
    '<span class="av">' + ordinal(confRankOn(c, x.key)) + "</span></div>")));
  w.appendChild(sc);

  if(!isMine){
    const want = wantScore(c, me), need = inviteThreshold(c);
    const gap = want - need;
    const word = gap >= 8 ? "They would take you tomorrow" : gap >= 0 ? "You are on their list"
      : gap >= -12 ? "Close, but not yet" : gap >= -28 ? "A long way off" : "Not a conversation";
    const pc = $('<div class="card"></div>');
    pc.appendChild($('<div class="grp-h">How you look to them</div>'));
    pc.appendChild($('<div class="row"><span class="muted small">Standing with this league</span>' +
      '<span class="' + (gap >= 0 ? "res-w" : gap >= -12 ? "" : "muted") + '">' + word + "</span></div>"));
    pc.appendChild($('<div class="small muted" style="margin-top:8px">A league shops for what it is short of, not for the best school available. If it already reaches your market you are worth far less to it than a worse school somewhere it has nobody.</div>'));
    w.appendChild(pc);
  }
}

let MAP_MODE = "mine";
function natMap(w, me){
  const mine = me.conf != null ? C(me.conf) : null;
  const modes = [["mine","Your league"],["all","Everyone"],["reach","Media reach"],["pick","All leagues"]];
  const strip = $('<div class="tabgrid" style="grid-template-columns:repeat(4,minmax(0,1fr))"></div>');
  modes.forEach(([k, lab]) => {
    const b = $('<button class="btn sm ' + (MAP_MODE === k ? "" : "sec") + '">' + lab + "</button>");
    b.onclick = () => { MAP_MODE = k; render() };
    strip.appendChild(b);
  });
  w.appendChild(strip);

  if(MAP_MODE === "pick"){
    const cs = $('<div class="tabgrid" style="grid-template-columns:repeat(3,minmax(0,1fr))"></div>');
    G.conferences.slice().sort((a,b) => a.stratum - b.stratum).forEach(x => {
      const b = $('<button class="btn sm ' + (LEAGUE_ID === x.id ? "" : "sec") + '">' +
        esc(x.name.split(" ")[0]) + "</button>");
      b.onclick = () => { LEAGUE_ID = x.id; render() };
      cs.appendChild(b);
    });
    w.appendChild(cs);
  }
  const focus = MAP_MODE === "pick" ? C(LEAGUE_ID) : mine;

  const c = $('<div class="card"></div>');
  /* Population underneath, so the map explains why a campus is worth what it is. */
  const metros = METROS.map(([nm, x, y, pop]) =>
    '<circle cx="' + x + '" cy="' + y + '" r="' + (pop * (MAP_MODE === "reach" ? 0.9 : 0.55)) +
    '" fill="rgba(120,150,220,' + (MAP_MODE === "reach" ? ".22" : ".10") + ')"/>').join("");
  const labels = MAP_MODE === "reach" ? METROS.filter(m => m[3] >= 7).map(([nm, x, y]) =>
    '<text x="' + x + '" y="' + (y - 5.5) + '" text-anchor="middle" font-size="2.6" ' +
    'fill="#8b94a6" font-family="Open Sans,sans-serif">' + esc(nm) + "</text>").join("") : "";
  /* Lines from each member of the league in focus to its center of gravity, so
     the footprint of a conference reads as a shape rather than a list. */
  let web = "";
  if(focus && MAP_MODE !== "reach"){
    const ms = focus.members.map(id => S(id)).filter(Boolean);
    if(ms.length){
      const cx = avg(ms.map(x => x.x)), cy = avg(ms.map(x => x.y));
      web = ms.map(x => '<line x1="' + cx + '" y1="' + cy + '" x2="' + x.x + '" y2="' + x.y +
        '" stroke="rgba(224,175,82,.22)" stroke-width="0.35"/>').join("");
    }
  }
  const dots = G.schools.map(s => {
    const isMe = s.id === me.id;
    const inFocus = focus && s.conf === focus.id;
    const r = isMe ? 2.6 : inFocus ? 1.8 : MAP_MODE === "all" ? 1.3 : 0.9;
    const col = isMe ? "#ffd88f" : inFocus ? "#e0af52" : MAP_MODE === "all" ? "#5a6780" : "#333c4e";
    return '<circle data-id="' + s.id + '" cx="' + s.x + '" cy="' + s.y + '" r="' + r +
      '" fill="' + col + '" style="cursor:pointer"><title>' + esc(s.name) + "</title></circle>";
  }).join("");
  const svg = $('<svg viewBox="0 0 ' + MAP_W + " " + MAP_H + '" width="100%" ' +
    'style="display:block;border-radius:10px;background:#0d1119">' + metros + labels + web + dots + "</svg>");
  /* Every dot opens the school. The map is a way into the country, not a picture. */
  svg.querySelectorAll("circle[data-id]").forEach(n => {
    n.onclick = () => openSchool(+n.getAttribute("data-id"));
  });
  c.appendChild(svg);
  c.appendChild($('<div class="small muted" style="margin-top:9px">Tap any school to open it.' +
    (focus ? " Gold is the " + esc(focus.name) + "." : "") +
    " The faint circles are population, which is the one number on your sheet you can never raise.</div>"));
  w.appendChild(c);

  const near = nearestMetro(me.x, me.y);
  const info = $('<div class="card"></div>');
  info.appendChild($('<div class="grp-h">Your campus</div>'));
  info.appendChild($('<div class="logline"><span class="muted">Market</span><span>' +
    marketWord(pillarsOf(me).med) + "</span></div>"));
  info.appendChild($('<div class="logline"><span class="muted">Nearest metro</span><span>' + esc(near.name) +
    ", " + (near.d < 8 ? "close" : near.d < 18 ? "an hour or so" : "a long way") + "</span></div>"));
  info.appendChild($('<div class="logline"><span class="muted">Media reach</span><span>' +
    ordinal(schoolRankOn(me, "med")) + " of " + G.schools.length + "</span></div>"));
  if(focus){
    const ms = focus.members.map(id => S(id)).filter(Boolean);
    const spread = avg(ms.filter(x => x.id !== me.id).map(x => dist(me.x, me.y, x.x, x.y)));
    info.appendChild($('<div class="logline"><span class="muted">' + esc(focus.name) + " footprint</span><span>" +
      Math.round(spread) + " units average, " + money(travelSeason(me)) + " of travel</span></div>"));
  }
  w.appendChild(info);
}

    h.onclick = () => {
      if(me.coaches[c.sport]){ toast("That chair is not empty."); return }
      const r = hireCoach(c, 4);
      if(!r.ok) return toast(r.why);
      toast(c.name + " is your new " + SPORT_SHORT[c.sport].toLowerCase() + " coach.");

    };
    v.onclick = () => openCoach(c);
    rr.appendChild(h); rr.appendChild(v);

    d.appendChild(row);
  });
  sheet(d);
}

/* ---- backup --------------------------------------------------------------- */
function exportSave(){
  try{
    const blob = new Blob([JSON.stringify(stripRuntime(G))], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ad-empire-s" + G.season + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Backup downloaded.");
  }catch(e){ toast("Your browser blocked the download.") }
}
function doImport(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const g = JSON.parse(r.result);
        if(!g || !g.schools || g.schoolId == null) return toast("That is not an AD Empire save.");
        G = g; hydrate(); saveGame(); TAB = "office"; render();
        toast("Save loaded.");
      }catch(e){ toast("That file would not open.") }
    };
    r.readAsText(f);
  };
  inp.click();
}

      '<div class="small muted">' + esc(o.blurb) + '</div></div><span class="tag">' + o.tier + "</span></div>");
    row.onclick = () => {
      START_NAME = nm.value || "Director";
      startCareer(o);
    };
    list.appendChild(row);
  });
  s.appendChild(list);
  const re = $('<button class="btn sec sm" style="width:100%;margin-top:10px">Show me different schools</button>');
  re.onclick = () => { START_POOL = null; renderStart() };
  s.appendChild(re);
  app.appendChild(s);
}
let START_POOL = null, START_WORLD = null;
/* The world is generated first and the six offers are drawn out of it, so what
   you are shown on the start screen is the school you actually get. */
function rollStartPool(){
  genWorld("Director");
  START_WORLD = G;
  const ranked = G.schools.slice().sort((a,b) => schoolScore(a) - schoolScore(b));
  const bands = [
    ["Bottom of the country", 0, 0.16],
    ["Struggling", 0.16, 0.34],
    ["Middling", 0.36, 0.54],
    ["Well thought of", 0.58, 0.74],
    ["A real program", 0.78, 0.90],
    ["A blueblood", 0.93, 1.0]
  ];
  START_POOL = bands.map(([tier, lo, hi]) => {
    const slice = ranked.slice(Math.floor(ranked.length*lo), Math.max(1, Math.floor(ranked.length*hi)));
    const s = pick(slice.length ? slice : ranked);
    const c = s.conf != null ? C(s.conf) : null;
    return { id:s.id, name:s.name, mascot:s.mascot, tier,
      blurb: (c ? c.name : "Independent") + " \u00B7 " + s.programs.length + " sports \u00B7 " +
             marketWord(pMed(s)).toLowerCase() };
  });
}
function startCareer(o){
  G = START_WORLD;
  G.owner = START_NAME || "Director";
  G.schoolId = o.id;
  const s = ME();
  /* You start with a working balance rather than nothing, because the first
     screen after a new career should be a decision, not a wait. */
  s.budget = Math.round(IN(clamp(revenueSeason(s) * 0.22, 8e6, 90e6)));
  s.presidentPatience = 66;
  s.rs = s.rs || {}; s.restricted = {}; s.named = {}; s.clout = 0;
  s.rsIn = revenueSeason(s) > rsCap() * 3.4;
  if(s.rsIn) s.rs = rsAutoSplit(s);
  seedDonors(s);
  G.agenda = newAgenda();
  G.audit = { start: s.budget, weekly:0, settle:0 };
  ncInit();
  G._dirty = true;
  buildSchedule();
  G.seasonBook = null;
  TAB = "office";
  saveGame();
  render();
  toast("Welcome to " + s.name + ".");
}

/* Leaving the page is a clock move too. */
function wireLifecycle(){
  const flush = () => { try{ if(G && G.schoolId != null) saveGame() }catch(e){} };
  const on2 = (t, ev, fn) => { if(t && typeof t.addEventListener === "function") t.addEventListener(ev, fn) };
  on2(typeof document !== "undefined" ? document : null, "visibilitychange",
    () => { if(document.visibilityState === "hidden") flush() });
  on2(typeof window !== "undefined" ? window : null, "pagehide", flush);
  on2(typeof window !== "undefined" ? window : null, "beforeunload", e => {
    flush();
    if(G && G.saveError && e){ if(e.preventDefault) e.preventDefault(); e.returnValue = "" }
  });
}
function boot(){
  try{
    if(loadGame()){ TAB = "office"; render(); return }
  }catch(e){}
  renderStart();
}
if(typeof window !== "undefined" && typeof document !== "undefined"){ wireLifecycle(); boot() }
