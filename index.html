  s.presidentPatience = clamp(s.presidentPatience + d, 0, 100);
  const p = s.presidentPatience;
  const line = p >= 82 ? "The president would give you anything you asked for."
    : p >= 62 ? "The president is pleased. Keep going."
    : p >= 42 ? "The president wants to see progress next year."
    : p >= 24 ? "The president has started taking other calls."
    : "The board has asked for a review of the department.";
  return { d, line, p };
}
function goalFor(){
  const s = ME(), c = s.conf != null ? C(s.conf) : null;
  const r = G.cupMine ? G.cupMine.rank : 100;
  if(!c) return { text:"Get this department into a conference.", key:"conf", target:0 };
  if(r > 60) return { text:"Finish inside the top sixty of the Director's Cup.", key:"cup", target:60 };
  if(r > 30) return { text:"Finish inside the top thirty of the Director's Cup.", key:"cup", target:30 };
  if(c.stratum > 0) return { text:"Get this department into a bigger conference.", key:"climb", target:0 };
  return { text:"Win a national title in something.", key:"title", target:1 };
}
/* Where the goal stands RIGHT NOW, so it is a bar that moves every week rather
   than a sentence you read once in the offseason. */
function goalProgress(){
  const s = ME(), g = (G.osData && G.osData.goal) || goalFor();
  if(g.key === "cup"){
    /* Rank the country on this season's cup points as they stand today. */
    const table = G.schools.map(x => ({ id:x.id, p: cupPointsLive(x) })).sort((a,b) => b.p - a.p);
    const at = table.findIndex(x => x.id === s.id) + 1;
    return { text:g.text, now:"You are " + ordinal(at) + " on current form",
      pct: clamp(1 - (at - g.target) / Math.max(1, G.schools.length - g.target), 0, 1), hit: at <= g.target };
  }
  if(g.key === "title"){
    const n = s.programs.filter(p => p.poll > 0 && p.poll <= 4).length;
    return { text:g.text, now: n ? n + " program" + (n>1?"s":"") + " in the national top four" : "Nothing close yet",
      pct: clamp(n / 2, 0, 1), hit: n > 0 };
  }
  if(g.key === "climb"){
    const best = G.conferences.filter(x => x.stratum < ((MYC()||{stratum:3}).stratum))
      .map(x => wantScore(x, s) - inviteThreshold(x)).sort((a,b) => b - a)[0];
    return { text:g.text, now: best == null ? "No league above you" :
      best >= 0 ? "You are on somebody's list" : "Short by a distance",
      pct: clamp((best + 30) / 40, 0, 1), hit: best != null && best >= 0 };
  }
  return { text:g.text, now:"", pct:0, hit:false };
}
/* Cup points on the season so far, using the same shape as the final table. */
function cupPointsLive(s){
  let t = 0;
  s.programs.forEach(p => {
    const k = REVENUE.includes(p.sport) ? 1.5 : 1;
    const g = p.rec.W + p.rec.L;
    let v = g ? (p.rec.W / g) * 34 : 0;
    if(p.poll) v += (26 - p.poll) * 1.4;
    t += v * k;
  });
  return Math.round(t);
}

/* What deferring the upkeep does. Runs on your department as well as everyone
   else's, because a lever with no downside is not a lever. */
function decayTick(s){
  BKEYS.forEach(k => {
    const lv = s.bld[k] || 0;
    if(lv <= 0) return;
    const m = MAINT[(s.maint || {})[k] == null ? 1 : s.maint[k]];
    if(Math.random() < m.decay * lv * 0.5){
      s.bld[k] = lv - 1;
      if(s.id === G.schoolId)
        G.news.unshift("Deferred maintenance caught up with the " + BLD[k].name.toLowerCase() + ".");
    }
  });
}
function developTick(){
  G.schools.forEach(s => {
    const strengthCoach = 1 + (s.staff.str || 0) * 0.16;
    s.programs.forEach(p => {
      const c = s.coaches[p.sport];
      const home = (s.bld[SPORT_HOME[p.sport]] || 0) * 20;
      const gap = (p.pot - p.ovr);
      let move = gap * 0.14 * strengthCoach;
      move += ((c ? c.dev : 30) - 50) * 0.038;
      move += (home - 50) * 0.030;
      move += ((s.bld.perf||0)*20 - 50) * 0.034;
      move += (p.cls - 50) * 0.058;
      move += (s.nil - 40) * 0.021;
      move += ((s.bld.acad||0)*20 + s.aca)/2 > 55 ? 0.4 : -0.5;
      p.ovr = clamp(p.ovr + move + rnd(-1.4, 1.4), 8, 99);
      /* Ceilings move too, slowly, toward what the department has become. */
      const target = (pillarsOf(s).pre * 0.42 + facScore(s) * 0.34 + pMed(s) * 0.24);
      p.pot = clamp(p.pot + clamp((target - p.pot) * 0.07, -2.2, 2.6), 20, 99);
      if(p.pot < p.ovr) p.pot = p.ovr;
      p.hurt = 0;
    });
  });
}

/* ---- recruiting -----------------------------------------------------------
   The central dial. One pot, eight claims on it, and every one of them is
   somebody's season. Spread it evenly and nothing gets good; pour it into
   football and the other seven slide, and the Director's Cup counts all eight.
   -------------------------------------------------------------------------- */
function recruitPool(s){
  /* What you are able to put into recruiting at all, before you decide how to
     split it. Scales with revenue, so a mid-major genuinely cannot outspend a
     power and has to out-coach it instead. */
  return Math.round(clamp(revenueSeason(s) * 0.09, IN(1.2e6), IN(46e6)));
}
function classFor(s, sp, spend, pool){
  const c = s.coaches[sp];
  const share = pool > 0 ? spend / pool : 0;
  const money = clamp(share * s.programs.length, 0, 2.6);
  const p = pillarsOf(s);
  const conf = s.conf != null ? (3 - ((C(s.conf) || { stratum:2 }).stratum)) : 0.5;
  const v = 14
    + (c ? (c.rec - 50) : -18) * 0.30
    + p.pre * 0.24
    + p.fac * 0.16
    + p.med * 0.09
    + s.nil * 0.20
    + rsEffect(s, sp) * 7.5
    + conf * 4.6
    + (s.staff.rec || 0) * 2.7
    + money * 11
    + (s.apparel ? APPAREL[s.apparel.tier].rec : 0)
    + rnd(-5, 5);
  return clamp(Math.round(v), 6, 99);
}
function classStars(v){ return v>=86?5:v>=72?4:v>=56?3:v>=38?2:1 }
function autoRecruit(s){
  const pool = recruitPool(s);
  const wts = s.programs.map(p => REVENUE.includes(p.sport) ? 3.2 : 1);
  const t = sum(wts);
  s.programs.forEach((p, i) => { p.cls = classFor(s, p.sport, pool * wts[i]/t, pool) });
}

/* ---- sponsoring a sport ---------------------------------------------------
   The Director's Cup counts every program you field, so the fastest way up the
   table is a sport you do not have yet. It is also the most expensive decision
   on the desk: the startup check is one-time and the scholarships, travel and
   coach are forever. A department can grow itself broke doing this.
   -------------------------------------------------------------------------- */
function addableSports(s){ return SPORTS.filter(sp => !progOf(s, sp)) }
/* The economics of sponsoring each sport, so the decision is made on numbers
   rather than vibes. Football is its own category: it costs several times what
   anything else does, it is the only sport that fills a stadium, and it is
   what a television partner is actually buying. A league will take a school
   without basketball. It will not take one without football. */
function sportEcon(s, sp){
  const has = !!progOf(s, sp);
  const schol = sp === "FB" ? 7.4e6 : REVENUE.includes(sp) ? 2.1e6 : 1.15e6;
  const keep = Math.round(IN(schol) + IN(1.05e6));
  const coach = Math.round(IN(coachAsk({ sport:sp, rec:58, dev:58, gd:58 })));
  /* Gate is football in the stadium and the winter sports in the arena. */
  const gate = sp === "FB" ? Math.round(6 * seatCap(s,"stad") * fillRate(s) * s.ticket * 1.34)
    : (sp === "MBB" || sp === "WBB" || sp === "VB")
      ? Math.round((sp === "MBB" ? 14 : sp === "WBB" ? 12 : 10) * seatCap(s,"arena") * fillRate(s) * s.ticket * 0.46 * 1.34)
      : 0;
  const tv = sp === "FB" ? "Drives the league's television deal"
    : sp === "MBB" ? "Second most valuable, and it earns tournament units"
    : sp === "WBB" ? "Earns tournament units"
    : "No television value on its own";
  return { has, keep, coach, gate:Math.round(IN(gate)), tv,
           cup: REVENUE.includes(sp) ? "Counts 1.5x in the Director's Cup" : "Counts once in the Director's Cup",
           start: addSportCost(sp) };
}
function addSportCost(sp){ return IN(sp === "FB" ? 68e6 : sp === "MBB" ? 28e6 : sp === "WBB" ? 22e6 : 15e6) }
function addSportKeep(sp){ return Math.round(IN(sp === "FB" ? 7.4e6 : REVENUE.includes(sp) ? 2.1e6 : 1.15e6) + IN(1.05e6)) }
function addSport(sp){
  const s = ME();
  if(progOf(s, sp)) return { ok:false, why:"You already sponsor it." };
  const home = SPORT_HOME[sp];
  if((s.bld[home] || 0) < 1) return { ok:false, why:"You need a " + BLD[home].name.toLowerCase() + " before you can field it." };
  const cost = addSportCost(sp);
  if(s.budget < cost) return { ok:false, why:"Starting that program costs " + money(cost) + "." };
  s.budget -= cost;
  const band = clamp(pillarsOf(s).pre * 0.45 + facScore(s) * 0.30, 12, 62);
  const p = newProgram(sp, band - 12);
  p.cls = clamp(Math.round(band - 10), 8, 90);
  s.programs.push(p);
  s.programs.sort((a,b) => SPORTS.indexOf(a.sport) - SPORTS.indexOf(b.sport));
  s.coaches[sp] = hireFresh(sp, band - 6, s);
  G._dirty = true;
  touchPillars();
  return { ok:true, cost };
}
function dropSport(sp){
  const s = ME();
  if(!progOf(s, sp)) return { ok:false, why:"You do not sponsor it." };
  if(s.programs.length <= 3) return { ok:false, why:"Three programs is the minimum to stay Division I." };
  s.programs = s.programs.filter(p => p.sport !== sp);
  delete s.coaches[sp];
  s.pre = clamp(s.pre - 2.5, 0, 100);
  s.presidentPatience = clamp(s.presidentPatience - 6, 0, 100);
  G._dirty = true;
  touchPillars();
  return { ok:true };
}

/* ---- the carousel ---------------------------------------------------------
   Winning makes your staff worth stealing, which is the brake on a runaway
   department. Every good season is a season somebody tries to take a coach off
   you, and keeping him costs money you wanted to spend on a building.
   -------------------------------------------------------------------------- */
function coachValue(c){ return coachOvr(c) * 0.72 + c.rings * 6 + c.confTitles * 2 + clamp(60 - c.age, 0, 20) * 0.5 }
function jobScore(s, sp, pay){
  const p = pillarsOf(s);
  const m = clamp(pay / Math.max(1, IN(2.6e6)), 0, 3.4);
  const conf = s.conf != null ? (3 - ((C(s.conf) || { stratum:2 }).stratum)) * 5 : 0;
  return p.pre*0.30 + p.fac*0.26 + p.ath*0.15 + p.aca*0.08 + p.med*0.15 + m*9 + conf;
}
function refillCoachPool(){
  while(G.coachPool.length < 34){
    const sp = pick(SPORTS);
    const c = newCoach(sp, ri(20, 82));
    c.pay = coachAsk(c);
    G.coachPool.push(c);
  }
  if(G.coachPool.length > 70) G.coachPool.splice(0, G.coachPool.length - 70);
}
function coachAge(){
  G.schools.forEach(s => SPORTS.forEach(sp => {
    const c = s.coaches[sp]; if(!c) return;
    c.age++;
    /* Improvement toward potential while young, decline once the game passes
       them. Same shape as a player career, one season at a time. */
    const room = c.pot - coachOvr(c);
    const k = c.age < 44 ? 0.34 : c.age < 52 ? 0.18 : -0.22;
    const d = room > 0 ? room * Math.max(k, 0) * 0.5 + (k < 0 ? k*3 : 0) : (k < 0 ? k*3 : 0);
    ["rec","dev","gd"].forEach(a => c[a] = clamp(Math.round(c[a] + d/3 + rnd(-1.1,1.1)), 8, 99));
    c.pot = Math.max(c.pot, coachOvr(c));
    if(c.years > 0) c.years--;
  }));
  G.coachPool.forEach(c => { c.age++; if(c.age > 68) c._gone = true });
  G.coachPool = G.coachPool.filter(c => !c._gone);
}
/* Everyone except you. Retirements, firings, and the hiring cascade that
   follows, best jobs choosing first. */
function aiCarousel(){
  const meId = G.schoolId;
  const free = [];
  G.schools.forEach(s => {
    if(s.id === meId) return;
    s.programs.forEach(p => {
      const c = s.coaches[p.sport]; if(!c) return;
      const g = c.wins + c.losses;
      const wp = g ? c.wins / g : 0.5;
      const retire = c.age >= 66 || (c.age >= 61 && Math.random() < 0.3);
      const fired = g > 18 && wp < 0.33 && Math.random() < 0.55;
      const lapsed = c.years <= 0 && Math.random() < 0.35;
      if(retire){ delete s.coaches[p.sport]; return }
      if(fired || lapsed){ delete s.coaches[p.sport]; free.push(c) }
    });
  });
  const jobs = [];
  G.schools.forEach(s => s.programs.forEach(p => {
    if(!s.coaches[p.sport]) jobs.push({ s, sp:p.sport, fund: coachFund(s, p.sport) });
  }));
  const market = free.concat(G.coachPool).sort((a,b) => coachValue(b) - coachValue(a));
  const taken = new Set();
  market.forEach(c => {
    const open = jobs.filter(j => !taken.has(j.s.id+":"+j.sp) && j.sp === c.sport && j.s.id !== meId);
    if(!open.length) return;
    const ask = coachAsk(c);
    const can = open.filter(j => j.fund >= IN(ask));
    if(!can.length) return;
    can.forEach(j => j._sc = jobScore(j.s, j.sp, j.fund));
    can.sort((a,b) => b._sc - a._sc);
    const j = can[0];
    c.pay = ask; c.since = G.season; c.years = ri(3,6); c.wins = 0; c.losses = 0; c.morale = ri(62,84);
    j.s.coaches[c.sport] = c;
    taken.add(j.s.id+":"+j.sp);
    G.coachPool = G.coachPool.filter(x => x.id !== c.id);
  });
  jobs.filter(j => !j.s.coaches[j.sp] && j.s.id !== meId).forEach(j => {
    const c = newCoach(j.sp, clamp(j.fund / IN(0.9e6) * 8, 10, 52));
    c.pay = coachAsk(c); c.since = G.season; c.years = ri(3,5);
    j.s.coaches[j.sp] = c;
  });
  refillCoachPool();
}
/* What a school can put on the table for one chair. */
function coachFund(s, sp){
  const mul = sp === "FB" ? 0.42 : sp === "MBB" ? 0.24 : sp === "WBB" ? 0.11 : 0.05;
  return Math.round(revenueSeason(s) * 0.30 * mul * 3.2);
}
/* Who is coming for your people. Returns the offers you have to answer. */
function poachOffers(){
  const me = ME(), out = [];
  me.programs.forEach(p => {
    const c = me.coaches[p.sport]; if(!c) return;
    const v = coachValue(c);
    if(v < 52) return;
    const suitors = G.schools.filter(s => s.id !== me.id && progOf(s, p.sport))
      .filter(s => coachFund(s, p.sport) > IN(c.pay) * 1.15)
      .map(s => ({ s, sc: jobScore(s, p.sport, coachFund(s, p.sport)) }))
      .sort((a,b) => b.sc - a.sc);
    if(!suitors.length) return;
    const best = suitors[0];
    const here = jobScore(me, p.sport, IN(c.pay));
    const pull = (best.sc - here) + (100 - c.morale) * 0.22 + rnd(-9, 9);
    if(pull < 6) return;
    const offer = Math.round(coachAsk(c) * rnd(1.18, 1.55));
    out.push({ sp:p.sport, coachId:c.id, from:best.s.id, offer, pull:Math.round(pull) });
  });
  return out;
}
function keepCoach(o){
  const me = ME(), c = me.coaches[o.sp];
  if(!c) return { ok:false, why:"That coach is already gone." };
  const cost = Math.round(IN(o.offer) * rnd(1.0, 1.14));
  if(me.budget < cost) return { ok:false, why:"You cannot cover that." };
  me.budget -= Math.round(cost * 0.35);   // the raise is annualised into pay
  c.pay = Math.round(o.offer * 1.02);
  c.years = Math.max(c.years, 4);
  c.morale = clamp(c.morale + 14, 0, 100);
  return { ok:true, pay:c.pay };
}
function letCoachGo(o){
  const me = ME(), c = me.coaches[o.sp];
  if(!c) return;
  delete me.coaches[o.sp];
  const to = S(o.from);
  if(to){ c.pay = o.offer; c.since = G.season; c.years = ri(4,6); c.wins=0; c.losses=0; to.coaches[o.sp] = c }
  G.news.unshift(c.name + " left for " + (to ? to.name : "somewhere else") + ".");
}
function fireCoach(sp){
  const me = ME(), c = me.coaches[sp];
  if(!c) return { ok:false, why:"That chair is already empty." };
  /* You are paying the guarantee you wrote when you hired him. */
  const buyout = buyoutFor(c);
  if(me.budget < buyout) return { ok:false, why:"The buyout is " + money(buyout) + " and you do not have it." };
  me.budget -= buyout;
  delete me.coaches[sp];
  me.programs.forEach(p => { if(p.sport === sp) p.ovr = clamp(p.ovr - 1.5, 5, 99) });
  return { ok:true, buyout };
}
function hireCoach(c, years){
  const me = ME();
  const ask = coachAsk(c);
  if(coachFund(me, c.sport) < IN(ask)) return { ok:false, why:"This job does not pay enough to interest that coach." };
  const sc = jobScore(me, c.sport, IN(ask));
  if(sc < coachValue(c) * 0.68) return { ok:false, why:"Turned down. This is not the job for that coach yet." };
  const signing = Math.round(IN(ask) * 0.4);
  if(me.budget < signing) return { ok:false, why:"You cannot cover the signing costs." };
  me.budget -= signing;
  c.pay = ask; c.years = years; c.since = G.season; c.wins = 0; c.losses = 0; c.morale = ri(66, 88);
  me.coaches[c.sport] = c;
  G.coachPool = G.coachPool.filter(x => x.id !== c.id);
  return { ok:true, cost:signing };
}
function extendCoach(sp, years){
  const me = ME(), c = me.coaches[sp];
  if(!c) return { ok:false, why:"That chair is empty." };
  const ask = coachAsk(c);
  const cost = Math.round(IN(ask) * years * 0.22);
  if(me.budget < cost) return { ok:false, why:"That extension costs " + money(cost) + "." };
  me.budget -= cost;
  c.pay = Math.max(c.pay, ask);
  c.years += years;
  c.morale = clamp(c.morale + 9, 0, 100);
  return { ok:true, cost };
}
function moraleTick(){
  const me = ME();
  me.programs.forEach(p => {
    const c = me.coaches[p.sport]; if(!c) return;
    const g = p.rec.W + p.rec.L;
    const wp = g ? p.rec.W / g : 0.5;
    let d = (wp - 0.5) * 20;
    d += IN(c.pay) < coachAsk(c) * 0.85 ? -9 : IN(c.pay) > coachAsk(c) * 1.2 ? 5 : 0;
    d += ((me.bld[SPORT_HOME[p.sport]]||0) + (me.bld.perf||0)) * 1.1 - 5;
    d += c.years <= 1 ? -7 : 0;
    c.morale = clamp(c.morale + d + rnd(-4,4), 0, 100);
  });
}

/* ===========================================================================
   THE SEARCH
   Hiring a coach is the single thing an athletic director is actually judged
   on, and it is not a list with a Hire button on it. It is a process:

     you have a vacancy
     you decide whether to run it yourself or pay a firm to run it
     the firm's value is INFORMATION, not candidates
     everyone worth having is already employed, and has a buyout
     everyone worth having has an agent, and the agent has other calls
     you make an offer with three terms, not one
     and the guarantee you write today is the check you write when you fire him

   The three offer terms pull against each other on purpose. Money buys yes.
   Years buy yes. Guaranteed money buys yes hardest of all, and it is the one
   that comes back for you in three seasons when it has not worked.
   =========================================================================== */

const FIRM_FEE = 0.9e6;          // what a national search firm costs to retain
const SEARCH_ROUNDS = 3;         // offers you get before the cycle moves on

/* How much of a coach you can actually see. A coach you have not looked into is
   a record and a reputation; the firm's database is what turns him into three
   attributes and an honest read on why he left his last job. */
function scoutLevel(c){ return c._scout || 0 }
function attrBand(c, k){
  const v = c[k], lv = scoutLevel(c);
  if(lv >= 2) return attrWordFor(v);
  if(lv === 1){
    /* one look: a range, honest but wide */
    const lo = attrWordFor(clamp(v - 9, 0, 100)), hi = attrWordFor(clamp(v + 9, 0, 100));
    return lo === hi ? lo : lo + " to " + hi;
  }
  return "Not looked at";
}
function attrWordFor(v){
  return v>=88?"exceptional":v>=76?"very strong":v>=64?"strong":v>=52?"decent":v>=40?"weak":"poor";
}

/* ---- what a contract actually says ---------------------------------------
   Salary, term, and the share of the remaining term that is guaranteed if you
   fire him. Real deals run from barely guaranteed to fully guaranteed, and the
   difference is exactly how badly the school wanted him. -------------------- */
function buyoutFor(c){
  const yrs = Math.max(0, c.years || 0);
  return Math.round(IN(c.pay) * yrs * (c.gtee != null ? c.gtee : 0.6));
}
/* What the coach's current school would charge you to take him early. */
function releaseFee(c){ return Math.round(buyoutFor(c) * 0.55) }

/* How attractive an offer is to a specific coach, in the same units as the
   job itself, so the two are directly comparable. */
/* Money has to keep mattering. Both terms used to be CLAMPED, so anything above
   about nine million a year was worth exactly the same as nine million: a
   director could offer sixty-seven million and get the identical verdict, which
   is what turned this screen into an infinite haggle. Salary now runs on a log
   curve, so it keeps buying appeal for ever while each extra million buys less
   than the last. */
function offerAppeal(s, sp, offer){
  const ref = Math.max(1, IN(coachAsk({ sport:sp, rec:60, dev:60, gd:60 })));
  const rel = Math.max(0.15, IN(offer.salary) / ref);
  return jobScore(s, sp, IN(offer.salary))
       + Math.log(rel) * 15
       + (offer.years - 4) * 2.2
       + (offer.gtee - 0.6) * 26;
}
/* Does this offer meet the number the agent came back with? A counter is a
   promise: match it on all three terms and it is done. */
function meetsCounter(cand, offer){
  const w = cand.counter;
  if(!w) return false;
  return offer.salary >= Math.round(w.salary * 0.995)
      && offer.years >= w.years
      && offer.gtee >= w.gtee - 0.0001;
}
/* What this coach is worth on the open market, which is what he thinks he is
   worth, plus what his agent has told him. */
function marketPrice(c){ return Math.round(coachAsk(c) * (1 + (c._agent || 0) * 0.09)) }

/* ---- opening a search ----------------------------------------------------- */
function canSearch(sp){
  const me = ME();
  return progOf(me, sp) && !me.coaches[sp];
}
function startSearch(sp, useFirm){
  const me = ME();
  if(me.coaches[sp]) return { ok:false, why:"That chair is not empty." };
  const fee = useFirm ? IN(FIRM_FEE) : 0;
  if(me.budget < fee) return { ok:false, why:"Retaining a firm costs " + money(fee) + "." };
  me.budget -= fee;

  /* The pool. Free agents, plus sitting head coaches at other schools who are
     genuinely gettable. A firm gets you into the second group properly. */
  const free = G.coachPool.filter(c => c.sport === sp);
  const sitting = G.schools.filter(x => x.id !== me.id && x.coaches[sp])
    .map(x => ({ c: x.coaches[sp], at: x.id }))
    .filter(x => coachValue(x.c) > 40);
  const n = useFirm ? 8 : 4;
  const cands = [];
  /* Gettable means the job compares well against what the coach is walking away
     from. Sorting purely by quality produces a board of people who will never
     take the call, so the pool is built as a mix: the best coaches who would
     plausibly say yes, then a couple of reaches. */
  const here = j => jobScore(me, sp, IN(coachFund(me, sp)));
  const reachable = c => (coachValue(c) * 0.55) < here() + 6;
  free.sort((a,b) => (reachable(b) - reachable(a)) || (coachValue(b) - coachValue(a)));
  sitting.sort((a,b) => coachValue(b.c) - coachValue(a.c));
  /* An in-house search reaches the people who call you. A firm reaches the
     people who would never return the call themselves. */
  const takeSit = useFirm ? 5 : 1;
  sitting.slice(0, takeSit * 3).sort(() => Math.random() - 0.5).slice(0, takeSit)
    .forEach(x => cands.push({ id:x.c.id, at:x.at }));
  free.slice(0, n - cands.length).forEach(c => cands.push({ id:c.id, at:null }));

  cands.forEach(x => {
    const c = findCoach(x.id);
    if(!c) return;
    c._scout = useFirm ? 2 : 1;
    c._agent = c._agent != null ? c._agent : ri(0, 3);
    x.release = x.at != null ? releaseFee(c) : 0;
    x.asking = marketPrice(c);
    x.status = "open";
  });
  G.search = { sport:sp, firm:!!useFirm, cands, round:0, fee, hired:null, log:[] };
  return { ok:true, fee };
}
function findCoach(id){
  if(!id) return null;
  for(const c of G.coachPool){ if(c.id === id) return c }
  for(const s of G.schools){ for(const k in s.coaches){ if(s.coaches[k] && s.coaches[k].id === id) return s.coaches[k] } }
  return null;
}
/* A second look at one candidate. Cheap, and it is the difference between
   hiring a reputation and hiring a coach. */
function digIn(cand){
  const me = ME(), c = findCoach(cand.id);
  if(!c) return { ok:false, why:"That candidate is off the board." };
  if(scoutLevel(c) >= 2) return { ok:false, why:"You have already had this one worked up." };
  const cost = IN(140e3);
  if(me.budget < cost) return { ok:false, why:"That costs " + money(cost) + "." };
  me.budget -= cost;
  c._scout = 2;
  return { ok:true, cost };
}
/* ---- the offer ------------------------------------------------------------ */
function offerVerdict(cand, offer){
  const me = ME(), c = findCoach(cand.id);
  if(!c) return { k:"gone" };
  const sp = G.search.sport;
  const appeal = offerAppeal(me, sp, offer);
  /* What they are weighing you against: the job they already have, or the best
     one they expect to be offered if they do not have one. */
  const here = cand.at != null ? jobScore(S(cand.at), sp, IN(c.pay)) + 8 : coachValue(c) * 0.55;
  const need = here + (c._agent || 0) * 2.4;
  const gap = appeal - need;

  /* A counter is a commitment. Match it on all three terms and the deal is done.
     Previously the agent could come back with a number, get exactly that number,
     and counter it again with a fresh escalation, for ever. */
  if(meetsCounter(cand, offer)) return { k:"yes", gap, honored:true };

  if(offer.salary < cand.asking * 0.8) return { k:"low", gap };
  if(gap > 4) return { k:"yes", gap };

  /* There is a limit to haggling. Two counters, then it is yes or no, so the
     conversation always terminates. */
  const rounds = cand.rounds || 0;
  if(gap > -7 && rounds < 2) return { k:"counter", gap,
    want: { salary: Math.round(Math.max(offer.salary, cand.asking) * rnd(1.05, 1.14)),
            years: Math.max(offer.years, 5),
            gtee: Math.min(0.95, Math.max(offer.gtee, 0.72)) } };
  if(gap > -7) return { k:"yes", gap, worn:true };
  return { k:"no", gap };
}
/* The read you get back down the phone before anything is signed. */
function offerRead(cand, offer){
  const v = offerVerdict(cand, offer);
  if(v.k === "gone") return { word:"Off the board", tone:"muted" };
  if(v.k === "low")  return { word:"Not in the range", tone:"loss" };
  if(v.k === "yes")  return { word: v.honored ? "This matches their counter. Done"
                                  : v.worn ? "They are ready to sign" : "They would take this", tone:"win" };
  if(v.k === "counter") return { word:"Close. Expect a counter", tone:"" };
  /* A flat no at a generous number means the job is the problem, not the money. */
  const rich = offer.gtee >= 0.85 && offer.salary >= cand.asking * 1.4;
  return { word: rich ? "This is not about money. They do not want the job"
                      : "Not interested at this number", tone:"loss" };
}
function makeOffer(cand, offer){
  const me = ME(), c = findCoach(cand.id);
  const S2 = G.search;
  if(!c || cand.status !== "open") return { ok:false, why:"That candidate is off the board." };
  const upfront = (cand.at != null ? cand.release : 0) + Math.round(IN(offer.salary) * 0.15);
  if(me.budget < upfront)
    return { ok:false, why:"You need " + money(upfront) + " up front for the release and signing costs." };

  const v = offerVerdict(cand, offer);
  S2.round++;
  if(v.k === "gone"){ cand.status = "gone"; return { ok:false, why:"That candidate is off the board." } }
  if(v.k === "low"){
    S2.log.unshift(c.name + "'s agent said the number is not in the range.");
    return { ok:false, why:"The agent will not take that number in.", soft:true };
  }
  if(v.k === "no"){
    cand.status = "no";
    S2.log.unshift(c.name + " is staying put.");
    return { ok:false, why:c.name + " turned it down." };
  }
  if(v.k === "counter"){
    cand.counter = v.want;
    cand.rounds = (cand.rounds || 0) + 1;
    S2.log.unshift(c.name + "'s agent came back with a number.");
    return { ok:false, why:"They countered.", counter:v.want };
  }
  /* yes */
  me.budget -= upfront;
  if(cand.at != null){
    const from = S(cand.at);
    if(from){ delete from.coaches[S2.sport]; from.budget += cand.release }
  } else {
    G.coachPool = G.coachPool.filter(x => x.id !== c.id);
  }
  c.pay = offer.salary; c.years = offer.years; c.gtee = offer.gtee;
  c.since = G.season; c.wins = 0; c.losses = 0; c.morale = clamp(70 + v.gap, 40, 96);
  me.coaches[S2.sport] = c;
  S2.hired = { name:c.name, sport:S2.sport, salary:offer.salary, years:offer.years, gtee:offer.gtee, upfront };
  cand.status = "hired";
  G.news.unshift(me.name + " hired " + c.name + " to run " + SPORT_NAME[S2.sport].toLowerCase() + ".");
  return { ok:true, hired:S2.hired };
}
/* Between offers the rest of the country keeps hiring. Deliberating is not free. */
function searchDrift(){
  const S2 = G.search;
  if(!S2) return;
  S2.cands.forEach(x => {
    if(x.status !== "open") return;
    const c = findCoach(x.id);
    if(!c) { x.status = "gone"; return }
    if(Math.random() < 0.16 + coachValue(c) / 600){
      x.status = "gone";
      S2.log.unshift(c.name + " took another job.");
    }
  });
}
function endSearch(){ G.search = null }

/* ---- keeping the ones you have -------------------------------------------
   Retention is cheaper than a search and it is the part of the job nobody
   notices when it is done well. An extension is money now against a buyout you
   might pay later, which is the whole tension. -------------------------------- */
function extensionTerms(sp){
  const me = ME(), c = me.coaches[sp];
  if(!c) return null;
  const mkt = marketPrice(c);
  const raise = Math.max(0, mkt - c.pay);
  return {
    salary: Math.max(c.pay, mkt),
    years: 4,
    gtee: c.gtee != null ? c.gtee : 0.6,
    cost: Math.round(IN(raise) * 0.6 + IN(mkt) * 0.12),
    underpaid: c.pay < mkt * 0.85
  };
}
function signExtension(sp, terms){
  const me = ME(), c = me.coaches[sp];
  if(!c) return { ok:false, why:"That chair is empty." };
  /* A coach who is already unhappy will not sign just because you asked. */
  if(c.morale < 26 && terms.gtee < 0.8)
    return { ok:false, why:c.name + " will not sign that without more guaranteed money." };
  if(me.budget < terms.cost) return { ok:false, why:"That costs " + money(terms.cost) + "." };
  me.budget -= terms.cost;
  c.pay = terms.salary; c.years = terms.years; c.gtee = terms.gtee;
  c.morale = clamp(c.morale + 10 + (terms.gtee - 0.6) * 30, 0, 100);
  return { ok:true, cost:terms.cost };
}

/* ===========================================================================
   THE DONORS
   Half the job. A power conference department loses tens of millions a year on
   operations and closes the gap out of the boosters' pockets, which means the
   director spends his week having lunch.

   Donors here are PEOPLE, not a slider. Each one has a capacity, a warmth
   toward you that only moves with time and attention, and a thing they
   personally care about. The last one is the interesting part: a restricted
   gift is money you cannot spend on what you needed. Turning down forty
   million dollars because it has to go on a scoreboard is a real decision that
   real directors actually make.
   =========================================================================== */
const DONOR_FIRST = ["Walt","Ellis","Marjorie","Hal","Corinne","Dwayne","Lorraine","Sam","Peggy",
  "Cliff","Rosalie","Bernard","Ida","Frank","Gwen","Arthur","Delia","Roy","Constance","Manny",
  "Harriet","Vernon","Lucille","Stan","Adele","Gordon","Bev","Wendell","Faye","Roland"];
const DONOR_LAST = ["Prewitt","Halloway","Beaumont","Sturges","Vance","Ostrander","Kellerman",
  "Marsh","Doyle","Ashby","Cavanaugh","Winterbourne","Nash","Ridley","Calloway","Tarkington",
  "Sherwood","Bly","Lindstrom","Okonkwo","Mercer","Vandenberg","Ruiz","Farnsworth","Chalmers"];
const DONOR_HOW = ["made it in freight","made it in insurance","made it in soft drinks",
  "made it in commercial real estate","made it in agriculture","made it drilling",
  "made it in hospital supply","made it in car dealerships","made it in timber",
  "made it in grocery distribution","sold a software company","inherited most of it"];
/* What a donor will and will not write a check for. Unrestricted is rare and
   it is the most valuable kind of money in the building. */
const DONOR_CAUSE = [
  { key:"open",  label:"whatever you need most",    weight:2 },
  { key:"stad",  label:"the stadium",               weight:3 },
  { key:"arena", label:"the arena",                 weight:2 },
  { key:"perf",  label:"the performance center",    weight:2 },
  { key:"acad",  label:"the academic center",       weight:2 },
  { key:"med",   label:"sports medicine",           weight:1 },
  { key:"olym",  label:"the Olympic sports",        weight:2 },
  { key:"FB",    label:"football, and only football",weight:3 },
  { key:"MBB",   label:"basketball",                weight:2 },
  { key:"nil",   label:"paying the players",        weight:2 }
];
function pickCause(){
  const t = sum(DONOR_CAUSE.map(x => x.weight));
  let r = Math.random() * t;
  for(const c of DONOR_CAUSE){ r -= c.weight; if(r <= 0) return c.key }
  return "open";
}
function causeLabel(k){ const c = DONOR_CAUSE.find(x => x.key === k); return c ? c.label : "whatever you need" }

let DONOR_SEQ = 0;
function newDonor(band){
  /* Capacity is heavy tailed. Most of your board can write six figures and one
     of them can write nine, and finding out which is the job. */
  const roll = Math.random();
  const cap = roll < 0.06 ? rnd(38e6, 120e6) : roll < 0.22 ? rnd(9e6, 38e6)
            : roll < 0.55 ? rnd(1.6e6, 9e6) : rnd(180e3, 1.6e6);
  return {
    id: ++DONOR_SEQ,
    name: pick(DONOR_FIRST) + " " + pick(DONOR_LAST),
    how: pick(DONOR_HOW),
    cap: Math.round(cap * clamp(band / 55, 0.4, 1.8)),
    warmth: ri(8, 42),
    cause: pickCause(),
    given: 0, lastAsk: 0, cultivated: 0, patience: ri(2, 5)
  };
}
function seedDonors(s){
  const band = pillarsOf(s).pre * 0.5 + s.donors * 0.5;
  s.board = [];
  const n = 5 + Math.round(clamp(band / 22, 0, 4));
  for(let i = 0; i < n; i++) s.board.push(newDonor(band));
}
function capWord(v){
  return v>=38e6?"Can move a building":v>=9e6?"Can fund a wing":v>=1.6e6?"Writes real checks"
       : "Writes small checks";
}
function warmthWord(v){
  return v>=82?"Would do anything for you":v>=62?"Warm":v>=42?"Interested":v>=24?"Polite":"Barely knows you";
}
/* Time and attention. It costs money because it is dinners, flights and a suite
   you did not sell, and it takes seasons because that is how relationships work. */
function cultivateCost(d){ return Math.round(IN(60e3 + d.cap * 0.004)) }
function cultivate(d){
  const s = ME();
  const cost = cultivateCost(d);
  if(s.budget < cost) return { ok:false, why:"That costs " + money(cost) + "." };
  if(d.cultivated >= 2) return { ok:false, why:"You have already met twice this year." };
  s.budget -= cost;
  d.cultivated++;
  const lift = 9 + (s.staff.fund || 0) * 3 + rnd(-3, 7);
  d.warmth = clamp(d.warmth + lift, 0, 100);
  return { ok:true, cost, lift:Math.round(lift) };
}
/* What he will say yes to today. Warmth sets the fraction of capacity you can
   reach, and asking for more than that is how you lose the relationship. */
function askCeiling(d){ return Math.round(d.cap * clamp(d.warmth / 130, 0.03, 0.72)) }
function askTiers(d){
  const ceil = askCeiling(d);
  return [
    { label:"A modest ask",   amt: Math.round(ceil * 0.35) },
    { label:"A serious ask",  amt: Math.round(ceil * 0.85) },
    { label:"Everything they have", amt: Math.round(ceil * 1.6) }
  ].filter(x => x.amt > IN(40e3));
}
function solicit(d, amt){
  const s = ME();
  const ceil = askCeiling(d);
  const stretch = amt / Math.max(1, ceil);
  const p = clamp(1.25 - stretch * 0.75 + (s.staff.fund || 0) * 0.05, 0.04, 0.96);
  d.lastAsk = G.season;
  d.cultivated = 0;
  if(Math.random() > p){
    /* Overreaching costs you the relationship, which is the only real currency
       in fundraising. */
    d.warmth = clamp(d.warmth - 10 - stretch * 12, 0, 100);
    d.patience--;
    return { ok:false, why:d.name + " said not this year.", cooled:true };
  }
  const got = Math.round(amt * rnd(0.85, 1.12));
  d.given += got;
  d.warmth = clamp(d.warmth + 6, 0, 100);
  s.donors = clamp(s.donors + got / IN(4e6), 0, 100);
  applyGift(s, d, got);
  return { ok:true, amt:got, cause:d.cause };
}
/* Where the money is allowed to go. This is the whole point of the mechanic. */
function applyGift(s, d, amt){
  const k = d.cause;
  if(k === "open"){ s.budget += amt; return }
  if(k === "nil"){ s.nil = clamp(s.nil + amt / IN(2.2e6), 0, 100); return }
  if(k === "FB" || k === "MBB"){
    const p = progOf(s, k);
    if(p){ p.cls = clamp(p.cls + amt / IN(3.4e6), 0, 99); p.ovr = clamp(p.ovr + amt / IN(9e6), 0, 99) }
    else s.budget += Math.round(amt * 0.4);
    return;
  }
  /* A building gift is held in a restricted fund. It will pay for that building
     and nothing else, and it sits there until you build. */
  s.restricted = s.restricted || {};
  s.restricted[k] = (s.restricted[k] || 0) + amt;
  /* Big enough and his name goes on it. */
  if(amt >= IN(30e6) && !(s.named || {})[k]){
    s.named = s.named || {};
    s.named[k] = d.name.split(" ").slice(-1)[0];
    G.trophies.push({ season:G.season, kind:"gift", what:s.named[k] + " " + BLD[k].name });
  }
}
function restrictedFor(s, key){ return (s.restricted || {})[key] || 0 }
function spendRestricted(s, key, amt){
  const have = restrictedFor(s, key);
  const use = Math.min(have, amt);
  if(use > 0) s.restricted[key] = have - use;
  return use;
}
/* New faces turn up as the department gets bigger, and old ones die or drift. */
function donorTick(){
  const s = ME();
  s.board = s.board || [];
  s.board.forEach(d => {
    d.cultivated = 0;
    d.warmth = clamp(d.warmth - 4 - (G.season - (d.lastAsk || 0) > 6 ? 4 : 0), 0, 100);
  });
  s.board = s.board.filter(d => d.patience > 0);
  const band = pillarsOf(s).pre * 0.5 + s.donors * 0.5;
  const want = 5 + Math.round(clamp(band / 22, 0, 5));
  while(s.board.length < want) s.board.push(newDonor(band));
  if(s.board.length > 12) s.board.length = 12;
}

/* ===========================================================================
   NON-CONFERENCE SCHEDULING
   The most underrated thing on the desk, and for a small department it is the
   whole budget. A trip to a big stadium is a near certain loss and a check
   that covers the year's travel for eight sports. A home game against a
   nobody is a win you paid seven figures for. A home-and-home with a peer
   costs nothing, risks everything, and is the only one that moves your
   national profile.

   You fill these slots yourself, for football and men's basketball, before the
   season is played. Everyone else's slates are filled around you.
   =========================================================================== */
const NC_SPORTS = ["FB","MBB"];
const NC_SLOTS_BASE = { FB:2, MBB:4 };
/* A league that votes for nine conference games takes a non-conference date off
   every member. That is the actual trade in the room: better inventory for the
   network, one fewer game you can buy, sell or duck. */
function ncSlots(sp){
  const c = MYC();
  if(sp === "FB" && c && c.nineGame) return Math.max(1, NC_SLOTS_BASE.FB - 1);
  return NC_SLOTS_BASE[sp];
}
const NC_SLOTS = NC_SLOTS_BASE;

/* What a visiting team gets paid to come and lose. Scales with how big a name
   the host is, because the check is really a ticket-revenue share. */
function guaranteeFee(host, guest){
  const hp = pillarsOf(host), gp = pillarsOf(guest);
  const base = (hp.med * 0.5 + hp.pre * 0.5) * 26e3;
  const draw = clamp(gp.pre / 60, 0.55, 1.5);
  return Math.round(IN(base * draw));
}
function ncOptions(sp){
  const me = ME();
  const mine = schoolScore(me);
  const pool = G.schools.filter(x => x.id !== me.id && progOf(x, sp) && x.conf !== me.conf);
  const scored = pool.map(x => ({ x, v: schoolScore(x) }));
  const out = [];
  /* BUY GAME: you pay somebody small to come to you. Near certain win, real
     money out, and it does nothing for how the country sees you. */
  const small = scored.filter(o => o.v < mine - 14).sort((a,b) => b.v - a.v).slice(0, 14);
  if(small.length){
    const o = pick(small);
    out.push({ kind:"buy", opp:o.x.id, home:true, fee: -guaranteeFee(me, o.x),
      note:"They come to you. You write the check." });
  }
  /* GUARANTEE GAME: you go and get paid. This is how a small department pays
     for its Olympic sports. */
  const big = scored.filter(o => o.v > mine + 12).sort((a,b) => b.v - a.v).slice(0, 14);
  if(big.length){
    const o = pick(big);
    out.push({ kind:"guarantee", opp:o.x.id, home:false, fee: guaranteeFee(o.x, me),
      note:"You go there. They write the check." });
  }
  /* HOME AND HOME: a genuine peer, no money either way. */
  const peer = scored.filter(o => Math.abs(o.v - mine) <= 16).sort(() => Math.random() - 0.5).slice(0, 10);
  if(peer.length){
    const o = pick(peer);
    out.push({ kind:"series", opp:o.x.id, home: Math.random() < 0.5, fee:0,
      note:"Even terms, home and home. No guarantee either way." });
  }
  /* An empty slot is a bye, which is worse than it sounds: no gate, no result. */
  out.push({ kind:"open", opp:null, home:true, fee:0, note:"Leave it empty." });
  return out;
}
function ncInit(){
  const me = ME();
  G.nonconf = {};
  NC_SPORTS.forEach(sp => {
    if(!progOf(me, sp)) return;
    G.nonconf[sp] = [];
    for(let i = 0; i < ncSlots(sp); i++) G.nonconf[sp].push(null);
  });
  G.ncOffers = {};
  NC_SPORTS.forEach(sp => {
    if(!progOf(me, sp)) return;
    G.ncOffers[sp] = [];
    for(let i = 0; i < ncSlots(sp); i++) G.ncOffers[sp].push(ncOptions(sp));
  });
}
function ncBook(sp, slot, opt){
  const me = ME();
  if(!G.nonconf || !G.nonconf[sp]) return { ok:false, why:"Nothing to schedule." };
  const prev = G.nonconf[sp][slot];
  /* Work the whole swap out before touching the bank. The previous version
     reversed the old booking first and then bailed on the afford check, leaving
     the old game still in the slot with its money already refunded: book twice
     and you were paid for it twice. */
  /* No money changes hands at booking. The check clears on the week the game is
     played, which is where the player is actually looking and is the entire
     small school fantasy: you flew somewhere and got paid for it. */
  if(opt.fee < 0 && me.budget + opt.fee < 0)
    return { ok:false, why:"That game costs " + money(-opt.fee) + " and you cannot cover it." };
  G.nonconf[sp][slot] = opt;
  G._dirty = true;
  return { ok:true };
}
/* What the booked non-conference slate settles this week. */
function ncWeekFee(week){
  let total = 0, note = null;
  NC_SPORTS.forEach(sp => {
    const booked = (G.nonconf && G.nonconf[sp]) || [];
    const per = PER_WEEK[sp];
    const from = (week - 1) * per, to = from + per;
    for(let i = from; i < to && i < booked.length; i++){
      const g = booked[i];
      if(!g || !g.fee) continue;
      total += g.fee;
      const opp = S(g.opp);
      if(!note && opp) note = g.fee > 0
        ? opp.name + " paid the guarantee: " + money(g.fee)
        : "You paid " + opp.name + " " + money(-g.fee) + " to come.";
    }
  });
  return { total, note };
}
function ncSummary(){
  let paid = 0, earned = 0, n = 0;
  for(const sp in (G.nonconf || {})){
    (G.nonconf[sp] || []).forEach(g => {
      if(!g) return;
      n++;
      if(g.fee < 0) paid += -g.fee; else earned += g.fee;
    });
  }
  return { paid, earned, net: earned - paid, n };
}
/* The schedule builder honours whatever you booked and fills the rest at
   random, the way the other hundred and thirty-one schools' slates get filled. */
function ncFixtures(sp, week){
  const me = ME();
  const out = [];
  const booked = (G.nonconf && G.nonconf[sp]) || [];
  const perWeek = PER_WEEK[sp];
  const from = (week - 1) * perWeek, to = from + perWeek;
  for(let i = from; i < to && i < booked.length; i++){
    const g = booked[i];
    if(!g || g.kind === "open" || g.opp == null) continue;
    out.push(g.home ? { h:me.id, a:g.opp, c:null, nc:true } : { h:g.opp, a:me.id, c:null, nc:true });
  }
  return out;
}

/* ===========================================================================
   PAYING THE PLAYERS
   Schools may now share revenue with athletes directly, up to a cap: twenty and
   a half million in the first year of the settlement, rising toward the low
   thirties over the following decade. Nothing tells a department how to split
   it. Football and men's basketball generate the money and take most of it,
   and where exactly that leaves everyone else is an open legal question that
   several people are currently suing about.

   Third-party collective money is separate and does not count against the cap,
   which is exactly why collectives did not go away.
   =========================================================================== */
const RS_CAP_BASE = 20.5e6;      // season one, in season-one dollars
const RS_CAP_GROWTH = 0.021;     // on top of inflation, toward the low thirties

function rsCap(){ return Math.round(IN(RS_CAP_BASE * Math.pow(1 + RS_CAP_GROWTH, G.season - 1))) }
/* You do not have to opt in. A small department genuinely cannot afford the
   cap and is better off not pretending it can. */
function rsOptedIn(s){ return !!s.rsIn }
function rsSpend(s){ return sum(Object.keys(s.rs || {}).map(k => s.rs[k] || 0)) }
function rsShare(s, sp){ return (s.rs || {})[sp] || 0 }

/* Title IX is not modeled as a rule with a number, because there is not one.
   It is modeled as exposure: the further you tilt, the more likely somebody
   makes it your problem. */
const WOMENS = ["WBB","VB","GYM"];
function womensShare(s){
  const t = rsSpend(s);
  if(!t) return 0.5;
  return sum(WOMENS.map(sp => rsShare(s, sp))) / t;
}
function titleIXRisk(s){
  const w = womensShare(s);
  return clamp((0.32 - w) * 2.6, 0, 0.85);
}
function titleIXWord(s){
  const r = titleIXRisk(s);
  return r < 0.06 ? "Nobody is going to ask about this"
    : r < 0.22 ? "Defensible"
    : r < 0.45 ? "Your compliance people are uncomfortable"
    : "This is a lawsuit waiting to happen";
}
function rsAutoSplit(s){
  /* What most departments do: the overwhelming majority to football, a sixth to
     men's basketball, scraps to everyone else. */
  const cap = rsCap();
  const out = {};
  const has = sp => !!progOf(s, sp);
  let left = cap;
  if(has("FB")){ out.FB = Math.round(cap * 0.72); left -= out.FB }
  if(has("MBB")){ out.MBB = Math.round(cap * 0.17); left -= out.MBB }
  const rest = s.programs.map(p => p.sport).filter(sp => sp !== "FB" && sp !== "MBB");
  rest.forEach(sp => { out[sp] = Math.round(left / Math.max(1, rest.length)) });
  return out;
}
/* What the money actually buys: it is a recruiting and retention multiplier,
   because that is what it is for. */
function rsEffect(s, sp){
  if(!rsOptedIn(s)) return 0;
  const per = rsShare(s, sp);
  const norm = per / Math.max(1, rsCap() * (REVENUE.includes(sp) ? 0.5 : 0.09));
  return clamp(norm, 0, 2.2);
}

/* ===========================================================================
   HOW A CONFERENCE ACTUALLY WORKS

   A conference is not a tier label. It is a contract between a dozen schools
   about three things: how the television money gets divided, how hard it is to
   leave, and who gets to decide. Almost everything a director does at the
   league level is one of those three.

   DISTRIBUTION. Leagues have historically split media money evenly. Two things
   broke that. New members increasingly come in on PARTIAL shares for a fixed
   number of years, because no incumbent will vote to take a pay cut so that
   somebody else can join: recent expansions have brought schools in at roughly
   half of what the legacy members take, for as long as six years. And one
   league has now moved to VIEWERSHIP based distribution, paying more to
   whoever draws the audience in football and men's basketball, which is a very
   different league to be the fourteenth best team in.

   LEAVING. An exit fee is normally a multiple of the annual payout, written to
   step down on a published schedule. The bigger obstacle is the GRANT OF
   RIGHTS: members hand their media rights to the league until a fixed year, so
   a school that leaves early is still handing its home games to the league it
   left. That combination is what turns a nine-figure exit fee into a number
   several times larger, and it is why so few schools actually move.

   BEING RAIDED. When a league gets picked apart, the schools that stay can be
   owed money. Scheduling alliances have been written with penalty clauses: a
   flat sum if one member is taken and an escalator for each one after. Those
   penalties, plus the departing schools' exit fees, are distributed to the
   members who stayed. Not getting an invitation is not purely a loss.

   DECIDING. The athletic directors sit as a council and recommend. The
   presidents and chancellors sit as a board and decide, and they do not always
   agree with you. Once a year everybody goes to the same hotel for a week and
   argues about conference game counts, distribution formulas, playoff format
   and who is allowed to enforce what.
   =========================================================================== */

const DIST_MODELS = {
  equal: { name:"Even split", note:"Every member takes the same share, whatever they draw." },
  tiered:{ name:"Tiered",     note:"Legacy members take a full share. Newer members take less until they vest." },
  view:  { name:"Viewership", note:"Paid on what your football and basketball actually draw." }
};
/* Partial shares for a new member, by years since joining. */
const VEST_SCHEDULE = {
  equal:  [0.55, 0.70, 0.85, 1.0],
  tiered: [0.45, 0.45, 0.50, 0.60, 0.75, 0.90, 1.0],
  view:   [0.60, 0.78, 0.92, 1.0]
};
function vestFactor(c, s){
  const yrs = G.season - (s.joined || 1);
  const sch = VEST_SCHEDULE[c.model || "equal"];
  return yrs >= sch.length ? 1 : sch[Math.max(0, yrs)];
}
/* What a school draws, which is what a viewership model pays on. Football and
   men's basketball, because that is what the ratings are. */
function drawOf(s){
  const p = pillarsOf(s);
  const fb = progOf(s, "FB") ? p.ath * 1.0 : 0;
  const mb = progOf(s, "MBB") ? p.ath * 0.35 : 0;
  return Math.max(4, (fb + mb) * 0.5 + p.med * 0.7 + p.pre * 0.4);
}

/* ---- tournament units -----------------------------------------------------
   The basketball money nobody outside the industry talks about. A team earns
   its conference a unit for reaching the field and another for every round it
   survives, and the unit is then paid ANNUALLY FOR SIX YEARS. A good March is
   still paying the league five years later, and the league divides it however
   it likes. It is why a conference cares about basketball depth rather than
   just a champion. ------------------------------------------------------------ */
const UNIT_VALUE = 350e3;
const UNIT_TERM = 6;
function awardUnits(){
  G.conferences.forEach(c => { c.units = c.units || [] });
  ["MBB","WBB"].forEach(sp => {
    const p = G.post[sp];
    if(!p || !p.national) return;
    const tally = {};
    const add = (id, n) => {
      const s = S(id); if(!s || s.conf == null) return;
      tally[s.conf] = (tally[s.conf] || 0) + n;
    };
    Object.keys(p.national.path).forEach(idStr => add(+idStr, 1));   // the bid
    p.national.rounds.forEach(r => r.games.forEach(g => add(g.w, 1)));  // each round survived
    if(p.national.champ != null) add(p.national.champ, 1);
    /* Credited to the school that earned them as well as the league, so a vote
       to share them evenly is a vote that actually moves somebody's money. */
    const byS = {};
    const credit = (id, n) => { byS[id] = (byS[id] || 0) + n };
    Object.keys(p.national.path).forEach(idStr => credit(+idStr, 1));
    p.national.rounds.forEach(r => r.games.forEach(g => credit(g.w, 1)));
    if(p.national.champ != null) credit(p.national.champ, 1);
    for(const cid in tally){
      const c = C(+cid);
      if(!c) continue;
      const mine = {};
      c.members.forEach(id => { if(byS[id]) mine[id] = byS[id] });
      c.units.push({ season:G.season, n:tally[cid], sport:sp, by:mine });
    }
  });
  G.conferences.forEach(c => {
    c.units = (c.units || []).filter(u => G.season - u.season < UNIT_TERM);
  });
}
function unitIncome(c){ return Math.round(sum((c.units || []).map(u => u.n)) * IN(UNIT_VALUE)) }
/* What a single school's own units are worth this year. If the league voted to
   pool them this is zero and it all goes through the distribution instead. */
function ownUnitIncome(c, s){
  if(c.unitsEven) return 0;
  let n = 0;
  (c.units || []).forEach(u => { if(u.by && u.by[s.id]) n += u.by[s.id] });
  return Math.round(n * IN(UNIT_VALUE));
}
function pooledUnitIncome(c){
  if(c.unitsEven) return unitIncome(c);
  let claimed = 0;
  (c.units || []).forEach(u => {
    if(!u.by) return;
    for(const k in u.by) claimed += u.by[k];
  });
  return Math.round(Math.max(0, sum((c.units||[]).map(u => u.n)) - claimed) * IN(UNIT_VALUE));
}
function unitCount(c){ return sum((c.units || []).map(u => u.n)) }
function myUnits(){
  /* Your own contribution this year, which is the number you take into the room
     when the league argues about how units should be split. */
  const me = ME();
  let n = 0;
  ["MBB","WBB"].forEach(sp => {
    const p = G.post[sp];
    if(!p || !p.national) return;
    if(p.national.path[me.id]) n++;
    p.national.rounds.forEach(r => r.games.forEach(g => { if(g.w === me.id) n++ }));
    if(p.national.champ === me.id) n++;
  });
  return n;
}

/* ---- what the league is worth and what you take home ---------------------- */
function confPot(c){ return Math.round(confRevenue(c) * 0.88) + pooledUnitIncome(c) }
function memberShareModel(s){
  const c = s.conf != null ? C(s.conf) : null;
  if(!c) return 0;
  const ms = c.members.map(id => S(id)).filter(Boolean);
  if(!ms.length) return 0;
  const pot = confPot(c);
  const model = c.model || "equal";
  let base;
  if(model === "view"){
    const tot = sum(ms.map(m => drawOf(m))) || 1;
    base = pot * 0.42 / ms.length + pot * 0.58 * (drawOf(s) / tot);
  } else {
    base = pot / ms.length;
  }
  const vest = vestFactor(c, s);
  let share = base * vest;
  /* In a rich league the media partner underwrites the newcomer's shortfall so
     the incumbents do not take a cut, which is exactly how the largest recent
     expansions were paid for. In a poor league the shortfall stays in the pot
     and the incumbents split it. */
  if(vest < 1 && c.stratum === 0) share += base * (1 - vest) * 0.55;
  /* Units the school earned itself, when the league has not pooled them. */
  share += ownUnitIncome(c, s);
  return Math.round(share);
}

/* ---- leaving -------------------------------------------------------------- */
function exitSchedule(c){
  const step = Math.max(0, G.season - (c.exitFrom || 1));
  return Math.max(c.exitFloor || 1.0, (c.exitMult || 3.0) - step * 0.28);
}
function exitCost(s){
  const c = s.conf != null ? C(s.conf) : null;
  if(!c) return { fee:0, gor:0, total:0, gorYears:0, mult:0 };
  const annual = memberShareModel(s);
  const fee = Math.round(annual * exitSchedule(c));
  const gorYears = Math.max(0, (c.gor || 0) - G.season);
  const gor = Math.round(annual * gorYears * 0.55);
  return { fee, gor, total: fee + gor, gorYears, mult: exitSchedule(c) };
}

/* ---- being raided --------------------------------------------------------- */
const POACH_BASE = 10e6, POACH_STEP = 0.5e6;
function poachPenalty(from, n){
  if(from.alliance == null) return 0;
  return Math.round(IN(POACH_BASE) + IN(POACH_STEP) * Math.max(0, n - 1));
}
/* Money moves from the raider and the leaver to whoever stayed behind. */
function settleDeparture(s, fromId, toId){
  const from = C(fromId);
  if(!from) return null;
  from._raided = (from._raided || 0) + 1;
  /* Distribute the fee that was genuinely collected. Computing a second one
     here printed money: the leaver paid a fee plus a grant of rights, and the
     stayers were then handed a fee nobody had paid out of the same purse. The
     grant of rights piece is not in this purse; it is rights the league keeps. */
  const fee = G._exitPaid != null ? G._exitPaid
            : Math.round(memberShareModel(s) * exitSchedule(from));
  G._exitPaid = null;
  const pen = from.alliance === toId ? poachPenalty(from, from._raided) : 0;
  const purse = fee + pen;
  const stayers = from.members.map(id => S(id)).filter(x => x && x.id !== s.id);
  if(stayers.length && purse > 0){
    const each = Math.round(purse / stayers.length);
    stayers.forEach(x => { x.budget += each });
    if(stayers.some(x => x.id === G.schoolId))
      G.news.unshift("Exit fees and penalties from the raid paid out " + money(each) + " a school.");
  }
  return { fee, pen, purse };
}

/* ===========================================================================
   THE SPRING MEETINGS
   =========================================================================== */
const AGENDA = [
  { key:"ninegame", title:"Move to nine conference games",
    yes:"Better inventory for the network, and one more league home game every other year.",
    no:"Keep eight, and keep the non-conference date you control.",
    lean: c => (confPillars(c).med - 52) / 40 + (c.rightsDeal && c.rightsDeal.tier < 2 ? 0.5 : -0.3) },
  { key:"view", title:"Move to viewership-based distribution",
    yes:"Members are paid on what their football and basketball actually draw.",
    no:"Keep the even split. Nobody's share moves.",
    lean: c => (confPillars(c).ath - 62) / 35 - 0.5 },
  { key:"expand", title:"Expand by two members",
    yes:"More inventory to sell, and a thinner slice for everyone already here.",
    no:"Stay this size. Nobody votes to take a pay cut.",
    lean: c => (13 - c.members.length) / 6 - 0.5 },
  { key:"gor", title:"Extend the grant of rights",
    yes:"Members hand the league their media rights for another six years. Nobody leaves cheaply.",
    no:"Let it run out and take our chances.",
    lean: c => c.stratum === 0 ? 0.4 : 0.9 },
  { key:"alliance", title:"Sign a scheduling alliance with another league",
    yes:"Games we can sell, and a penalty clause if they come for our members.",
    no:"Stay out of it.",
    lean: c => c.stratum === 0 ? -0.6 : 0.7 },
  { key:"units", title:"Split tournament units evenly",
    yes:"Basketball money is shared by every member, however it was earned.",
    no:"The schools that earned the units keep them.",
    lean: c => (60 - confPillars(c).ath) / 40 },
  { key:"champ", title:"Seed the championship game on record alone",
    yes:"Drop divisions. The two best records play.",
    no:"Keep the format we have.",
    lean: c => 0.3 }
];
function newAgenda(){
  const c = MYC();
  if(!c) return [];
  const pool = AGENDA.filter(a => {
    if(a.key === "view" && c.model === "view") return false;
    if(a.key === "alliance" && c.alliance != null) return false;
    if(a.key === "ninegame" && c.nineGame) return false;
    return true;
  });
  return shuffle(pool.slice()).slice(0, 2).map(a => ({
    key:a.key, title:a.title, yes:a.yes, no:a.no, resolved:false,
    room: clamp(a.lean(c) + rnd(-0.45, 0.45), -1.6, 1.6)
  }));
}
/* Your weight in the room: what you are worth to the league, plus tenure. */
function standing(s){
  const c = s.conf != null ? C(s.conf) : null;
  if(!c) return 0;
  const ms = c.members.map(id => S(id)).filter(Boolean);
  const rank = ms.map(m => drawOf(m)).sort((a,b) => b-a).indexOf(drawOf(s));
  const tenure = clamp((G.season - (s.joined || 1)) / 8, 0, 1) * 14;
  return clamp(96 - rank * (86 / Math.max(1, ms.length)) + tenure + (s.clout || 0) * 4, 0, 100);
}
function standingWord(v){
  return v>=80?"One of the voices that decides things":v>=60?"Listened to"
       : v>=40?"One vote of many":v>=20?"New here":"Nobody is waiting on your opinion";
}
/* A whip count. What a director actually does the week before a vote is find
   out where everyone is, then go and see the two who might move. */
function whipCount(m){
  const c = MYC();
  if(!c || !m) return { yes:0, no:0, n:0 };
  const n = c.members.length;
  const yes = clamp(Math.round(n * clamp(0.5 + m.room * 0.3, 0.08, 0.92)), 0, n);
  const swung = Math.min(n - yes, G.whipped || 0);
  return { yes: yes + swung, no: n - yes - swung, n };
}
function whipCost(){ return Math.round(IN(340e3) * Math.pow(1.55, G.whipped || 0)) }
function whipVotes(){
  const s = ME();
  if((G.whipped || 0) >= 4) return { ok:false, why:"You have seen everyone who was going to move." };
  const cost = whipCost();
  if(s.budget < cost) return { ok:false, why:"That costs " + money(cost) + "." };
  s.budget -= cost;
  G.whipped = (G.whipped || 0) + 1;
  return { ok:true, cost };
}
function resolveMeasure(m, vote){
  const s = ME(), c = MYC();
  if(!m || !c) return null;
  const w = standing(s) / 100;
  const lean = m.room + (G.whipped || 0) * 0.30 * (vote === "yes" ? 1 : -1)
             + (vote === "yes" ? 1 : -1) * w * 0.75;
  m.resolved = true; m.youVoted = vote; m.passed = lean > 0;
  /* The directors recommend. The presidents decide, and occasionally they say
     no to something the room had already agreed on. */
  if(m.passed && Math.random() < 0.14){ m.passed = false; m.vetoed = true }
  m.withYou = (m.passed && vote === "yes") || (!m.passed && vote === "no");
  s.clout = clamp((s.clout || 0) + (m.withYou ? 1 : -1), -4, 6);
  if(m.passed) applyMeasure(c, m.key);
  G.whipped = 0;
  return m;
}
function applyMeasure(c, key){
  if(key === "ninegame") c.nineGame = true;
  if(key === "view") c.model = "view";
  if(key === "expand") c.wantSize = Math.min(CONF_MAX, c.members.length + 2);
  if(key === "gor"){ c.gor = Math.max(c.gor || 0, G.season + 6); c.exitFrom = G.season; c.exitMult = 3.2 }
  if(key === "alliance"){
    const other = G.conferences.filter(x => x.id !== c.id && x.alliance == null &&
      Math.abs(x.stratum - c.stratum) <= 1);
    if(other.length){
      const o = pick(other); c.alliance = o.id; o.alliance = c.id;
      G.news.unshift("The " + c.name + " and the " + o.name + " signed a scheduling alliance.");
    }
  }
  if(key === "units") c.unitsEven = true;
  if(key === "champ") c.openChamp = true;
}

/* ===========================================================================
   THE WEEK
   What is actually on a director's calendar during a season. Hosting donors on
   a game weekend, sitting with a coach who is unhappy, taking the conference
   office's weekly call, and doing the local radio are four of the things this
   job is made of, and there are only so many evenings.
   =========================================================================== */
function weekOptions(){
  const s = ME();
  const out = [];
  out.push({ k:"box", label:"Host donors in the president's box",
    note:"A home game is the best fundraising day you get all week." });
  const unhappy = s.programs.map(p => s.coaches[p.sport]).filter(c => c && c.morale < 55)
    .sort((a,b) => a.morale - b.morale)[0];

    note:"Better to hear it from the coach than read it in the paper." });
  if(MYC()) out.push({ k:"council", label:"Take the directors' council call",
    note:"The league's athletic directors meet weekly through the season." });
  const ranked = s.programs.filter(p => p.poll > 0 && p.poll <= 40).sort((a,b) => a.poll - b.poll)[0];
  if(ranked) out.push({ k:"committee", sp:ranked.sport, label:"Put the resume in front of the committee",
    note:"Somebody has to make the case to the people who seed the bracket." });
  out.push({ k:"radio", label:"The coaches show and the quarterback club",
    note:"Season tickets and small gifts come out of these rooms." });
