<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0c1216">
<title>Front Line</title>
<!--
  FRONT LINE — a grand strategy war game in one file.

  Built on the architecture of Empire FC 2. What carried over, near enough unchanged:
    - one global G, rebuilt indexes, a central movement API, an integrity guard
    - a tick function that advances the whole world one step
    - dice that weight a roll by two strength numbers
    - compact-ish save, shape validation, scrub on import
  What is new here and has no equivalent in the football game:
    - a MAP. Who can fight whom depends on who is adjacent, not on a fixed schedule.
    - a clock that runs on its own instead of waiting for a tap.
    - relationships between AI countries, stored once per pair.

  Two rules this file does not break:
    1. All army and province movement goes through the API in the WORLD MUTATION
       section. Hand-rolled edits to prov.owner or army.prov cause ghosts.
    2. Every relationship between two countries lives in exactly one record,
       keyed on the sorted pair. Never on either country.
-->
<style>
  /* ---------------------------------------------------------------
     Palette: a situation map under low light. The chrome is cold and
     almost colourless on purpose, because ten country colours have to
     read clearly on top of it. Only three UI colours are allowed to be
     saturated: amber for you, red for war, teal for a pact.
     Type: system stack for prose, monospace for every number the player
     reads off the board. Military readouts are monospace. No webfont,
     so the game looks the same offline as online.
  ------------------------------------------------------------------ */
  :root{
    --ground:#0c1216; --panel:#141e26; --panel2:#1b2833; --line:#27363f;
    --ink:#dae4ea; --muted:#7b909e; --dim:#4f6371;
    --you:#f0b429; --war:#e05252; --pact:#3fb0a0; --ok:#6cc27a;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--ground);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.45;overscroll-behavior-y:none}
  body{padding-bottom:calc(58px + env(safe-area-inset-bottom))}
  #app{max-width:560px;margin:0 auto}
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--you);outline-offset:2px}

  /* ---- top bar: the readout. Always visible, always current. ---- */
  .bar{position:sticky;top:0;z-index:12;background:var(--ground);
    border-bottom:1px solid var(--line);padding:6px 8px 5px}
  .bar .who{display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .flag{width:13px;height:13px;border-radius:2px;flex:none;border:1px solid rgba(255,255,255,.28)}
  .bar h1{font-size:14px;margin:0;font-weight:700;letter-spacing:.2px;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clock{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.4px}
  .res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
  .res>div{background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:3px 2px;text-align:center;min-width:0}
  .res .k{font-size:8px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);
    white-space:nowrap;overflow:hidden}
  .res .v{font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .res .d{font-family:var(--mono);font-size:8px;color:var(--muted)}
  .up{color:var(--ok)} .down{color:var(--war)}

  /* ---- the map. This is the signature: everything else is a panel. ---- */
  .mapwrap{position:relative;background:#080d11;border-bottom:1px solid var(--line)}
  svg.map{display:block;width:100%;height:auto;touch-action:manipulation}
  .hex{stroke:#0a1015;stroke-width:1.4;cursor:pointer}
  .hex.sea{fill:#0d1a24;stroke:#0a1218;cursor:default}
  .hex.sel{stroke:var(--you);stroke-width:2.6}
  .hexlbl{font-family:var(--mono);font-size:8px;fill:rgba(255,255,255,.5);
    text-anchor:middle;pointer-events:none;letter-spacing:.2px}
  .city{fill:rgba(255,255,255,.82);pointer-events:none}
  .cap{fill:#fff;stroke:#000;stroke-width:.5;pointer-events:none}
  .cnt{pointer-events:none}
  .cnt rect{stroke:rgba(0,0,0,.6);stroke-width:1}
  .cnt text{font-family:var(--mono);font-size:9px;font-weight:700;text-anchor:middle;
    fill:#0a0f13;dominant-baseline:central}
  .arrow{pointer-events:none;stroke-width:3;stroke-linecap:round;opacity:.9}
  .speeds{display:flex;gap:2px;flex:none}
  .speeds button{font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:4px;
    background:rgba(10,16,20,.85);border:1px solid var(--line);color:var(--muted)}
  .speeds button.on{color:var(--ground);background:var(--you);border-color:var(--you);font-weight:700}

  /* ---- panels ---- */
  .wrap{padding:8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:7px;
    padding:9px 10px;margin-bottom:7px}
  .eyebrow{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:1.3px;
    color:var(--dim);margin-bottom:5px}
  h3{font-size:14px;margin:0 0 5px;font-weight:700}
  .small{font-size:12px} .muted{color:var(--muted)} .mono{font-family:var(--mono)}
  .row{display:flex;align-items:center;gap:7px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:7px}
  .divider{height:1px;background:var(--line);margin:7px 0}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;
    padding:7px 11px;font-size:13px;font-weight:600}
  .btn.p{background:var(--you);border-color:var(--you);color:#12181c}
  .btn.d{background:transparent;border-color:var(--war);color:var(--war)}
  .btn.sm{padding:4px 8px;font-size:11px;border-radius:4px}
  .btn[disabled]{opacity:.36}
  .pill{font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:3px;
    border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .pill.war{color:var(--war);border-color:var(--war)}
  .pill.pact{color:var(--pact);border-color:var(--pact)}
  .pill.just{color:var(--you);border-color:var(--you)}
  .bar2{height:5px;background:#0a1015;border-radius:3px;overflow:hidden}
  .bar2 i{display:block;height:100%}
  .lst>div{padding:6px 0;border-top:1px solid var(--line)}
  .lst>div:first-child{border-top:none}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.8px;
    color:var(--dim);font-weight:400;text-align:right;padding:2px 3px}
  td{padding:4px 3px;text-align:right;border-top:1px solid var(--line)}
  th.l,td.l{text-align:left}

  /* ---- nav ---- */
  nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;z-index:14;
    display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--panel);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{padding:7px 1px 8px;font-size:9.5px;color:var(--muted);min-width:0;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  nav button .ic{font-size:15px;line-height:1}
  nav button.on{color:var(--you)}
  nav button.alert .ic{color:var(--war)}

  /* ---- sheet + toasts ---- */
  .overlay{position:fixed;inset:0;background:rgba(4,8,11,.74);z-index:30;
    display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px 12px 0 0;
    padding:14px;width:100%;max-width:560px;max-height:84vh;overflow:auto}
  .toasts{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);z-index:20;
    width:calc(100% - 20px);max-width:400px;display:flex;flex-direction:column;gap:4px;
    pointer-events:none}
  .toast{background:rgba(20,30,38,.97);border:1px solid var(--line);border-left:3px solid var(--you);
    border-radius:5px;padding:6px 9px;font-size:12px}
  .toast.war{border-left-color:var(--war)} .toast.good{border-left-color:var(--ok)}
  @media (prefers-reduced-motion:no-preference){
    .toast{animation:tin .18s ease-out}
    @keyframes tin{from{opacity:0;transform:translateY(6px)}}
  }
  .start{padding:22px 16px;text-align:center}
  .start h1{font-size:26px;letter-spacing:3px;text-transform:uppercase;margin:0 0 2px;color:var(--you)}
  .pick{display:flex;align-items:center;gap:9px;padding:9px 10px;background:var(--panel);
    border:1px solid var(--line);border-radius:6px;margin-bottom:5px;text-align:left;width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ================================================================
   CONSTANTS
   ================================================================ */
const SAVE_KEY="frontline_v1", SAVE_VER=1;
const COLS=11, ROWS=9, HEX=30;          // pointy-top hexes, odd-row offset
const SEA_CHANCE=.12;
const N_COUNTRIES=10;
const START_YEAR=1936;
const TICK_MS={0:0,1:900,2:420,3:170};  // paused, slow, normal, fast

const REINFORCE_OVER=14;                // how far a reinforced army may push past its size
const REPLENISH=.09;                    // troops per day recovered in friendly land
const RECRUIT_DAYS=14;                  // days for one recruitment order to land
const MOVE_DAYS=2;                      // days an army needs to reach a neighbour
const JUSTIFY_DAYS=20;                  // the kid's number, and a good one
const JUSTIFY_PP=55;
const BROKEN_AT=.18;                    // below this share of max troops, an army breaks
const ARMY_MAX=8;                       // armies one country may field
/* A capital falling ends a country only once that country is already beaten. Above
   this share of its original land it relocates the seat of government and fights on.
   Without this, one lucky thrust hands an AI ten provinces and the map snowballs to a
   single winner inside two years. Measured in the harness, not guessed. */
const CAPITULATE_AT=.5;
const OPENING_PEACE=365;                // days before the first war may be justified
const PACT_DRIFT_CAP=55;                // friendship from a pact alone stops climbing here
const MAX_PACTS=3;                      // nobody allies with the entire world

const COUNTRY_COLORS=["#c8553d","#4a7fb5","#7a9e3f","#9b59b6","#d9873f",
  "#3fa0a0","#c05a8a","#5c6bc0","#7e8b3a","#b5504f"];
/* The ten largest countries in Europe by land area, in order: Russia, Ukraine, France,
   Spain, Sweden, Norway, Germany, Finland, Poland, Italy. (Russia counted by its
   European portion; by population the list would swap Norway and Finland out for the
   United Kingdom and Romania.)

   Each is a slot with a terrain profile and a bonus, and each is handed to whichever
   generated country its land actually resembles, so the blurb describes the map in
   front of you rather than decorating it. The mountain nation really does get the
   mountains. The map is not Europe and makes no attempt to be: these are names and
   characters, not borders. */
const NATIONS=[
 {name:"Russia",  blurb:"Vast. All of its problems are at the edges.",
  want:{size:3},          bonus:{recruit:.15,politics:.2}},
 {name:"Ukraine", blurb:"Open black earth. Room to march.",
  want:{plain:3,size:1},  bonus:{recruit:.2}},
 {name:"France",  blurb:"Talks first. Fights well enough afterwards.",
  want:{city:1,plain:1},  bonus:{politics:.5,defence:-.08}},
 {name:"Spain",   blurb:"Two coasts and every port between them.",
  want:{coast:3},         bonus:{income:.25}},
 {name:"Sweden",  blurb:"Forest and iron. Slow to wear down.",
  want:{wood:3},          bonus:{defence:.15,replenish:.5}},
 {name:"Norway",  blurb:"Mountains and fjords. Easy to hold, hard to farm.",
  want:{mtn:3,hill:2},    bonus:{defence:.22,income:-.1}},
 {name:"Germany", blurb:"Foundries, coal and rail.",
  want:{city:3},          bonus:{industry:.3}},
 {name:"Finland", blurb:"Lake, bog and winter. Nobody enjoys the crossing.",
  want:{marsh:4},         bonus:{defence:.28,income:-.18}},
 {name:"Poland",  blurb:"Flat, fertile, and between two larger neighbours.",
  want:{small:2,plain:2,city:1}, bonus:{income:.45,defence:-.12}},
 {name:"Italy",   blurb:"Bologna and Padua. Ideas travel faster here.",
  want:{city:2,coast:1},  bonus:{research:.3}}];
const PERSONALITIES=[
  {k:"expansionist",label:"Expansionist",aggro:1.35,ally:.75,research:.9},
  {k:"defensive",   label:"Defensive",   aggro:.55,ally:1.25,research:1.05},
  {k:"opportunist", label:"Opportunist", aggro:1.0, ally:1.0, research:1.0},
  {k:"isolationist",label:"Isolationist",aggro:.7, ally:.45, research:1.15}];

const TERRAIN={
  plain:{k:"plain",label:"Plain",def:1.00,income:1.00},
  hill: {k:"hill", label:"Hills",def:1.25,income:.85},
  mtn:  {k:"mtn",  label:"Mountains",def:1.55,income:.6},
  wood: {k:"wood", label:"Forest",def:1.15,income:.9},
  marsh:{k:"marsh",label:"Marsh",def:1.3,income:.7}};
const TERRAIN_TINT={plain:0,hill:-.1,mtn:-.2,wood:-.14,marsh:-.06};

/* Research is three columns because that is how the reference game reads:
   what you fight with, what you fight from, and what you fight over. */
const TECH=[
  {k:"infantry",col:"Land",label:"Infantry",desc:"Every soldier hits harder.",cost:1400,days:24,max:5},
  {k:"armor",   col:"Land",label:"Armour",  desc:"Attacking armies do more damage.",cost:2100,days:32,max:5},
  {k:"at",      col:"Land",label:"Anti-tank",desc:"Cuts enemy armour bonus.",cost:1600,days:26,max:5},
  /* The Defence column is a chain, not a shelf. He described levelling "from the top
     down", and an unlocked shelf let an isolationist with spare cash buy a deterrent in
     year two. Land stays free-choice. */
  {k:"fort",    col:"Defence",label:"Fortification",desc:"Walls hold even with nobody behind them.",cost:1500,days:26,max:5},
  {k:"air",     col:"Defence",label:"Air force",desc:"Your armies hit harder in every battle.",cost:2400,days:36,max:5,req:{fort:2}},
  {k:"nuke",    col:"Defence",label:"Deterrent",desc:"Justifying a war on you costs far more.",cost:5200,days:70,max:3,req:{air:2}},
  {k:"industry",col:"Industry",label:"Industry",desc:"Factories build faster.",cost:1200,days:20,max:5},
  {k:"logistics",col:"Industry",label:"Logistics",desc:"Armies move in one day less.",cost:1800,days:30,max:3},
  {k:"admin",   col:"Industry",label:"Administration",desc:"More tax from every province.",cost:1300,days:22,max:5},
  /* Twelve percent of the map is water and it was decoration. This is not a ship: it is
     permission for an army to cross to a coast it could see but could not reach. */
  {k:"navy",    col:"Industry",label:"Navy",desc:"Armies can cross water to another coast. Slow.",cost:2000,days:34,max:3}];
const TECH_BY=Object.fromEntries(TECH.map(t=>[t.k,t]));

/* ================================================================
   SMALL UTILITIES
   ================================================================ */
let G=null;
const rnd=()=>Math.random();
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* Every string that reaches innerHTML goes through esc(). Country and province names
   come from closed pools, but the player types their nation's name at the start, and
   that is exactly the hole this closes before it exists. */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Returns the first element for a single-root template, and a fragment when the
   template has several roots. Returning only firstElementChild silently dropped
   everything after the first tag, which is how the Nation stats table went missing
   for a whole build without throwing anything. */
const $=h=>{
  const d=document.createElement("div");d.innerHTML=h;
  if(d.children.length<=1)return d.firstElementChild;
  const f=document.createDocumentFragment();
  while(d.firstChild)f.appendChild(d.firstChild);
  return f;
};
function num(n){n=Math.round(n);
  if(Math.abs(n)>=1e6)return (n/1e6).toFixed(Math.abs(n)>=1e7?0:1)+"M";
  if(Math.abs(n)>=1e4)return (n/1e3).toFixed(0)+"k";
  if(Math.abs(n)>=1e3)return (n/1e3).toFixed(1)+"k";
  return String(n);}
function money(n){return "$"+num(n);}
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MDAYS=[31,28,31,30,31,30,31,31,30,31,30,31];
function dateOf(day){
  let y=START_YEAR,d=day;
  for(;;){const len=365;if(d<len)break;d-=len;y++;}
  let m=0;while(d>=MDAYS[m]){d-=MDAYS[m];m++;}
  return {y,m,d:d+1};}
function dateStr(day){const t=dateOf(day);return `${String(t.d).padStart(2,"0")} ${MONTHS[t.m]} ${t.y}`;}

/* ---- name pools ---- */
const NAME_A=["Vor","Kar","Mel","Tar","Ost","Bran","Dal","Sev","Ker","Lun","Rhen","Astr","Gral","Mor","Vel","Tesh","Cald","Nor","Yss","Pren"];
const NAME_B=["ovia","stadt","mark","gard","landia","holm","ova","esse","burg","aria","dor","vind","stan","heim","ica","oria","vell","gorod","alia","mere"];
const PLACE_A=["Ald","Bel","Cor","Dun","Eln","Fal","Gost","Hald","Ir","Jen","Kol","Lem","Mird","Nev","Or","Pel","Rask","Sten","Tov","Ulm","Ves","Wyd","Zar"];
const PLACE_B=["burg","ford","gate","hollow","mont","reach","vale","wick","fell","stead","cross","hain","moor","ridge","sk","by","tal","point"];
function countryName(used){for(let i=0;i<200;i++){const n=pick(NAME_A)+pick(NAME_B);if(!used.has(n)){used.add(n);return n;}}return "Republic "+used.size;}
function placeName(used){for(let i=0;i<400;i++){const n=pick(PLACE_A)+pick(PLACE_B);if(!used.has(n)){used.add(n);return n;}}return "Post "+used.size;}
const GEN_A=["Aleksa","Bruno","Casimir","Dmitri","Erika","Faris","Greta","Halvard","Ines","Jorg","Klaus","Lena","Milos","Nadia","Otto","Pia","Rurik","Sonja","Tomas","Ursa","Viktor","Wanda","Yuri","Zofia"];
const GEN_B=["Varga","Kessler","Novak","Petrov","Halloran","Berg","Dukic","Marek","Sandoval","Ilves","Rask","Tolan","Grath","Weiss","Ozols","Farkas"];
const genName=()=>pick(GEN_A)+" "+pick(GEN_B);

/* ================================================================
   MAP GEOMETRY
   Pointy-top hexes, odd-row offset. Adjacency is the whole reason this
   game exists, so it lives in one function and nothing else computes it.
   ================================================================ */
function hexXY(col,row){
  const w=Math.sqrt(3)*HEX;
  return {x:w*(col+(row&1?.5:0))+w*.5+3, y:HEX*1.5*row+HEX+3};
}
const MAPW=Math.ceil(Math.sqrt(3)*HEX*(COLS+.5))+6;
const MAPH=Math.ceil(HEX*1.5*(ROWS-1)+HEX*2)+6;
function hexPath(cx,cy){
  let p="";
  for(let i=0;i<6;i++){
    const a=Math.PI/180*(60*i-90);
    p+=(i?"L":"M")+(cx+HEX*Math.cos(a)).toFixed(1)+" "+(cy+HEX*Math.sin(a)).toFixed(1);
  }
  return p+"Z";
}
const NB_EVEN=[[+1,0],[-1,0],[0,-1],[-1,-1],[0,+1],[-1,+1]];
const NB_ODD =[[+1,0],[-1,0],[0,-1],[+1,-1],[0,+1],[+1,+1]];
function neighborCells(col,row){
  const list=(row&1)?NB_ODD:NB_EVEN,out=[];
  for(const [dc,dr] of list){
    const c=col+dc,r=row+dr;
    if(c>=0&&c<COLS&&r>=0&&r<ROWS)out.push(r*COLS+c);
  }
  return out;
}

/* ================================================================
   INDEXES
   ================================================================ */
const PROV=new Map(), CTRY=new Map(), ARMY=new Map();
function rebuildIndex(){
  PROV.clear();CTRY.clear();ARMY.clear();
  G.provinces.forEach(p=>PROV.set(p.id,p));
  G.countries.forEach(c=>CTRY.set(c.id,c));
  G.armies.forEach(a=>ARMY.set(a.id,a));
}
const PV=id=>PROV.get(id);
const CO=id=>CTRY.get(id);
const AR=id=>ARMY.get(id);
const you=()=>CO(G.you);
const alive=()=>G.countries.filter(c=>c.alive);
function provsOf(cid){return G.provinces.filter(p=>!p.sea&&p.owner===cid);}
function armiesOf(cid){return G.armies.filter(a=>a.owner===cid);}
function armiesAt(pid){return G.armies.filter(a=>a.prov===pid);}
function neighbors(pid){const p=PV(pid);return p?p.nb.map(PV).filter(Boolean):[];}
function landNeighbors(pid){return neighbors(pid).filter(p=>!p.sea);}

/* ================================================================
   RELATIONSHIPS
   One record per pair, keyed on the sorted pair. Stance, pact, war and
   any live war justification all hang off that single record, so two
   countries can never disagree about what is between them.
   Nothing outside this section reaches into G.rel to add or delete a row. Reading a
   row through rel()/relIfAny() is fine and happens all over the UI; creating, mutating
   or destroying one is this section's job, which is why forgetRelations() lives here
   rather than inside annexCountry.
   ================================================================ */
function relKey(a,b){return a<b?a+":"+b:b+":"+a;}
function rel(a,b){
  if(a===b)return null;
  const k=relKey(a,b);
  let r=G.rel[k];
  if(!r)r=G.rel[k]={stance:0,pact:null,war:false,justify:null,lastAsk:-999,truce:0};
  return r;
}
function relIfAny(a,b){return a===b?null:(G.rel[relKey(a,b)]||null);}
function stanceOf(a,b){const r=relIfAny(a,b);return r?r.stance:0;}
function nudgeStance(a,b,d){const r=rel(a,b);r.stance=clamp(r.stance+d,-100,100);}
function atWar(a,b){const r=relIfAny(a,b);return !!(r&&r.war);}
function pactBetween(a,b){const r=relIfAny(a,b);return r&&r.pact?r.pact:null;}
function hasPact(a,b,type){const p=pactBetween(a,b);return !!p&&(!type||p.type===type);}
function alliesOf(cid){
  const out=[];
  for(const k in G.rel){
    const r=G.rel[k];if(!r.pact)continue;
    const [a,b]=k.split(":").map(Number);
    if(a===cid&&CO(b)&&CO(b).alive)out.push(b);
    else if(b===cid&&CO(a)&&CO(a).alive)out.push(a);
  }
  return out;
}
function formPact(a,b,type){
  const r=rel(a,b);
  if(r.war)return false;
  if(alliesOf(a).length>=MAX_PACTS||alliesOf(b).length>=MAX_PACTS)return false;
  // Signing with someone who is mid-justification was a free pact that evaporated the
  // moment their timer ran out, which reads as the game cheating.
  if(r.justify||r.ready)return false;
  r.pact={type:type||"defense",since:G.day};
  r.stance=clamp(r.stance+18,-100,100);
  return true;
}
function breakPact(a,b){
  const r=rel(a,b);
  if(!r.pact)return false;
  r.pact=null;r.stance=clamp(r.stance-45,-100,100);
  return true;
}
/* Declaring war walks the defender's pacts and pulls their allies in. That graph can
   loop (A defends B, B defends C, C defends A), so the walk carries a visited set.
   Without it this recurses until the stack dies, which is the classic way a grand
   strategy game crashes. */
function declareWar(aggressor,defender,visited){
  visited=visited||new Set();
  const key=relKey(aggressor,defender);
  if(visited.has(key))return;
  visited.add(key);
  const A=CO(aggressor),D=CO(defender);
  if(!A||!D||!A.alive||!D.alive||aggressor===defender)return;
  const r=rel(aggressor,defender);
  if(r.war)return;
  r.war=true;r.pact=null;r.justify=null;r.ready=null;r.stance=-100;r.truce=0;r.warStart=G.day;r.taken={};
  // everyone watching thinks slightly worse of the aggressor
  alive().forEach(c=>{if(c.id!==aggressor&&c.id!==defender)nudgeStance(c.id,aggressor,-4);});
  logAdd(`${A.name} declares war on ${D.name}.`,"war");
  if(aggressor===G.you||defender===G.you)toast(`War: ${A.name} vs ${D.name}`,"war");
  // call to arms, both directions, breadth first through the visited set
  alliesOf(defender).forEach(ally=>{
    if(ally===aggressor)return;
    logAdd(`${CO(ally).name} honours its pact with ${D.name}.`,"war");
    declareWar(aggressor,ally,visited);
  });
  // Deliberately one-directional. A defence pact obliges you to defend, not to join
  // someone else's war of choice. Pulling the aggressor's friends in as well meant one
  // declaration became a nine-on-one and the victim was annexed in a fortnight.
}
/* War score. Provinces actually taken during THIS war, plus a strength read. This is
   what "demand terms" is argued from, so it has to be a number both sides can see
   rather than a coin flip. Reset when the war starts. */
function warTaken(r,cid){return (r.taken&&r.taken[cid])||0;}
function warScore(me,them){
  const r=relIfAny(me,them);
  if(!r)return 0;
  const land=warTaken(r,me)-warTaken(r,them);
  const myT=armiesOf(me).reduce((s,x)=>s+x.troops,0);
  const thT=armiesOf(them).reduce((s,x)=>s+x.troops,0);
  const force=(myT-thT)/Math.max(20,myT+thT)*6;
  return land*1.6+force;
}
/* The three endings a war is allowed to have. He named the button: demand terms. A war
   that can only end by total annexation or by a coin flip that moves nothing has no
   diplomatic payoff, only a map payoff, and that is half a grand strategy game. */
function termsOffer(from,to,kind,provId){
  const r=relIfAny(from,to);
  if(!r||!r.war)return {ok:false,msg:"You are not at war."};
  const score=warScore(from,to);
  const len=G.day-(r.warStart||G.day);
  if(kind==="white"){
    // both sides stop and keep what they hold
    const accept=score<1.5&&(len>45||score<-1.5);
    if(!accept)return {ok:false,msg:`${CO(to).name} thinks it is still winning.`};
    makePeace(from,to);
    return {ok:true,msg:"White peace. Everyone keeps what they hold."};
  }
  if(kind==="demand"){
    const p=PV(provId);
    if(!p||p.owner!==to)return {ok:false,msg:"They do not hold that province."};
    if(!p.nb.some(n=>PV(n)&&PV(n).owner===from))
      return {ok:false,msg:"You must border a province to demand it."};
    if(p.capital)return {ok:false,msg:"No country hands over its capital."};
    const bar=3.2+(p.city?1.6:0)+p.fort*.5;
    if(score<bar)return {ok:false,msg:`${CO(to).name} refuses. Beat them harder first.`};
    setProvinceOwner(p.id,from);
    armiesAt(p.id).filter(x=>x.owner===to).forEach(x=>{
      const home=landNeighbors(p.id).find(q=>q.owner===to);
      if(home)moveArmyTo(x,home.id);else destroyArmy(x,"disbanded by treaty");
    });
    makePeace(from,to);
    logAdd(`${CO(to).name} cedes ${p.name} to ${CO(from).name}.`);
    return {ok:true,msg:`${p.name} is yours. The war is over.`};
  }
  if(kind==="cede"){
    const p=PV(provId);
    if(!p||p.owner!==from)return {ok:false,msg:"That is not yours to give."};
    if(p.capital)return {ok:false,msg:"You cannot give away your capital."};
    if(score>-1)return {ok:false,msg:`${CO(to).name} wants more than that.`};
    setProvinceOwner(p.id,to);
    armiesAt(p.id).filter(x=>x.owner===from).forEach(x=>{
      const home=landNeighbors(p.id).find(q=>q.owner===from);
      if(home)moveArmyTo(x,home.id);else destroyArmy(x,"disbanded by treaty");
    });
    makePeace(from,to);
    logAdd(`${CO(from).name} cedes ${p.name} to ${CO(to).name} for peace.`);
    return {ok:true,msg:`${p.name} is theirs. The war is over.`};
  }
  return {ok:false};
}
function demandableFrom(me,them){
  return G.provinces.filter(p=>!p.sea&&p.owner===them&&!p.capital&&
    p.nb.some(n=>PV(n)&&PV(n).owner===me));
}
function makePeace(a,b){
  const r=rel(a,b);
  if(!r.war)return false;
  r.war=false;r.stance=clamp(r.stance+25,-100,60);r.truce=G.day+540;r.warStart=0;
  r.taken=null;r.demand=null;
  const A=CO(a),B=CO(b);
  if(A&&B)logAdd(`${A.name} and ${B.name} sign a ceasefire.`);
  return true;
}
/* Two countries border each other if any province of one touches any province of
   the other. Recomputed on demand rather than stored, because provinces change hands
   constantly and a cached border list is a ghost waiting to happen. */
/* Tearing down every relationship a dead country was part of. This used to be inlined
   in annexCountry and again in collapseStep, which is two places to forget. */
function forgetRelations(cid){
  let n=0;
  for(const k in G.rel){
    const [a,b]=k.split(":").map(Number);
    if(a===cid||b===cid){delete G.rel[k];n++;}
  }
  return n;
}
function bordersWith(cid){
  const out=new Set();
  G.provinces.forEach(p=>{
    if(p.sea||p.owner!==cid)return;
    p.nb.forEach(nid=>{const n=PV(nid);if(n&&!n.sea&&n.owner!=null&&n.owner!==cid)out.add(n.owner);});
  });
  return [...out];
}

/* ================================================================
   WORLD GENERATION
   ================================================================ */
let _genTries=0;
function genWorld(){
  const usedC=new Set(), usedP=new Set();
  const provinces=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const id=r*COLS+c;
    const edge=(c===0||c===COLS-1||r===0||r===ROWS-1);
    const sea=rnd()<(edge?SEA_CHANCE*2.4:SEA_CHANCE*.55);
    const xy=hexXY(c,r);
    provinces.push({id,col:c,row:r,x:+xy.x.toFixed(1),y:+xy.y.toFixed(1),
      sea,owner:null,name:sea?"":placeName(usedP),
      terrain:sea?"plain":pick(["plain","plain","plain","hill","wood","mtn","marsh"]),
      city:false,capital:false,fort:0,siege:0,
      pop:sea?0:ri(60,180),nb:neighborCells(c,r)});
  }
  const land=provinces.filter(p=>!p.sea);
  if(land.length<N_COUNTRIES*4)return genWorld();   // freak map, roll again

  const MIN_LAND=7;   // ~89 land hexes over 10 nations averages 8.9, so 7 is a floor
                      // that can actually be met rather than an aspiration
  // seed capitals as far apart as a greedy pass manages, then flood fill outward
  const countries=[],seeds=[];
  const shuffled=shuffle(land.slice());
  for(const p of shuffled){
    if(seeds.length>=N_COUNTRIES)break;
    if(seeds.every(s=>Math.hypot(s.x-p.x,s.y-p.y)>HEX*2.6))seeds.push(p);
  }
  while(seeds.length<N_COUNTRIES){const p=pick(land);if(!seeds.includes(p))seeds.push(p);}

  seeds.forEach((s,i)=>{
    countries.push({id:i,name:countryName(usedC),color:COUNTRY_COLORS[i%COUNTRY_COLORS.length],
      ai:true,alive:true,capital:s.id,
      treasury:ri(3200,5200),workers:ri(160,240),factories:ri(3,6),pp:ri(10,40),
      tech:Object.fromEntries(TECH.map(t=>[t.k,0])),
      research:null,build:[],
      personality:pick(PERSONALITIES).k,homeProvs:0,
      nextThink:ri(1,6),warWeary:0});
    s.owner=i;s.capital=true;s.city=true;s.fort=3;
  });

  /* Fill strictly one hex per country per pass. The old version let a country with a
     wide frontier claim several hexes in a single pass, which is how a four province
     nation ended up next to a twenty province one. Round robin equalises by
     construction, and picking the hex at random keeps the borders ragged. */
  let unclaimed=land.filter(p=>p.owner==null).length;
  let guard=0;
  while(unclaimed>0&&guard++<4000){
    let progress=false;
    for(let i=0;i<countries.length&&unclaimed>0;i++){
      const mine=provinces.filter(p=>!p.sea&&p.owner===i);
      const open=[];
      mine.forEach(p=>p.nb.forEach(n=>{
        const q=provinces[n];
        if(q&&!q.sea&&q.owner==null&&!open.includes(q))open.push(q);
      }));
      if(!open.length)continue;
      pick(open).owner=i;unclaimed--;progress=true;
    }
    if(!progress)break;
  }
  // any island the fill could not reach goes to whoever is nearest
  provinces.forEach(p=>{
    if(p.sea||p.owner!=null)return;
    let best=0,bd=1e9;
    seeds.forEach((s,i)=>{const d=Math.hypot(s.x-p.x,s.y-p.y);if(d<bd){bd=d;best=i;}});
    p.owner=best;
  });

  // cities: the capital plus roughly one in three provinces
  countries.forEach(c=>{
    const mine=provinces.filter(p=>!p.sea&&p.owner===c.id);
    shuffle(mine.slice()).slice(0,Math.max(1,Math.round(mine.length/3))).forEach(p=>{
      if(!p.capital){p.city=true;p.fort=ri(0,1);}
    });
  });

  G={ver:SAVE_VER,day:0,you:null,speed:2,
    provinces,countries,armies:[],generals:[],rel:{},log:[],
    nextArmy:1,nextGen:1,stats:{battles:0,taken:0,mine:0}};
  rebuildIndex();

  balanceLand(provinces,countries,MIN_LAND);
  /* Levelling gets almost every map there, but a country can be enclaved so completely
     that no neighbour can legally feed it. Generation costs about four milliseconds, so
     rather than accept a two hex nation on the pick screen, throw the map away and roll
     another one. The guard is there so a pathological constant can never hang the boot. */
  {
    const sizes=countries.map(c=>provinces.filter(p=>!p.sea&&p.owner===c.id).length);
    if(Math.min(...sizes)<MIN_LAND&&_genTries<60){_genTries++;return genWorld();}
    _genTries=0;
  }
  assignIdentities(provinces,countries);
  countries.forEach(c=>{c.homeProvs=provsOf(c.id).length;});
  recolourByAdjacency(countries);
  // starting armies: two per country, on the capital
  /* Both starting armies used to sit on an inland capital, so an early war found no
     adjacent enemy and produced no battles at all. One garrisons the seat, the other is
     already on the frontier where the game actually happens. */
  countries.forEach(c=>{
    const n=provsOf(c.id).length;
    spawnArmy(c.id,c.capital,ri(24,32)+n*2);
    const border=provsOf(c.id).filter(p=>p.id!==c.capital&&
      p.nb.some(x=>PV(x)&&!PV(x).sea&&PV(x).owner!==c.id));
    const post=border.sort((a,b)=>(b.city?1:0)-(a.city?1:0)||b.fort-a.fort)[0];
    spawnArmy(c.id,post?post.id:c.capital,ri(24,32)+n*2);
  });
  // starting opinions: neighbours start slightly wary, distant countries indifferent
  countries.forEach(a=>bordersWith(a.id).forEach(b=>{if(a.id<b)rel(a.id,b).stance=ri(-25,10);}));
  return G;
}

/* The pick screen shows the province count and a twelve-year-old taps the colour they
   like. A four-hex start is not a difficulty setting, it is a trap with a pretty
   swatch, so the smallest nations are topped up from their largest neighbour until
   every seat at the table is playable. */
function balanceLand(provinces,countries,minLand){
  const count=id=>provinces.filter(p=>!p.sea&&p.owner===id).length;
  /* A country boxed in by its neighbours stops growing during the fill while one with
     open space runs away, so round robin alone still produced a four hex nation beside
     a seventeen hex one. This levels afterwards by repeatedly moving a single border
     hex from the largest country to the smallest country it touches. Because the
     transfer only ever goes to an ADJACENT smaller neighbour, land chains down the map
     from the fat country to the thin one over successive passes instead of teleporting.
     Capitals never move, and a donor never drops below the floor. */
  for(let guard=0;guard<900;guard++){
    const sizes=countries.map(c=>count(c.id));
    const hi=sizes.indexOf(Math.max(...sizes));
    if(Math.max(...sizes)-Math.min(...sizes)<=3)break;
    let best=null;
    provinces.forEach(p=>{
      if(p.sea||p.owner!==hi||p.capital)return;
      p.nb.forEach(n=>{
        const q=provinces[n];
        if(!q||q.sea||q.owner==null||q.owner===hi)return;
        if(sizes[q.owner]>=sizes[hi]-1)return;
        if(!best||sizes[q.owner]<sizes[best.to])best={p,to:q.owner};
      });
    });
    if(!best)break;
    if(count(hi)<=minLand)break;
    best.p.owner=best.to;
  }
}
/* Match each generated country to the authored nation its land actually looks like, so
   the mountain nation ends up in the mountains and the blurb is not a lie. */
function assignIdentities(provinces,countries){
  const sizes=countries.map(c=>provinces.filter(p=>!p.sea&&p.owner===c.id).length);
  const big=Math.max(...sizes,1);
  const profile=c=>{
    const mine=provinces.filter(p=>!p.sea&&p.owner===c.id);
    const n=mine.length||1;
    const share=t=>mine.filter(p=>p.terrain===t).length/n;
    const coast=mine.filter(p=>p.nb.some(x=>provinces[x]&&provinces[x].sea)).length/n;
    return {mtn:share("mtn"),hill:share("hill"),plain:share("plain"),wood:share("wood"),
      marsh:share("marsh"),city:mine.filter(p=>p.city).length/n,coast,
      size:n/big,small:1-n/big};
  };
  const profiles=countries.map(profile);
  const pairs=[];
  countries.forEach((c,ci)=>NATIONS.forEach((nat,ni)=>{
    let sc=0;for(const k in nat.want)sc+=nat.want[k]*(profiles[ci][k]||0);
    pairs.push({ci,ni,sc});
  }));
  pairs.sort((a,b)=>b.sc-a.sc);
  const usedC=new Set(),usedN=new Set();
  pairs.forEach(({ci,ni})=>{
    if(usedC.has(ci)||usedN.has(ni))return;
    usedC.add(ci);usedN.add(ni);
    applyIdentity(countries[ci],ni);
  });
  countries.forEach((c,i)=>{if(c.nat==null)applyIdentity(c,i%NATIONS.length);});
}
function applyIdentity(c,ni){
  const n=NATIONS[ni];if(!n)return;
  c.nat=ni;c.name=n.name;c.blurb=n.blurb;c.bonus=n.bonus;
}
const bonusOf=(c,k)=>(c&&c.bonus&&c.bonus[k])||0;

/* Greedy graph colouring over the country adjacency graph. Ten colours for ten
   countries means a perfect assignment is not guaranteed, so this maximises the
   minimum hue distance to each already-coloured neighbour instead of insisting. */
function hueOf(hex){
  const n=parseInt(hex.slice(1),16);
  const r=((n>>16)&255)/255,g=((n>>8)&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  if(!d)return 0;
  let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;
  return (h*60+360)%360;
}
function hueGap(a,b){const d=Math.abs(hueOf(a)-hueOf(b));return Math.min(d,360-d);}
function recolourByAdjacency(countries){
  const adj=countries.map(c=>new Set(bordersWith(c.id)));
  const pool=COUNTRY_COLORS.slice();
  const order=countries.map((c,i)=>i).sort((a,b)=>adj[b].size-adj[a].size);
  const taken=new Array(countries.length).fill(null);
  order.forEach(i=>{
    let best=null,bestScore=-1;
    pool.forEach(col=>{
      if(taken.includes(col))return;
      let worst=999;
      adj[i].forEach(nb=>{if(taken[nb])worst=Math.min(worst,hueGap(col,taken[nb]));});
      if(worst>bestScore){bestScore=worst;best=col;}
    });
    taken[i]=best||pool[i%pool.length];
  });
  countries.forEach((c,i)=>{c.color=taken[i];});
}

/* ================================================================
   WORLD MUTATION API
   Every change to who owns what and where an army stands goes through here.
   The football game learned this the hard way: hand-rolled squad edits left
   1,200 players pointing at clubs that no longer existed. Same rule, same reason.
   ================================================================ */
function newGeneral(){
  const g={id:G.nextGen++,name:genName(),skill:ri(1,5)};
  G.generals.push(g);return g;
}
function spawnArmy(cid,pid,troops){
  const g=newGeneral();
  const a={id:G.nextArmy++,owner:cid,prov:pid,troops,max:troops,pool:0,
    gen:g.id,stance:"defend",broken:false,moving:null,eta:0,target:null};
  G.armies.push(a);ARMY.set(a.id,a);
  return a;
}
/* Destroying an army also releases its general. Missing this is the exact shape of
   the academy ghost bug: an object that still exists, still referenced, invisible. */
function destroyArmy(a,reason){
  if(!a)return;
  const i=G.armies.indexOf(a);if(i<0)return;
  G.armies.splice(i,1);ARMY.delete(a.id);
  const gi=G.generals.findIndex(g=>g.id===a.gen);
  if(gi>=0)G.generals.splice(gi,1);
  if(a.owner===G.you)toast(`Army lost${reason?" — "+reason:""}.`,"war");
}
function moveArmyTo(a,pid){
  if(!a||!PV(pid)||PV(pid).sea)return false;
  a.prov=pid;a.moving=null;a.eta=0;
  return true;
}
/* The capital flag is cleared HERE, where ownership changes, and nowhere else.
   annexCountry only ever cleared stars on hexes still owned by the loser, and the hex
   you just took is already yours, so the star came with it. The winner then had two
   capitals, and an enemy retaking that hex would read wasCap===true and capitulate its
   current owner. One flag stored in two places (p.capital and c.capital), disagreeing
   after the first successful siege. Same shape as the academy ghost. */
function setProvinceOwner(pid,cid){
  const p=PV(pid);
  if(!p||p.sea)return;
  p.owner=cid;p.capital=false;p.fort=Math.max(0,p.fort-1);p.siege=0;
}
/* A country falls when its capital is taken. Everything it owned transfers, every
   army it had dies, and every relationship it was part of is torn down. Leaving a
   single stale record here is what makes a save quietly rot twenty hours later. */
function annexCountry(loserId,winnerId){
  const L=CO(loserId),W=CO(winnerId);
  if(!L||!L.alive)return;
  L.alive=false;
  G.provinces.forEach(p=>{if(!p.sea&&p.owner===loserId){p.owner=winnerId;p.capital=false;p.siege=0;}});
  armiesOf(loserId).slice().forEach(a=>destroyArmy(a));
  forgetRelations(loserId);
  L.treasury=0;L.workers=0;L.factories=0;L.build=[];L.research=null;
  logAdd(`${L.name} has fallen. ${W?W.name:"Its conqueror"} takes everything.`,"war");
  if(loserId===G.you){G.defeat=true;toast("Your capital has fallen.","war");}
  else if(winnerId===G.you)toast(`${L.name} annexed.`,"good");
  else toast(`${L.name} has fallen.`,"war");
  alive().forEach(c=>{if(c.id!==winnerId)nudgeStance(c.id,winnerId,-14);});
}
function logAdd(text,kind){
  G.log.unshift({d:G.day,t:text,k:kind||""});
  if(G.log.length>260)G.log.length=260;
}

/* ================================================================
   ECONOMY
   Four resources, each with a different job:
     money    spent on research, forts and recruitment
     workers  consumed by recruitment, replaced slowly by population
     factories decide how fast recruitment and building actually run
     political points buy diplomacy, and only diplomacy
   ================================================================ */
function incomeOf(cid){
  const c=CO(cid);if(!c)return 0;
  let m=0;
  provsOf(cid).forEach(p=>{
    m+=p.pop*.5*TERRAIN[p.terrain].income*(p.city?1.5:1);
  });
  return Math.round(m*(1+c.tech.admin*.09)*(1+bonusOf(c,"income")));
}
function workerGain(cid){
  const c=CO(cid);if(!c)return 0;
  return Math.round(provsOf(cid).reduce((a,p)=>a+p.pop,0)*.0045);
}
function upkeepOf(cid){
  // Armies drain money every single day. A recurring drain is a far stronger sink
  // than any one-off purchase, which is the one economic lesson that carried over
  // from the football game intact.
  const c=CO(cid);if(!c)return 0;
  return Math.round(armiesOf(cid).reduce((a,x)=>a+x.troops*2.2,0)+provsOf(cid).length*6);
}
function netOf(cid){return incomeOf(cid)-upkeepOf(cid);}
function ppGain(cid){
  const c=CO(cid);if(!c)return 0;
  return +((0.55+provsOf(cid).length*.045+c.factories*.03)*(1+bonusOf(c,"politics"))).toFixed(2);
}
function buildRate(cid){
  const c=CO(cid);if(!c)return 1;
  return c.factories*(1+c.tech.industry*.12)*(1+bonusOf(c,"industry"));
}
function recruitCost(cid){
  const c=CO(cid);
  const n=armiesOf(cid).length;
  return {money:Math.round(900*(1+n*.2)),workers:Math.round(46*(1+n*.12))};
}
function fortCost(p){return Math.round(340*(1+p.fort*.75));}

/* ================================================================
   COMBAT
   Battles do not resolve in one roll. Two armies in adjacent provinces chip at
   each other every day, and the arrow between them only reports who is chipping
   faster. That is the single biggest difference from the football engine, and it
   is a smaller change than it sounds: same weighted dice, run small and often
   instead of once and large.
   ================================================================ */
function generalOf(a){return G.generals.find(g=>g.id===a.gen)||{name:"—",skill:1};}
function attackPower(a){
  const c=CO(a.owner);if(!c)return 0;
  const g=generalOf(a);
  let s=a.troops*(1+c.tech.infantry*.10);
  s*=(1+c.tech.armor*.09);
  s*=(1+g.skill*.05);
  s*=a.stance==="attack"?1.18:.72;
  if(a.broken)s*=.4;
  return s;
}
function defencePower(a,inProv){
  const c=CO(a.owner);if(!c)return 0;
  const g=generalOf(a);
  let s=a.troops*(1+c.tech.infantry*.10);
  s*=(1+c.tech.at*.07);
  s*=(1+g.skill*.05);
  s*=a.stance==="defend"?1.22:.88;
  if(a.broken)s*=.4;
  const p=inProv||PV(a.prov);
  if(p){
    s*=TERRAIN[p.terrain].def;
    s*=1+p.fort*.2+(p.owner===a.owner?.15+c.tech.fort*.06+bonusOf(c,"defence"):0);
    // A capital is the one province a country actually digs in around. Making it merely
    // a bit tougher meant capitals fell several times a year and the headline event of
    // the game became routine. It has to be a wall.
    if(p.capital)s*=2.1;
  }
  return s;
}
/* One day of one engagement, fought symmetrically.
   Two armies of countries at war standing next to each other FIGHT. Stance tilts the
   dice; it is not permission to fight. v1 only chipped when someone had pressed Attack,
   so two hostile armies could sit on a border on Hold for months with no arrow and no
   losses. That made the Army tab a reminder to press a button rather than a front line.
   Intensity: both dug in is a skirmish, one pressing is a battle, both pressing is a
   bloodbath. Losses scale with the smaller army, so the big side cannot erase the small
   one in a day and a fortified border can hold. */
function isPressing(self,other){
  return !self.broken&&self.stance==="attack"&&self.moving==null&&
    (self.target===other.prov||self.target==null);
}
function sidePower(self,other,pressing){
  return pressing?attackPower(self):defencePower(self);
}
function battleTick(a,b){
  const aPress=isPressing(a,b), bPress=isPressing(b,a);
  const ap=sidePower(a,b,aPress), bp=sidePower(b,a,bPress);
  const total=ap+bp||1;
  const intensity=(aPress&&bPress)?1.15:(aPress||bPress)?1:.34;
  const width=Math.min(a.troops,b.troops);
  const ca=CO(a.owner), cb=CO(b.owner);
  const airA=1+(ca?ca.tech.air*.05:0), airB=1+(cb?cb.tech.air*.05:0);
  // A broken army is scattered, not standing in a line. It stops absorbing full damage,
  // which is what makes "walk into the city to finish them" the way it dies rather than
  // plain attrition quietly deleting it while nobody is looking.
  const bLoss=Math.max(1,Math.round(width*.038*(ap/total)*2*intensity*airA*(.7+rnd()*.6)*(b.broken?.45:1)));
  const aLoss=Math.max(1,Math.round(width*.038*(bp/total)*2*intensity*airB*(.7+rnd()*.6)*(a.broken?.45:1)));
  a.troops=Math.max(0,a.troops-aLoss);
  b.troops=Math.max(0,b.troops-bLoss);
  a._win=bLoss>aLoss; b._win=aLoss>bLoss;
  a._fighting=true; b._fighting=true;
  a._quiet=b._quiet=!aPress&&!bPress;
  checkBroken(a);checkBroken(b);
  return {aLoss,bLoss};
}
function checkBroken(a){
  if(a.troops<=0){destroyArmy(a,"wiped out");return;}
  if(!a.broken&&a.troops<=a.max*BROKEN_AT){
    a.broken=true;a.stance="defend";a.target=null;a.moving=null;a.eta=0;
    if(a.owner===G.you)toast(`${generalOf(a).name}'s army is broken.`,"war");
  }
  if(a.broken&&a.troops>a.max*BROKEN_AT*2)a.broken=false;   // rallied
}
/* Engagements are derived every tick from where armies actually stand, and this
   function is pure: the map calls it on every repaint, so it must not mutate anything.
   Each army fights its single strongest adjacent enemy. Letting one stack fight three
   neighbours at once turned a surrounded army into paste in four days and made the
   arrows unreadable. */
function engagements(){
  const seen=new Set(), out=[];
  for(const a of G.armies){
    if(a.moving!=null)continue;
    let best=null;
    for(const q of neighbors(a.prov)){
      if(q.sea)continue;
      for(const b of armiesAt(q.id)){
        if(b.owner===a.owner||b.moving!=null)continue;
        if(!atWar(a.owner,b.owner))continue;
        if(!best||b.troops>best.troops)best=b;
      }
    }
    if(!best)continue;
    const key=a.id<best.id?a.id+":"+best.id:best.id+":"+a.id;
    if(seen.has(key))continue;
    seen.add(key);
    // orient the pair so the player's army is the origin of its own arrow
    out.push(best.owner===G.you?{att:best,def:a}:{att:a,def:best});
  }
  return out;
}

/* ================================================================
   ORDERS
   ================================================================ */
/* Land provinces this army could reach by sea. Armies never stand on water, so the
   integrity rule "no army at sea" survives untouched: a crossing is a slow move between
   two coasts that share a stretch of water. Range is the navy tech level. */
function seaReach(fromPid,cid){
  const c=CO(cid);
  const lvl=c?(c.tech.navy||0):0;
  if(!lvl)return [];
  const from=PV(fromPid);
  if(!from)return [];
  let frontier=from.nb.map(PV).filter(q=>q&&q.sea);
  const seenSea=new Set(frontier.map(q=>q.id));
  const out=new Set();
  for(let hop=0;hop<lvl;hop++){
    const next=[];
    frontier.forEach(sq=>sq.nb.map(PV).forEach(q=>{
      if(!q)return;
      if(q.sea){if(!seenSea.has(q.id)){seenSea.add(q.id);next.push(q);}}
      else if(q.id!==fromPid&&!from.nb.includes(q.id))out.add(q.id);
    }));
    frontier=next;
    if(!frontier.length)break;
  }
  return [...out];
}
function crossingDays(cid){
  const c=CO(cid);
  return Math.max(3,7-(c?(c.tech.navy||0):0)-(c?(c.tech.logistics||0):0));
}
function canMove(a,pid){
  if(!a||a.moving!=null)return false;
  const p=PV(pid);
  if(!p||p.sea)return false;
  const bySea=!PV(a.prov).nb.includes(pid);
  if(bySea&&!seaReach(a.prov,a.owner).includes(pid))return false;
  if(p.owner!=null&&p.owner!==a.owner&&!atWar(a.owner,p.owner))return false;
  // may not slip past an enemy army into the ground it holds, unless falling back
  // into your own territory
  if(p.owner!==a.owner&&zocBlocked(p,a.owner))return false;
  return true;
}
function orderMove(a,pid){
  if(!canMove(a,pid))return false;
  const c=CO(a.owner);
  const bySea=!PV(a.prov).nb.includes(pid);
  a.moving=pid;
  a.eta=bySea?crossingDays(a.owner):Math.max(1,MOVE_DAYS-(c?c.tech.logistics:0)*.5|0);
  a.stance="defend";a.target=null;
  return true;
}
function orderAttack(a,pid){
  if(!a||a.broken||a.moving!=null)return false;
  const p=PV(pid);
  if(!p||p.sea||!PV(a.prov).nb.includes(pid))return false;
  if(p.owner==null||p.owner===a.owner)return false;
  if(!atWar(a.owner,p.owner))return false;
  a.stance="attack";a.target=pid;
  return true;
}
function orderHold(a){if(!a)return;a.stance="defend";a.target=null;a.moving=null;a.eta=0;}
/* A general was a name and a number the player could not touch. One button, one price,
   one reroll. He asked for generals as a tab; this is the smallest thing that makes the
   word mean something. */
const GENERAL_PP=25;
function replaceGeneral(cid,armyId){
  const c=CO(cid),a=AR(armyId);
  if(!c||!a||a.owner!==cid)return {ok:false};
  if(c.pp<GENERAL_PP)return {ok:false,msg:`Needs ${GENERAL_PP} political points.`};
  c.pp-=GENERAL_PP;
  const gi=G.generals.findIndex(g=>g.id===a.gen);
  if(gi>=0)G.generals.splice(gi,1);
  const g=newGeneral();a.gen=g.id;
  return {ok:true,name:g.name,skill:g.skill};
}
function orderRecruit(cid,pid){
  const c=CO(cid),p=PV(pid);
  if(!c||!p||p.owner!==cid||!p.city)return {ok:false,msg:"Recruit in a city you hold."};
  if(armiesOf(cid).length+c.build.filter(b=>b.kind==="army").length>=ARMY_MAX)
    return {ok:false,msg:`No headquarters free. ${ARMY_MAX} armies is the cap.`};
  const cost=recruitCost(cid);
  if(c.treasury<cost.money)return {ok:false,msg:"Not enough money."};
  if(c.workers<cost.workers)return {ok:false,msg:"Not enough workers."};
  c.treasury-=cost.money;c.workers-=cost.workers;
  c.build.push({kind:"army",prov:pid,left:RECRUIT_DAYS*8,
    size:Math.round(ri(20,28)*(1+bonusOf(c,"recruit")))});
  return {ok:true};
}
/* Reinforce is the verb he actually described: you feed manpower into a unit already
   at the front, you do not only conjure whole new stacks. It raises the ceiling as well
   as the count, so a veteran army grows rather than capping at its birth size. */
function reinforceCost(a){
  return {money:Math.round(26*Math.max(6,a.max-a.troops+6)),
          workers:Math.round(1.3*Math.max(6,a.max-a.troops+6))};
}
function orderReinforce(cid,armyId){
  const c=CO(cid),a=AR(armyId);
  if(!c||!a||a.owner!==cid)return {ok:false,msg:"No such army."};
  const p=PV(a.prov);
  if(!p||p.owner!==cid)return {ok:false,msg:"Reinforce in your own territory."};
  if(a.troops>=a.max+REINFORCE_OVER)return {ok:false,msg:"This army is at full strength."};
  const cost=reinforceCost(a);
  if(c.treasury<cost.money)return {ok:false,msg:"Not enough money."};
  if(c.workers<cost.workers)return {ok:false,msg:"Not enough workers."};
  c.treasury-=cost.money;c.workers-=cost.workers;
  const gain=Math.max(4,Math.round((a.max-a.troops)*.6)||6);
  a.troops+=gain;
  a.max=Math.max(a.max,a.troops);
  if(a.broken&&a.troops>a.max*BROKEN_AT*2)a.broken=false;
  return {ok:true,gain};
}
function orderFortify(cid,pid){
  const c=CO(cid),p=PV(pid);
  if(!c||!p||p.owner!==cid)return {ok:false,msg:"Fortify a province you hold."};
  if(p.fort>=4)return {ok:false,msg:"Already fortified as far as it goes."};
  const cost=fortCost(p);
  if(c.treasury<cost)return {ok:false,msg:"Not enough money."};
  c.treasury-=cost;p.fort++;
  return {ok:true};
}
function orderFactory(cid){
  const c=CO(cid);if(!c)return {ok:false};
  const cost=Math.round(900*(1+c.factories*.22));
  if(c.treasury<cost)return {ok:false,msg:"Not enough money."};
  c.treasury-=cost;c.build.push({kind:"factory",left:RECRUIT_DAYS*10});
  return {ok:true};
}
function factoryCost(c){return Math.round(900*(1+c.factories*.22));}
function techLocked(c,t){
  if(!t.req)return null;
  for(const k in t.req)
    if((c.tech[k]||0)<t.req[k])return `${TECH_BY[k].label} ${t.req[k]}`;
  return null;
}
function startResearch(cid,key){
  const c=CO(cid),t=TECH_BY[key];
  if(!c||!t)return {ok:false};
  if(c.research)return {ok:false,msg:"One project at a time."};
  if(c.tech[key]>=t.max)return {ok:false,msg:"Fully researched."};
  const lock=techLocked(c,t);
  if(lock)return {ok:false,msg:`Needs ${lock} first.`};
  const cost=Math.round(t.cost*(1+c.tech[key]*.55));
  if(c.treasury<cost)return {ok:false,msg:"Not enough money."};
  c.treasury-=cost;
  const days=Math.max(4,Math.round(t.days/(1+bonusOf(c,"research"))));
  c.research={k:key,left:days,total:days};
  return {ok:true};
}
function techCost(c,t){return Math.round(t.cost*(1+c.tech[t.k]*.55));}

/* ---- diplomacy orders ---- */
/* Both directions run through the same stance number, so the AI can never propose
   an alliance it would have refused coming the other way. */
function allianceOdds(from,to){
  const c=CO(to);if(!c)return 0;
  const r=rel(from,to);
  if(r.war||r.pact||r.justify||r.ready)return 0;
  if(alliesOf(from).length>=MAX_PACTS||alliesOf(to).length>=MAX_PACTS)return 0;
  const p=PERSONALITIES.find(x=>x.k===c.personality)||PERSONALITIES[2];
  let odds=.5+r.stance/200;                             // stance is the spine
  odds*=p.ally;                                          // personality tilts it
  const mine=provsOf(from).length, theirs=provsOf(to).length;
  odds*=theirs>mine*1.6?.75:mine>theirs*1.6?1.2:1;      // the weak seek the strong
  const enemies=bordersWith(to).filter(b=>atWar(to,b));
  if(enemies.length)odds*=1.3;                           // a country at war wants friends
  if(enemies.includes(from))return 0;
  alliesOf(to).forEach(a=>{if(atWar(from,a))odds*=.25;});// not while you fight my friend
  if(G.day-r.lastAsk<60)odds*=.35;                       // stop asking every week
  return clamp(odds,0,.95);
}
function proposeAlliance(from,to){
  const r=rel(from,to);
  const odds=allianceOdds(from,to);
  r.lastAsk=G.day;
  if(rnd()<odds){formPact(from,to,"defense");return true;}
  r.stance=clamp(r.stance-4,-100,100);
  return false;
}
function startJustify(from,to){
  const r=rel(from,to);
  const c=CO(from);
  if(!c||r.war||r.justify)return {ok:false,msg:"Nothing to justify."};
  // The write-up said nobody starts a war in the first year. It was gated on the AI
  // only, so the player could declare on day one and the sentence was a lie.
  if(G.day<OPENING_PEACE)
    return {ok:false,msg:`The world is at peace until ${dateStr(OPENING_PEACE)}.`};
  if(r.truce>G.day)return {ok:false,msg:"A truce is still in force."};
  if(!bordersWith(from).includes(to))return {ok:false,msg:"You share no border."};
  const target=CO(to);
  const cost=Math.round(JUSTIFY_PP*(1+(target?target.tech.nuke:0)*.7));
  if(c.pp<cost)return {ok:false,msg:`Needs ${cost} political points.`};
  c.pp-=cost;
  r.justify={by:from,until:G.day+JUSTIFY_DAYS};
  r.stance=clamp(r.stance-30,-100,100);
  logAdd(`${c.name} begins justifying a war against ${target.name}.`,"war");
  if(to===G.you)toast(`${c.name} is justifying a war on you.`,"war");
  return {ok:true};
}

/* ================================================================
   THE TICK
   One day. The order of these steps is the contract: money before spending,
   movement before combat, combat before capture, capture before collapse.
   Anything reordered here changes the game even though nothing else moves.
   ================================================================ */
function tick(){
  if(!G||G.you==null||G.defeat||G.victory)return;
  G.day++;
  economyStep();
  researchStep();
  buildStep();
  justifyStep();
  aiStep();
  movementStep();
  combatStep();
  replenishStep();
  captureStep();
  siegeDecay();
  collapseStep();
  if(G.day%20===0)integrityGuard("tick");
  if(G.day%10===0)saveGame(true);
}
function economyStep(){
  alive().forEach(c=>{
    c.treasury+=Math.round(netOf(c.id)/7);
    c.workers=Math.min(9999,Math.round((c.workers+workerGain(c.id)/7)*10)/10);
    c.pp=Math.min(400,c.pp+ppGain(c.id)/7);
    if(c.treasury<0){
      // Insolvency does not bankrupt you, it starves the army. Troops desert.
      const arms=armiesOf(c.id);
      if(arms.length){
        const a=pick(arms);a.troops=Math.max(0,a.troops-1);checkBroken(a);
        if(c.id===G.you&&G.day%10===0)toast("Treasury empty. Troops are deserting.","war");
      }
      c.treasury=Math.min(0,c.treasury+30);
    }
  });
}
function researchStep(){
  alive().forEach(c=>{
    if(!c.research)return;
    c.research.left-=1;
    if(c.research.left<=0){
      const t=TECH_BY[c.research.k];
      c.tech[c.research.k]=Math.min(t.max,c.tech[c.research.k]+1);
      if(c.id===G.you)toast(`${t.label} level ${c.tech[c.research.k]} complete.`,"good");
      c.research=null;
    }
  });
}
function buildStep(){
  alive().forEach(c=>{
    if(!c.build.length)return;
    const rate=buildRate(c.id);
    const b=c.build[0];
    b.left-=rate;
    if(b.left<=0){
      c.build.shift();
      if(b.kind==="army"){
        const p=PV(b.prov);
        const dest=(p&&!p.sea&&p.owner===c.id)?b.prov:(provsOf(c.id)[0]||{}).id;
        if(dest!=null){
          spawnArmy(c.id,dest,b.size);
          if(c.id===G.you)toast(`New army raised at ${PV(dest).name}.`,"good");
        }
      }else{
        c.factories++;
        if(c.id===G.you)toast("Factory finished.","good");
      }
    }
  });
}
function justifyStep(){
  for(const k in G.rel){
    const r=G.rel[k];
    // offers and demands carry an expiry, so they have to actually expire
    if(r.offer&&G.day>r.offer.until)r.offer=null;
    if(r.demand&&G.day>r.demand.until)r.demand=null;
    if(!r.justify)continue;
    if(G.day>=r.justify.until){
      const [a,b]=k.split(":").map(Number);
      const by=r.justify.by, on=(by===a?b:a);
      r.justify=null;
      const A=CO(by),B=CO(on);
      if(!A||!B||!A.alive||!B.alive)continue;
      // Neither side auto-fires. The player gets a Declare button; the AI gets one more
      // decision, so a pact signed or an army lost during the twenty days can still call
      // the whole thing off.
      r.ready={by,until:G.day+90};
      if(by===G.you)toast(`War on ${B.name} is now justified.`,"war");
      else if(on===G.you)toast(`${A.name} has finished justifying its war.`,"war");
    }
    if(r.ready&&G.day>r.ready.until)r.ready=null;
  }
}
/* Armies heal in their own territory. In v1 troops only ever fell, so a war in year
   twelve was two eight-man remnants shoving each other and upkeep solved itself the
   wrong way. This is a trickle, not a manpower pool: it rewards pulling a battered
   army home rather than feeding it. */
function replenishStep(){
  G.armies.forEach(a=>{
    if(a.troops>=a.max||a._fighting)return;
    const p=PV(a.prov);
    if(!p||p.owner!==a.owner)return;
    const c=CO(a.owner);
    if(!c||c.treasury<0)return;
    a.pool=(a.pool||0)+REPLENISH*(p.city?1.6:1)*(1+(c.tech.industry||0)*.08)*(1+bonusOf(c,"replenish"));
    while(a.pool>=1&&a.troops<a.max){a.pool-=1;a.troops++;}
    if(a.broken&&a.troops>a.max*BROKEN_AT*2)a.broken=false;
  });
}
function movementStep(){
  G.armies.slice().forEach(a=>{
    if(a.moving==null)return;
    a.eta-=1;
    if(a.eta>0)return;
    const dest=PV(a.moving);
    if(!dest||dest.sea){a.moving=null;a.eta=0;return;}
    // an enemy army standing there blocks the move and starts a fight instead
    const hostile=armiesAt(a.moving).filter(x=>x.owner!==a.owner&&atWar(a.owner,x.owner));
    if(hostile.length){
      const to=a.moving;a.moving=null;a.eta=0;
      if(!a.broken){a.stance="attack";a.target=to;}
      return;
    }
    moveArmyTo(a,a.moving);
  });
}
function combatStep(){
  G.armies.forEach(a=>{a._fighting=false;});
  // Stale orders are cleared here rather than inside engagements(), because the map
  // calls engagements() on every repaint and a paint must never change the world.
  G.armies.forEach(a=>{
    if(a.target==null)return;
    const tp=PV(a.target);
    if(!tp||tp.sea||tp.owner===a.owner||!PV(a.prov).nb.includes(a.target)){
      a.target=null;if(a.stance==="attack")a.stance="defend";
    }
  });
  engagements().forEach(({att,def})=>{
    if(!ARMY.has(att.id)||!ARMY.has(def.id))return;
    battleTick(att,def);
    G.stats.battles++;
  });
}
/* Capture is deliberately a separate step from combat, exactly as the reference game
   plays it: breaking an army marks it, and someone still has to walk into the city.
   That gap is where the tension lives. */
function captureStep(){
  G.armies.slice().forEach(a=>{
    if(a.broken||a.stance!=="attack"||a.target==null)return;
    const p=PV(a.target);
    if(!p||p.sea||p.owner===a.owner)return;
    if(!atWar(a.owner,p.owner))return;
    const holders=armiesAt(a.target).filter(d=>d.owner!==a.owner&&!d.broken);
    if(holders.length)return;                       // someone still standing, keep fighting
    // Walls hold even with nobody behind them. Without this a fortified capital with no
    // army in it fell to a single unopposed walk-in, which made every fort on the map
    // decoration and turned capitals falling into a weekly event.
    const need=siegeNeed(p);
    if(need>0){
      p.siege=Math.min(need,(p.siege||0)+attackPower(a)/12);
      if(p.siege<need)return;
    }
    // The siege is done, but a relief army next door still denies the ground.
    if(zocBlocked(p,a.owner))return;
    // walk in: any broken enemy sitting here is destroyed
    armiesAt(a.target).filter(d=>d.owner!==a.owner).forEach(d=>destroyArmy(d,"overrun"));
    const loser=p.owner, wasCap=p.capital;
    setProvinceOwner(a.target,a.owner);
    moveArmyTo(a,a.target);
    a.stance="defend";a.target=null;
    G.stats.taken++;
    if(a.owner===G.you)G.stats.mine=(G.stats.mine||0)+1;
    {const wr=relIfAny(a.owner,loser);
     if(wr&&wr.war){wr.taken=wr.taken||{};wr.taken[a.owner]=(wr.taken[a.owner]||0)+1;}}
    if(a.owner===G.you)toast(`${p.name} taken.`,"good");
    else if(loser===G.you)toast(`${p.name} lost.`,"war");
    logAdd(`${CO(a.owner).name} takes ${p.name} from ${CO(loser)?CO(loser).name:"nobody"}.`,"war");
    if(wasCap&&loser!=null)capitalFell(loser,a.owner);
  });
}
/* The reference game's rule with one condition on it: take the capital, take the
   country. The condition is that the country must already have lost half its land.
   Otherwise the government relocates and the war goes on. */
/* One writer for the seat of government, so p.capital and c.capital cannot drift. */
function setCapital(cid,pid){
  const c=CO(cid),p=PV(pid);
  if(!c||!p||p.sea||p.owner!==cid)return false;
  G.provinces.forEach(q=>{if(q.owner===cid)q.capital=false;});
  p.capital=true;p.city=true;c.capital=p.id;
  return true;
}
function capitalFell(loserId,winnerId){
  const L=CO(loserId);
  if(!L||!L.alive)return;
  const left=provsOf(loserId).length;
  if(left>0&&left>=Math.ceil((L.homeProvs||left)*CAPITULATE_AT)){
    // Relocate as far from the fighting as the remaining land allows. Picking the
    // biggest city instead put the new seat straight back on the front line, and the
    // capital then fell again every few weeks. Distance first, size second.
    const hostile=provsOf(loserId).length?G.provinces.filter(q=>!q.sea&&q.owner!=null&&
      q.owner!==loserId&&atWar(loserId,q.owner)):[];
    const seat=provsOf(loserId).map(q=>{
      let d=99;hostile.forEach(h=>{d=Math.min(d,Math.hypot(h.x-q.x,h.y-q.y)/HEX);});
      return {q,score:d*2+(q.city?3:0)+q.pop/300};
    }).sort((x,y)=>y.score-x.score)[0].q;
    setCapital(loserId,seat.id);seat.fort=Math.max(seat.fort,2);
    logAdd(`${L.name} moves its capital to ${seat.name} and fights on.`,"war");
    if(loserId===G.you)toast(`Capital lost. Government moves to ${seat.name}.`,"war");
    else if(winnerId===G.you)toast(`${L.name} relocates its capital.`);
    return;
  }
  annexCountry(loserId,winnerId);
}
function siegeNeed(p){
  if(!p||p.sea)return 0;
  // Open ground still takes a day or two to actually occupy. At zero, a war became a
  // footrace into each other's empty provinces and the two armies never met at all.
  return 6+(p.capital?60:0)+(p.city?16:0)+p.fort*11;
}
/* Zone of control. An unbroken army holds the ground next to it, so you cannot stroll
   past one into the province behind it. This is the single rule that turns a war from
   two armies swapping homelands into a front line that has to be pushed. */
function zocBlocked(prov,byOwner){
  return neighbors(prov.id).some(q=>
    armiesAt(q.id).some(x=>x.owner!==byOwner&&!x.broken&&atWar(byOwner,x.owner)));
}
/* A siege that nobody is pressing lifts. Stored on the province rather than derived,
   because it is real progress the player can see, but it decays fast so an abandoned
   assault does not leave a province half-taken for the rest of the game. */
function siegeDecay(){
  G.provinces.forEach(p=>{
    if(!p.siege)return;
    const pressed=G.armies.some(x=>x.stance==="attack"&&x.target===p.id&&!x.broken);
    if(!pressed)p.siege=Math.max(0,p.siege-siegeNeed(p)*.12);
  });
}
function collapseStep(){
  // a country with no provinces left is finished even if its capital never fell
  alive().forEach(c=>{
    if(c.id===G.you)return;
    if(provsOf(c.id).length===0){
      c.alive=false;
      armiesOf(c.id).slice().forEach(a=>destroyArmy(a));
      forgetRelations(c.id);
      logAdd(`${c.name} ceases to exist.`,"war");
    }
  });
  const me=you();
  if(me&&provsOf(G.you).length===0)G.defeat=true;
  if(alive().length===1&&alive()[0].id===G.you)G.victory=true;
}

/* ================================================================
   AI
   Countries act on their own initiative on a stagger, so the world does not move
   in lockstep. Personality tilts every roll rather than deciding it outright,
   which is what keeps them feeling authored instead of random.
   ================================================================ */
/* A country that is being justified against, or that is running a justification, is in
   a crisis and thinks every day instead of every four to nine. The twenty day timer
   exists so the other side can react; in v1 they kept doing peacetime wandering, so the
   telegraph was a political points tax and a wait rather than a build-up you can watch
   walking toward your border. */
function threatenedBy(cid){
  const out=[];
  for(const k in G.rel){
    const r=G.rel[k];
    if(!r.justify&&!r.ready)continue;
    const j=r.justify||r.ready;
    const [a,b]=k.split(":").map(Number);
    if(a!==cid&&b!==cid)continue;
    if(j.by===cid)continue;
    out.push(j.by);
  }
  return out;
}
function inCrisis(cid){
  if(threatenedBy(cid).length)return true;
  for(const k in G.rel){
    const r=G.rel[k];
    if(r.justify&&r.justify.by===cid)return true;
  }
  return false;
}
function aiStep(){
  alive().forEach(c=>{
    if(c.id===G.you)return;
    if(G.day<c.nextThink)return;
    c.nextThink=G.day+(inCrisis(c.id)?1:ri(4,9));
    const p=PERSONALITIES.find(x=>x.k===c.personality)||PERSONALITIES[2];
    aiEconomy(c,p);
    aiDiplomacy(c,p);
    aiCrisis(c,p);
    aiWar(c,p);
  });
}
function aiEconomy(c,p){
  if(!c.research&&rnd()<.55*p.research){
    const opts=TECH.filter(t=>c.tech[t.k]<t.max&&!techLocked(c,t)&&techCost(c,t)<=c.treasury*.5);
    if(opts.length){
      const want=atWar_any(c.id)?opts.filter(t=>t.col!=="Industry"):opts;
      startResearch(c.id,pick(want.length?want:opts).k);
    }
  }
  // patch up a battered army before paying for a whole new one
  const hurt=armiesOf(c.id).filter(x=>x.troops<x.max*.72&&PV(x.prov)&&PV(x.prov).owner===c.id);
  if(hurt.length&&rnd()<.7){
    const a2=hurt.sort((x,y)=>(x.troops/x.max)-(y.troops/y.max))[0];
    const rc=reinforceCost(a2);
    if(c.treasury>rc.money*1.8&&c.workers>rc.workers*1.4)orderReinforce(c.id,a2.id);
  }
  const cities=provsOf(c.id).filter(x=>x.city);
  const cost=recruitCost(c.id);
  const wantArmy=atWar_any(c.id)?.75:.3*p.aggro;
  if(cities.length&&rnd()<wantArmy&&c.treasury>cost.money*2.2&&c.workers>cost.workers*1.6)
    orderRecruit(c.id,pick(cities).id);
  if(rnd()<.22&&c.treasury>factoryCost(c)*2.5&&c.build.length<2)orderFactory(c.id);
  if(rnd()<.3&&c.treasury>2000){
    const front=provsOf(c.id).filter(x=>x.nb.some(n=>{const q=PV(n);return q&&!q.sea&&q.owner!=null&&q.owner!==c.id&&atWar(c.id,q.owner);}));
    if(front.length)orderFortify(c.id,pick(front).id);
  }
}
/* Twenty days of visible preparation: dig in on the threatened border, pull the field
   army onto it, buy a soldier, and go looking for a friend. */
function aiCrisis(c,p){
  const threats=threatenedBy(c.id);
  if(!threats.length)return;
  const hot=new Set();
  G.provinces.forEach(q=>{
    if(q.sea||q.owner!==c.id)return;
    if(q.nb.some(n=>{const z=PV(n);return z&&!z.sea&&threats.includes(z.owner);}))hot.add(q.id);
  });
  if(!hot.size)return;
  const front=[...hot].map(PV);
  // fortify the threatened border specifically, not just any border
  const weakest=front.filter(q=>q.fort<4).sort((x,y)=>x.fort-y.fort)[0];
  if(weakest&&c.treasury>fortCost(weakest)*1.5)orderFortify(c.id,weakest.id);
  // raise a soldier if there is a city to raise it in
  const cities=provsOf(c.id).filter(x=>x.city);
  const cost=recruitCost(c.id);
  if(cities.length&&c.treasury>cost.money*1.6&&c.workers>cost.workers*1.3&&rnd()<.5)
    orderRecruit(c.id,cities[0].id);
  // walk the army to the border they are about to come through
  armiesOf(c.id).forEach(a=>{
    if(a.moving!=null||a.broken||hot.has(a.prov))return;
    if(atWar_any(c.id))return;                       // a live war outranks a threat
    const goal=[...hot].sort((x,y)=>
      Math.hypot(PV(x).x-PV(a.prov).x,PV(x).y-PV(a.prov).y)-
      Math.hypot(PV(y).x-PV(a.prov).x,PV(y).y-PV(a.prov).y))[0];
    const step=stepToward(a.prov,goal,c.id,[]);
    if(step!=null)orderMove(a,step);
  });
  // and look for anyone who might stand with them
  if(rnd()<.5){
    const friend=alive().map(o=>o.id).filter(t=>t!==c.id&&!threats.includes(t)&&
      !hasPact(c.id,t)&&!atWar(c.id,t)&&allianceOdds(c.id,t)>.3);
    if(friend.length){
      const t=friend.sort((x,y)=>stanceOf(c.id,y)-stanceOf(c.id,x))[0];
      if(t===G.you){
        const r=rel(c.id,G.you);
        if(!r.offer){r.offer={from:c.id,until:G.day+30};r.lastAsk=G.day;
          toast(`${c.name} wants a pact. It is being threatened.`);}
      }else proposeAlliance(c.id,t);
    }
  }
}
function atWar_any(cid){return alive().some(c=>c.id!==cid&&atWar(cid,c.id));}
function aiDiplomacy(c,p){
  const nbrs=bordersWith(c.id).filter(b=>CO(b)&&CO(b).alive);
  const known=[...new Set([...nbrs,...alive().map(x=>x.id)])].filter(x=>x!==c.id);
  // ask someone for a pact
  if(rnd()<.45*p.ally){
    const cands=alliesOf(c.id).length>=MAX_PACTS?[]:
      known.filter(t=>!hasPact(c.id,t)&&!atWar(c.id,t)&&allianceOdds(c.id,t)>.45);
    if(cands.length){
      const t=cands.sort((a,b)=>stanceOf(c.id,b)-stanceOf(c.id,a))[0];
      if(t===G.you){
        // the AI approaching the player is a decision waiting in the Diplomacy tab,
        // not a thing that happens to them
        const r=rel(c.id,G.you);
        if(!r.offer&&G.day-(r.lastAsk||-999)>45){
          r.offer={from:c.id,until:G.day+30};r.lastAsk=G.day;
          toast(`${c.name} proposes a defence pact. Open Talks to answer.`);
          logAdd(`${c.name} proposes a defence pact.`);
        }
      }else if(proposeAlliance(c.id,t)){
        logAdd(`${c.name} and ${CO(t).name} sign a defence pact.`);
      }
    }
  }
  // distant nations have nothing to argue about, so opinion creeps back toward neutral
  alive().forEach(o=>{
    if(o.id===c.id||nbrs.includes(o.id)||atWar(c.id,o.id))return;
    const st=stanceOf(c.id,o.id);
    if(st<0)nudgeStance(c.id,o.id,.35);
  });
  // drift: neighbours you are not allied with slowly grate on each other
  nbrs.forEach(b=>{
    if(hasPact(c.id,b)){if(stanceOf(c.id,b)<PACT_DRIFT_CAP)nudgeStance(c.id,b,.25);}
    else if(!atWar(c.id,b))nudgeStance(c.id,b,rnd()<.5?-.4:.4);
  });
  // end wars: demand a province when clearly winning, take white peace when not
  alive().forEach(o=>{
    if(o.id===c.id||!atWar(c.id,o.id))return;
    const r=rel(c.id,o.id);
    const len=G.day-(r.warStart||G.day);
    const score=warScore(c.id,o.id);
    if(len>70&&score>4&&rnd()<.3){
      const want=demandableFrom(c.id,o.id)
        .sort((x,y)=>(y.city?1:0)-(x.city?1:0)||y.pop-x.pop)[0];
      if(want){
        if(o.id===G.you){
          // a demand aimed at the player is a decision that waits on Diplomacy
          if(!r.demand){r.demand={from:c.id,prov:want.id,until:G.day+40};
            toast(`${c.name} demands ${want.name} for peace.`,"war");
            logAdd(`${c.name} demands ${want.name} in exchange for peace.`,"war");}
        }else{
          termsOffer(c.id,o.id,"demand",want.id);
        }
        return;
      }
    }
    if(len<150)return;
    const weary=clamp((len-150)/900,0,.6);
    if(rnd()<.05+weary)makePeace(c.id,o.id);
  });
}
function aiWar(c,p){
  const r=rel;
  // cash in a ripe justification, or think better of it
  for(const k in G.rel){
    const rr=G.rel[k];
    if(!rr.ready||rr.ready.by!==c.id)continue;
    const [x,y]=k.split(":").map(Number);
    const target=x===c.id?y:x;
    const T=CO(target);
    if(!T||!T.alive){rr.ready=null;continue;}
    const mine=armiesOf(c.id).reduce((s,a)=>s+a.troops,0);
    const theirs=armiesOf(target).reduce((s,a)=>s+a.troops,0);
    // they armed up during the twenty days, or someone got in the way
    if(hasPact(c.id,target)||theirs>mine*1.15||alliesOf(target).some(al=>hasPact(c.id,al))){
      rr.ready=null;rr.stance=clamp(rr.stance+10,-100,100);
      logAdd(`${c.name} thinks better of its war on ${T.name}.`);
      continue;
    }
    rr.ready=null;
    declareWar(c.id,target);
  }
  const nbrs=bordersWith(c.id).filter(b=>CO(b)&&CO(b).alive);
  // start a justification against a weak, disliked neighbour
  // Nobody starts a war in the first year. Two of ten test worlds killed a player who
  // had done nothing wrong inside nine months, which is a bad way to learn a game.
  if(G.day>=OPENING_PEACE&&!atWar_any(c.id)&&rnd()<.085*p.aggro){
    const targets=nbrs.filter(b=>{
      const rr=r(c.id,b);
      return !rr.war&&!rr.justify&&!rr.pact&&rr.truce<G.day&&
        provsOf(b).length<provsOf(c.id).length*1.1&&rr.stance<5&&
        armiesOf(b).reduce((s,x)=>s+x.troops,0)<armiesOf(c.id).reduce((s,x)=>s+x.troops,0)*1.05;
    });
    if(targets.length){
      const t=targets.sort((a,b)=>(provsOf(a).length-stanceOf(c.id,a)/8)-(provsOf(b).length-stanceOf(c.id,b)/8))[0];
      startJustify(c.id,t);
    }
  }
  // a justification the AI paid for fires the moment it ripens (justifyStep handles it)
  // move and fight
  const enemies=alive().filter(o=>o.id!==c.id&&atWar(c.id,o.id)).map(o=>o.id);
  armiesOf(c.id).forEach(a=>{
    if(a.moving!=null)return;
    if(a.broken){
      // fall back toward home
      const safe=landNeighbors(a.prov).filter(q=>q.owner===c.id&&!armiesAt(q.id).some(x=>x.owner!==c.id));
      if(safe.length)orderMove(a,pick(safe).id);
      return;
    }
    if(!enemies.length){
      // peacetime: drift toward the border with whoever is least liked
      const front=provsOf(c.id).filter(q=>q.nb.some(n=>{const z=PV(n);return z&&!z.sea&&z.owner!=null&&z.owner!==c.id;}));
      if(front.length&&rnd()<.25){
        const step=landNeighbors(a.prov).filter(q=>q.owner===c.id);
        if(step.length)orderMove(a,pick(step).id);
      }
      a.stance="defend";a.target=null;
      return;
    }
    // if this army is sitting on a completed but blocked siege, go kill the blocker
    if(a.target!=null){
      const tp=PV(a.target);
      if(tp&&tp.siege>=siegeNeed(tp)&&zocBlocked(tp,c.id)){
        const blocker=landNeighbors(a.prov).find(q=>
          armiesAt(q.id).some(x=>x.owner!==c.id&&!x.broken&&enemies.includes(x.owner)));
        if(blocker){orderAttack(a,blocker.id);return;}
      }
    }
    const hostileAdj=landNeighbors(a.prov).filter(q=>q.owner!=null&&enemies.includes(q.owner));
    if(hostileAdj.length){
      // attack the softest adjacent target, unless badly outnumbered there
      const best=hostileAdj.map(q=>{
        const def=armiesAt(q.id).filter(d=>d.owner!==c.id&&!d.broken)
          .reduce((s,d)=>s+defencePower(d,q),0);
        return {q,def};
      }).sort((x,y)=>x.def-y.def)[0];
      if(best.def<attackPower(a)*(1.15*p.aggro))orderAttack(a,best.q.id);
      else {a.stance="defend";a.target=null;}
      return;
    }
    // no contact: step toward the nearest enemy province
    const goal=nearestEnemyProv(a.prov,enemies);
    if(goal!=null){
      const step=stepToward(a.prov,goal,c.id,enemies);
      if(step!=null)orderMove(a,step);
    }
  });
}
/* Breadth-first over the province graph. The map is 99 hexes, so a full search per
   army is cheap. If the map ever grows past a few hundred, cache this per country
   per tick instead of per army. */
function nearestEnemyProv(from,enemies){
  const seen=new Set([from]);let q=[from];
  for(let depth=0;depth<14&&q.length;depth++){
    const next=[];
    for(const pid of q){
      for(const nid of PV(pid).nb){
        if(seen.has(nid))continue;seen.add(nid);
        const n=PV(nid);if(!n||n.sea)continue;
        if(n.owner!=null&&enemies.includes(n.owner))return nid;
        next.push(nid);
      }
    }
    q=next;
  }
  return null;
}
function stepToward(from,goal,cid,enemies){
  const prev=new Map([[from,null]]);let q=[from];
  for(let depth=0;depth<16&&q.length;depth++){
    const next=[];
    for(const pid of q){
      for(const nid of PV(pid).nb){
        if(prev.has(nid))continue;
        const n=PV(nid);if(!n||n.sea)continue;
        if(n.owner!=null&&n.owner!==cid&&!enemies.includes(n.owner))continue;  // no trespassing
        prev.set(nid,pid);
        if(nid===goal){
          let cur=nid;while(prev.get(cur)!==from&&prev.get(cur)!=null)cur=prev.get(cur);
          return cur;
        }
        next.push(nid);
      }
    }
    q=next;
  }
  return null;
}

/* ================================================================
   INTEGRITY
   Throws in a harness, repairs quietly in play. Same stack as the football game:
   assert what must be true, fix what can be fixed, never take the game down.
   ================================================================ */
function assertWorldIntegrity(where){
  const errs=[];
  const seenA=new Set();
  G.armies.forEach(a=>{
    if(seenA.has(a.id))errs.push(`duplicate army id ${a.id}`);
    seenA.add(a.id);
    const p=PV(a.prov);
    if(!p)errs.push(`army ${a.id} on missing province ${a.prov}`);
    else if(p.sea)errs.push(`army ${a.id} at sea`);
    const c=CO(a.owner);
    if(!c)errs.push(`army ${a.id} owned by missing country ${a.owner}`);
    else if(!c.alive)errs.push(`army ${a.id} owned by dead country ${c.name}`);
    if(a.troops<0)errs.push(`army ${a.id} negative troops`);
