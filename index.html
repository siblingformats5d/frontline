<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Empire Conference</title>
<style>
/* ---------------------------------------------------------------------------
   PALETTE. A commissioner's office, not a stadium. Deep slate ground, one warm
   brass accent for the things only the commissioner controls, and six fixed
   pillar hues that never move so the scorecard is readable at a glance without
   its labels. -------------------------------------------------------------- */
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#252d38;
  --ink:#e6edf3; --dim:#8b95a1; --faint:#5d6773;
  --brass:#d8a657; --pos:#4ec9a0; --neg:#e5534b; --warn:#e3a008;
  --p-ath:#4ea8de; --p-pre:#d8a657; --p-aca:#a78bfa; --p-fac:#f2845c;
  --p-med:#4ec9a0; --p-per:#e0709a;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  padding-bottom:76px;
}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px;font-weight:650}
h2{font-size:18px;letter-spacing:-.01em;margin:0 0 8px;font-weight:600}
h3{font-size:13px;font-weight:600;margin:0;color:var(--dim);letter-spacing:.01em}
p{margin:0 0 10px}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 0}
.small{font-size:12.5px}
.muted{color:var(--dim)}
.faint{color:var(--faint)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .brass{color:var(--brass)}
.right{text-align:right}
.mono{font-variant-numeric:tabular-nums}

/* cards ------------------------------------------------------------------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px;margin:0 0 11px}
.card.act{border-color:#3a4a5e;background:linear-gradient(180deg,#1a222c,#161b22)}
.card.hi{border-color:var(--brass)}
.card.bad{border-color:var(--neg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row+.row{margin-top:6px}
.rowl{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 0;border-top:1px solid var(--line)}
.rowl:first-of-type{border-top:0}
.stack{display:flex;flex-direction:column;gap:1px;min-width:0}
.tr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* the scorecard: the one place the design spends its boldness -------------- */
.score{display:flex;flex-direction:column;gap:9px;margin-top:11px}
.pil{display:grid;grid-template-columns:96px 1fr 62px;align-items:center;gap:10px}
.pil .nm{font-size:12.5px;color:var(--dim)}
.pil .bar{height:9px;border-radius:5px;background:#11161d;overflow:hidden;position:relative}
.pil .fill{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pil .val{font-size:12.5px;text-align:right;color:var(--dim)}
.pil .val b{color:var(--ink);font-weight:600}
.pil .avg{position:absolute;top:-3px;bottom:-3px;width:2px;background:#4a5563}
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font-size:44px;font-weight:680;letter-spacing:-.03em;line-height:1}
.rk{font-size:15px;color:var(--dim)}
.delta{font-size:12.5px}

/* pills, tags, chips ------------------------------------------------------- */
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:#232c37;color:var(--dim)}
.pill.s0{background:#3d2f14;color:var(--brass)}
.pill.s1{background:#1e3340;color:#67b4dd}
.pill.s2{background:#2a2f38;color:#94a1b0}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:#232c37;color:var(--dim)}
.tag.up{background:#123028;color:var(--pos)}
.tag.dn{background:#37181a;color:var(--neg)}
.tag.hot{background:#3d2f14;color:var(--brass)}

/* controls ---------------------------------------------------------------- */
.btn{background:var(--brass);color:#171208;border:0;border-radius:8px;padding:9px 14px;
  font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:#232c37;color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.big{width:100%;padding:14px;font-size:16px;margin-top:11px}
.btn.danger{background:#3a1f21;color:#f0a3a0}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{background:#1b222b;color:var(--dim);border:1px solid var(--line);
  border-radius:7px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button.on{background:#2b3743;color:var(--ink);border-color:#3d4b5c}
.inp{width:100%;background:#11161d;border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:11px;font:inherit;margin:0 0 11px}
input[type=range]{width:100%;accent-color:var(--brass)}
.lk{color:#8fc6ea;cursor:pointer}
.lk:active{opacity:.6}

/* tables ------------------------------------------------------------------ */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--faint);font-weight:500;font-size:11.5px;padding:4px 5px}
td{padding:6px 5px;border-top:1px solid var(--line)}
tr.mine td{background:#1a2430}
td.n{text-align:right;color:var(--dim)}
td.rkc{color:var(--faint);width:26px;text-align:right}

/* nav --------------------------------------------------------------------- */
nav{position:fixed;left:0;right:0;bottom:0;background:#11161dee;
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
nav button{flex:1;background:0;border:0;color:var(--faint);font:inherit;font-size:10.5px;
  padding:5px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--brass)}
nav .ic{font-size:17px;line-height:1}

/* map --------------------------------------------------------------------- */
.mapbox{background:#0b0f14;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
svg.map{display:block;width:100%;height:auto}

/* misc -------------------------------------------------------------------- */
.sheet{position:fixed;inset:0;background:#000b;z-index:60;overflow:auto;padding:22px 12px}
.sheetin{max-width:620px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:15px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#242e3a;
  color:var(--ink);padding:10px 15px;border-radius:9px;font-size:13.5px;z-index:80;
  border:1px solid var(--line);max-width:88vw;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.fact{background:#11161d;border-radius:8px;padding:9px}
.fact b{display:block;font-size:15px}
.fact span{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;margin-bottom:9px;cursor:pointer}
.pick:active{border-color:var(--brass)}
.hook{font-size:13.5px;color:var(--brass);margin-top:7px;line-height:1.45}
.sparkrow{display:flex;align-items:flex-end;gap:2px;height:26px}
.sparkrow i{flex:1;background:#2e6f8e;border-radius:1px;min-height:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
/* ===========================================================================
   EMPIRE CONFERENCE
   A college athletic conference simulator. You are the commissioner. You do not
   coach. You decide who is in the room, who is on television, and where the
   money goes.

   THIS IS A REWRITE, not an evolution of the previous build. New save key, new
   data model, nothing migrates. The parts that survived from v1 are the ones
   that were already right: the movement doors, frozen rights AAV, conservative
   distribution, derived fixtures, and the discipline of never storing anything
   that can be recomputed.

   THE LOOP, which everything below serves:
     money  ->  academics + facilities + coaching pay
            ->  attracts coaches (personnel) and schools (values)
            ->  programs develop faster  ->  athletics this season
            ->  accumulates into prestige
            ->  prestige + media reach price the next television deal
            ->  money

   Media reach is the one pillar you cannot buy. It comes from where your
   schools are on the map. A small-market conference has to win on academics
   and facilities instead, which is a different climb, not a slower one.
   =========================================================================== */
"use strict";
const VER = 1;
const SAVE_KEY = "empire_conference_v1";

/* ---- shared math ---------------------------------------------------------- */
function rnd(a,b){ return a + Math.random()*(b-a) }
function ri(a,b){ return Math.floor(a + Math.random()*(b-a+1)) }
function pick(a){ return a[Math.floor(Math.random()*a.length)] }
function clamp(v,a,b){ return v<a?a:v>b?b:v }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=ri(0,i); [a[i],a[j]]=[a[j],a[i]] } return a }
function sum(a){ return a.reduce((x,y)=>x+y,0) }
function avg(a){ return a.length ? sum(a)/a.length : 0 }
function money(n){
  const v = Math.abs(n), sg = n<0 ? "-$" : "$";
  if(v>=1e9) return sg+(v/1e9).toFixed(2)+"B";
  if(v>=1e6) return sg+(v/1e6).toFixed(1)+"M";
  if(v>=1e3) return sg+Math.round(v/1e3)+"K";
  return sg+Math.round(v);
}

/* ---- calendar -------------------------------------------------------------
   ONE calendar for every sport. v1 split the year (football to week 11, then
   basketball) which meant six of the eight sports were invisible for the whole
   regular season and the weekly television choice was never a choice: in any
   given week only one sport was playing.

   Twelve weeks. Weeks 1-2 are non-conference so national rankings mean
   something across conferences, weeks 3-12 are conference play. Then every
   conference tournament resolves in one step, then every national bracket
   resolves in one step. ---------------------------------------------------- */
const SEASON_LEN = 12;
const NONCON_WEEKS = 2;

/* Games per team per week. Chosen so a full season lands near the real thing:
   12 football games, 24 basketball, 36 baseball, 12 gymnastics meets. */
const SPORTS = ["FB","MBB","WBB","VB","SOC","BSB","GYM","WRES"];
const SPORT_NAME = {
  FB:"Football", MBB:"Men's basketball", WBB:"Women's basketball", VB:"Volleyball",
  SOC:"Soccer", BSB:"Baseball", GYM:"Gymnastics", WRES:"Wrestling"
};
const SPORT_SHORT = { FB:"Football", MBB:"M Basketball", WBB:"W Basketball", VB:"Volleyball",
  SOC:"Soccer", BSB:"Baseball", GYM:"Gymnastics", WRES:"Wrestling" };
const PER_WEEK = { FB:1, MBB:2, WBB:2, VB:2, SOC:1, BSB:3, GYM:1, WRES:1 };

/* Revenue sports carry the television deal and the costs. A conference with no
   football is cheaper to run and has a far lower ceiling, which is a different
   game rather than a worse one. */
const REVENUE = ["FB","MBB"];
const NAMED_COACH = ["FB","MBB","WBB"];      // the three with a tracked person

/* What the scoreboard looks like, per sport. */
const SHAPE = {
  FB:  { events:5.2, pts:[7,3],  ot:true  },
  MBB: { events:26,  pts:[2,3],  ot:true  },
  WBB: { events:24,  pts:[2,3],  ot:true  },
  SOC: { events:1.5, pts:[1],    ot:false },
  BSB: { events:4.2, pts:[1],    ot:true  },
  WRES:{ events:9,   pts:[3],    ot:false },
  /* Volleyball is sets and gymnastics is a judged total out of 200. Running
     both through the same poisson as football printed 0-4 volleyball matches
     and 8-12 gymnastics meets, which read as broken next to a 24-17. */
  VB:  { sets:true },
  GYM: { judged:true }
};

/* ---- the six pillars ------------------------------------------------------
   Every one is 0-100 for a school, and a conference is the weighted composite
   of its members. Only two are bought directly. The order here is the order
   they appear on the dashboard and it is deliberate: the two you control are
   in the middle, the one you cannot control is at the bottom. ---------------- */
const PILLARS = [
  { key:"ath", name:"Athletics",   hue:"--p-ath", note:"how your members are doing right now" },
  { key:"pre", name:"Prestige",    hue:"--p-pre", note:"what they have done before this season" },
  { key:"aca", name:"Academics",   hue:"--p-aca", note:"classrooms, research, graduation" },
  { key:"fac", name:"Facilities",  hue:"--p-fac", note:"buildings, training, medical" },
  { key:"per", name:"Personnel",   hue:"--p-per", note:"the coaches who will take the job" },
  { key:"med", name:"Media reach", hue:"--p-med", note:"who can watch, and where they are" }
];
const PILLAR_KEYS = PILLARS.map(p => p.key);

/* ---- the map --------------------------------------------------------------
   A 100 x 62 grid shaped like the United States. Metros carry a population
   weight and every school has real coordinates, so a school outside Los Angeles
   reaches an audience a school in the mountains never will. This replaced v1's
   flat 1-to-5 market scalar, which made geography decorative. ---------------- */
const MAP_W = 100, MAP_H = 62;
const METROS = [
  ["Bayfront",      6,27,10],["Harbor City",  8,38,10],["Southgate",   10,44, 6],
  ["Cascade",       8, 7, 6],["Rivermouth",   5,13, 4],["Sunridge",   18,42, 7],
  ["Silverflats",  12,34, 4],["Highpoint",    30,30, 6],["Basin",      22,25, 3],
  ["Crossroads",   45,45, 9],["Gulfport",     48,52, 8],["Mission Bay",42,52, 4],
  ["Cedar Hill",   43,49, 5],["Rail Junction",48,30, 4],["Northlake",  52,15, 5],
  ["Lakeshore",    60,22,10],["Confluence",   56,31, 5],["Foundry",    67,20, 6],
  ["Ironbridge",   71,22, 4],["Chord",        63,38, 5],["Peachtree",  69,44, 8],
  ["Coral Bay",    79,60, 8],["Springhead",   77,56, 5],["Palmetto",   76,56, 4],
  ["Queenston",    74,39, 5],["The Capital",   79,30, 8],["Liberty",    82,26, 7],
  ["Empire Harbor",85,24,10],["Beacon",       89,18, 6],["Delta",      56,53, 3]
];
const REGIONS = [
  { key:"pac",  name:"Pacific",     test:(x,y)=> x<15 },
  { key:"mtn",  name:"Mountain",    test:(x,y)=> x<34 && y<38 },
  { key:"swt",  name:"Southwest",   test:(x,y)=> x<40 },
  { key:"pln",  name:"Plains",      test:(x,y)=> x<54 && y<34 },
  { key:"sth",  name:"South",       test:(x,y)=> x<66 && y>=38 },
  { key:"mwt",  name:"Midwest",     test:(x,y)=> x<74 && y<34 },
  { key:"sea",  name:"Southeast",   test:(x,y)=> y>=34 },
  { key:"nea",  name:"Northeast",   test:(x,y)=> true }
];
function regionOf(x,y){ return REGIONS.find(r => r.test(x,y)) || REGIONS[REGIONS.length-1] }
function dist(ax,ay,bx,by){ const dx=ax-bx, dy=ay-by; return Math.sqrt(dx*dx+dy*dy) }

/* Raw audience a location can reach. Every metro contributes, falling off with
   distance, so a school between two mid-size cities can beat one parked next to
   a single big one. Normalised into the 0-100 pillar later. */
function rawReach(x,y){
  return METROS.reduce((a,[,mx,my,pop]) => a + pop / (1 + Math.pow(dist(x,y,mx,my)/9, 1.7)), 0);
}
/* An invented name on a cartoon grid does not tell a player what kind of market
   they are looking at, and pasting real city names onto a rectangle is an IP
   problem the family project does not need. The gloss does the job instead. */
function marketGloss(x, y){
  const ns = y < 20 ? "northern" : y > 42 ? "southern" : "";
  const ew = x < 20 ? "west coast" : x < 40 ? "mountain" : x < 58 ? "central"
           : x < 74 ? "midwestern" : "east coast";
  return (ns ? ns + " " : "") + ew;
}
function nearestMetro(x,y){
  let best=null, bd=1e9;
  METROS.forEach(m => { const d=dist(x,y,m[1],m[2]); if(d<bd){bd=d;best=m} });
  return { name:best[0], d:bd, pop:best[3] };
}

/* ---- names ---------------------------------------------------------------- */
const PLACES = [
  "Ashford","Bellcreek","Cedarville","Dunmore","Eastvale","Fairmont","Granger","Hollis",
  "Ironwood","Jessup","Kingsbury","Larkin","Marbury","Northfield","Oakhurst","Pinecrest",
  "Quarry Ridge","Rowan","Stillwater","Thatcher","Underhill","Vandermere","Westbrook","Yarrow",
  "Alder","Brightwater","Calloway","Danbury","Elkhorn","Fenwick","Greenlake","Hartwell",
  "Inglewood","Jubilee","Kestrel Ridge","Longmeadow","Meridian","Norwood","Overton","Pembroke",
  "Redstone","Sableton","Tanglewood","Ulster","Vernon","Whitmore","Ximena Flats","Yorkfield",
  "Amberly","Blackrock","Coalport","Draytonville","Emberton","Fallbrook","Glenmoor","Havenport",
  "Ivyhurst","Jamesport","Kirkfield","Lodestone","Mayfair","Newhaven","Orchard Park","Prentice",
  "Rockbridge","Sandhill","Templeton","Union Gap","Vinemont","Waverly","Ashland Falls","Braeburn",
  "Chandler","Dovewood","Eastmoor","Foxglove","Gilead","Hampton Row","Ironside","Junction City",
  "Kenmore","Lakemont","Millbrook","Northgate","Oxbow","Pinehurst","Quill","Ravenna",
  "Silverton","Thornbury","Upland","Verity","Winslow","Yardley","Abbotsford","Bramblewood",
  "Castleton","Deerfield","Ellsworth","Fairhaven","Goldbank","Hazelton","Innisfree","Jasperville",
  "Knollwood","Lyndon","Mordant Hill","Nettleton","Ostergaard","Providence Bay","Quimby","Rosewood",
  "Sagebrook","Trentham","Umbria","Valemont","Westhaven","Yellow Creek","Alcott","Birchwood",
  "Colechester","Dunbarton","Elmridge","Fordham Vale","Glasswater","Holloway","Ithaca Falls","Jorvik",
  "Kilbourne","Langford","Merrivale","Nightingale","Oakenshaw","Pellworth","Quintrell","Rathmore",
  "Selby","Tallowfield","Ulverston","Vaughan","Whitfield","Yewbank","Amesbury","Bracknell",
  "Crestmoor","Dalefield","Edgemont","Fairweather","Gravesend","Hollybrook","Ironhaven","Jennerly"
];
const SUFFIX = [
  ["State",       28],["University", 20],["Tech",       12],["A&M",        10],
  ["College",     12],["Institute",   5],["Central",     4],["Southern",    3],
  ["Northern",     3],["Eastern",     3],["Western",     3],["Polytechnic", 2]
];
const COACH_FIRST = ["Marcus","Dell","Ray","Tobias","Hank","Curtis","Andre","Jim","Wes","Lamar",
  "Pete","Sylvester","Cordell","Bo","Chip","Nolan","Vince","Duane","Rico","Gus","Barry","Terrell",
  "Mack","Cyrus","Dwight","Otis","Freddie","Roland","Chase","Wendell","Angela","Dana","Renee",
  "Colleen","Marisol","Tanya","Yvette","Brenda","Simone","Patrice","Kendra","Nadia","Joanne","Rosalind"];
const COACH_LAST = ["Whitfield","Boone","Alvarado","Castellano","Grimes","Okafor","Sandoval","Pruitt",
  "Bannister","Delacroix","Hargrove","Mancuso","Yates","Fontaine","Sturgis","Ellingson","Rourke",
  "Vasquez","Kowalski","Petrosian","Adeyemi","Halloran","Nakashima","Beauchamp","Cardwell","Trent",
  "Osgood","Lindqvist","Machado","Farrow","Kinsella","Devereaux","Amundsen","Bellweather"];

/* ---- conferences ----------------------------------------------------------
   Twelve, four per stratum at the open. Each has a starting identity that is a
   real position on the scorecard rather than a label: the academic conference
   genuinely does have better classrooms and worse buildings. ---------------- */
const STRATUM_NAME = ["Power","Group","Mid-major"];
const CONF_MIN = 8, CONF_MAX = 16;
const CONF_DEFS = [
  { key:"atlantic", name:"Atlantic Coalition",  stratum:0, seed:{aca:74,fac:78,med:82}, x:80,y:30, fb:true  },
  { key:"heartland",name:"Heartland Alliance",  stratum:0, seed:{aca:62,fac:84,med:70}, x:58,y:25, fb:true  },
  { key:"southern", name:"Southern Compact",    stratum:0, seed:{aca:55,fac:86,med:66}, x:66,y:46, fb:true  },
  { key:"pacific",  name:"Pacific Union",       stratum:0, seed:{aca:80,fac:70,med:76}, x:12,y:30, fb:true  },
  { key:"summit",   name:"Summit League",       stratum:1, seed:{aca:66,fac:60,med:44}, x:30,y:28, fb:true  },
  { key:"gateway",  name:"Gateway Conference",  stratum:1, seed:{aca:58,fac:58,med:56}, x:52,y:34, fb:true  },
  { key:"tidewater",name:"Tidewater Association",stratum:1,seed:{aca:70,fac:52,med:60}, x:76,y:40, fb:true  },
  { key:"frontier", name:"Frontier Conference", stratum:1, seed:{aca:52,fac:56,med:40}, x:40,y:44, fb:true  },
  { key:"lyceum",   name:"Lyceum Group",        stratum:2, seed:{aca:88,fac:44,med:52}, x:84,y:22, fb:false },
  { key:"granite",  name:"Granite Conference",  stratum:2, seed:{aca:60,fac:42,med:34}, x:86,y:17, fb:false },
  { key:"prairie",  name:"Prairie Conference",  stratum:2, seed:{aca:54,fac:40,med:30}, x:48,y:18, fb:true  },
  { key:"delta",    name:"Delta Conference",    stratum:2, seed:{aca:48,fac:46,med:38}, x:58,y:52, fb:true  }
];

/* ---- economics ------------------------------------------------------------
   Every constant below is in SEASON-1 DOLLARS. Inflation is applied once, at
   the point of display or payment, through IN(). Nothing stored is inflated,
   so a deal signed in season 3 is still worth what it was worth in season 3. */
const INFL_RATE = 0.031;
function IN(G,v){ return Math.round(v * (G.infl || 1)) }

const RIGHTS_TIERS = [
  { name:"National broadcast",   tier:0, base:640e6, term:8, floor:0.72, win:{nat:3,reg:4} },
  { name:"National cable",       tier:1, base:340e6, term:7, floor:0.63, win:{nat:2,reg:4} },
  { name:"Regional network",     tier:2, base:150e6, term:6, floor:0.54, win:{nat:2,reg:3} },
  { name:"Syndication package",  tier:3, base:62e6,  term:5, floor:0.44, win:{nat:1,reg:3} },
  { name:"Streaming only",       tier:4, base:22e6,  term:4, floor:0.34, win:{nat:1,reg:2} }
];
/* Running costs. A football school costs far more to operate, which is the
   whole reason a conference without it is a different economic animal. */
const COST_FB      = 34e6;      // per football-sponsoring school, per season
const COST_BASE    = 7e6;       // per school, per season, before football
const COST_SPORT   = 1.35e6;    // per non-revenue program, per season
const TRAVEL_UNIT   = 210e3;    // per unit of average member separation

/* What a point of investment costs, and how fast it decays if you stop paying.
   Both academics and facilities SLIDE BACK when neglected: a building ages and
   a faculty leaves, so neither is a one-time purchase. */
const ACA_COST = 3.1e6, FAC_COST = 4.4e6;
/* Decay is PROPORTIONAL, not flat. A flat slide meant only a conference with
   television money could stand still, so the bottom of the table fell forever
   and the climb the whole game is about could not happen. Upkeep scaling with
   what you have built is also just true: a ninety million dollar arena costs
   more to keep than a field house, and a research faculty costs more to hold
   than a teaching one. It is the brake on the top and the floor under the
   bottom, from one rule. */
const ACA_DECAY_BASE = 0.14, ACA_DECAY_RATE = 0.017;
const FAC_DECAY_BASE = 0.18, FAC_DECAY_RATE = 0.024;
/* What the conference keeps off the top before the four-way split. Without a
   retained cut the shares summed to one and the conference banked nothing, so
   it could never cover an exit fee and realignment was closed to everyone
   except whoever started rich. */
const CONF_RETAIN = 0.10;

/* ===========================================================================
   THE MODEL
   Conference is club-shaped. School is player-shaped. Programs nest inside a
   school. NOTHING that can be derived is stored: no school-level overall, no
   conference-level pillar, no fixture list, no per-game log. Eleven thousand
   games get played a season and none of them are kept.
   =========================================================================== */

function newProgram(sport, band){
  const pot = clamp(Math.round(band + rnd(-11,13)), 22, 97);
  const ovr = clamp(Math.round(pot - rnd(2,20)), 18, 96);
  return { sport, ovr, pot, cycle: ri(-2,2), titles:0,
           tilt: ri(-9, 9),        // + offensive, - defensive. Rolled once, for good.
           rec:{ W:0, L:0 }, last:{ W:0, L:0 }, best:0, poll:0 };
}
function newCoach(sport, band){
  return {
    id: ++COACH_SEQ,
    name: pick(COACH_FIRST) + " " + pick(COACH_LAST),
    sport,
    prestige: clamp(Math.round(band + rnd(-16,16)), 8, 97),
    pay: 0,                       // set on hire, in season-1 dollars
    since: 1,
    wins: 0, losses: 0, rings: 0
  };
}
let COACH_SEQ = 0;

function newSchool(id, name, x, y, band, opt){
  opt = opt || {};
  const reg = regionOf(x,y);
  const s = {
    id, name, x, y, region: reg.key,
    conf: null, joined: 1, grant: 0,
    /* THE TWO YOU BUY. Both slide back if you stop paying for them. */
    aca: clamp(Math.round((opt.aca != null ? opt.aca : band) + rnd(-13,13)), 12, 96),
    fac: clamp(Math.round((opt.fac != null ? opt.fac : band) + rnd(-14,14)), 10, 95),
    /* THE ONE THAT ACCUMULATES. Seeded from where the school starts so a
       blueblood opens with a past and a new school opens with none. */
    pre: clamp(Math.round(band + rnd(-15,10)), 6, 94),
    reach: rawReach(x,y),                  // fixed by geography, forever
    awareness: 0,                          // the only way to move reach at all
    programs: [], coaches: {}, leadership: clamp(Math.round(band + rnd(-12,12)), 15, 92),
    budget: 0, presidentPatience: ri(52,84),
    /* WHAT THIS SCHOOL CARES ABOUT. Weights over the four things a conference
       can offer. They are what makes a school refuse a richer room. */
    values: null,
    archetype: opt.archetype || "balanced",
    history: [], titles: 0, seasonConf: null
  };
  return s;
}

/* Each school weighs a conference against its own priorities. An academic
   school will not sit at a table full of diploma mills however much the
   television deal pays, and a media-driven school does not care about the
   library. These weights always sum to one. */
const VALUE_SETS = {
  academic:  { aca:.50, ath:.14, med:.14, fac:.22, label:"academic standing" },
  competitor:{ aca:.10, ath:.42, med:.20, fac:.28, label:"winning" },
  showcase:  { aca:.12, ath:.24, med:.44, fac:.20, label:"exposure" },
  builder:   { aca:.18, ath:.22, med:.16, fac:.44, label:"facilities" },
  balanced:  { aca:.25, ath:.25, med:.25, fac:.25, label:"a bit of everything" }
};

function newConference(id, def){
  return {
    id, key: def.key, name: def.name,
    stratum: def.stratum, startStratum: def.stratum,
    x: def.x, y: def.y,
    members: [], budget: 0,
    rightsDeal: null,
    /* THE ALLOCATION. This is the game's central dial: four claims on the same
       money, re-set every offseason, and every one of them is somebody's
       season. They are shares, they always sum to one. */
    spend: { aca:.20, fac:.20, pay:.20, dist:.40 },
    /* How the distributed portion is split between members. */
    formula: { equal:.55, athWeight:.60, newShare:.40, newYears:3 },
    awareness: 0,
    titles: {}, titleSeasons: [], driftHist: [],
    ratings: [], restless: [],
    _pillars: null, _pillarStamp: null
  };
}

/* ---- accessors ------------------------------------------------------------ */
function S(G,id){ return G._sx ? G._sx[id] : G.schools.find(s => s.id === id) }
function C(G,id){ return id == null ? null : G.conferences.find(c => c.id === id) }
function reindex(G){ G._sx = {}; G.schools.forEach(s => G._sx[s.id] = s) }
function me(G){ return C(G, G.userConf) }
function progOf(s, sp){ return s.programs.find(p => p.sport === sp) }
function hasFB(s){ return !!progOf(s,"FB") }
function confHasFB(G,c){ return c.members.some(id => { const s=S(G,id); return s && hasFB(s) }) }

/* ===========================================================================
   THE SCORECARD
   Six numbers, 0-100, per school. Three are stored state (academics,
   facilities, prestige) and three are computed every time they are asked for
   (athletics, personnel, media reach). None of them are stored on a conference:
   a conference pillar is always the live composite of who is currently in it,
   which is the entire point of realignment.
   =========================================================================== */

/* Athletics: how the school is doing RIGHT NOW. Program strength carries most
   of it because a 2-0 start does not make you good, but results move it enough
   that a season visibly changes the dashboard. Revenue sports count double. */
function pAth(G, s){
  if(!s.programs.length) return 0;
  let w = 0, t = 0;
  s.programs.forEach(p => {
    const k = REVENUE.includes(p.sport) ? 2 : 1;
    const games = p.rec.W + p.rec.L;
    const form = games >= 3 ? (p.rec.W / games) * 100 : 50;
    const poll = p.poll ? clamp(100 - (p.poll - 1) * 2.4, 40, 100) : 0;
    w += k * (p.ovr * 0.58 + form * 0.27 + poll * 0.15);
    t += k;
  });
  return clamp(Math.round(w / t), 0, 100);
}
/* Personnel: the three tracked coaches, plus one leadership figure standing in
   for the other five programs. Deliberately not an average of a thousand
   numbers, because then it would be a constant. */
function pPer(G, s){
  const named = NAMED_COACH.filter(sp => progOf(s,sp)).map(sp => s.coaches[sp]).filter(Boolean);
  if(!named.length) return Math.round(s.leadership);
  const head = avg(named.map(c => c.prestige));
  return clamp(Math.round(head * 0.72 + s.leadership * 0.28), 0, 100);
}
/* Media reach: geography, and almost nothing else. Awareness spending is the
   one lever and it is deliberately weak, because you cannot move a campus. */
function pMed(G, s){
  const base = G._reachScale ? clamp((s.reach / G._reachScale) * 88, 3, 92) : 40;
  return clamp(Math.round(base + (s.awareness || 0) * 0.6), 0, 100);
}
function pillarsOf(G, s){
  /* Asked for constantly: twice per game when pricing a television window,
     once per school per pillar row, and eight times over for a conference
     composite. Cached against the clock; anything that moves a pillar bumps
     the clock rather than hunting down every reader. */
  const stamp = G._pstamp || 0;
  if(s._pc && s._pcs === stamp) return s._pc;
  s._pc = { ath:pAth(G,s), pre:Math.round(s.pre), aca:Math.round(s.aca),
            fac:Math.round(s.fac), per:pPer(G,s), med:pMed(G,s) };
  s._pcs = stamp;
  return s._pc;
}
function touchPillars(G){ G._pstamp = (G._pstamp || 0) + 1; G.conferences.forEach(c => c._pillarStamp = null) }

/* ---- conference composites ------------------------------------------------
   Three different maths, on purpose. If every pillar averaged the same way,
   every school would be worth the same to you and realignment would collapse
   into "take the highest number available".

   ATHLETICS and PRESTIGE are TOP HEAVY. The country judges a conference by its
   best programs, so a strong sixteenth member barely registers.

   ACADEMICS, FACILITIES and PERSONNEL are FLAT AVERAGES. One bad classroom
   drags the whole room, which is exactly why a school with standards will not
   join you until you clean it up.

   MEDIA REACH is a UNION, not an average. Two schools in the same city are
   worth barely more than one. A school in a market you do not have is worth
   enormously more than a better school next door to one you already own. That
   single difference is what makes the map a strategy rather than a picture.
   -------------------------------------------------------------------------- */
function topHeavy(vals){
  if(!vals.length) return 0;
  const s = vals.slice().sort((a,b) => b-a);
  let w = 0, t = 0;
  s.forEach((v,i) => { const k = Math.pow(0.82, i); w += v*k; t += k });
  return w/t;
}
function confReachRaw(G, ms){
  /* Union of coverage. Walk the metros: each is claimed by how well the single
     best-placed member covers it, plus a small bonus for depth. */
  let tot = 0;
  METROS.forEach(([,mx,my,pop]) => {
    let best = 0, second = 0;
    ms.forEach(s => {
      const v = 1 / (1 + Math.pow(dist(s.x,s.y,mx,my)/9, 1.7));
      if(v > best){ second = best; best = v } else if(v > second) second = v;
    });
    tot += pop * (best + second * 0.16);
  });
  return tot;
}
function confPillars(G, c){
  const stamp = G.season + ":" + G.week + ":" + c.members.length + ":" + c.members.join(",");
  if(c._pillarStamp === stamp && c._pillars) return c._pillars;
  const ms = c.members.map(id => S(G,id)).filter(Boolean);
  if(!ms.length){
    c._pillars = { ath:0, pre:0, aca:0, fac:0, per:0, med:0 };
    c._pillarStamp = stamp; return c._pillars;
  }
  const p = ms.map(s => pillarsOf(G,s));
  const out = {
    ath: Math.round(topHeavy(p.map(x=>x.ath))),
    pre: Math.round(topHeavy(p.map(x=>x.pre))),
    aca: Math.round(avg(p.map(x=>x.aca))),
    fac: Math.round(avg(p.map(x=>x.fac))),
    per: Math.round(avg(p.map(x=>x.per))),
    med: Math.round(clamp((confReachRaw(G,ms) / (G._confReachScale||1)) * 92 + c.awareness*0.5, 0, 100))
  };
  c._pillars = out; c._pillarStamp = stamp;
  return out;
}
/* One number for the header, and the thing you are actually trying to raise.
   Weighted toward what a television partner pays for, because that is what
   turns the dashboard back into money. */
/* Weighted toward what actually gets paid for, and deliberately NOT dominated
   by media reach. An early cut had media at 0.22 and the television deal at
   0.40, which made geography destiny: a mid-major could raise every pillar it
   was able to buy for thirty seasons and still not move a place in the table,
   because the one thing it could not change decided the whole number. Winning
   is the biggest term now, and winning is downstream of facilities and coaches,
   which is the climb the game is about. */
const COMPOSITE_W = { ath:.21, pre:.19, med:.20, fac:.16, aca:.12, per:.12 };
function composite(p){
  return Math.round(PILLAR_KEYS.reduce((a,k) => a + p[k]*COMPOSITE_W[k], 0));
}
function confScore(G,c){ return composite(confPillars(G,c)) }
function schoolScore(G,s){ return composite(pillarsOf(G,s)) }

/* National rank of a conference on any pillar, which is how every number on the
   dashboard is actually presented. A raw 68 means nothing. Fourth of twelve
   means everything. */
function confRankOn(G, c, key){
  const all = G.conferences.map(x => ({ id:x.id, v: key==="all" ? confScore(G,x) : confPillars(G,x)[key] }))
    .sort((a,b) => b.v - a.v);
  return all.findIndex(x => x.id === c.id) + 1;
}
function schoolRankOn(G, s, key){
  const all = G.schools.map(x => ({ id:x.id, v: key==="all" ? schoolScore(G,x) : pillarsOf(G,x)[key] }))
    .sort((a,b) => b.v - a.v);
  return all.findIndex(x => x.id === s.id) + 1;
}

/* ===========================================================================
   WORLD GENERATION
   =========================================================================== */
function genWorld(owner){
  COACH_SEQ = 0;
  const G = {
    ver: VER, owner: owner || "Commissioner", season: 1, week: 0, phase: "regular",
    infl: 1, schools: [], conferences: [], independents: [],
    news: [], log: [], story: null, lastWeek: null,
    exposure: { weekKey:null, nat:[], reg:[] },
    coachPool: [], saga: null, sagaLog: [], refused: {},
    window: { lost: [] }, userConf: null, failNow: null, scouted: []
  };

  /* --- schools. Placed near a metro or deliberately out in the country, so
     the media pillar has real spread rather than everyone being average. --- */
  const names = shuffle(PLACES.slice());
  let id = 1000, used = new Set();
  function placeName(){
    for(let i=0;i<300;i++){
      const p = names[(id + i*7) % names.length];
      let w = 0, r = Math.random()*sum(SUFFIX.map(x=>x[1]));
      let suf = SUFFIX[0][0];
      for(const [nm,wt] of SUFFIX){ w += wt; if(r <= w){ suf = nm; break } }
      const full = suf==="Central"||suf==="Southern"||suf==="Northern"||suf==="Eastern"||suf==="Western"
        ? suf + " " + p : p + " " + suf;
      if(!used.has(full)){ used.add(full); return full }
    }
    return "School " + id;
  }
  function spawn(cx, cy, spread, band, opt){
    let x, y, tries = 0;
    do {
      x = clamp(cx + rnd(-spread,spread), 3, MAP_W-3);
      y = clamp(cy + rnd(-spread,spread), 3, MAP_H-3);
      tries++;
    } while(tries < 12 && G.schools.some(s => dist(s.x,s.y,x,y) < 2.2));
    const s = newSchool(++id, placeName(), Math.round(x*10)/10, Math.round(y*10)/10, band, opt);
    G.schools.push(s);
    return s;
  }

  /* --- conferences --------------------------------------------------------- */
  CONF_DEFS.forEach((def, i) => {
    const c = newConference(i + 1, def);
    G.conferences.push(c);
    const n = def.stratum === 0 ? ri(11,13) : def.stratum === 1 ? ri(10,12) : ri(9,11);
    const band = def.stratum === 0 ? 71 : def.stratum === 1 ? 57 : 44;
    for(let k = 0; k < n; k++){
      const s = spawn(def.x, def.y, def.stratum===0 ? 17 : 13, band,
        { aca: def.seed.aca, fac: def.seed.fac });
      /* A conference without football has none of its members sponsoring it.
         Everything about their economy follows from this one flag. */
      buildPrograms(s, band, def.fb && Math.random() < (def.stratum===0?0.94:def.stratum===1?0.82:0.55));
      /* Rolled ONCE. It used to be rolled twice, so an "academic" school could
         carry competitor weights and the refusal message would name an axis the
         school does not actually care about, teaching the player the wrong
         lesson about their own conference. */
      const vk = pickValueSet(s, def);
      s.values = Object.assign({}, VALUE_SETS[vk]); s.values.set = vk;
      joinConf(G, s, c.id);
      s.grant = ri(2, 7);
      s.joined = 1;
    }
  });
  /* --- independents: the pool a commissioner actually shops in ------------- */
  for(let k = 0; k < 14; k++){
    const m = pick(METROS);
    const s = spawn(m[1] + rnd(-16,16), m[2] + rnd(-11,11), 6, ri(34,64), {});
    buildPrograms(s, 48, Math.random() < 0.5);
    const vk = pickValueSet(s, {stratum:2});
    s.values = Object.assign({}, VALUE_SETS[vk]); s.values.set = vk;
    s.conf = null; s.grant = 0;
    s.history = [{ conf:null, name:"Independent", in:1, out:null }];
    G.independents.push(s.id);
  }

  reindex(G);
  rescale(G);
  G.schools.forEach(s => seedCoaches(G, s));
  G.conferences.forEach(c => { c.rightsDeal = openingDeal(G, c); });
  refillCoachPool(G);
  return G;
}
function pickValueSet(s, def){
  const r = Math.random();
  if(def.stratum === 2 && def.key === "lyceum") return "academic";
  if(r < .22) return "academic";
  if(r < .46) return "competitor";
  if(r < .64) return "showcase";
  if(r < .82) return "builder";
  return "balanced";
}
/* Program slates. Football is the expensive fork in the road; everything else
   is breadth, which costs money and buys academics-adjacent goodwill. */
function buildPrograms(s, band, wantsFB){
  const slate = ["MBB","WBB"];
  if(wantsFB) slate.unshift("FB");
  const extras = shuffle(["VB","SOC","BSB","GYM","WRES"]);
  const n = ri(2, 5);
  for(let i = 0; i < n; i++) slate.push(extras[i]);
  s.programs = slate.map(sp => newProgram(sp, band + (REVENUE.includes(sp) ? 4 : -3)));
}
/* Reach is meaningless in absolute terms, so both scales are set once against
   the world that actually got generated. */
function rescale(G){
  G._reachScale = Math.max(...G.schools.map(s => s.reach)) || 1;
  G._confReachScale = Math.max(...G.conferences.map(c =>
    confReachRaw(G, c.members.map(id => S(G,id)).filter(Boolean)))) || 1;
}
function seedCoaches(G, s){
  const band = (s.pre * 0.5 + s.fac * 0.3 + s.aca * 0.2);
  NAMED_COACH.forEach(sp => {
    if(!progOf(s, sp)) return;
    const c = newCoach(sp, band);
    c.pay = coachAsk(G, c);
    c.since = 1;
    s.coaches[sp] = c;
  });
}

/* ===========================================================================
   MOVEMENT
   Every change of affiliation in the entire game goes through joinConf. There
   is no other way in or out. v1 had five doors and one of them (the saga) quietly
   skipped the membership floor; one door cannot disagree with itself.
   =========================================================================== */
function joinConf(G, s, confId){
  if(s.conf != null){
    const old = C(G, s.conf);
    if(old) old.members = old.members.filter(x => x !== s.id);
  }
  G.independents = G.independents.filter(x => x !== s.id);
  s.conf = confId;
  if(confId == null){
    G.independents.push(s.id);
    s.grant = 0;
    delete s.promised;
  }else{
    const c = C(G, confId);
    if(c && !c.members.includes(s.id)) c.members.push(s.id);
    s.joined = G.season;
  }
  /* The affiliation spine. history was allocated from the first build and never
     written, so a school sheet could not say where anybody had been. */
  s.history = s.history || [];
  const open = s.history[s.history.length - 1];
  if(open && open.out == null) open.out = G.season;
  s.history.push({ conf: confId, name: confId == null ? "Independent" : (C(G,confId)||{}).name,
                   in: G.season, out: null });
  if(s.history.length > 14) s.history.shift();
  G._dirty = true;
  G.conferences.forEach(c => c._pillarStamp = null);
  return true;
}
function exitFee(G, s){
  const p = pillarsOf(G, s);
  const worth = (p.med*1.5 + p.ath*1.1 + p.pre*1.0 + p.fac*0.6) * (hasFB(s) ? 1 : 0.55);
  /* The grant is the whole price. A school with four years left is genuinely
     hard to move and a school out of contract is nearly free, which is what
     makes re-signing your own members a real defence rather than a formality. */
  return IN(G, Math.round(worth * 0.26e6 * (0.35 + s.grant * 0.42)));
}
/* THE DEFENCE. Without it a commissioner watches members walk and has nothing
   to do about it but overpay somebody else's. Re-signing costs real money now
   against a raid that may never come, which is the shape a good decision has. */
function resignCost(G, c, s, years){
  const p = pillarsOf(G, s);
  const base = (p.med*1.4 + p.ath*1.1 + p.pre*0.9) * 0.19e6;
  const mood = s.presidentPatience < 45 ? 1.55 : s.presidentPatience < 65 ? 1.2 : 1;
  return IN(G, Math.round(base * years * mood));
}
function resignSchool(G, c, s, years){
  if(!c.members.includes(s.id)) return { ok:false, why:"not a member" };
  if(s.grant >= 7) return { ok:false, why:"they are already locked up" };
  const cost = resignCost(G, c, s, years);
  if(c.budget < cost) return { ok:false, why:"you cannot cover it" };
  if(s.presidentPatience < 22) return { ok:false, why:"they will not sign anything right now" };
  c.budget -= cost; s.budget += Math.round(cost * 0.7);
  s.grant = Math.min(8, s.grant + years);
  s.presidentPatience = clamp(s.presidentPatience + 7, 0, 100);
  return { ok:true, cost };
}

/* ---- WILL THEY COME? ------------------------------------------------------
   The best idea in the design and the one that turns realignment from an
   auction into a courtship. A school does not compare cheques. It compares the
   room to itself, on the axes it happens to care about.

   An academic school in a conference full of diploma mills will refuse a
   richer table, and the only way to change its mind is to spend seasons
   raising the conference's academics. That is a multi-season plan, which is
   what a commissioner is supposed to have.
   -------------------------------------------------------------------------- */
function joinFit(G, s, conf){
  const cp = confPillars(G, conf), sp = pillarsOf(G, s), v = s.values;
  const parts = {};
  ["aca","ath","med","fac"].forEach(k => {
    /* How much better or worse the room is than the school itself, in units of
       roughly one stratum. Weighted by how much this school cares. */
    parts[k] = v[k] * clamp((cp[k] - sp[k]) / 20, -2.4, 2.4);
  });
  return { total: sum(Object.values(parts)), parts };
}
function offerShare(G, conf, s){
  /* What this school would take home, roughly, if it joined tomorrow. */
  const rev = confRevenue(G, conf) * conf.spend.dist;
  const n = conf.members.length + 1;
  return Math.round(rev / n * (conf.formula.newShare));
}
function willJoin(G, s, conf){
  const fit = joinFit(G, s, conf);
  const from = s.conf != null ? C(G, s.conf) : null;
  const nowShare = s._lastShare || 0;
  const newShare = offerShare(G, conf, s);
  /* Money matters, but it is one term among several and it saturates. */
  const cash = clamp((newShare - nowShare) / Math.max(IN(G,18e6), nowShare || IN(G,18e6)), -1.2, 1.6);
  const climb = from ? (from.stratum - conf.stratum) * 0.55 : (2 - conf.stratum) * 0.42;
  const loyal = from && s.presidentPatience > 72 ? -0.5 : 0;
  const score = fit.total * 1.15 + cash * 0.85 + climb + loyal + rnd(-0.30, 0.30);

  if(score >= 0.18) return { ok:true, score, fit, newShare };
  /* Name the axis that actually killed it, so the refusal teaches something. */
  const worst = Object.keys(fit.parts).sort((a,b) => fit.parts[a] - fit.parts[b])[0];
  const label = { aca:"your academics", ath:"how your members are doing",
                  med:"the audience you reach", fac:"your facilities" }[worst];
  const why = fit.parts[worst] < -0.12
    ? label + " are below what they already have"
    : "the money does not move them";
  return { ok:false, score, fit, why, worst };
}
function tryInvite(G, conf, s){
  if(conf.members.length >= CONF_MAX) return { ok:false, why:"the conference is full" };
  if(G.refused[s.id])                 return { ok:false, why:"they already said no this window" };
  const from = s.conf != null ? C(G, s.conf) : null;
  if(from && from.id === conf.id)     return { ok:false, why:"already a member" };
  if(from && from.members.length <= CONF_MIN) return { ok:false, why:"their conference cannot go any smaller" };
  const fee = from ? exitFee(G, s) : 0;
  if(conf.budget < fee)               return { ok:false, why:"you cannot cover the exit fee" };
  const v = willJoin(G, s, conf);
  if(!v.ok){ G.refused[s.id] = true; return { ok:false, why:v.why, refused:true } }
  conf.budget -= fee;
  if(from) from.budget += fee;
  joinConf(G, s, conf.id);
  s.grant = 5;
  s.presidentPatience = clamp(s.presidentPatience + 12, 0, 100);
  G.news.push(s.name + " is joining the " + conf.name + ".");
  if(from && from.id === G.userConf) noteLost(G, s.id);
  checkFail(G);
  return { ok:true, fee };
}
function releaseSchool(G, conf, s){
  if(!conf.members.includes(s.id)) return { ok:false, why:"not a member" };
  if(conf.members.length <= CONF_MIN) return { ok:false, why:"that puts you under the floor" };
  joinConf(G, s, null);
  conf.members.map(id => S(G,id)).filter(Boolean).forEach(m =>
    m.presidentPatience = clamp(m.presidentPatience - 9, 0, 100));
  G.news.push("The " + conf.name + " released " + s.name + ".");
  if(conf.id === G.userConf){ noteLost(G, s.id); checkFail(G) }
  return { ok:true };
}
function noteLost(G, id){
  G.window = G.window || { lost:[] };
  G.window.lost = G.window.lost || [];
  if(!G.window.lost.includes(id)) G.window.lost.push(id);
}
function checkFail(G){
  if(!G || G.userConf == null) return null;
  const c = me(G);
  if(!c){ G.failNow = "gone"; return "gone" }
  if(c.members.length < CONF_MIN){ G.failNow = "membership"; return "membership" }
  if(!c.rightsDeal){ G.failNow = "rights"; return "rights" }
  return null;
}

/* ===========================================================================
   MONEY
   Two streams. The conference sells television rights and splits them. Each
   school earns its own gate and donations off its media reach and its results.
   A school without football earns much less and costs much less, which is the
   entire reason a non-football conference is a different game.
   =========================================================================== */
function schoolCost(G, s){
  const extras = s.programs.filter(p => !REVENUE.includes(p.sport)).length;
  const fb = hasFB(s) ? COST_FB : 0;
  /* Better facilities and better coaches cost more to run. Nothing you build
     is free to keep, which is what stops one-time purchases dominating. */
  const upkeep = s.fac * 0.16e6 + (s.aca * 0.09e6);
  const wages = NAMED_COACH.reduce((a,sp) => a + (s.coaches[sp] ? s.coaches[sp].pay : 0), 0);
  return IN(G, COST_BASE + fb + extras * COST_SPORT + upkeep) + IN(G, wages);
}
function schoolRevenue(G, s){
  const p = pillarsOf(G, s);
  const gate = p.med * 0.92e6 + p.ath * 0.58e6 + p.fac * 0.34e6 + p.pre * 0.26e6;
  return IN(G, Math.round(gate * (hasFB(s) ? 1 : 0.44)));
}
function travelCost(G, c){
  const ms = c.members.map(id => S(G,id)).filter(Boolean);
  if(ms.length < 2) return 0;
  const cx = avg(ms.map(s=>s.x)), cy = avg(ms.map(s=>s.y));
  const spread = avg(ms.map(s => dist(s.x,s.y,cx,cy)));
  return IN(G, Math.round(spread * ms.length * TRAVEL_UNIT));
}
function confSpread(G, c){
  const ms = c.members.map(id => S(G,id)).filter(Boolean);
  if(ms.length < 2) return 0;
  const cx = avg(ms.map(s=>s.x)), cy = avg(ms.map(s=>s.y));
  return avg(ms.map(s => dist(s.x,s.y,cx,cy)));
}

/* ---- television ----------------------------------------------------------
   The deal is signed ONCE and its annual value never moves for the life of the
   term. That is what makes a long deal at a low number a real trap and a short
   deal in a rising conference a real opportunity. What CAN move is a ratings
   haircut if the conference fails to deliver the audience it promised.

   Value is steeply superlinear in the composite. That is not a balance choice,
   it is what the actual market looks like: the gap between the top conference
   and the eighth is far larger than the gap in quality. -------------------- */
function dealValue(G, c, tierIdx){
  const p = confPillars(G, c);
  /* Only three pillars are things a network is buying. Academics and
     facilities reach the deal indirectly, by making the other three better. */
  const comp = p.med*0.37 + p.ath*0.37 + p.pre*0.26;
  const shoulder = comp <= 66 ? comp : 66 + (comp-66)*0.45;
  const ms = c.members.map(id=>S(G,id)).filter(Boolean);
  const fbShare = ms.length ? ms.filter(hasFB).length / ms.length : 0;
  const fb = 0.34 + fbShare * 0.66;                 // no football, a third of the money
  const size = clamp(0.72 + c.members.length * 0.026, 0.72, 1.14);
  /* Anchored at the middle of the range a generated world actually produces.
     The exponent is steep on purpose: the gap between the richest conference
     and the eighth is far larger than the gap in quality, and that is what
     makes the climb feel like a climb rather than a slope. */
  return IN(G, Math.round(170e6 * Math.pow(shoulder / 50, 5.2) * fb * size));
}
function tierFor(G, c){
  const p = confPillars(G, c);
  const comp = p.med*0.37 + p.ath*0.37 + p.pre*0.26;
  return comp >= 66 ? 0 : comp >= 56 ? 1 : comp >= 45 ? 2 : comp >= 34 ? 3 : 4;
}
function openingDeal(G, c){
  const t = tierFor(G, c), T = RIGHTS_TIERS[t];
  return {
    name: T.name, tier: t, aav: dealValue(G, c, t),
    term: T.term, signed: G.season - ri(0, T.term - 2),
    floor: T.floor, windows: { nat: T.win.nat, reg: T.win.reg }
  };
}
function dealYearsLeft(d, season){ return Math.max(0, d.term - (season - d.signed)) }
function offerDeal(G, c){
  const t = tierFor(G, c), T = RIGHTS_TIERS[t];
  return { name:T.name, tier:t, aav: dealValue(G, c, t), term:T.term,
           signed:G.season, floor:T.floor, windows:{ nat:T.win.nat, reg:T.win.reg } };
}
function confRevenue(G, c){ return c.rightsDeal ? c.rightsDeal.aav : 0 }

/* ===========================================================================
   THE ALLOCATION
   Four claims on one pot, re-set every offseason. Academics and facilities are
   the two you cannot buy any other way, coaching pay decides which coaches will
   answer, and distribution is what keeps your members from leaving. Starving
   any one of them is a strategy with a bill attached.
   =========================================================================== */
function normSpend(sp){
  const t = sp.aca + sp.fac + sp.pay + sp.dist;
  if(t <= 0){ sp.aca=sp.fac=sp.pay=0; sp.dist=1; return sp }
  sp.aca/=t; sp.fac/=t; sp.pay/=t; sp.dist/=t;
  return sp;
}
/* What a season of investment actually moves. Deliberately slow: a point of
   academics is roughly a season of a full conference's academic budget, so
   turning a diploma mill into a school an academic conference would join is a
   ten-season project, not a purchase. */
/* A conference builds things a single campus cannot: a shared medical and
   performance centre, one research consortium, one accreditation push. That is
   why conference money buys roughly twice what the same money buys inside a
   school, and it is the reason the allocation dial is worth touching at all.
   Without the advantage, handing every member cash and letting them spend it
   on themselves strictly dominated, and the central decision of the game was a
   trap. */
const CONF_INVEST_EDGE = 3.0;
function investStep(G, c, pot, key){
  const ms = c.members.map(id => S(G,id)).filter(Boolean);
  if(!ms.length || pot <= 0) return 0;
  const unit = IN(G, key === "aca" ? ACA_COST : FAC_COST);
  const points = (pot * CONF_INVEST_EDGE) / (unit * ms.length);
  ms.forEach(s => {
    /* Sharply diminishing near the ceiling. This is the brake on the top of
       the table: at eighty five, a full conference budget barely covers what
       the upkeep takes back, so a leader has to keep spending everything just
       to stand still while a challenger at forty converts the same money into
       real ground. Without it whoever started rich finished rich and the
       ladder was arithmetic, not a game. */
    const room = (100 - s[key]) / 100;
    s[key] = clamp(s[key] + points * (0.12 + Math.pow(room, 1.6) * 1.5), 0, 99);
  });
  return points;
}
function decayOf(s, key){
  return key === "aca" ? ACA_DECAY_BASE + s.aca * ACA_DECAY_RATE
                       : FAC_DECAY_BASE + s.fac * FAC_DECAY_RATE;
}
function decayPillars(G, c){
  c.members.map(id => S(G,id)).filter(Boolean).forEach(s => {
    s.aca = clamp(s.aca - decayOf(s,"aca"), 5, 99);
    s.fac = clamp(s.fac - decayOf(s,"fac"), 5, 99);
  });
}
/* A school spends its own surplus on itself, always, without being told. This
   is the baseline every campus holds on its own gate, and it is why the
   conference's allocation is an ACCELERATOR rather than the only thing keeping
   the lights on. A school with money maintains good buildings whoever it plays
   for. */
function schoolInvest(G, s){
  if(s.budget <= 0) return;
  const spend = s.budget * 0.26;
  const each = spend / 2;
  [["aca", ACA_COST], ["fac", FAC_COST]].forEach(([k, cost]) => {
    const pts = each / IN(G, cost);
    const room = (100 - s[k]) / 100;
    s[k] = clamp(s[k] + pts * (0.30 + room * 1.0), 0, 99);
  });
  s.budget -= Math.round(spend);
}

/* ---- distribution --------------------------------------------------------
   Conservative: what leaves the pot equals what arrives in the members, and
   what a new member gets on a reduced share is redistributed to the rest
   rather than vanishing. -------------------------------------------------- */
function distribute(G, c, pot0){
  const gross = (pot0 != null ? pot0 : confRevenue(G,c)) * c.spend.dist;
  const travel = travelCost(G, c);
  const pot = Math.max(0, gross - travel);
  c._lastTravel = travel;
  const ms = c.members.map(id => S(G,id)).filter(Boolean);
  if(!ms.length || pot <= 0) return [];
  const f = c.formula;
  const scores = ms.map(s => {
    const p = pillarsOf(G, s);
    return Math.max(1, p.ath * f.athWeight + p.med * (1 - f.athWeight));
  });
  const tot = sum(scores);
  const raw = ms.map((s,i) => pot * (f.equal / ms.length + (1 - f.equal) * scores[i] / tot));
  /* New members on a reduced share; the remainder goes back to the room. */
  const newby = ms.map(s => (G.season - s.joined) < f.newYears);
  let held = 0;
  const cut = raw.map((v,i) => { if(!newby[i]) return v; const k = v * f.newShare; held += v - k; return k });
  const fullIdx = ms.map((_,i)=>i).filter(i => !newby[i]);
  const fullTot = sum(fullIdx.map(i => cut[i])) || 1;
  fullIdx.forEach(i => cut[i] += held * (cut[i] / fullTot));
  const out = [];
  ms.forEach((s,i) => { const v = Math.round(cut[i]); s.budget += v; s._lastShare = v; out.push({ s, v }) });
  return out;
}

/* ===========================================================================
   COACHES
   Three tracked people per school, in the three sports where a name on the door
   changes what a program can be. Everything else runs on one leadership number
   that rises and falls with academics and facilities.

   The commissioner never hires a coach. That would be 426 decisions a season.
   The commissioner decides how much coaching money the conference sends its
   members, and whether the schools are places a good coach would go. Personnel
   is downstream of facilities, academics and prestige exactly the way you would
   expect: a great coach does not take a job at a bad school for scale.
   =========================================================================== */
function coachAsk(G, c){
  const mul = c.sport === "FB" ? 1.0 : c.sport === "MBB" ? 0.72 : 0.34;
  return Math.round(1.6e6 * Math.pow(Math.max(12, c.prestige) / 50, 2.3) * mul);
}
/* How good a job this is, from the coach's chair. Money is a term, not the
   term: prestige and facilities are what a coach is actually buying. */
function jobScore(G, s, sport, offer){
  const p = pillarsOf(G, s);
  const money = clamp(offer / Math.max(1, IN(G, 3.0e6)), 0, 3.4);
  return p.pre*0.30 + p.fac*0.26 + p.ath*0.16 + p.aca*0.10 + p.med*0.18 + money*9;
}
function schoolCoachFund(G, s){
  const c = s.conf != null ? C(G, s.conf) : null;
  const fromConf = c ? confRevenue(G, c) * c.spend.pay / Math.max(1, c.members.length) : 0;
  return Math.round(fromConf + schoolRevenue(G, s) * 0.11);
}
function refillCoachPool(G){
  while(G.coachPool.length < 26){
    const sp = pick(NAMED_COACH);
    const c = newCoach(sp, ri(22, 84));
    c.pay = coachAsk(G, c);
    G.coachPool.push(c);
  }
  if(G.coachPool.length > 60) G.coachPool.splice(0, G.coachPool.length - 60);
}
/* One market, once a season, after the money has moved. Coaches at the top get
   poached downward through the table, which is the brake on a runaway
   conference: winning makes your staff worth stealing. */
function coachMarket(G){
  const free = [];
  /* 1. retirements and departures */
  G.schools.forEach(s => {
    NAMED_COACH.forEach(sp => {
      const c = s.coaches[sp];
      if(!c) return;
      const tenure = G.season - c.since;
      const fund = schoolCoachFund(G, s);
      const underpaid = IN(G, c.pay) > fund * 0.62;
      const stale = tenure > ri(5, 13);
      const failing = c.wins + c.losses > 20 && c.wins / Math.max(1, c.wins + c.losses) < 0.34;
      if(stale || failing || (underpaid && Math.random() < 0.5)){
        delete s.coaches[sp];
        if(!stale || Math.random() < 0.6) free.push(c);
        if(s.conf === G.userConf) G.news.push(c.name + " has left " + s.name + ".");
      }
    });
  });
  /* 2. every unfilled job, best coaches choosing first */
  const jobs = [];
  G.schools.forEach(s => NAMED_COACH.forEach(sp => {
    if(progOf(s, sp) && !s.coaches[sp]) jobs.push({ s, sp, fund: schoolCoachFund(G, s) });
  }));
  const market = free.concat(G.coachPool).sort((a,b) => b.prestige - a.prestige);
  const taken = new Set();
  market.forEach(c => {
    const open = jobs.filter(j => !taken.has(j.s.id + ":" + j.sp) && j.sp === c.sport);
    if(!open.length) return;
    const ask = coachAsk(G, c);
    const can = open.filter(j => j.fund * 0.55 >= IN(G, ask));
    if(!can.length) return;
    can.forEach(j => j._sc = jobScore(G, j.s, j.sp, j.fund * 0.55));
    can.sort((a,b) => b._sc - a._sc);
    const j = can[0];
    c.pay = ask; c.since = G.season; c.wins = 0; c.losses = 0;
    j.s.coaches[c.sport] = c;
    taken.add(j.s.id + ":" + j.sp);
    G.coachPool = G.coachPool.filter(x => x.id !== c.id);
    if(j.s.conf === G.userConf) G.news.push(j.s.name + " hired " + c.name + ".");
  });
  /* 3. anything still open gets a nobody, so no program is ever coachless */
  jobs.filter(j => !j.s.coaches[j.sp]).forEach(j => {
    const c = newCoach(j.sp, clamp(j.fund / IN(G, 1.1e6) * 9, 10, 48));
    c.pay = coachAsk(G, c); c.since = G.season;
    j.s.coaches[j.sp] = c;
  });
  refillCoachPool(G);
}

/* ===========================================================================
   THE REST OF THE COUNTRY MOVES
   Without this the world only ever loses members: presidents walk out, nobody
   recruits them back, and after forty seasons every conference is sitting on
   the floor with thirty six schools stranded in the independent pool. Eleven
   other commissioners are doing the same job you are.
   =========================================================================== */
/* TIME AT THE TOP IS A COST. Proportional upkeep stopped a leader growing but
   never pushed it down, so whoever started first finished first. A conference
   that has sat in the Power band for years accumulates the things that actually
   break real ones: members who believe they are carrying everyone else, and a
   partner who has already paid for the audience and wants the next deal cheaper. */
function crownWeight(c){ return clamp((c._atTop || 0) - 4, 0, 14) }
function crownTick(G){
  G.conferences.forEach(c => {
    c._atTop = c.stratum === 0 ? (c._atTop || 0) + 1 : Math.max(0, (c._atTop || 0) - 2);
    const w = crownWeight(c);
    if(!w) return;
    c.members.map(id => S(G,id)).filter(Boolean).forEach(s => {
      /* The best school in a long-dominant room starts asking what it is for. */
      const p = pillarsOf(G, s);
      if(p.ath > confPillars(G,c).ath - 3) s.presidentPatience = clamp(s.presidentPatience - w*0.55, 0, 100);
    });
    if(c.rightsDeal && Math.random() < 0.06 + w*0.012){
      c.rightsDeal.aav = Math.round(c.rightsDeal.aav * (1 - 0.03 - w*0.004));
      if(c.id === G.userConf) G.news.push("Your partner renegotiated downward. They have already bought this audience.");
    }
  });
}
/* AWARENESS. The field existed from the first build and nothing spent it, so
   the comment promising it was the only way to move reach was a lie. It is a
   rare project rather than a fifth slice on the dial, because a fifth slice
   would fight the four-way decision the whole office is built around, and
   because geography is supposed to stay destiny. The cap is the point. */
const AWARE_CAP = 12;
function awareCost(G, c){
  return IN(G, Math.round(38e6 * Math.pow(1.55, (c.awareness || 0) / 3)));
}
function buyAwareness(G, c){
  if((c.awareness || 0) >= AWARE_CAP) return { ok:false, why:"there is nothing left to buy here" };
  const cost = awareCost(G, c);
  if(c.budget < cost) return { ok:false, why:"you cannot cover it" };
  c.budget -= cost;
  c.awareness = Math.min(AWARE_CAP, (c.awareness || 0) + 3);
  c.members.map(id => S(G,id)).filter(Boolean).forEach(s =>
    s.awareness = Math.min(AWARE_CAP, (s.awareness || 0) + 2));
  G.news.push("The " + c.name + " opened an overseas broadcast window.");
  return { ok:true, cost };
}
function confTarget(c){ return c.stratum === 0 ? 13 : c.stratum === 1 ? 12 : 11 }
/* ELEVEN OTHER COMMISSIONERS, AND THEY ARE NOT ALL GOOD AT THIS.
   With every conference running the same sensible allocation for forty seasons,
   the table never churned: whoever started on top finished on top and the climb
   the whole game is about was arithmetically closed. Real conferences overpay
   their members, starve their buildings, chase a television number and fall
   apart. Each AI office has a temperament, drifts, and occasionally has a bad
   decade, and that churn is the ladder. */
const AI_TEMPER = [
  { n:"builder",  aca:.22, fac:.34, pay:.16, dist:.28 },
  { n:"academic", aca:.36, fac:.18, pay:.14, dist:.32 },
  { n:"payer",    aca:.10, fac:.14, pay:.34, dist:.42 },
  { n:"populist", aca:.07, fac:.09, pay:.10, dist:.74 },   // buys peace, builds nothing
  { n:"balanced", aca:.20, fac:.22, pay:.20, dist:.38 }
];
function aiOffice(G){
  G.conferences.forEach(c => {
    if(c.id === G.userConf) return;
    if(!c._temper) c._temper = pick(AI_TEMPER).n;
    /* A change of commissioner. Rare, and it can be for the worse. */
    if(Math.random() < 0.055) c._temper = pick(AI_TEMPER).n;
    const t = AI_TEMPER.find(x => x.n === c._temper) || AI_TEMPER[4];
    ["aca","fac","pay","dist"].forEach(k => {
      c.spend[k] = clamp(c.spend[k] * 0.62 + t[k] * 0.38 + rnd(-0.03, 0.03), 0.02, 0.9);
    });
    normSpend(c.spend);
  });
}
function aiRealign(G){
  let moved = 0;
  /* Strongest conferences pick first, which is what makes the top of the table
     genuinely hostile to hold. */
  const order = G.conferences.filter(c => c.id !== G.userConf)
    .map(c => ({ c, v: confScore(G,c) })).sort((a,b) => b.v - a.v);
  order.forEach(({ c }) => {
    let want = confTarget(c) - c.members.length;
    if(want <= 0) return;
    const appetite = 1;
    want = Math.min(want, appetite);
    /* Independents first, they are free. Then a raid, which is not. */
    const pool = G.independents.map(id => S(G,id)).filter(Boolean)
      .concat(G.schools.filter(s => s.conf != null && s.conf !== c.id && s.grant <= 1 &&
        (C(G,s.conf) || {members:[]}).members.length > CONF_MIN));
    const ranked = pool.map(s => {
      const p = pillarsOf(G,s);
      /* Value to THIS conference, not in the abstract. A school in a market you
         already own is worth far less than one that opens a new city. */
      const before = confPillars(G,c).med;
      const after = clamp((confReachRaw(G, c.members.map(i=>S(G,i)).filter(Boolean).concat([s]))
                    / (G._confReachScale||1)) * 92, 0, 100);
      return { s, v: p.ath*0.9 + p.pre*0.7 + (after - before)*3.2 + p.fac*0.4 + p.aca*0.3
                    - exitFee(G,s)/IN(G,9e6) };
    }).sort((a,b) => b.v - a.v).slice(0, 14);
    for(const cand of ranked){
      if(want <= 0) break;
      /* Do not hoover up schools that do nothing for you. Leaving the weak end
         of the pool alone is what keeps a cheap first rung on the ladder. */
      if(cand.s.conf == null && cand.v < confScore(G,c) * 0.55) continue;
      const r = tryInvite(G, c, cand.s);
      if(r.ok){ want--; moved++ }
    }
  });
  G.refused = {};
  return moved;
}

/* ===========================================================================
   THE SCHEDULE
   Derived, every time, from current membership. Never stored, never patched.
   Eleven thousand games a season exist only long enough to move a win-loss
   record and then they are gone.
   =========================================================================== */
function bergerRounds(ids){
  const a = ids.slice();
  if(a.length % 2) a.push(null);
  const n = a.length, rounds = [];
  for(let r = 0; r < n - 1; r++){
    const pairs = [];
    for(let i = 0; i < n/2; i++){
      const h = a[i], v = a[n-1-i];
      if(h != null && v != null) pairs.push(r % 2 ? [v,h] : [h,v]);
    }
    rounds.push(pairs);
    a.splice(1, 0, a.pop());
  }
  return rounds;
}
function sportTeams(G, c, sp){
  return c.members.filter(id => { const s = S(G,id); return s && progOf(s, sp) });
}
function buildSchedule(G){
  const sch = {};
  SPORTS.forEach(sp => {
    const weeks = [];
    for(let w = 0; w < SEASON_LEN; w++) weeks.push([]);
    /* conference play, weeks 3 to 12 */
    G.conferences.forEach(c => {
      const ids = sportTeams(G, c, sp);
      if(ids.length < 2) return;
      const rounds = bergerRounds(ids);
      let k = 0;
      for(let w = NONCON_WEEKS; w < SEASON_LEN; w++){
        for(let g = 0; g < PER_WEEK[sp]; g++){
          (rounds[k % rounds.length] || []).forEach(([h,a]) =>
            weeks[w].push({ h, a, c:c.id }));
          k++;
        }
      }
    });
    /* non-conference, weeks 1 to 2. Drawn nationally so the polls have
       something to compare across conferences. */
    /* One pairing per slot, drawn from schools that have not already played in
       that slot, and never two members of the same conference: this is the
       non-conference block, and its whole job is to give the polls something
       comparable across the country. */
    const all = G.schools.filter(s => progOf(s, sp)).map(s => s.id);
    const met = new Set();
    const key = (a,b) => a < b ? a+":"+b : b+":"+a;
    for(let w = 0; w < NONCON_WEEKS; w++){
      for(let g = 0; g < PER_WEEK[sp]; g++){
        const pool = shuffle(all.slice());
        const used = new Set();
        for(let i = 0; i < pool.length; i++){
          const A = pool[i]; if(used.has(A)) continue;
          const sa = S(G, A);
          let j = -1;
          for(let k = i + 1; k < pool.length; k++){
            const B = pool[k]; if(used.has(B)) continue;
            const sb = S(G, B);
            if(sa.conf != null && sa.conf === sb.conf) continue;
            if(met.has(key(A,B))) continue;
            j = k; break;
          }
          if(j < 0) continue;
          const B = pool[j];
          used.add(A); used.add(B); met.add(key(A,B));
          weeks[w].push({ h:A, a:B, c:null, nc:true });
        }
      }
    }
    sch[sp] = weeks;
  });
  G.sched = sch;
  G._dirty = false;
}
function weekGames(G, sp, w){
  if(G._dirty || !G.sched) buildSchedule(G);
  return (G.sched[sp] && G.sched[sp][w-1]) || [];
}

/* ===========================================================================
   SIMULATION
   =========================================================================== */
function coachEdge(G, s, sp){
  if(NAMED_COACH.includes(sp)){
    const c = s.coaches[sp];
    return c ? (c.prestige - 50) * 0.13 : -4;
  }
  return (s.leadership - 50) * 0.075;
}
function strength(G, s, sp){
  const p = progOf(s, sp); if(!p) return 0;
  return p.ovr + coachEdge(G, s, sp) + (s.fac - 50) * 0.05;
}
function poisson(l){
  const L = Math.exp(-Math.min(l, 30));
  let k = 0, p = 1;
  do { k++; p *= Math.random() } while(p > L && k < 200);
  return k - 1;
}
function scoreFrom(sp, xg){
  const sh = SHAPE[sp];
  const eff = clamp(xg, 0.34, 2.3);
  let n = poisson(eff * sh.events), pts = 0;
  for(let i = 0; i < n; i++) pts += pick(sh.pts);
  return Math.round(pts);
}
/* OFFENCE AND DEFENCE. One stored number per program: a tilt rolled at
   generation and never developed separately. Offence is ovr plus the tilt,
   defence is ovr minus it, so a team is as good as its rating says and the
   split only decides HOW it wins. It feeds the scoreline and nothing else: two
   more numbers driving the athletics pillar would make the six-axis card noisy
   for no gain, and two more careers to develop is a model change nobody asked
   for. */
function offOf(G, s, sp){ const p = progOf(s,sp); return p ? p.ovr + (p.tilt||0) + coachEdge(G,s,sp) : 0 }
function defOf(G, s, sp){ const p = progOf(s,sp); return p ? p.ovr - (p.tilt||0) + coachEdge(G,s,sp) : 0 }
function tiltWord(t){ return t >= 5 ? "Offensive" : t <= -5 ? "Defensive" : "Balanced" }
function simGame(G, hId, aId, sp){
  const h = S(G,hId), a = S(G,aId);
  if(!h || !a || !progOf(h,sp) || !progOf(a,sp)) return null;
  /* What a side scores is its OFFENCE against the other side's DEFENCE, plus
     the home ground. An offensive team against a defensive one is a low score
     the offence still often wins. */
  const sh = SHAPE[sp];
  /* The gap is bounded and its weight falls with how many scoring events a
     sport has. An unbounded differential over 26 printed 80-10 football and
     101-34 basketball: in a high-event sport the law of large numbers should
     compress the scoreline, not stretch it. */
  const damp = (sh.events || 6) > 15 ? 0.45 : 1;
  const gap = (o, d, home) => 1 + clamp((offOf(G,o,sp) + (home?2.6:0) - defOf(G,d,sp)) / 38,
                                        -0.55, 0.55) * damp + rnd(-0.13, 0.13);
  const hx = gap(h, a, true), ax = gap(a, h, false);
  let hp, ap;
  if(sh.sets){
    /* Volleyball is first to three sets. */
    const p = clamp(0.5 + (hx - ax) * 0.66, 0.20, 0.80);
    hp = 0; ap = 0;
    while(hp < 3 && ap < 3){ if(Math.random() < p) hp++; else ap++ }
    return { h:hId, a:aId, hp, ap, sp, w: hp>ap?hId:aId, l: hp>ap?aId:hId };
  }
  if(sh.judged){
    /* Gymnastics is a judged total out of 200, and it is scored, not won on
       goals, so the home side gets a small bump rather than a scoring chance. */
    /* A judged total is a narrow band. Gymnastics meets are decided by tenths,
       so the spread here is small on purpose. */
    const sc = x => Math.round((185.2 + clamp(x,0.3,2.2) * 4.6 + rnd(-0.9,0.9)) * 100) / 100;
    hp = Math.min(199.5, sc(hx)); ap = Math.min(199.5, sc(ax));
    if(hp === ap) hp += 0.05;
    return { h:hId, a:aId, hp, ap, sp, w: hp>ap?hId:aId, l: hp>ap?aId:hId };
  }
  hp = scoreFrom(sp, hx); ap = scoreFrom(sp, ax);
  if(hp === ap){
    const d = (hx - ax) * 0.16;
    if(Math.random() < 0.5 + d) hp += pick(sh.pts); else ap += pick(sh.pts);
  }
  return { h:hId, a:aId, hp, ap, sp, w: hp>ap ? hId : aId, l: hp>ap ? aId : hId };
}
function applyResult(G, g){
  const w = S(G,g.w), l = S(G,g.l);
  const pw = progOf(w, g.sp), pl = progOf(l, g.sp);
  if(pw){ pw.rec.W++; if(NAMED_COACH.includes(g.sp) && w.coaches[g.sp]) w.coaches[g.sp].wins++ }
  if(pl){ pl.rec.L++; if(NAMED_COACH.includes(g.sp) && l.coaches[g.sp]) l.coaches[g.sp].losses++ }
}

/* ===========================================================================
   POLLS
   A national top 25 per sport, from a power rating rather than raw record,
   because with only twelve weeks and a conference schedule, records alone do
   not compare across the country. Cached per week; the cache is the only
   reason the dashboard is cheap enough to render eight times a screen.
   =========================================================================== */
function power(G, s, sp){
  const p = progOf(s, sp); if(!p) return -1;
  const g = p.rec.W + p.rec.L;
  const wp = g ? p.rec.W / g : 0.5;
  return strength(G,s,sp) * 0.62 + wp * 46 + Math.min(g, 12) * 0.4;
}
function pollFor(G, sp, top){
  const stamp = G.season + ":" + G.week + ":" + G.phase;
  if(!G._poll || G._poll.stamp !== stamp) G._poll = { stamp, v:{} };
  const key = sp + ":" + (top || 25);
  if(G._poll.v[key]) return G._poll.v[key];
  const list = G.schools.filter(s => progOf(s, sp))
    .map(s => ({ s, v: power(G,s,sp), rec: progOf(s,sp).rec }))
    .sort((a,b) => b.v - a.v).slice(0, top || 25)
    .map((x,i) => ({ rank:i+1, s:x.s, rec:x.rec, conf: x.s.conf!=null ? C(G,x.s.conf) : null }));
  G._poll.v[key] = list;
  return list;
}
function rankIn(G, sp, id){
  const r = pollFor(G, sp, 25).find(x => x.s.id === id);
  return r ? r.rank : 0;
}
function stampPolls(G){
  /* Write each program's current national rank onto it, so the athletics
     pillar can read it without recomputing eight polls per school. */
  SPORTS.forEach(sp => {
    G.schools.forEach(s => { const p = progOf(s,sp); if(p) p.poll = 0 });
    pollFor(G, sp, 25).forEach(x => { const p = progOf(x.s, sp); if(p) p.poll = x.rank });
  });
}

/* ===========================================================================
   THE WEEK
   One tap plays roughly a thousand games across eight sports. What comes back
   is not a table of a thousand scores, it is the five things that mattered and
   a dashboard that has moved.
   =========================================================================== */
function playWeek(G){
  if(G.phase !== "regular") return null;
  G.week++;
  const played = [];
  SPORTS.forEach(sp => {
    weekGames(G, sp, G.week).forEach(f => {
      const g = simGame(G, f.h, f.a, sp);
      if(g){ applyResult(G, g); g.conf = f.c; g.nc = !!f.nc; played.push(g) }
    });
  });
  touchPillars(G);
  stampPolls(G);
  touchPillars(G);
  ratingsTick(G, played);
  /* Last week's scores, kept only until the next tap. This is what makes the
     Sports tab a Saturday instead of a table: bounded to the games a member of
     yours played, so it is a few dozen rows and not eleven thousand. */
  const mineIds = me(G) ? new Set(me(G).members) : new Set();
  G.results = played.filter(g => mineIds.has(g.w) || mineIds.has(g.l))
    .map(g => ({ sp:g.sp, h:g.h, a:g.a, hp:g.hp, ap:g.ap, w:g.w }));
  G.story = weekStory(G, played);
  G.lastWeek = { season:G.season, week:G.week, n:played.length };
  weeklyNews(G);
  touchPillars(G);
  if(G.saga && G.week % 4 === 0) sagaLeak(G);
  return played;
}

/* ---- what mattered -------------------------------------------------------
   Ranked wins beat blowouts, upsets beat ranked wins, and anything involving a
   member of yours beats all of it, because the player is not a neutral. ------ */
function weekStory(G, played){
  const mine = me(G);
  const mineIds = mine ? new Set(mine.members) : new Set();
  const scored = played.map(g => {
    const w = S(G,g.w), l = S(G,g.l);
    const rw = rankIn(G,g.sp,g.w), rl = rankIn(G,g.sp,g.l);
    let v = 0;
    if(rl) v += 30 - rl;
    if(rw) v += (30 - rw) * 0.5;
    if(rl && (!rw || rw > rl + 8)) v += 26;                       // upset
    if(REVENUE.includes(g.sp)) v += 9;
    if(mineIds.has(g.w) || mineIds.has(g.l)) v += 34;
    return { g, v, w, l, rw, rl };
  }).sort((a,b) => b.v - a.v);
  if(!scored.length) return null;
  const top = scored[0];
  const line = (x) => {
    const wp = x.g.w === x.g.h ? x.g.hp : x.g.ap;
    const lp = x.g.w === x.g.h ? x.g.ap : x.g.hp;
    const rw = x.rw ? "#" + x.rw + " " : "";
    const rl = x.rl ? "#" + x.rl + " " : "";
    return rw + x.w.name + " beat " + rl + x.l.name + " " + wp + "-" + lp +
           " in " + SPORT_NAME[x.g.sp].toLowerCase();
  };
  return {
    lead: line(top),
    leadSport: top.g.sp,
    rest: scored.slice(1, 5).map(line)
  };
}

/* ===========================================================================
   TELEVISION WINDOWS
   The weekly decision, and now a real one: with every sport playing at once you
   are choosing across them. The volleyball team ranked second in the country or
   the football team sitting at 4 and 4 is a genuine question, and it was not
   one when the calendar was split and only one sport played per week.
   =========================================================================== */
const EXPO_FRESH = 3;
function exposureFatigue(s){
  const n = s._nat || 0;
  return n < EXPO_FRESH ? 1 : Math.max(0.42, 1 - (n - EXPO_FRESH + 1) * 0.11);
}
function freshWord(s){
  const f = exposureFatigue(s);
  return f >= 1 ? "" : f >= 0.78 ? "on a lot" : f >= 0.6 ? "over-exposed" : "nobody is watching";
}
/* Every game a member of yours plays next week, as a slot you could sell. */
function windowSlate(G, c){
  const w = G.week + 1;
  if(w > SEASON_LEN) return [];
  const mine = new Set(c.members);
  const out = [];
  SPORTS.forEach(sp => {
    weekGames(G, sp, w).forEach(f => {
      const home = mine.has(f.h), away = mine.has(f.a);
      if(!home && !away) return;
      const id = home ? f.h : f.a, opp = home ? f.a : f.h;
      const s = S(G,id), o = S(G,opp);
      if(!s || !o) return;
      out.push({
        key: sp + ":" + f.h + ":" + f.a, sp, id, opp,
        name: s.name, oppName: o.name,
        rank: rankIn(G,sp,id), oppRank: rankIn(G,sp,opp),
        derby: f.c === c.id,
        draw: gameDraw(G, c, s, o, sp, 1)
      });
    });
  });
  return out.sort((a,b) => b.draw - a.draw);
}
/* What a game is worth to the partner. Media reach dominates, the ranking of
   both sides matters, and a revenue sport is worth several of anything else. */
function gameDraw(G, c, s, o, sp, mult){
  const p = pillarsOf(G,s), q = pillarsOf(G,o);
  const base = (p.med*0.013 + p.ath*0.006 + q.med*0.004 + q.ath*0.003);
  const rk = (rankIn(G,sp,s.id) ? 0.28 : 0) + (rankIn(G,sp,o.id) ? 0.2 : 0);
  const sport = REVENUE.includes(sp) ? 1 : sp==="WBB"||sp==="BSB" ? 0.62 : 0.44;
  return clamp((base + rk) * sport * mult, 0.02, 2.6);
}
function assignWindows(G, c, natKeys, regKeys){
  const w = c.rightsDeal.windows;
  G.exposure = { weekKey: G.season + ":" + (G.week + 1),
                 nat: (natKeys||[]).slice(0, w.nat), reg: (regKeys||[]).slice(0, w.reg) };
}
function ratingsTick(G, played){
  G.conferences.forEach(c => {
    const w = c.rightsDeal && c.rightsDeal.windows; if(!w) return;
    const slate = c.id === G.userConf ? windowSlate(G, c) : null;
    let picks = [];
