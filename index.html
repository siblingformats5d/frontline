    if(c.id === G.userConf && G.exposure && G.exposure.weekKey === G.season + ":" + G.week){
      const byKey = {};
      (G._lastSlate || []).forEach(x => byKey[x.key] = x);
      picks = [[G.exposure.nat.map(k => byKey[k]).filter(Boolean), 1.0],
               [G.exposure.reg.map(k => byKey[k]).filter(Boolean), 0.45]];
    }else{
      /* Everyone else assigns greedily, so every conference has a ratings
         series and nobody is compared against a floor they never played. */
      const auto = autoSlate(G, c);
      picks = [[auto.slice(0, w.nat), 1.0], [auto.slice(w.nat, w.nat + w.reg), 0.45]];
    }
    let tot = 0, n = 0;
    picks.forEach(([list, mult]) => list.forEach(x => {
      const s = S(G, x.id); if(!s) return;
      const fat = mult === 1 ? exposureFatigue(s) : 1;
      tot += x.draw * mult * fat; n++;
      const p = progOf(s, x.sp);
      if(p) p.fame = clamp((p.fame||0) + (mult===1 ? 1.5*fat : 0.5), 0, 100);
      s._nat = (s._nat || 0) + (mult === 1 ? 1 : 0.35);
      s._expo = (s._expo || 0) + (mult === 1 ? 1 : 0.4);
    }));
    if(n){
      c.ratings = c.ratings || [];
      c.ratings.push(tot / n + (c.awareness || 0) * 0.004);
      if(c.ratings.length > 20) c.ratings.shift();
    }
  });
}
function autoSlate(G, c){
  const mine = new Set(c.members);
  const out = [];
  SPORTS.forEach(sp => {
    weekGames(G, sp, G.week).forEach(f => {
      const home = mine.has(f.h);
      if(!home && !mine.has(f.a)) return;
      const id = home ? f.h : f.a, opp = home ? f.a : f.h;
      const s = S(G,id), o = S(G,opp);
      if(s && o) out.push({ id, sp, draw: gameDraw(G,c,s,o,sp,1) });
    });
  });
  return out.sort((a,b) => b.draw - a.draw);
}
function ratingsAvg(c){ const r = c.ratings || []; return r.length ? avg(r) : 0 }

/* ---- the wire ------------------------------------------------------------ */
const NEWS_LINES = [
  s => "A donor at " + s.name + " has put their name on the new practice facility.",
  s => s.name + " opened a research institute the president will not stop mentioning.",
  s => "A grade scandal at " + s.name + " reaches the wire.",
  s => s.name + " sold out every seat for the first time in a decade.",
  s => "The " + s.name + " president is publicly unhappy with the television split.",
  s => "A rival conference was seen on campus at " + s.name + "."
];
function weeklyNews(G){
  if(Math.random() > 0.4) return;
  const c = me(G); if(!c || !c.members.length) return;
  const s = S(G, pick(c.members)); if(!s) return;
  const i = ri(0, NEWS_LINES.length - 1);
  G.news.push(NEWS_LINES[i](s));
  if(i === 0) s.fac = clamp(s.fac + 1.4, 0, 99);
  if(i === 1) s.aca = clamp(s.aca + 1.4, 0, 99);
  if(i === 2){ s.aca = clamp(s.aca - 2.2, 0, 99); s.presidentPatience = clamp(s.presidentPatience - 4, 0, 100) }
  if(i === 4) s.presidentPatience = clamp(s.presidentPatience - 6, 0, 100);
  if(i === 5 && !c.restless.includes(s.id)) c.restless.push(s.id);
  if(G.news.length > 60) G.news.splice(0, G.news.length - 60);
}

/* ===========================================================================
   POSTSEASON
   Every conference tournament resolves in one step. Then every national bracket
   resolves in one step. Eight sports, one calendar, two taps.
   =========================================================================== */
const FIELD = { FB:16, MBB:16, WBB:16, VB:16, BSB:16, SOC:16, GYM:8, WRES:8 };
const ROUND_NAME = { 16:"Round of 16", 8:"Quarter-finals", 4:"Semi-finals", 2:"Final" };

/* Standard recursive seeding. The one and two seeds meet in the FINAL, at every
   field size. The obvious pairing (1,n,2,n-1,...) is a correct first round and
   a broken bracket after it. */
function seedOrder(n){
  let o = [1];
  while(o.length < n){ const m = o.length*2 + 1; o = o.flatMap(x => [x, m - x]) }
  return o;
}
function runBracket(G, entries, sp){
  let n = 2; while(n*2 <= entries.length) n *= 2;
  if(n < 2) return { rounds:[], champ: entries[0] ? entries[0].id : null };
  const draw = entries.slice(0, n);
  let alive = seedOrder(n).map(seed => ({ id: draw[seed-1].id, seed }));
  const rounds = [];
  let guard = 0;
  while(alive.length > 1 && guard++ < 10){
    const next = [], games = [];
    for(let i = 0; i < alive.length; i += 2){
      const a = alive[i], b = alive[i+1];
      const g = simGame(G, a.id, b.id, sp) || { w:a.id, l:b.id, hp:0, ap:0 };
      applyResult(G, g);
      const win = g.w === a.id ? a : b, lose = g.w === a.id ? b : a;
      games.push({ w:win.id, l:lose.id, ws:win.seed, ls:lose.seed,
                   sc: g.w === g.h ? g.hp+"-"+g.ap : g.ap+"-"+g.hp });
      next.push(win);
    }
    rounds.push({ name: ROUND_NAME[alive.length] || ("Round of "+alive.length), games });
    alive = next;
  }
  return { rounds, champ: alive[0] ? alive[0].id : null };
}
function confStandings(G, c, sp){
  return sportTeams(G, c, sp).map(id => {
    const s = S(G,id), p = progOf(s,sp), g = p.rec.W + p.rec.L;
    return { id, s, W:p.rec.W, L:p.rec.L, pct: g ? p.rec.W/g : 0, pw: power(G,s,sp) };
  }).sort((a,b) => b.pct - a.pct || b.pw - a.pw);
}
function runConferenceRound(G){
  G.post = {};
  SPORTS.forEach(sp => {
    const champs = [];
    G.conferences.forEach(c => {
      const tbl = confStandings(G, c, sp);
      if(tbl.length < 4) return;
      const r = runBracket(G, tbl.slice(0, 8), sp);
      if(!r.champ) return;
      const s = S(G, r.champ);
      champs.push({ conf:c.id, confName:c.name, id:r.champ, name:s.name, sport:sp });
      c.titles[sp] = (c.titles[sp] || 0) + 1;
      c.titleSeasons.push({ season:G.season, kind:"conf", sport:sp, school:s.name });
      const p = progOf(s, sp); if(p) p.titles++;
      s.pre = clamp(s.pre + 0.9, 0, 100);
    });
    G.post[sp] = { champs, national:null };
  });
  if(G.conferences.length) trimTitles(G);
  G.phase = "national";
}
function runNationalRound(G){
  SPORTS.forEach(sp => {
    const p = G.post[sp]; if(!p) return;
    const size = FIELD[sp] || 8;
    const auto = p.champs.map(x => x.id);
    const pool = G.schools.filter(s => progOf(s,sp))
      .map(s => ({ id:s.id, v:power(G,s,sp) })).sort((a,b) => b.v - a.v);
    const field = [];
    const seen = new Set();
    pool.forEach(x => { if(auto.includes(x.id) && !seen.has(x.id)){ seen.add(x.id); field.push(x) } });
    pool.forEach(x => { if(field.length < size && !seen.has(x.id)){ seen.add(x.id); field.push(x) } });
    const r = runBracket(G, field.slice(0, size), sp);
    p.national = r;
    if(r.champ){
      const s = S(G, r.champ), c = s.conf != null ? C(G, s.conf) : null;
      p.championName = s.name; p.championConf = c ? c.name : "Independent";
      s.titles++; s.pre = clamp(s.pre + (REVENUE.includes(sp) ? 5.5 : 3.0), 0, 100);
      const pr = progOf(s, sp); if(pr) pr.titles++;
      if(c){
        c.titles[sp+"Nat"] = (c.titles[sp+"Nat"] || 0) + 1;
        c.titleSeasons.push({ season:G.season, kind:"nat", sport:sp, school:s.name });
      }
      if(NAMED_COACH.includes(sp) && s.coaches[sp]) s.coaches[sp].rings++;
      G.news.push(s.name + " won the " + SPORT_NAME[sp].toLowerCase() + " national title.");
    }
  });
  trimTitles(G);
  G.phase = "offseason";
}
function trimTitles(G){
  G.conferences.forEach(c => {
    if(c.titleSeasons.length > 220) c.titleSeasons.splice(0, c.titleSeasons.length - 220);
  });
}

/* ===========================================================================
   THE OFFSEASON
   The order below is load bearing. Anything that reads a pillar must run before
   the thing that changes it, and every number a president or a coach reacts to
   must be the number they were actually paid.
   =========================================================================== */
function endSeason(G){
  const user = me(G);
  /* 1  snapshot who played for whom, before anyone moves */
  G.schools.forEach(s => s.seasonConf = s.conf);

  /* 2  prestige absorbs the season. This is the ONLY writer of s.pre outside
        the title bumps, so nothing washes it at turnover. */
  G.schools.forEach(s => {
    const a = pAth(G, s);
    s.pre = clamp(s.pre * 0.88 + a * 0.12, 0, 100);
  });

  /* 3  presidents react to the season they just had */
  presidentTick(G);

  /* 4  the money. Revenue in, costs out, then the four-way allocation. */
  G.conferences.forEach(c => {
    const ms = c.members.map(id => S(G,id)).filter(Boolean);
    ms.forEach(s => { s.budget += schoolRevenue(G, s) - schoolCost(G, s) });
    const rev = confRevenue(G, c);
    normSpend(c.spend);
    /* The office keeps a tenth before anything is split. That retained cash is
       the war chest: exit fees, promises, and the reason a commissioner can act
       at all rather than only watch. */
    const keep = Math.round(rev * CONF_RETAIN);
    c.budget += keep;
    const pot = rev - keep;
    investStep(G, c, pot * c.spend.aca, "aca");
    investStep(G, c, pot * c.spend.fac, "fac");
    distribute(G, c, pot);
    /* pay share is not banked, it is what the members can offer a coach; it
       reaches the world through schoolCoachFund, not through a balance. */
  });
  /* Independents live entirely on their own gate. */
  G.independents.map(id => S(G,id)).filter(Boolean).forEach(s => {
    s.budget += schoolRevenue(G, s) - schoolCost(G, s);
  });

  /* 5  each campus spends its own surplus on itself, then everything slides
        back in proportion to what it costs to maintain */
  G.schools.forEach(s => schoolInvest(G, s));
  G.conferences.forEach(c => decayPillars(G, c));
  /* An independent pays for itself out of its own gate. It slides, but it
     slides toward a floor rather than to nothing, because the pool every
     commissioner shops in has to stay worth shopping in. */
  G.independents.map(id => S(G,id)).filter(Boolean).forEach(s => {
    s.aca = clamp(s.aca - decayOf(s,"aca")*1.25, 12, 99);
    s.fac = clamp(s.fac - decayOf(s,"fac")*1.25, 10, 99);
  });

  /* 6  programs develop. Facilities and the coach on the door decide how fast. */
  developTick(G);
  touchPillars(G);

  /* 7  the coach market, after the money has moved and before the next season */
  coachMarket(G);

  /* 8  television: the floor, then expiry */
  rightsTick(G);

  /* 9  stratum drift, then what it costs to have been there a while */
  driftTick(G);
  crownTick(G);

  /* 10 sagas */
  sagaHousekeeping(G);
  if(!G.saga && Math.random() < 0.5) startSaga(G);

  /* 11 the rest of the country moves */
  aiOffice(G);
  G.aiMoved = aiRealign(G);

  /* 12 reset the season ledger and roll the clock */
  const lost = (G.window && G.window.lost) || [];
  G.season++; G.week = 0; G.phase = "regular";
  G.infl *= (1 + INFL_RATE);
  G.refused = {};
  G.window = { lost: [] };
  if(G.news.length > 60) G.news.splice(0, G.news.length - 60);
  if(G.log.length > 120) G.log.splice(0, G.log.length - 120);
  G.schools.forEach(s => {
    s.programs.forEach(p => { p.last = { W:p.rec.W, L:p.rec.L }; p.rec = { W:0, L:0 } });
    s.grant = Math.max(0, s.grant - 1);
    delete s._nat; delete s._expo;
  });
  G.conferences.forEach(c => { c.ratings = []; c.restless = []; c._pillarStamp = null });
  G._dirty = true;
  rescale(G);
  stampPolls(G);
  return { fail: user ? failState(G, user, lost) : "gone" };
}
function failState(G, c, lost){
  if(!c) return "gone";
  if(c.members.length < CONF_MIN) return "membership";
  if(!c.rightsDeal) return "rights";
  return null;
}

/* ---- programs develop -----------------------------------------------------
   Toward potential, at a rate set by facilities, the coach, and money. This is
   where the loop closes: the two pillars you buy show up as wins two or three
   seasons later, never immediately. ---------------------------------------- */
function developTick(G){
  G.schools.forEach(s => {
    const band = IN(G, 30e6);
    const cash = clamp(Math.log10(1 + Math.max(0, s.budget) / band) * 1.7, 0, 2.0);
    const fac  = (s.fac - 50) * 0.035;
    s.programs.forEach(p => {
      const edge = coachEdge(G, s, p.sport);
      const gap = p.pot - p.ovr;
      const push = (cash + fac + edge*0.5 + 0.55) * (gap > 0 ? 1 : 0.35);
      p.ovr = clamp(p.ovr + push * clamp(gap/18, -1.4, 1.15) + p.cycle*0.5 + rnd(-1.1,1.1), 14, 99);
      /* Potential itself drifts with the school, slowly, both ways. */
      const pull = (s.fac*0.5 + s.aca*0.22 + s.pre*0.28) - p.pot;
      p.pot = clamp(p.pot + clamp(pull*0.045, -1.4, 1.4), 20, 99);
      p.cycle = clamp(p.cycle + ri(-1,1), -3, 3);
      p.fame = (p.fame || 0) * 0.88;
      p.best = Math.max(p.best || 0, p.ovr);
    });
    /* Leadership in the five untracked sports tracks the school itself. */
    const target = s.fac*0.42 + s.aca*0.34 + s.pre*0.24;
    s.leadership = clamp(s.leadership + clamp((target - s.leadership)*0.16, -3, 3), 8, 96);
  });
}

/* ---- presidents ----------------------------------------------------------- */
function presidentTick(G){
  G.conferences.forEach(c => {
    const ms = c.members.map(id => S(G,id)).filter(Boolean);
    const shares = ms.map(s => s._lastShare || 0);
    const mid = shares.length ? shares.slice().sort((a,b)=>a-b)[Math.floor(shares.length/2)] : 0;
    const cp = confPillars(G, c);
    ms.forEach(s => {
      const p = pillarsOf(G, s);
      let d = 3;
      if((s._lastShare||0) < mid*0.72) d -= 8;
      if((s._expo||0) < 2) d -= 7;
      /* A president compares the room to what the school itself is. Being the
         best school in a bad conference is the single most corrosive position
         in the game, which is exactly right. */
      const fit = joinFit(G, s, c).total;
      if(fit < -0.55) d -= 9; else if(fit > 0.35) d += 4;
      if(p.ath > 62) d += 4;
      if(s.promised && (s._lastShare||0) < mid) d -= 10;
      s.presidentPatience = clamp(s.presidentPatience + d, 0, 100);
      if(s.presidentPatience < 30 && !c.restless.includes(s.id)) c.restless.push(s.id);
    });
    /* Nobody walks out of a conference that is already at the floor. */
    ms.forEach(s => {
      if(c.members.length <= CONF_MIN) return;
      if(s.presidentPatience <= 8 && s.grant <= 0 && Math.random() < 0.55){
        joinConf(G, s, null);
        G.news.push(s.name + " has left the " + c.name + ".");
        if(c.id === G.userConf) noteLost(G, s.id);
      }
    });
  });
}

/* ---- television over time ------------------------------------------------- */
function rightsTick(G){
  G.conferences.forEach(c => {
    const d = c.rightsDeal; if(!d) return;
    /* No sample is not a miss. */
    if((c.ratings||[]).length && ratingsAvg(c) < d.floor && Math.random() < 0.32){
      d.aav = Math.round(d.aav * 0.9);
      if(c.id === G.userConf) G.news.push("Your partner cut what they pay. The audience was short of the floor.");
    }
    if(dealYearsLeft(d, G.season) <= 0){
      const next = offerDeal(G, c);
      c.rightsDeal = next;
      if(c.id === G.userConf)
        G.news.push("A new television deal: " + next.name + " at " + money(next.aav) + " a season for " + next.term + " years.");
    }
  });
}

/* ---- stratum drift -------------------------------------------------------- */
function driftTick(G){
  const ranked = G.conferences.map(c => ({ c, v: confScore(G,c) })).sort((a,b) => b.v - a.v);
  ranked.forEach((x,i) => { x.c.rank = i + 1 });
  const n = G.conferences.length;
  ranked.forEach((x,i) => {
    const want = i < n/3 ? 0 : i < (n*2)/3 ? 1 : 2;
    x.c.driftHist.push(want);
    if(x.c.driftHist.length > 6) x.c.driftHist.shift();
    const h = x.c.driftHist;
    if(h.length >= 3 && h.slice(-3).every(v => v === want) && x.c.stratum !== want){
      const up = want < x.c.stratum;
      x.c.stratum = want;
      G.news.push("The " + x.c.name + " " + (up ? "is now a " : "has dropped to ") + STRATUM_NAME[want] + " conference.");
    }
  });
}

/* ===========================================================================
   THE SAGA
   One school, one story, one decision, resolved in the window and never in the
   middle of a season. It is the only place the game speaks about a single
   president by name for weeks on end, and it is the emotional beat the rest of
   the dashboard cannot provide.
   =========================================================================== */
const SAGA_ROUNDS = 3;
const LEAKS = [
  s => "Sources say the " + s.name + " president met a rival commissioner privately.",
  s => "A charter flight from " + s.name + " was tracked to an unusual airport.",
  s => "The " + s.name + " athletic director declined three times to say they were staying.",
  s => "Two " + s.name + " trustees have gone quiet in public."
];
function startSaga(G){
  const c = me(G); if(!c || c.members.length <= CONF_MIN + 1) return;
  const ms = c.members.map(id => S(G,id)).filter(Boolean).filter(s => s.grant <= 2);
  if(!ms.length) return;
  const s = ms.sort((a,b) => a.presidentPatience - b.presidentPatience)[0];
  const suit = G.conferences.filter(x => x.id !== c.id && x.members.length < CONF_MAX)
    .map(x => ({ x, v: confScore(G,x) })).sort((a,b) => b.v - a.v).slice(0,3).map(x => x.x.id);
  if(!suit.length) return;
  G.saga = { school:s.id, suitors:suit, round:0, leaks:[], ripe:false, promised:false };
}
function sagaLeak(G){
  const sg = G.saga; if(!sg || sg.ripe) return;
  const s = S(G, sg.school); if(!s){ G.saga = null; return }
  sg.round++;
  const line = LEAKS[(sg.round - 1) % LEAKS.length](s);
  sg.leaks.push({ season:G.season, line });
  G.news.push(line);
  if(sg.round >= SAGA_ROUNDS) sg.ripe = true;
}
function sagaLoyalty(G, s){
  const c = s.conf != null ? C(G, s.conf) : null; if(!c) return 0;
  const fit = joinFit(G, s, c).total;
  return s.presidentPatience * 0.5 + fit * 22 + (s._expo || 0) * 1.6 + s.grant * 7;
}
function placate(G, s){
  const c = s.conf != null ? C(G, s.conf) : null; if(!c) return 0;
  const cost = Math.round(exitFee(G, s) * 0.2);
  if(c.budget < cost) return 0;
  c.budget -= cost; s.budget += cost;
  s.presidentPatience = clamp(s.presidentPatience + 20, 0, 100);
  s.promised = G.season;
  if(G.saga && G.saga.school === s.id) G.saga.promised = true;
  c.restless = c.restless.filter(id => id !== s.id);
  return cost;
}
function resolveSaga(G){
  const sg = G.saga; if(!sg) return;
  const s = S(G, sg.school);
  if(!s || s.conf == null){ G.saga = null; return }
  const from = C(G, s.conf);
  const best = sg.suitors.map(id => C(G,id)).filter(Boolean)
    .map(c => ({ c, v: willJoin(G, s, c) }))
    .filter(x => x.v.ok).sort((a,b) => b.v.score - a.v.score)[0];
  const loyal = sagaLoyalty(G, s) + (sg.promised ? 24 : 0);
  const stay = !best || loyal > 62 + rnd(-9, 9) || (from && from.members.length <= CONF_MIN);
  if(stay){
    s.presidentPatience = clamp(s.presidentPatience + 12, 0, 100);
    G.news.push(s.name + " is staying.");
    G.sagaLog.push({ season:G.season, school:s.name, stayed:true });
  }else{
    const fee = exitFee(G, s);
    best.c.budget -= fee; if(from) from.budget += fee;
    joinConf(G, s, best.c.id); s.grant = 5;
    G.news.push(s.name + " is leaving for the " + best.c.name + ".");
    G.sagaLog.push({ season:G.season, school:s.name, stayed:false, to:best.c.name, fee });
    if(from && from.id === G.userConf){ noteLost(G, s.id); checkFail(G) }
  }
  if(G.sagaLog.length > 40) G.sagaLog.shift();
  G.saga = null;
}
function sagaHousekeeping(G){
  const sg = G.saga; if(!sg) return;
  const s = S(G, sg.school);
  if(!s || s.conf == null){ G.saga = null; return }
  sg.suitors = sg.suitors.filter(id => C(G,id));
  if(!sg.suitors.length){ G.saga = null; return }
  if(sg.ripe) resolveSaga(G);
}

/* ===========================================================================
   PERSISTENCE
   Derived state never goes to disk. The schedule, the poll cache, the pillar
   cache and the reach scales are all rebuilt on load, because a save that
   carries a stale schedule can load last season's fixtures against this
   season's membership.
   =========================================================================== */
let G = null;
function serializeSave(){
  const g = Object.assign({}, G);
  delete g.sched; delete g._dirty; delete g._sx; delete g._poll;
  delete g._reachScale; delete g._confReachScale; delete g._tiles;
  g.conferences = G.conferences.map(c => {
    const k = Object.assign({}, c); delete k._pillars; delete k._pillarStamp; return k;
  });
  g.schools = G.schools.map(s => { const k = Object.assign({}, s); delete k.seasonConf; return k });
  return JSON.stringify(g);
}
function saveGame(){
  try { localStorage.setItem(SAVE_KEY, serializeSave()); return true }
  catch(e){ G.saveError = "The save did not write: " + e.message; return false }
}
/* Bump VER, then add a case. It is a no-op today ON PURPOSE: the switch has to
   exist before the first schema change, because the moment VER moves without
   one, every career in the wild hits the throw and has no way back. */
function migrateSave(g){
  if(!(g.ver >= 1) || g.ver > VER) return false;
  while(g.ver < VER){
    switch(g.ver){
      default: return false;
    }
  }
  return true;
}
function validateSave(g){
  if(!g || typeof g !== "object") throw new Error("not an object");
  if(g.ver > VER) throw new Error("save is newer than this build");
  if(g.ver !== VER && !migrateSave(g)) throw new Error("save version " + g.ver + ", expected " + VER);
  if(!Array.isArray(g.schools) || !g.schools.length) throw new Error("no schools");
  if(!Array.isArray(g.conferences) || !g.conferences.length) throw new Error("no conferences");
  if(g.userConf != null && !g.conferences.some(c => c.id === g.userConf)) throw new Error("your conference is missing");
  return true;
}
function loadGame(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(!raw) return false;
  try {
    const g = JSON.parse(raw);
    validateSave(g);
    G = g;
    hydrate();
    return true;
  } catch(e){
    G = null;
    LOAD_ERROR = "That save could not be opened: " + e.message;
    return false;
  }
}
let LOAD_ERROR = null;

/* Everything a half-written or hand-edited save could be missing. Every field
   dereferenced by a screen gets a default here, because a null in one tab used
   to take the whole career down for the rest of its life. */
function hydrate(){
  G.news = G.news || []; G.log = G.log || []; G.refused = G.refused || {};
  G.independents = G.independents || []; G.coachPool = G.coachPool || [];
  G.sagaLog = G.sagaLog || []; G.scouted = Array.isArray(G.scouted) ? G.scouted : [];
  G.window = G.window || { lost: [] }; G.window.lost = G.window.lost || [];
  G.exposure = G.exposure || { weekKey:null, nat:[], reg:[] };
  G.phase = G.phase || "regular";
  G.results = Array.isArray(G.results) ? G.results.slice(-120) : [];
  G._faults = Array.isArray(G._faults) ? G._faults.slice(-12) : [];
  if(typeof G.aiMoved !== "number") G.aiMoved = null;
  G.infl = G.infl > 0 ? G.infl : 1;
  G.schools.forEach(s => {
    s.programs = s.programs || [];
    s.programs.forEach(p => {
      p.rec = p.rec || { W:0, L:0 }; p.last = p.last || { W:0, L:0 };
      p.poll = p.poll || 0; p.fame = p.fame || 0; p.titles = p.titles || 0;
    });
    s.coaches = s.coaches || {};
    if(!s.values || !VALUE_SETS[s.values.set]){
      const k = (s.values && s.values.set) || "balanced";
      s.values = Object.assign({}, VALUE_SETS[VALUE_SETS[k] ? k : "balanced"]);
      s.values.set = VALUE_SETS[k] ? k : "balanced";
    }
    if(!(s.reach > 0)) s.reach = rawReach(s.x, s.y);
    ["aca","fac","pre","leadership"].forEach(k => { if(!(s[k] >= 0)) s[k] = 40 });
    s.awareness = s.awareness || 0;
    s.history = s.history || [];
    s.programs.forEach(p => { if(p.tilt == null) p.tilt = ri(-9,9) });
  });
  G.conferences.forEach(c => {
    c.members = Array.isArray(c.members) ? c.members : [];
    c.titles = c.titles || {}; c.titleSeasons = c.titleSeasons || [];
    c.driftHist = c.driftHist || []; c.ratings = c.ratings || []; c.restless = c.restless || [];
    c.spend = c.spend || { aca:.2, fac:.2, pay:.2, dist:.4 };
    ["aca","fac","pay","dist"].forEach(k => c.spend[k] = clamp(+c.spend[k] || 0, 0, 1));
    normSpend(c.spend);
    c.formula = c.formula || { equal:.55, athWeight:.6, newShare:.4, newYears:3 };
    c.formula.equal = clamp(+c.formula.equal || 0, 0, 1);
    c.formula.athWeight = clamp(+c.formula.athWeight || 0, 0, 1);
    c.formula.newShare = clamp(+c.formula.newShare || 0, .1, 1);
    c.formula.newYears = clamp(Math.round(+c.formula.newYears || 0), 0, 8);
    c.awareness = c.awareness || 0;
    c._atTop = c._atTop || 0;
    if(!c._temper && c.id !== G.userConf) c._temper = pick(AI_TEMPER).n;
    if(!(c._lastComp >= 0)) c._lastComp = null;
    if(!c.rightsDeal) c.rightsDeal = openingDeal(G, c);
    if(!c.rightsDeal.windows) c.rightsDeal.windows = { nat:2, reg:3 };
    c._pillarStamp = null;
  });
  reindex(G);
  repair(G);
  rescale(G);
  buildSchedule(G);
  stampPolls(G);
}
/* Self-healing. Anything that would violate an invariant gets put back rather
   than throwing, and the count is shown in the office so a silent repair is
   never actually silent. */
function repair(G){
  let n = 0;
  const seen = new Set();
  G.conferences.forEach(c => {
    c.members = c.members.filter(id => {
      const s = S(G, id);
      if(!s || seen.has(id)){ n++; return false }
      seen.add(id); s.conf = c.id; return true;
    });
  });
  G.schools.forEach(s => {
    if(s.conf != null && !seen.has(s.id)){ s.conf = null; n++ }
    if(s.conf == null && !G.independents.includes(s.id)){ G.independents.push(s.id); n++ }
    if(s.conf != null){ G.independents = G.independents.filter(x => x !== s.id) }
    if(s.conf == null && s.grant !== 0){ s.grant = 0; n++ }
    if(!s.programs.length){ buildPrograms(s, 40, false); n++ }
    NAMED_COACH.forEach(sp => {
      if(progOf(s,sp) && !s.coaches[sp]){ const c = newCoach(sp, 34); c.pay = coachAsk(G,c); c.since = G.season; s.coaches[sp] = c; n++ }
      if(!progOf(s,sp) && s.coaches[sp]){ delete s.coaches[sp]; n++ }
    });
  });
  if(G.news.length > 60){ G.news.splice(0, G.news.length - 60); n++ }
  G.conferences.forEach(c => { if(c.titleSeasons.length > 220){ c.titleSeasons.splice(0, c.titleSeasons.length - 220); n++ } });
  G._repaired = n;
  return n;
}
function integrityCheck(G){
  const errs = [];
  const seen = new Set();
  G.conferences.forEach(c => {
    if(c.members.length > CONF_MAX) errs.push(c.name + " is over the ceiling");
    c.members.forEach(id => {
      if(seen.has(id)) errs.push("school " + id + " is in two conferences");
      seen.add(id);
      const s = S(G,id);
      if(!s) errs.push("phantom member " + id);
      else if(s.conf !== c.id) errs.push(s.name + " disagrees about its conference");
    });
  });
  G.schools.forEach(s => {
    if(s.conf == null && s.grant > 0) errs.push(s.name + " is independent with a grant");
    if(s.conf != null && !C(G,s.conf)) errs.push(s.name + " points at no conference");
  });
  return errs;
}

/* ===========================================================================
   RENDER
   =========================================================================== */
let TAB = "dash", SPORT_TAB = "FB", SHEET = null;
const $ = h => { const d = document.createElement("div"); d.innerHTML = h;
  return d.children.length > 1 ? (()=>{ const f=document.createDocumentFragment();
    while(d.firstChild) f.appendChild(d.firstChild); return f })() : d.firstElementChild };
function on(el, sel, fn){ const n = el && el.querySelector(sel); if(n) n.onclick = fn; return n }
function wire(el){ if(el && el.querySelectorAll) el.querySelectorAll("[data-s]").forEach(b => b.onclick = () => openSchool(+b.dataset.s)) }
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2100);
}
const TABS = [["dash","▦","Dashboard"],["sports","◈","Sports"],["schools","▤","Schools"],
              ["window","⇄","Window"],["office","✎","Office"],["map","◉","Map"]];

/* Faults are RECORDED, not swallowed. A view that throws used to blank the app
   and take the nav with it, so the player could not even change tab. */
function integrityGuard(where){
  const e = integrityCheck(G);
  if(e.length){ G._faults = (G._faults||[]).concat(e.slice(0,3).map(x => where + ": " + x));
    if(G._faults.length > 12) G._faults.splice(0, G._faults.length - 12);
    repair(G); }
  return e.length;
}
let _lastTab = null;
function render(){
  const app = document.getElementById("app");
  if(!G){ renderStart(); return }
  const c = me(G);
  if(!c){ renderLost(); return }
  app.innerHTML = "";
  const el = $(`<div class="wrap"></div>`);
  header(el, c);
  const view = { dash:viewDash, sports:viewSports, schools:viewSchools,
                 window:viewWindow, office:viewOffice, map:viewMap }[TAB] || viewDash;
  try { view(el, c); }
  catch(err){
    G._renderFault = TAB + ": " + err.message;
    el.appendChild($(`<div class="card bad"><h3>This screen did not draw</h3>
      <div class="small">${err.message}</div>
      <div class="muted small" style="margin-top:6px">The rest of the game still works. Use the tabs
      below, and the Office has an export if you want the career off this device.</div></div>`));
  }
  app.appendChild(el);
  navBar();
  wire(el);
  /* Only jump to the top when the screen actually changed. Switching sport used
     to throw you back to the segment control every time. */
  if(_lastTab !== TAB){ window.scrollTo(0, 0); _lastTab = TAB }
}
function navBar(){
  const n = document.getElementById("nav");
  n.innerHTML = TABS.map(([k,i,l]) =>
    `<button data-t="${k}" class="${TAB===k?"on":""}"><span class="ic">${i}</span>${l}</button>`).join("");
  n.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { TAB = b.dataset.t; render() });
}
function header(el, c){
  const left = G.phase === "regular" ? "Week " + (G.week+1) + " of " + SEASON_LEN
             : G.phase === "conference" ? "Conference tournaments"
             : G.phase === "national" ? "National championships" : "The window";
  el.appendChild($(`<div class="row" style="margin-bottom:12px">
    <div class="stack"><h2 style="margin:0">${c.name}</h2>
      <span class="muted small">Season ${G.season} · ${left}</span></div>
    <span class="pill s${c.stratum}">${STRATUM_NAME[c.stratum]}</span></div>`));
}

/* ---- the scorecard, which is the whole product ---------------------------- */
function pillarBlock(pil, rankFn, avgFn){
  return `<div class="score">${PILLARS.map(p => {
    const v = pil[p.key], r = rankFn(p.key), a = avgFn ? avgFn(p.key) : null;
    return `<div class="pil">
      <span class="nm">${p.name}</span>
      <span class="bar"><span class="fill" style="width:${clamp(v,0,100)}%;background:var(${p.hue})"></span>
        ${a!=null?`<span class="avg" style="left:${clamp(a,0,100)}%"></span>`:""}</span>
      <span class="val"><b>${v}</b> ${r?`<span class="faint">#${r}</span>`:""}</span></div>`;
  }).join("")}</div>`;
}
function viewDash(el, c){
  const pil = confPillars(G, c);
  const comp = composite(pil), rank = confRankOn(G, c, "all");
  const nAll = G.conferences.length;
  const worldAvg = k => avg(G.conferences.map(x => confPillars(G,x)[k]));
  const last = c._lastComp;
  const dv = last != null ? comp - last : null;

  el.appendChild($(`<div class="card act">
    <div class="hero"><span class="big">${comp}</span>
      <span class="rk">#${rank} of ${nAll} in the country</span>
      ${dv!=null&&dv!==0?`<span class="delta ${dv>0?"pos":"neg"}">${dv>0?"+":""}${dv} ${G.phase==="regular"?"this week":"this season"}</span>`:""}</div>
    ${pillarBlock(pil, k => confRankOn(G,c,k), k => worldAvg(k))}
    <div class="muted small" style="margin-top:10px">The line on each bar is the national average.
    Television money is priced on reach, results and history. The other three are how you get them.</div>
  </div>`));

  /* THE SCHOOL BOARD. The brief asked for a top 25 across all sports. Replacing
     the hero with it would fight the job, because the commissioner raises the
     room and not one campus. It goes here instead, as the answer to "is the
     room actually full of good schools". */
  const t25 = topTwentyFive(G, c);
  el.appendChild($(`<div class="card"><div class="row"><h3>The national top 25</h3>
      <span class="muted small">${t25.mine.length} of yours${t25.mine.length?", best #"+t25.mine[0].r:""}</span></div>
    ${t25.mine.length
      ? `<div style="margin-top:6px">${t25.mine.slice(0,5).map(o =>
          `<div class="rowl"><span class="tr"><span class="faint">${o.r}</span>
            <span class="lk" data-s="${o.x.s.id}">${o.x.s.name}</span></span>
            <span class="mono">${o.x.v}</span></div>`).join("")}</div>`
      : `<div class="muted small" style="margin-top:6px">Nobody in your conference is in the top 25
         schools in the country on the six.</div>`}
  </div>`));

  /* the week, or the button that ends it */
  if(G.phase === "regular") dashWeek(el, c);
  else if(G.phase === "conference") dashConfRound(el, c);
  else if(G.phase === "national") dashNatRound(el, c);
  else dashOffseason(el, c);

  if(G.saga) dashSaga(el, c);

  /* what happened */
  if(G.story){
    el.appendChild($(`<div class="card"><h3>Last week</h3>
      <div style="margin-top:6px;font-size:15px">${G.story.lead}</div>
      ${G.story.rest.length?`<div class="muted small" style="margin-top:8px">${G.story.rest.join("<br>")}</div>`:""}
    </div>`));
  }
  if(G.news.length){
    el.appendChild($(`<div class="card"><h3>Around the country</h3>
      <div class="muted small" style="margin-top:6px">${G.news.slice(-5).reverse().join("<br>")}</div></div>`));
  }
  /* money at a glance */
  const rev = confRevenue(G, c), d = c.rightsDeal;
  el.appendChild($(`<div class="card"><h3>The books</h3>
    <div class="grid3" style="margin-top:8px">
      <div class="fact"><b>${money(rev)}</b><span>television, a season</span></div>
      <div class="fact"><b>${money(c.budget)}</b><span>the office can spend</span></div>
      <div class="fact"><b>${dealYearsLeft(d,G.season)}</b><span>years left on the deal</span></div>
    </div></div>`));
}

/* ---- the weekly decision -------------------------------------------------- */
function dashWeek(el, c){
  const w = G.week + 1;
  const slate = windowSlate(G, c);
  G._lastSlate = slate;
  const win = c.rightsDeal.windows;
  const sel = new Set((G.exposure && G.exposure.weekKey === G.season+":"+w) ? G.exposure.nat : []);
  /* Default the national picks once, when the week opens, and never again as a
     side effect of drawing the screen. */
  if(!(G.exposure && G.exposure.weekKey === G.season+":"+w)){
    slate.slice(0, win.nat).forEach(x => sel.add(x.key));
    assignWindows(G, c, [...sel], slate.filter(x => !sel.has(x.key)).map(x => x.key));
  }
  const box = $(`<div class="card act"><div class="row"><h3>Who the country sees</h3>
    <span class="muted small">${sel.size} of ${win.nat} national</span></div>
    <div class="muted small" style="margin-top:4px">Every sport plays this week. The rest of your
    games go out regionally, and a school shown too often stops drawing.</div>
    <div id="picks" style="margin-top:8px"></div>
    <div class="muted small" id="cons" style="margin-top:8px"></div></div>`);
  const list = box.querySelector("#picks");
  slate.slice(0, 14).forEach(x => {
    const s = S(G, x.id), fw = freshWord(s);
    const r = $(`<div class="rowl" data-k="${x.key}" style="cursor:pointer">
      <span class="stack"><span class="tr">${sel.has(x.key)?"● ":"○ "}<b>${x.name}</b>
        <span class="muted small">${x.rank?"#"+x.rank+" ":""}vs ${x.oppRank?"#"+x.oppRank+" ":""}${x.oppName}</span></span>
        <span class="muted small">${SPORT_NAME[x.sp]}${x.derby?" · conference game":""}${fw?" · "+fw:""}</span></span>
      <span class="tag ${x.draw>1.1?"hot":""}">${drawWord(x.draw)}</span></div>`);
    r.onclick = () => {
      if(sel.has(x.key)) sel.delete(x.key);
      else { if(sel.size >= win.nat) return toast("You only have "+win.nat+" national window"+(win.nat>1?"s":"")+".");
             sel.add(x.key) }
      assignWindows(G, c, [...sel], slate.filter(y => !sel.has(y.key)).map(y => y.key));
      saveGame(); render();
    };
    list.appendChild(r);
  });
  const cons = box.querySelector("#cons");
  const nat = slate.filter(x => sel.has(x.key));
  const reg = slate.filter(x => !sel.has(x.key)).slice(0, win.reg);
  cons.innerHTML = nat.length
    ? "<b>" + nat.map(x=>x.name).join(" and ") + "</b> go out nationally"
      + (reg.length ? ", " + reg.map(x=>x.name).join(", ") + " regionally." : ".")
    : "Nothing on the national window. Your partner will notice.";
  el.appendChild(box);
  const b = $(`<button class="btn big">Play week ${w}</button>`);
  b.onclick = () => {
    const before = confScore(G, c);
    playWeek(G);
    if(G.week >= SEASON_LEN) G.phase = "conference";
    /* Assigned to itself here, so the hero delta never moved until June. */
    const c2 = me(G); if(c2) c2._lastComp = before;
    integrityGuard("week");
    saveGame(); render();
  };
  el.appendChild(b);
}
function drawWord(d){
  return d >= 1.4 ? "Everyone watches" : d >= 1.0 ? "A real audience"
       : d >= 0.6 ? "Worth a slot" : d >= 0.3 ? "Regional interest" : "Nobody is asking";
}

/* ---- the two postseason taps ---------------------------------------------- */
function dashConfRound(el, c){
  el.appendChild($(`<div class="card act"><h3>Conference tournaments</h3>
    <div class="muted small">Every sport, every conference, at once. The winners take an automatic
    place in their national bracket.</div></div>`));
  const b = $(`<button class="btn big">Play the conference tournaments</button>`);
  b.onclick = () => { runConferenceRound(G); saveGame(); render() };
  el.appendChild(b);
}
function dashNatRound(el, c){
  const mine = SPORTS.map(sp => (G.post[sp]||{champs:[]}).champs.filter(x => x.conf === c.id))
    .flat();
  el.appendChild($(`<div class="card"><h3>Your conference champions</h3>
    ${mine.length ? mine.map(x => `<div class="rowl"><span class="tr">${x.name}</span>
      <span class="muted small">${SPORT_NAME[x.sport||""]||""}</span></div>`).join("")
      : `<div class="muted small">You did not win a conference tournament this season.</div>`}</div>`));
  const b = $(`<button class="btn big">Play the national championships</button>`);
  b.onclick = () => { runNationalRound(G); saveGame(); render() };
  el.appendChild(b);
}
function dashOffseason(el, c){
  if(G.aiMoved != null) el.appendChild($(`<div class="card"><h3>While you were working</h3>
    <div class="muted small" style="margin-top:4px">${G.aiMoved
      ? G.aiMoved + " school" + (G.aiMoved>1?"s":"") + " changed conference elsewhere in the country when the last window closed. Check who came free."
      : "Nobody else moved when the last window closed."}</div></div>`));
  const won = SPORTS.filter(sp => G.post[sp] && G.post[sp].national &&
    S(G, G.post[sp].national.champ) && S(G, G.post[sp].national.champ).conf === c.id);
  if(won.length) el.appendChild($(`<div class="card hi"><h3>National champions</h3>
    ${won.map(sp => `<div class="rowl"><span>${G.post[sp].championName}</span>
      <span class="brass small">${SPORT_NAME[sp]}</span></div>`).join("")}</div>`));
  el.appendChild($(`<div class="card act"><h3>The window is open</h3>
    <div class="muted small">Set what the conference spends its money on in the Office, then recruit,
    re-sign and release in the Window. Nothing moves until you close it.</div></div>`));
  const b = $(`<button class="btn big">Close the window and start season ${G.season+1}</button>`);
  b.onclick = () => {
    const prev = confScore(G, c);
    const r = endSeason(G);
    const c2 = me(G); if(c2) c2._lastComp = prev;
    if(r.fail || !c2){ saveGame(); render(); return }
    saveGame(); render();
  };
  el.appendChild(b);
}
function dashSaga(el, c){
  const sg = G.saga, s = S(G, sg.school);
  if(!s || s.conf !== c.id) return;
  const suit = sg.suitors.map(id => C(G,id)).filter(Boolean);
  if(!sg.ripe){
    el.appendChild($(`<div class="card" style="border-color:#4a3a1a">
      <h3>${s.name}</h3>
      <div class="small" style="margin-top:4px">Linked with ${suit.map(x=>x.name).join(", ")}.
      They decide when the window opens.</div>
      <div class="muted small" style="margin-top:6px">${moodWord(s.presidentPatience)} · ${lockWord(s.grant)}</div>
      ${sg.leaks.length?`<div class="muted small" style="margin-top:6px">${sg.leaks.slice(-2).map(l=>l.line).join("<br>")}</div>`:""}
    </div>`));
    return;
  }
  const box = $(`<div class="card hi"><h3>Decision day</h3>
    <div class="small" style="margin-top:4px"><b>${s.name}</b> has to answer
    ${suit.map(x=>x.name).join(" and ")} before the window closes.
    ${sg.promised?" You have already promised them a top-three share.":""}</div>
    <div class="muted small" style="margin-top:6px">${moodWord(s.presidentPatience)} · ${lockWord(s.grant)}</div>
    <div class="row" style="margin-top:11px">
      ${sg.promised?"":`<button class="btn" id="pr">Promise a top-three share</button>`}
      <button class="btn ghost" id="lt">Let them take the call</button></div></div>`);
  on(box, "#pr", () => { const paid = placate(G, s);
    if(paid){ saveGame(); toast("It cost " + money(paid) + "."); render() } else toast("You cannot cover it.") });
  on(box, "#lt", () => { resolveSaga(G); saveGame(); render() });
  el.appendChild(box);
}
function moodWord(p){ return p>=70?"Happy":p>=50?"Content":p>=30?"Getting restless":"Ready to walk" }
function lockWord(g){ return g<=0?"Free to leave this window":g===1?"Locked in one more season":"Locked in "+g+" more seasons" }
function strengthWord(v){ return v>=80?"Elite":v>=67?"Strong":v>=54?"Solid":v>=41?"Middling":"Struggling" }
function reachWord(v){ return v>=80?"A national audience":v>=62?"A big market":v>=44?"A real market":v>=28?"A small market":"Almost nobody nearby" }

/* ===========================================================================
   SPORTS
   The deep dive. Every sport, every team, the national poll, the conference
   table and the bracket that just ran. The dashboard tells you the country
   moved; this is where you find out why.
   =========================================================================== */
function viewSports(el, c){
  const tabs = $(`<div class="card"><div class="seg">${SPORTS.map(sp =>
    `<button data-sp="${sp}" class="${sp===SPORT_TAB?"on":""}">${SPORT_SHORT[sp]}</button>`).join("")}</div></div>`);
  tabs.querySelectorAll("[data-sp]").forEach(b => b.onclick = () => { SPORT_TAB = b.dataset.sp; render() });
  el.appendChild(tabs);
  const sp = SPORT_TAB;

  const mine = sportTeams(G, c, sp);
  if(!mine.length){
    el.appendChild($(`<div class="card"><div class="muted small">
      No member of yours sponsors ${SPORT_NAME[sp].toLowerCase()}. Recruit a school that does, or
      the national bracket happens without you every season.</div></div>`));
  }

  /* THIS WEEK. The thing the review said was missing: a commissioner who taps
     Sports should be able to see a Saturday, not a standings table. */
  if(mine.length && G.phase === "regular"){
    const w = G.week + 1;
    const set = new Set(mine);
    const games = w <= SEASON_LEN ? weekGames(G, sp, w).filter(f => set.has(f.h) || set.has(f.a)) : [];
    if(games.length){
      el.appendChild($(`<div class="card"><h3>Week ${w}</h3>
        ${games.map(f => { const h = S(G,f.h), a = S(G,f.a);
          const hr = rankIn(G,sp,f.h), ar = rankIn(G,sp,f.a);
          return `<div class="rowl"><span class="tr">${hr?`<span class="faint">#${hr} </span>`:""}<span class="lk" data-s="${f.h}">${h.name}</span>
            <span class="muted small"> v </span>${ar?`<span class="faint">#${ar} </span>`:""}<span class="lk" data-s="${f.a}">${a.name}</span></span>
            <span class="muted small">${f.nc?"non-conference":"conference"}</span></div>`;
        }).join("")}</div>`));
    }
  }
  /* LAST WEEK, with scores. */
  const res = (G.results || []).filter(g => g.sp === sp);
  if(res.length){
    el.appendChild($(`<div class="card"><h3>Last week</h3>
      ${res.map(g => { const h = S(G,g.h), a = S(G,g.a); if(!h||!a) return "";
        const hw = g.w === g.h;
        return `<div class="rowl"><span class="tr">
          <span class="lk ${hw?"":"muted"}" data-s="${g.h}">${h.name}</span>
          <span class="muted small"> v </span>
          <span class="lk ${hw?"muted":""}" data-s="${g.a}">${a.name}</span></span>
          <span class="mono">${g.hp}<span class="faint"> - </span>${g.ap}</span></div>`;
      }).join("")}</div>`));
  }

  /* the national picture */
  const poll = pollFor(G, sp, 25);
  el.appendChild($(`<div class="card"><h3>National top 25</h3>
    <table><tr><th></th><th>School</th><th>Conference</th><th class="right">Record</th></tr>
    ${poll.map(x => `<tr class="${x.s.conf===c.id?"mine":""}">
      <td class="rkc">${x.rank}</td>
      <td><span class="lk" data-s="${x.s.id}">${x.s.name}</span></td>
      <td class="muted small">${x.conf?x.conf.name.replace(" Conference","").replace(" Association",""):"Independent"}</td>
      <td class="n">${x.rec.W}-${x.rec.L}</td></tr>`).join("")}</table></div>`));

  /* your table, with offence, defence and what is left to play */
  if(mine.length){
    const tbl = confStandings(G, c, sp);
    const left = id => { let n = 0;
      for(let w = Math.max(G.week+1, NONCON_WEEKS+1); w <= SEASON_LEN; w++)
        n += weekGames(G, sp, w).filter(f => f.c === c.id && (f.h === id || f.a === id)).length;
      return n; };
    el.appendChild($(`<div class="card"><h3>${c.name}</h3>
      <table><tr><th>School</th><th class="right">W-L</th><th class="right">Off</th>
        <th class="right">Def</th><th class="right">Left</th></tr>
      ${tbl.map(r => `<tr><td><span class="lk" data-s="${r.s.id}">${r.s.name}</span>
          ${rankIn(G,sp,r.id)?`<span class="faint small"> #${rankIn(G,sp,r.id)}</span>`:""}</td>
          <td class="n">${r.W}-${r.L}</td>
          <td class="n">${Math.round(offOf(G,r.s,sp))}</td>
          <td class="n">${Math.round(defOf(G,r.s,sp))}</td>
          <td class="n">${left(r.id)}</td></tr>`).join("")}</table>
      <div class="muted small" style="margin-top:7px">Offence is what a team scores against an average
      defence, and defence is what it gives up. A team is as good as its rating says either way; the
      split only decides how it wins.</div>
      ${NAMED_COACH.includes(sp)?`<h3 style="margin-top:12px">On the touchline</h3>
        ${tbl.map(r => { const co = r.s.coaches[sp]; if(!co) return "";
          return `<div class="rowl"><span class="stack"><span>${co.name}</span>
            <span class="muted small">${r.s.name} · since season ${co.since}${co.rings?" · "+co.rings+" national":""}</span></span>
            <span class="right muted small">${strengthWord(co.prestige)}<br>${money(IN(G,co.pay))} a year</span></div>`;
        }).join("")}`:`<div class="muted small" style="margin-top:10px">No named coach in this sport.
        It runs on the school's program leadership, which moves with facilities and academics.</div>`}
    </div>`));
  }

  /* what just happened in the postseason */
  const post = G.post && G.post[sp];
  if(post && post.national && post.national.rounds.length){
    el.appendChild($(`<div class="card"><h3>National bracket, season ${G.phase==="offseason"?G.season:G.season-1}</h3>
      ${post.championName?`<div class="row" style="margin-bottom:8px"><b class="brass">${post.championName}</b>
        <span class="muted small">${post.championConf}</span></div>`:""}
      ${post.national.rounds.slice().reverse().map(r => `<div style="margin-top:8px">
        <h3>${r.name}</h3>${r.games.map(g => {
          const w = S(G,g.w), l = S(G,g.l);
          return `<div class="rowl"><span class="tr"><span class="faint">${g.ws}</span>
            <span class="lk" data-s="${g.w}">${w?w.name:"?"}</span>
            <span class="muted small"> beat </span><span class="faint">${g.ls}</span>
            <span class="lk" data-s="${g.l}">${l?l.name:"?"}</span></span>
            <span class="muted small">${g.sc}</span></div>`;
        }).join("")}</div>`).join("")}</div>`));
  }
}

/* ===========================================================================
   SCHOOLS
   The rollup. Every member on the same six axes the dashboard uses, so it is
   obvious which one is dragging which pillar.
   =========================================================================== */
function topTwentyFive(G, c){
  const board = G.schools.map(s => ({ s, v: schoolScore(G,s) })).sort((a,b) => b.v - a.v).slice(0,25);
  const mine = board.map((x,i) => ({ x, r:i+1 })).filter(o => o.x.s.conf === c.id);
  return { board, mine };
}
function viewSchools(el, c){
  const ms = c.members.map(id => S(G,id)).filter(Boolean)
    .map(s => ({ s, p: pillarsOf(G,s), v: schoolScore(G,s) }))
    .sort((a,b) => b.v - a.v);
  el.appendChild($(`<div class="card"><div class="row"><h3>${ms.length} members</h3>
    <span class="muted small">floor ${CONF_MIN} · ceiling ${CONF_MAX}</span></div>
    <div class="muted small" style="margin-top:4px">The same six numbers as the dashboard. A conference
    is the composite of this list, which is why who is on it is the whole job.</div></div>`));
  ms.forEach(({ s, p, v }) => {
    const card = $(`<div class="card">
      <div class="row"><span class="stack">
        <span class="lk" data-s="${s.id}" style="font-size:15px;font-weight:600">${s.name}</span>
        <span class="muted small">${nearestMetro(s.x,s.y).name} · ${moodWord(s.presidentPatience)} · ${lockWord(s.grant)}</span></span>
        <span class="stack right"><b style="font-size:19px">${v}</b>
          <span class="faint small">#${schoolRankOn(G,s,"all")} of ${G.schools.length}</span></span></div>
      ${pillarBlock(p, k => schoolRankOn(G,s,k), null)}
      <div style="margin-top:10px">${s.programs.slice()
        .sort((a,b) => (REVENUE.includes(b.sport)?1:0)-(REVENUE.includes(a.sport)?1:0) || b.ovr - a.ovr)
        .map(pr => { const rk = rankIn(G, pr.sport, s.id), co = s.coaches[pr.sport];
          return `<div class="rowl"><span class="stack">
            <span class="small">${SPORT_NAME[pr.sport]}${rk?`<span class="brass"> #${rk}</span>`:""}</span>
            <span class="faint small">${strengthWord(pr.ovr)} · ${tiltWord(pr.tilt||0)}${co?" · "+co.name:""}</span></span>
          <span class="mono small">${pr.rec.W}-${pr.rec.L}</span></div>`;
        }).join("")}</div></div>`);
    el.appendChild(card);
  });
}

/* ===========================================================================
   WINDOW
   =========================================================================== */
function viewWindow(el, c){
  if(G.phase !== "offseason"){
    el.appendChild($(`<div class="card"><div class="muted small">
      The window opens when the season is finished. Play out the year first.</div></div>`));
    return;
  }
  el.appendChild($(`<div class="card act"><div class="row"><h3>Realignment</h3>
    <b>${money(c.budget)}</b></div>
    <div class="muted small" style="margin-top:4px">Pay a school's exit fee and it leaves its conference
    for yours. It can refuse, and it will if the room is worse than what it already has on the things
    it cares about.</div></div>`));

  /* defence first, because it is the thing players discover too late */
  const loose = c.members.map(id => S(G,id)).filter(Boolean).filter(s => s.grant <= 2)
    .sort((a,b) => a.presidentPatience - b.presidentPatience);
  if(loose.length){
    const box = $(`<div class="card"><h3>Members you could lose</h3>
      <div class="muted small">Re-sign them and the exit fee somebody else has to pay goes up with every
      year you add.</div></div>`);
    loose.slice(0,6).forEach(s => {
      const cost = resignCost(G, c, s, 3);
      const r = $(`<div class="rowl"><span class="stack">
        <span class="lk" data-s="${s.id}">${s.name}</span>
        <span class="muted small">${moodWord(s.presidentPatience)} · ${lockWord(s.grant)}</span></span>
        <button class="btn sm ghost" ${c.budget<cost?"disabled":""}>${money(cost)} for 3</button></div>`);
      const b = r.querySelector("button");
      if(b) b.onclick = () => { const x = resignSchool(G,c,s,3);
        if(x.ok){ saveGame(); toast(s.name+" signed for three more."); render() } else toast(x.why) };
      box.appendChild(r);
    });
    el.appendChild(box);
  }

  /* who you can take */
  const pool = G.independents.map(id => S(G,id)).filter(Boolean)
    .concat(G.schools.filter(s => s.conf != null && s.conf !== c.id))
    .map(s => ({ s, fee: s.conf != null ? exitFee(G,s) : 0, v: schoolScore(G,s) }))
    .sort((a,b) => (a.s.conf==null?0:1) - (b.s.conf==null?0:1) || b.v - a.v)
    .slice(0, 30);
  const box = $(`<div class="card"><h3>Schools you can take</h3>
    <div class="muted small">The price is their exit fee. Free means their grant has run out.</div></div>`);
  pool.forEach(({ s, fee, v }) => {
    const blocked = G.refused[s.id];
    const from = s.conf != null ? C(G, s.conf) : null;
    const r = $(`<div class="rowl"><span class="stack">
      <span class="lk" data-s="${s.id}">${s.name}</span>
      <span class="muted small">${from?from.name.replace(" Conference",""):"Independent"} · ${reachWord(pMed(G,s))}</span>
      <span class="faint small">rated ${v} · wants ${VALUE_SETS[s.values.set||"balanced"].label}</span></span>
      ${blocked?`<span class="tag dn">said no</span>`
        :`<button class="btn sm" ${c.budget<fee||c.members.length>=CONF_MAX?"disabled":""}>${fee?money(fee):"free"}</button>`}</div>`);
    const b = r.querySelector("button");
    if(b) b.onclick = () => { const x = tryInvite(G, c, s);
      toast(x.ok ? s.name + " is joining." : s.name + " said no: " + x.why);
      integrityGuard("invite"); saveGame(); render() };
    box.appendChild(r);
  });
  el.appendChild(box);

  if(c.members.length > CONF_MIN){
    const rb = $(`<div class="card"><h3>Let a member go</h3>
      <div class="muted small">No fee either way, and every president still in the room loses
      patience.</div></div>`);
    c.members.map(id => S(G,id)).filter(Boolean).sort((a,b) => schoolScore(G,a) - schoolScore(G,b))
      .slice(0,4).forEach(s => {
      const r = $(`<div class="rowl"><span class="lk" data-s="${s.id}">${s.name}</span>
        <button class="btn sm danger">Release</button></div>`);
      r.querySelector("button").onclick = () => {
        const x = releaseSchool(G, c, s);
        integrityGuard("release");
        if(x.ok){ saveGame(); toast(s.name + " is out."); render() } else toast(x.why);
      };
      rb.appendChild(r);
    });
    el.appendChild(rb);
  }
}

/* ===========================================================================
   OFFICE
   The allocation dial. Four claims on one pot and they always sum to one, so
   every point you move is taken from somewhere that wanted it.
   =========================================================================== */
const SPEND_LABEL = {
  aca:["Academics","classrooms and research across every member"],
  fac:["Facilities","buildings, training and medical"],
  pay:["Coaching pay","what your members can offer a coach"],
  dist:["Distribution","cash straight to the members"]
};
function viewOffice(el, c){
  const rev = confRevenue(G, c), pot = Math.round(rev * (1 - CONF_RETAIN));
  const box = $(`<div class="card act"><div class="row"><h3>Where the money goes</h3>
    <span class="muted small">${money(pot)} to split</span></div>
    <div class="muted small" style="margin-top:4px">The office keeps ${Math.round(CONF_RETAIN*100)}% for
    exit fees and promises. The rest is these four, and they always add to everything you have.</div>
    <div id="dials" style="margin-top:10px"></div></div>`);
  const d = box.querySelector("#dials");
  ["aca","fac","pay","dist"].forEach(k => {
    const row = $(`<div style="margin-top:11px">
      <div class="row"><span>${SPEND_LABEL[k][0]}</span>
        <b id="v${k}">${Math.round(c.spend[k]*100)}% · ${money(pot*c.spend[k])}</b></div>
      <div class="muted small">${SPEND_LABEL[k][1]}</div>
      <input type="range" min="0" max="100" value="${Math.round(c.spend[k]*100)}" id="r${k}"></div>`);
    const inp = row.querySelector("#r"+k);
    inp.oninput = () => {
      c.spend[k] = +inp.value / 100; normSpend(c.spend);
      ["aca","fac","pay","dist"].forEach(j => {
        const lab = box.querySelector("#v"+j);
        if(lab) lab.textContent = Math.round(c.spend[j]*100) + "% · " + money(pot*c.spend[j]);
      });
      saveSoon();
    };
    d.appendChild(row);
  });
  el.appendChild(box);

  /* what it has bought */
  const p = confPillars(G, c);
  el.appendChild($(`<div class="card"><h3>What that is buying</h3>
    <div class="grid2" style="margin-top:8px">
      <div class="fact"><b>${p.aca}</b><span>academics, #${confRankOn(G,c,"aca")}</span></div>
      <div class="fact"><b>${p.fac}</b><span>facilities, #${confRankOn(G,c,"fac")}</span></div>
      <div class="fact"><b>${p.per}</b><span>personnel, #${confRankOn(G,c,"per")}</span></div>
      <div class="fact"><b>${money(c._lastTravel||0)}</b><span>travel, off the top</span></div>
    </div>
    <div class="muted small" style="margin-top:8px">Upkeep scales with what you have built, so a
    conference near the top spends most of its money standing still.</div></div>`));

  /* television */
  const dl = c.rightsDeal;
  el.appendChild($(`<div class="card"><h3>Television</h3>
    <div class="row" style="margin-top:6px"><b>${dl.name}</b><b>${money(dl.aav)} a season</b></div>
    <div class="row"><span class="muted small">Year ${dl.term - dealYearsLeft(dl,G.season) + 1} of ${dl.term}</span>
      <span class="muted small">${dl.windows.nat} national, ${dl.windows.reg} regional windows</span></div>
    <div class="muted small" style="margin-top:6px">The number is fixed for the life of the deal. If the
    audience falls short of what was promised, they can cut it. When it expires you are repriced on what
    the conference is by then.</div></div>`));

  /* the one thing that moves reach at all */
  const aw = c.awareness || 0;
  const ab = $(`<div class="card"><div class="row"><h3>Overseas broadcast</h3>
    <span class="muted small">${aw} of ${AWARE_CAP}</span></div>
    <div class="muted small" style="margin-top:4px">The only lever on media reach, and it is a small
    one. Everything else about who can watch you is decided by where your members already are, and no
    amount of money moves a campus.</div>
    <div class="row" style="margin-top:10px">
      <span class="muted small">${aw >= AWARE_CAP ? "Nothing further to buy" : "Adds three points, permanently"}</span>
      <button class="btn sm ghost" ${aw>=AWARE_CAP||c.budget<awareCost(G,c)?"disabled":""}>${money(awareCost(G,c))}</button>
    </div></div>`);
  const abtn = ab.querySelector("button");
  if(abtn) abtn.onclick = () => { const r = buyAwareness(G, c);
    if(r.ok){ saveGame(); toast("Your games go out overseas."); render() } else toast(r.why) };
  el.appendChild(ab);

  /* the split between members */
  const f = c.formula;
  const fb = $(`<div class="card"><h3>How the members split it</h3>
    <div class="row" style="margin-top:8px"><span>Equal share</span><b id="eq">${Math.round(f.equal*100)}%</b></div>
    <input type="range" min="0" max="100" value="${Math.round(f.equal*100)}" id="sl">
    <div class="muted small">The rest is weighted by results and audience. Equal keeps everyone content.
    Weighted makes your best three elite and your bottom three flight risks.</div></div>`);
  const sl = fb.querySelector("#sl");
  if(sl) sl.oninput = () => { f.equal = +sl.value/100;
    const lab = fb.querySelector("#eq"); if(lab) lab.textContent = sl.value + "%"; saveSoon() };
  el.appendChild(fb);

  const last = c.members.map(id => S(G,id)).filter(s => s && s._lastShare)
    .sort((a,b) => b._lastShare - a._lastShare);
  if(last.length) el.appendChild($(`<div class="card"><h3>Last distribution</h3>
    ${last.map(s => `<div class="rowl"><span class="lk" data-s="${s.id}">${s.name}</span>
      <b>${money(s._lastShare)}</b></div>`).join("")}</div>`));

  el.appendChild($(`<div class="card"><h3>The office</h3>
    <div class="row"><span class="muted small">Season</span><span>${G.season}</span></div>
    <div class="row"><span class="muted small">Commissioner</span><span>${G.owner}</span></div>
    ${G._repaired?`<div class="muted small" style="margin-top:6px">Self-healed ${G._repaired} fault${G._repaired>1?"s":""} on load.</div>`:""}
    <div class="row" style="margin-top:10px">
      <button class="btn ghost sm" id="ex">Export the career</button>
      <span id="impslot2"></span>
      <button class="btn danger sm" id="wipe">Start again</button></div>
    ${(G._faults&&G._faults.length)?`<div class="muted small" style="margin-top:8px">
      Recorded and repaired: ${G._faults.slice(-3).join("<br>")}</div>`:""}</div>`));
  const sl2 = el.querySelector("#impslot2"); if(sl2) sl2.appendChild(importButton());
  on(el, "#ex", () => exportSave());
  on(el, "#wipe", () => { if(confirm("Delete this career? It cannot be undone.")) wipeSave() });
}
let _saveT = null;
function saveSoon(){ clearTimeout(_saveT); _saveT = setTimeout(saveGame, 400) }

/* ===========================================================================
   MAP
   Thirty metros and every school in the country. Squares near a city reach an
   audience; squares in the mountains do not. This is the one pillar money
   cannot touch, so it had better be legible.
   =========================================================================== */
function confColor(G, s){
  if(s.conf == null) return "#3a434e";
  const i = G.conferences.findIndex(c => c.id === s.conf);
  const hues = ["#d8a657","#4ea8de","#e0709a","#4ec9a0","#a78bfa","#f2845c",
                "#6ba368","#c96a6a","#7f9cc4","#c8a2c8","#9aa85c","#5fa8a0"];
  return hues[i % hues.length] || "#3a434e";
}
function viewMap(el, c){
  const mine = new Set(c.members);
  el.appendChild($(`<div class="card"><div class="row"><h3>The country</h3>
    <span class="muted small">${mine.size} of ${G.schools.length} schools</span></div>
    <div class="mapbox" style="margin-top:9px">
    <svg class="map" viewBox="0 0 ${MAP_W} ${MAP_H}" xmlns="http://www.w3.org/2000/svg">
      ${METROS.map(([nm,x,y,pop]) => `<circle cx="${x}" cy="${y}" r="${1.1+pop*0.42}"
        fill="#2a3a4a" opacity="0.55"/>`).join("")}
      ${METROS.filter(m=>m[3]>=7).map(([nm,x,y]) =>
        `<text x="${x}" y="${y-3.4}" font-size="2" fill="#5d6773" text-anchor="middle">${nm}</text>`).join("")}
      ${G.schools.map(s => `<rect x="${s.x-0.85}" y="${s.y-0.85}" width="1.7" height="1.7" rx="0.35"
        fill="${confColor(G,s)}" opacity="${mine.has(s.id)?1:0.45}"
        stroke="${mine.has(s.id)?"#fff":"none"}" stroke-width="${mine.has(s.id)?0.3:0}"/>`).join("")}
    </svg></div>
    <div class="muted small" style="margin-top:8px">Grey circles are cities, sized by population. Your
    members are outlined. Two schools in the same city reach almost the same people, so a school in a
    market you do not have is worth far more than a better one next door to a market you already own.</div>
  </div>`));

  const covered = {};
  METROS.forEach(([nm,x,y,pop]) => {
    const best = Math.max(0, ...c.members.map(id => { const s = S(G,id);
      return s ? 1/(1+Math.pow(dist(s.x,s.y,x,y)/9,1.7)) : 0 }));
    covered[nm] = { pop, v: best };
  });
  const miss = Object.entries(covered).filter(([,v]) => v.v < 0.34)
    .sort((a,b) => b[1].pop - a[1].pop).slice(0,6);
  if(miss.length) el.appendChild($(`<div class="card"><h3>Markets you do not reach</h3>
    ${miss.map(([nm,v]) => `<div class="rowl"><span>${nm}</span>
      <span class="muted small">population ${v.pop} of 10</span></div>`).join("")}
    <div class="muted small" style="margin-top:6px">A school near one of these lifts your media reach
    more than a better school anywhere you already cover.</div></div>`));

  el.appendChild($(`<div class="card"><h3>The table</h3>
    <table><tr><th></th><th>Conference</th><th class="right">Rated</th><th class="right">Television</th></tr>
    ${G.conferences.map(x => ({x, v:confScore(G,x)})).sort((a,b)=>b.v-a.v).map((o,i) =>
      `<tr class="${o.x.id===c.id?"mine":""}"><td class="rkc">${i+1}</td>
        <td>${o.x.name} <span class="faint small">${STRATUM_NAME[o.x.stratum]}</span></td>
        <td class="n">${o.v}</td><td class="n">${money(o.x.rightsDeal.aav)}</td></tr>`).join("")}
    </table></div>`));
}

/* ===========================================================================
   THE SCHOOL SHEET
   =========================================================================== */
function openSchool(id){
  const s = S(G, id); if(!s) return;
  const p = pillarsOf(G, s);
  const co = NAMED_COACH.filter(sp => s.coaches[sp]).map(sp => s.coaches[sp]);
  const conf = s.conf != null ? C(G, s.conf) : null;
  const n = $(`<div class="sheet"><div class="sheetin">
    <div class="row"><h2 style="margin:0">${s.name}</h2><button class="btn sm ghost" id="x">Close</button></div>
    <div class="muted small">${conf?conf.name:"Independent"} · ${nearestMetro(s.x,s.y).name} ·
      ${regionOf(s.x,s.y).name} · ${hasFB(s)?"sponsors football":"no football"}</div>
    ${pillarBlock(p, k => schoolRankOn(G,s,k), null)}
    <div class="grid2" style="margin-top:11px">
      <div class="fact"><b>${moodWord(s.presidentPatience)}</b><span>the president</span></div>
      <div class="fact"><b>${lockWord(s.grant)}</b><span>grant of rights</span></div>
      <div class="fact"><b>${money(exitFee(G,s))}</b><span>to buy them out</span></div>
      <div class="fact"><b>${VALUE_SETS[s.values.set||"balanced"].label}</b><span>what they care about</span></div>
    </div>
    <h3 style="margin-top:13px">Programs</h3>
    ${s.programs.map(pr => `<div class="rowl"><span class="stack">
        <span>${SPORT_NAME[pr.sport]}</span>
        <span class="muted small">${strengthWord(pr.ovr)}${pr.titles?" · "+pr.titles+" title"+(pr.titles>1?"s":""):""}</span></span>
      <span class="right muted small">${pr.rec.W}-${pr.rec.L}${rankIn(G,pr.sport,s.id)?" · #"+rankIn(G,pr.sport,s.id):""}</span></div>`).join("")}
    ${co.length?`<h3 style="margin-top:13px">Coaches</h3>
      ${co.map(x => `<div class="rowl"><span class="stack"><span>${x.name}</span>
        <span class="muted small">${SPORT_NAME[x.sport]} · since season ${x.since}${x.rings?" · "+x.rings+" national title"+(x.rings>1?"s":""):""}</span></span>
        <span class="right muted small">${strengthWord(x.prestige)}<br>${money(IN(G,x.pay))} a year</span></div>`).join("")}`:""}
    <h3 style="margin-top:13px">Reach</h3>
    <div class="muted small">${reachWord(p.med)}. Nearest city is ${nearestMetro(s.x,s.y).name},
      population ${nearestMetro(s.x,s.y).pop} of 10.</div>
  </div></div>`);
  on(n, "#x", () => n.remove());
  n.onclick = e => { if(e.target === n) n.remove() };
  document.body.appendChild(n);
}

/* ===========================================================================
   START, LOSS, BOOT
   =========================================================================== */
function exportSave(){
  try{
    const b = new Blob([serializeSave()], { type:"application/json" });
    const u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = "empire-conference-s" + G.season + ".json"; a.click();
    setTimeout(() => URL.revokeObjectURL(u), 1000);
  }catch(e){ toast("Export failed.") }
}
function wipeSave(){ localStorage.removeItem(SAVE_KEY); G = null; renderStart() }
/* The office could export and nothing could read one back, so a career was
   trapped on the device that made it. */
function importSave(file, done){
  const r = new FileReader();
  r.onload = () => {
    try{
      const g = JSON.parse(r.result);
      validateSave(g);
      G = g; hydrate(); saveGame(); TAB = "dash"; done(null);
    }catch(e){ done(e.message) }
  };
  r.onerror = () => done("that file could not be read");
  r.readAsText(file);
}
function importButton(){
  const wrap = $(`<span><input type="file" accept="application/json,.json" id="imp" style="display:none">
    <button class="btn ghost sm" id="impb">Import a career</button></span>`);
  const inp = wrap.querySelector("#imp"), btn = wrap.querySelector("#impb");
  btn.onclick = () => inp.click();
  inp.onchange = () => { const f = inp.files && inp.files[0]; if(!f) return;
    importSave(f, err => { if(err) toast(err); else render() }) };
  return wrap;
}
function renderLost(){
  const app = document.getElementById("app"); app.innerHTML = "";
  app.appendChild($(`<div class="wrap"><div class="card bad"><h2>Your conference is gone</h2>
    <div class="small">The save could not be read back into a conference you run. Nothing has been
    deleted. Export it first if you want to keep it.</div>
    <div class="row" style="margin-top:11px">
      <button class="btn ghost" id="ex">Export</button>
      <button class="btn danger" id="ag">Start again</button></div></div></div>`));
  on(app, "#ex", exportSave);
  on(app, "#ag", () => { if(confirm("Start again? This deletes the career.")) wipeSave() });
}
function startHook(G, c){
  const order = PILLAR_KEYS.slice().sort((a,b) => confRankOn(G,c,a) - confRankOn(G,c,b));
  const best = order[0], worst = order[order.length-1];
  const nm = k => PILLARS.find(x => x.key === k).name.toLowerCase();
  const bR = confRankOn(G,c,best), wR = confRankOn(G,c,worst), n = G.conferences.length;
  const loose = c.members.map(id => S(G,id)).filter(s => s && s.grant <= 2).length;
  const yrs = dealYearsLeft(c.rightsDeal, G.season);
  const fb = c.members.filter(id => hasFB(S(G,id))).length;
  /* Lead with the strength when there is one. It used to open "best in the
     country at nothing" even for a conference sitting first in a pillar. */
  const head = bR <= 3
    ? "First in the country for nothing" .replace("First in the country for nothing",
        "You are #" + bR + " in the country for " + nm(best) + ", and #" + wR + " of " + n + " for " + nm(worst) + ".")
    : "Best in the country at nothing. Your " + nm(worst) + " is #" + wR + " of " + n + ".";
  const cash = "The office keeps a tenth of the television money, which is " +
    money(Math.round(confRevenue(G,c) * CONF_RETAIN)) + " a season to move anybody with.";
  const path = fb === 0
    ? " No member plays football, so you cost far less to run and your ceiling on television is about a third of theirs."
    : "";
  const rung = confRevenue(G,c) * CONF_RETAIN < IN(G, 14e6)
    ? " At that number your first rung is free schools in cities nobody covers, not a raid."
    : "";
  return head + " " + loose + " member" + (loose===1?" is":"s are") + " out of contract inside two seasons and the deal has " +
    yrs + " years to run. " + cash + rung + path;
}
function renderStart(){
  const app = document.getElementById("app"); app.innerHTML = "";
  document.getElementById("nav").innerHTML = "";
  const pv = genWorld("Commissioner");
  touchPillars(pv);
  const cards = pv.conferences.map(c => ({
    c, score: confScore(pv, c), p: confPillars(pv, c),
    fb: c.members.filter(id => hasFB(S(pv,id))).length
  })).sort((a,b) => a.c.stratum - b.c.stratum || b.score - a.score);
  const wrap = $(`<div class="wrap">
    <h1>Empire Conference</h1>
    <p class="muted">You run a college athletic conference. You decide which schools are in it, who is
    on television each week, and where the money goes. You never coach anybody.</p>
    ${LOAD_ERROR?`<div class="card bad small">${LOAD_ERROR}</div>`:""}
    <input id="who" class="inp" placeholder="Your name" maxlength="24">
    <h3 style="margin-bottom:8px">Choose a conference</h3>
    <div class="muted small" style="margin-bottom:10px">A Power conference starts on top with everyone
    hunting its members. A Mid-major starts with a long climb and cheap mistakes.</div>
    <div id="impslot" style="margin-bottom:12px"></div>
  </div>`);
  const slot = wrap.querySelector("#impslot"); if(slot) slot.appendChild(importButton());
  cards.forEach(({ c, score, p, fb }) => {
    const el = $(`<div class="pick" data-p="${c.id}">
      <div class="row"><b>${c.name}</b><span class="pill s${c.stratum}">${STRATUM_NAME[c.stratum]}</span></div>
      <div class="row small muted" style="margin-top:3px">
        <span>${c.members.length} members · ${fb?fb+" play football":"no football"}</span>
        <span>${money(c.rightsDeal.aav)} a season</span></div>
      ${pillarBlock(p, k => confRankOn(pv,c,k), null)}
      <div class="hook">${startHook(pv, c)}</div></div>`);
    el.onclick = () => {
      G = pv;
      G.owner = (document.getElementById("who").value || "").trim() || "Commissioner";
      G.userConf = c.id;
      G.startHook = startHook(G, c);
      G.conferences.forEach(x => { if(x.id !== G.userConf) x._temper = pick(AI_TEMPER).n });
      TAB = "dash";
      saveGame(); render();
    };
    wrap.appendChild(el);
  });
  app.appendChild(wrap);
}
function boot(){
  if(!loadGame()) renderStart();
  else { TAB = "dash"; render() }
}
if(typeof document !== "undefined" && document.getElementById) boot();

</script>
